<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>المستخدمون | Pharma Cloud</title><style>@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap');:root{--p:#0d6e6e;--a:#12a3a3;--bg:#f2f6f8;--ink:#183238;--muted:#6d8085;--line:#dce7ea;--bad:#bf4141}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px Cairo,Arial}.shell{display:flex;min-height:100vh}.side{position:fixed;right:0;top:0;bottom:0;width:244px;background:var(--p);padding:22px 13px;color:#fff;z-index:20;transition:.25s}.brand{font-size:20px;font-weight:800;padding:0 12px 22px;border-bottom:1px solid #ffffff2b}.brand small{display:block;font-size:11px;font-weight:400;opacity:.72}.nav{padding-top:15px}.nav a{display:block;text-decoration:none;color:#d9f5f5;padding:10px 12px;margin:3px 0;border-radius:9px}.nav a:hover,.nav a.active{background:#ffffff25;color:white}.side-foot{position:absolute;bottom:20px;right:13px;left:13px}.signout{width:100%;padding:10px;border-radius:8px;border:1px solid #ffffff35;background:#ffffff16;color:#fff;font:inherit;cursor:pointer}.main{margin-right:244px;width:calc(100% - 244px)}.top{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;padding:0 29px;position:sticky;top:0;z-index:10}.who{display:flex;gap:9px;align-items:center}.avatar{display:grid;place-items:center;border-radius:50%;width:38px;height:38px;background:#d9f4f4;color:var(--p);font-weight:800}.who b,.who small{display:block}.who small{font-size:11px;color:var(--muted)}.hamb{display:none;font-size:25px;border:0;background:none;color:var(--p)}.page{max-width:1350px;margin:auto;padding:28px}.title{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px}.title h1{font-size:24px;margin:0}.title p{margin:4px 0;color:var(--muted)}button,.btn{font:inherit;cursor:pointer;border:0;border-radius:8px;padding:10px 14px}.primary{background:var(--a);color:#fff}.secondary{background:#e0f2f2;color:var(--p)}.danger{background:#fff0f0;color:var(--bad)}.panel{background:white;border:1px solid var(--line);border-radius:13px;padding:17px;box-shadow:0 2px 8px #17434a08}.tenant-select{padding:10px;border:1px solid var(--line);border-radius:8px;font:inherit;min-width:260px;background:#fff}table{border-collapse:collapse;width:100%}th,td{text-align:right;padding:11px 8px;border-bottom:1px solid var(--line);font-size:12px}th{font-size:11px;color:var(--muted)}.badge{font-size:10px;padding:3px 8px;border-radius:99px;background:#e0f3f2;color:var(--p)}.badge.off{background:#f5e5e5;color:var(--bad)}.actions{display:flex;gap:6px}.actions button{padding:6px 9px;font-size:11px}.empty{padding:36px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:11px}.modal-back{display:none;position:fixed;inset:0;background:#001a1d80;z-index:50;align-items:center;justify-content:center;padding:15px}.modal-back.open{display:flex}.modal{background:#fff;width:min(540px,100%);max-height:90vh;overflow:auto;border-radius:14px;padding:21px}.modal h2{margin:0 0 15px;font-size:19px}.close{float:left;background:transparent;color:var(--muted);font-size:22px;padding:0}label{display:block;font-size:12px;color:var(--muted);margin:12px 0 5px}input,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:#fff;font:inherit}.check{display:flex;gap:8px;align-items:center;color:var(--ink);margin-top:14px}.check input{width:auto}.modal-actions{display:flex;gap:8px;margin-top:17px}.toast{position:fixed;z-index:70;bottom:22px;left:22px;background:#183238;color:#fff;padding:12px 16px;border-radius:8px;opacity:0;transform:translateY(15px);transition:.2s}.toast.show{opacity:1;transform:none}.toast.error{background:var(--bad)}.veil{display:none}@media(max-width:900px){.side{transform:translateX(100%)}.side.open{transform:none;box-shadow:-5px 0 18px #0004}.main{margin:0;width:100%}.hamb{display:block}.veil.open{display:block;position:fixed;inset:0;background:#0005;z-index:19}.page{padding:20px}}@media(max-width:570px){.page{padding:14px}.top{height:63px;padding:0 15px}.title{align-items:start;flex-direction:column}.title h1{font-size:20px}.tenant-select{width:100%}.table-wrap{overflow:auto}.modal{padding:16px}}</style></head>
<body><div class="shell"><aside class="side" id="side"><div class="brand">Pharma Cloud<small>نظام إدارة الصيدليات</small></div><nav class="nav" id="nav"></nav><div class="side-foot"><button class="signout" onclick="signout()">تسجيل الخروج</button></div></aside><div class="veil" id="veil" onclick="toggleMenu()"></div><main class="main"><header class="top"><button class="hamb" onclick="toggleMenu()">☰</button><span></span><div class="who"><div class="avatar" id="initial"></div><div><b id="userName"></b><small id="roleText"></small></div></div></header><section class="page"><div class="title"><div><h1>المستخدمون</h1><p id="subtitle">إدارة حسابات مستخدمي المنشأة</p></div><div id="titleAction"></div></div><div id="tenantChooser"></div><section class="panel" id="usersPanel" style="margin-top:16px"><div class="table-wrap"><table><thead><tr><th>الاسم</th><th>اسم المستخدم</th><th>الدور</th><th>الحالة</th><th>تاريخ الإنشاء</th><th>إجراءات</th></tr></thead><tbody id="rows"></tbody></table></div></section></section></main></div><div class="modal-back" id="modal"><div class="modal"><button class="close" onclick="closeModal()">×</button><h2 id="modalTitle">إضافة مستخدم</h2><form onsubmit="saveUser(event)"><input type="hidden" id="editId"><label>الاسم</label><input id="name" required minlength="2"><label>اسم المستخدم</label><input id="username" required minlength="3" autocomplete="off"><label>كلمة المرور <span id="passwordHint"></span></label><input id="password" type="password" minlength="3" autocomplete="new-password"><label>الدور</label><select id="role"><option value="admin">مدير</option><option value="manager">مشرف</option><option value="cashier">كاشير</option><option value="warehouse">مستودع</option></select><label class="check"><input id="active" type="checkbox" checked> الحساب نشط</label><div class="modal-actions"><button class="primary">حفظ</button><button type="button" class="secondary" onclick="closeModal()">إلغاء</button></div></form></div></div><div class="toast" id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const URL='https://jlpjqwlwwuknabfekbth.supabase.co',KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJIUzI1NiIsInJlZiI6ImpscGpxd2x3d3VrbmFiZmVrYnRoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAyOTYxNTAsImV4cCI6MjEwNTg3MjE1MH0.8tcgNJnwGYbKlNZx3899k-h6E7dKWxl2vM9uD3pPFZ0';let session;try{session=JSON.parse(localStorage.getItem('pharma_session')||'null')}catch(e){}if(!session)location.replace('index.html');else if(!['super','admin'].includes(session.role))location.replace('dashboard.html');const db=supabase.createClient(URL,KEY),$=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));let tenantId=session.role==='super'?new URLSearchParams(location.search).get('tenant'):session.tenantId,tenants=[],users=[];
function menu(){let l=session.role==='super'?[['tenants.html','المنشآت'],['users.html','المستخدمون'],['chat.html','المحادثات'],['directory.html','دليل المنشآت']]:[['dashboard.html','لوحة التحكم'],['pos.html','نقطة البيع'],['purchase.html','المشتريات'],['products.html','الأصناف'],['stock.html','المخزون'],['ledger.html','الحسابات'],['suggestions.html','اقتراحات الطلب'],['orders.html','الطلبات'],['directory.html','دليل المنشآت'],['chat.html','المحادثات'],['users.html','المستخدمون']];$('#nav').innerHTML=l.map(x=>`<a class="${x[0]==='users.html'?'active':''}" href="${x[0]}">${x[1]}</a>`).join('')}function toggleMenu(){$('#side').classList.toggle('open');$('#veil').classList.toggle('open')}function signout(){localStorage.removeItem('pharma_session');location.replace('index.html')}function toast(t,b=false){let e=$('#toast');e.textContent=t;e.className='toast show '+(b?'error':'');setTimeout(()=>e.className='toast',3600)}function date(d){return new Date(d).toLocaleDateString('ar-SA')}
function chooseTenant(){let val=$('#tenant').value;location.href=val?'users.html?tenant='+encodeURIComponent(val):'users.html'}function render(){let manageable=!!tenantId;$('#titleAction').innerHTML=manageable?'<button class="primary" onclick="openAdd()">إضافة مستخدم</button>':'';if(!manageable){$('#usersPanel').style.display='none';$('#subtitle').textContent='اختر منشأة أولاً لعرض مستخدميها.';return}$('#usersPanel').style.display='block';let labels={admin:'مدير',manager:'مشرف',cashier:'كاشير',warehouse:'مستودع'};$('#rows').innerHTML=users.map(u=>`<tr><td><b>${esc(u.name)}</b></td><td>${esc(u.username)}</td><td>${esc(labels[u.role]||u.role)}</td><td><span class="badge ${u.active?'':'off'}">${u.active?'نشط':'موقوف'}</span></td><td>${date(u.created_at)}</td><td><div class="actions">${u.role!=='super'?`<button class="secondary" onclick="openEdit('${u.id}')">تعديل</button><button class="secondary" onclick="toggleActive('${u.id}')">${u.active?'إيقاف':'تفعيل'}</button><button class="danger" onclick="removeUser('${u.id}')">حذف</button>`:'<span class="badge">حساب محمي</span>'}</div></td></tr>`).join('')||'<tr><td colspan="6"><div class="empty">لا يوجد مستخدمون لهذه المنشأة.</div></td></tr>'}
function openAdd(){$('#modalTitle').textContent='إضافة مستخدم';$('#editId').value='';$('#name').value='';$('#username').value='';$('#password').value='';$('#password').required=true;$('#passwordHint').textContent='(مطلوبة)';$('#role').value='cashier';$('#active').checked=true;$('#modal').classList.add('open')}function openEdit(id){let u=users.find(x=>x.id===id);if(!u||u.role==='super')return;$('#modalTitle').textContent='تعديل مستخدم';$('#editId').value=u.id;$('#name').value=u.name;$('#username').value=u.username;$('#password').value='';$('#password').required=false;$('#passwordHint').textContent='(اتركها فارغة للإبقاء عليها)';$('#role').value=u.role;$('#active').checked=u.active;$('#modal').classList.add('open')}function closeModal(){$('#modal').classList.remove('open')}
async function saveUser(e){e.preventDefault();if(!tenantId)return;let id=$('#editId').value,pw=$('#password').value,payload={tenant_id:tenantId,name:$('#name').value.trim(),username:$('#username').value.trim(),role:$('#role').value,active:$('#active').checked};if(pw)payload.password=pw;let r=id?await db.from('users').update(payload).eq('id',id).eq('tenant_id',tenantId).select().single():await db.from('users').insert(payload).select().single();if(r.error){toast('تعذر حفظ المستخدم: '+r.error.message,true);return}users=id?users.map(u=>u.id===id?r.data:u):[r.data,...users];closeModal();render();toast('تم حفظ المستخدم بنجاح')}
async function toggleActive(id){let u=users.find(x=>x.id===id);if(!u||u.role==='super')return;let r=await db.from('users').update({active:!u.active}).eq('id',id).eq('tenant_id',tenantId).select().single();if(r.error){toast('تعذر تغيير الحالة: '+r.error.message,true);return}users=users.map(x=>x.id===id?r.data:x);render();toast(u.active?'تم إيقاف الحساب':'تم تفعيل الحساب')}
async function removeUser(id){let u=users.find(x=>x.id===id);if(!u||u.role==='super')return;if(!confirm('حذف المستخدم '+u.name+'؟'))return;let r=await db.from('users').delete().eq('id',id).eq('tenant_id',tenantId);if(r.error){toast('تعذر الحذف: '+r.error.message,true);return}users=users.filter(x=>x.id!==id);render();toast('تم حذف المستخدم')}
async function load(){menu();$('#userName').textContent=session.name||'مستخدم';$('#initial').textContent=(session.name||'م')[0];$('#roleText').textContent=session.role==='super'?'مدير المنصة':'مدير المنشأة';try{if(session.role==='super'){let tr=await db.from('tenants').select('id,name').eq('active',true).order('name');if(tr.error)throw tr.error;tenants=tr.data||[];if(tenantId&&!tenants.some(t=>t.id===tenantId)){tenantId=null;toast('المنشأة غير متاحة أو غير نشطة.',true)}$('#tenantChooser').innerHTML=`<select id="tenant" class="tenant-select" onchange="chooseTenant()"><option value="">اختر المنشأة لإدارة المستخدمين</option>${tenants.map(t=>`<option value="${t.id}" ${t.id===tenantId?'selected':''}>${esc(t.name)}</option>`).join('')}</select>`}if(tenantId){let r=await db.from('users').select('id,tenant_id,username,name,role,active,created_at').eq('tenant_id',tenantId).order('created_at',{ascending:false});if(r.error)throw r.error;users=r.data||[]}render()}catch(e){console.error(e);toast('تعذر تحميل المستخدمين: '+e.message,true);$('#rows').innerHTML='<tr><td colspan="6"><div class="empty">تعذر الوصول للبيانات.</div></td></tr>'}}
load();
</script></body></html>
