<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <meta name="theme-color" content="#0B2C4D">
  <title>تفاصيل المورد - رفاد</title>

  <link rel="icon" type="image/png" href="logo.png">
  <link rel="manifest" href="manifest.json">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdn.jsdelivr.net/npm/dayjs@1.11.10/dayjs.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    :root {
      --primary: #0B2C4D;
      --primary-light: #1e4a73;
      --accent: #14B8A6;
      --accent-dark: #0d9488;
      --gold: #F59E0B;
      --bg: #F1F5F9;
      --card: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --danger: #ef4444;
      --success: #10b981;
      --warning: #f59e0b;
      --info: #3b82f6;
      --purple: #8b5cf6;
      --sidebar-bg: #0B2C4D;
      --sidebar-text: #cbd5e1;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
      --shadow: 0 4px 20px rgba(11, 44, 77, 0.08);
      --shadow-lg: 0 10px 40px rgba(11, 44, 77, 0.12);
      --radius: 14px;
      --radius-sm: 10px;
      --sidebar-w: 260px;
      --topbar-h: 64px;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    [data-theme="dark"] {
      --bg: #0a1628;
      --card: #0f2137;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --border: #1e3a5f;
      --sidebar-bg: #061a2e;
      --sidebar-text: #94a3b8;
    }

    html, body {
      height: 100%;
      font-family: 'Cairo', sans-serif;
      background: var(--bg);
      color: var(--text);
      transition: background 0.3s, color 0.3s;
      overflow-x: hidden;
    }

    body { display: flex; min-height: 100vh; }

    /* ============ Sidebar ============ */
    .sidebar {
      width: var(--sidebar-w);
      height: 100vh;
      height: 100dvh;
      background: var(--sidebar-bg);
      color: var(--sidebar-text);
      position: fixed;
      top: 0;
      right: 0;
      z-index: 100;
      display: flex;
      flex-direction: column;
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: -4px 0 20px rgba(0,0,0,0.1);
    }
    .sidebar-header {
      padding: 20px 22px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      display: flex;
      align-items: center;
      gap: 14px;
      height: var(--topbar-h);
      box-sizing: border-box;
    }
    .sidebar-logo {
      width: 40px; height: 40px;
      background: linear-gradient(135deg, var(--accent), var(--accent-dark));
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      overflow: hidden;
      box-shadow: 0 4px 12px rgba(20,184,166,0.4);
    }
    .sidebar-logo img { width: 70%; height: 70%; object-fit: contain; }
    .sidebar-logo .fallback { color: white; font-weight: 800; font-size: 18px; }
    .sidebar-brand h2 { color: white; font-size: 20px; font-weight: 800; line-height: 1.2; }
    .sidebar-brand p { font-size: 10px; color: var(--sidebar-text); opacity: 0.7; font-weight: 500; margin-top: 2px; }
    .sidebar-nav { flex: 1; overflow-y: auto; padding: 12px 0; scrollbar-width: thin; }
    .sidebar-nav::-webkit-scrollbar { width: 5px; }
    .sidebar-nav::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 10px; }
    .nav-section { padding: 8px 20px 4px; font-size: 10px; font-weight: 700; color: rgba(255,255,255,0.35); text-transform: uppercase; letter-spacing: 1px; margin-top: 8px; }
    .nav-item {
      display: flex; align-items: center; gap: 12px;
      padding: 11px 22px;
      color: var(--sidebar-text);
      text-decoration: none;
      font-size: 14px; font-weight: 500;
      border-right: 3px solid transparent;
      transition: all 0.2s;
      cursor: pointer;
    }
    .nav-item:hover { background: rgba(255,255,255,0.05); color: white; }
    .nav-item.active { background: rgba(20,184,166,0.12); color: white; border-right-color: var(--accent); font-weight: 600; }
    .nav-item i, .nav-item svg { width: 18px; height: 18px; flex-shrink: 0; }
    .nav-item .badge { margin-right: auto; background: var(--danger); color: white; font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 10px; }

    /* ============ Main ============ */
    .main { flex: 1; margin-right: var(--sidebar-w); min-width: 0; display: flex; flex-direction: column; }

    /* ============ Topbar ============ */
    .topbar {
      height: var(--topbar-h);
      background: var(--card);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 20px;
      position: sticky;
      top: 0;
      z-index: 50;
      box-shadow: var(--shadow-sm);
    }
    .menu-toggle {
      display: none;
      background: transparent;
      border: none;
      color: var(--text);
      cursor: pointer;
      padding: 8px;
      border-radius: 8px;
      min-width: 40px;
      min-height: 40px;
      align-items: center;
      justify-content: center;
    }
    .topbar-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 6px;
      flex: 1;
      min-width: 0;
      overflow: hidden;
    }
    .topbar-title a {
      color: var(--text-muted);
      text-decoration: none;
      font-weight: 500;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }
    .topbar-title a:hover { color: var(--accent); }
    .topbar-title span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .topbar-actions { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
    .icon-btn {
      width: 38px; height: 38px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      flex-shrink: 0;
    }
    .icon-btn:hover { border-color: var(--accent); color: var(--accent); }
    .icon-btn i, .icon-btn svg { width: 18px; height: 18px; }
    .user-menu {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 4px 10px 4px 4px;
      border-radius: 10px;
      cursor: pointer;
      border: 1px solid var(--border);
      background: var(--card);
      transition: background 0.2s;
    }
    .user-menu:hover { background: var(--bg); }
    .user-avatar {
      width: 34px; height: 34px;
      border-radius: 9px;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 700;
      font-size: 14px;
      flex-shrink: 0;
      overflow: hidden;
    }
    .user-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .user-info { display: flex; flex-direction: column; line-height: 1.2; }
    .user-info .name { font-size: 13px; font-weight: 700; color: var(--text); }
    .user-info .role { font-size: 11px; color: var(--text-muted); }
    .dropdown {
      position: absolute;
      top: calc(100% + 8px);
      left: 0;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      box-shadow: var(--shadow-lg);
      min-width: 200px;
      padding: 6px;
      opacity: 0;
      visibility: hidden;
      transform: translateY(-8px);
      transition: all 0.2s;
      z-index: 100;
    }
    .dropdown.show { opacity: 1; visibility: visible; transform: translateY(0); }
    .dropdown-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 12px;
      border-radius: 8px;
      color: var(--text);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s;
      text-decoration: none;
    }
    .dropdown-item:hover { background: var(--bg); }
    .dropdown-item.danger { color: var(--danger); }
    .dropdown-item i { width: 16px; height: 16px; }
    .dropdown-divider { height: 1px; background: var(--border); margin: 6px 0; }

    /* ============ Content ============ */
    .content { padding: 20px; flex: 1; max-width: 100%; overflow-x: hidden; }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 16px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      border-radius: var(--radius-sm);
      border: none;
      cursor: pointer;
      transition: all 0.2s;
      text-decoration: none;
      white-space: nowrap;
      min-height: 40px;
    }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .btn i, .btn svg { width: 16px; height: 16px; flex-shrink: 0; }
    .btn-primary { background: linear-gradient(135deg, var(--primary), var(--accent)); color: white; }
    .btn-primary:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(20,184,166,0.35); }
    .btn-outline { background: var(--card); color: var(--text); border: 1px solid var(--border); }
    .btn-outline:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
    .btn-success { background: var(--success); color: white; }
    .btn-success:hover:not(:disabled) { background: #047857; }
    .btn-danger { background: var(--danger); color: white; }
    .btn-danger:hover:not(:disabled) { background: #b91c1c; }
    .btn-gold { background: var(--gold); color: white; }
    .btn-gold:hover:not(:disabled) { background: #d97706; }
    .btn-sm { padding: 6px 12px; font-size: 12px; min-height: 34px; }

    /* ============ Page Head ============ */
    .page-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .page-head-left {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
      flex: 1;
    }
    .back-btn {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      text-decoration: none;
      flex-shrink: 0;
    }
    .back-btn:hover { border-color: var(--accent); color: var(--accent); transform: translateX(-2px); }
    .back-btn i { width: 18px; height: 18px; }
    .page-head h1 {
      font-size: 22px;
      font-weight: 800;
      color: var(--text);
      margin-bottom: 2px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .page-head p { font-size: 13px; color: var(--text-muted); }
    .page-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      width: 100%;
      max-width: 100%;
    }

    /* ============ Alerts ============ */
    .alert-banner {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 14px 18px;
      border-radius: var(--radius);
      margin-bottom: 16px;
      font-size: 13px;
      line-height: 1.6;
      font-weight: 600;
    }
    .alert-banner.danger { background: rgba(239,68,68,0.08); border: 1.5px solid rgba(239,68,68,0.25); color: var(--danger); }
    .alert-banner.warning { background: rgba(245,158,11,0.08); border: 1.5px solid rgba(245,158,11,0.25); color: var(--gold); }
    .alert-banner.info { background: rgba(59,130,246,0.08); border: 1.5px solid rgba(59,130,246,0.25); color: var(--info); }
    .alert-banner i { width: 20px; height: 20px; flex-shrink: 0; margin-top: 2px; }

    /* ============ Profile Hero ============ */
    .profile-hero {
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      color: white;
      padding: 24px;
      border-radius: var(--radius);
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
      position: relative;
      overflow: hidden;
      box-shadow: var(--shadow-lg);
    }
    .profile-hero::before {
      content: '';
      position: absolute;
      top: -50%; left: -20%;
      width: 60%; height: 200%;
      background: radial-gradient(circle, rgba(20,184,166,0.25), transparent 70%);
      pointer-events: none;
    }
    .profile-hero::after {
      content: '';
      position: absolute;
      bottom: -50%; right: -20%;
      width: 60%; height: 200%;
      background: radial-gradient(circle, rgba(245,158,11,0.15), transparent 70%);
      pointer-events: none;
    }
    .profile-hero > * { position: relative; z-index: 1; }
    .profile-avatar {
      width: 80px;
      height: 80px;
      border-radius: 20px;
      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(10px);
      border: 2px solid rgba(255,255,255,0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 34px;
      flex-shrink: 0;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0,0,0,0.2);
    }
    .profile-info { flex: 1; min-width: 200px; }
    .profile-name {
      font-size: 24px;
      font-weight: 800;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .profile-status {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(10px);
    }
    .profile-status.active { background: rgba(16,185,129,0.25); }
    .profile-status.inactive { background: rgba(239,68,68,0.25); }
    .profile-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      font-size: 13px;
      opacity: 0.9;
    }
    .profile-meta span { display: flex; align-items: center; gap: 6px; }
    .profile-meta i { width: 14px; height: 14px; opacity: 0.85; }
    .profile-balance-box {
      background: rgba(255,255,255,0.12);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.2);
      padding: 16px 24px;
      border-radius: 14px;
      text-align: center;
      min-width: 180px;
    }
    .profile-balance-box .lbl {
      font-size: 11px;
      opacity: 0.85;
      font-weight: 600;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .profile-balance-box .val { font-size: 24px; font-weight: 800; line-height: 1.1; }
    .profile-balance-box .sub { font-size: 11px; opacity: 0.85; margin-top: 4px; }

    /* ============ Stats Grid ============ */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
      margin-bottom: 20px;
    }
    .stat-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: var(--shadow-sm);
      position: relative;
      overflow: hidden;
      transition: all 0.2s;
    }
    .stat-card:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
    .stat-card::before {
      content: '';
      position: absolute;
      top: 0; right: 0;
      width: 4px;
      height: 100%;
      background: var(--accent);
    }
    .stat-card.info::before { background: var(--info); }
    .stat-card.success::before { background: var(--success); }
    .stat-card.danger::before { background: var(--danger); }
    .stat-card.gold::before { background: var(--gold); }
    .stat-card.purple::before { background: var(--purple); }
    .stat-icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      background: rgba(20,184,166,0.12);
      color: var(--accent);
    }
    .stat-icon.info { background: rgba(59,130,246,0.12); color: var(--info); }
    .stat-icon.success { background: rgba(16,185,129,0.12); color: var(--success); }
    .stat-icon.danger { background: rgba(239,68,68,0.12); color: var(--danger); }
    .stat-icon.gold { background: rgba(245,158,11,0.12); color: var(--gold); }
    .stat-icon.purple { background: rgba(139,92,246,0.12); color: var(--purple); }
    .stat-icon i { width: 20px; height: 20px; }
    .stat-body { flex: 1; min-width: 0; }
    .stat-body .label {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 4px;
    }
    .stat-body .value {
      font-size: 18px;
      font-weight: 800;
      color: var(--text);
      line-height: 1.2;
      overflow-wrap: anywhere;
    }
    .stat-body .value.danger { color: var(--danger); }
    .stat-body .value.success { color: var(--success); }
    .stat-body .value.gold { color: var(--gold); }
    .stat-body .value.info { color: var(--info); }
    .stat-body .value.accent { color: var(--accent); }
    .stat-body .sub { font-size: 11px; color: var(--text-muted); margin-top: 2px; }

    /* ============ Tabs ============ */
    .tabs {
      display: flex;
      gap: 4px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 6px;
      margin-bottom: 16px;
      overflow-x: auto;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }
    .tabs::-webkit-scrollbar { display: none; }
    .tab {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 16px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      background: transparent;
      border: none;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .tab:hover { background: var(--bg); color: var(--text); }
    .tab.active {
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: white;
      box-shadow: 0 4px 12px rgba(20,184,166,0.3);
    }
    .tab i { width: 16px; height: 16px; }
    .tab .count-badge {
      background: rgba(255,255,255,0.2);
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 11px;
    }
    .tab:not(.active) .count-badge {
      background: rgba(148,163,184,0.2);
      color: var(--text-muted);
    }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; animation: fadeIn 0.3s; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ============ Card ============ */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
      overflow: hidden;
      margin-bottom: 16px;
    }
    .card-header {
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    .card-header h3 {
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .card-header h3 i { width: 18px; height: 18px; color: var(--accent); }
    .card-body { padding: 18px; }

    /* ============ Info Grid ============ */
    .info-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
    }
    .info-item {
      background: var(--bg);
      border-radius: 10px;
      padding: 12px 14px;
    }
    .info-item .lbl {
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 700;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .info-item .lbl i { width: 12px; height: 12px; }
    .info-item .val {
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
      word-break: break-word;
    }

    /* ============ Table ============ */
    .table-wrap {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }
    table.data-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      min-width: 720px;
    }
    table.data-table thead { background: var(--bg); }
    table.data-table th {
      text-align: right;
      padding: 12px 14px;
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      white-space: nowrap;
    }
    table.data-table tbody tr { border-bottom: 1px solid var(--border); }
    table.data-table tbody tr:hover { background: var(--bg); }
    table.data-table td { padding: 12px 14px; color: var(--text); }
    table.data-table tfoot td { padding: 12px 14px; }

    .money { font-weight: 700; color: var(--text); }
    .money.danger { color: var(--danger); }
    .money.success { color: var(--success); }
    .money.gold { color: var(--gold); }
    .money.accent { color: var(--accent); }
    .money.purple { color: var(--purple); }

    .type-link {
      color: var(--accent);
      font-weight: 700;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .type-link:hover { text-decoration: underline; }
    .type-link i { width: 12px; height: 12px; }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
    }
    .status-pill.paid { background: rgba(16,185,129,0.12); color: var(--success); }
    .status-pill.partial { background: rgba(245,158,11,0.12); color: var(--gold); }
    .status-pill.unpaid { background: rgba(239,68,68,0.12); color: var(--danger); }
    .status-pill.cancelled { background: rgba(148,163,184,0.15); color: var(--text-muted); }
    .status-pill.active { background: rgba(16,185,129,0.12); color: var(--success); }
    .status-pill.credit { background: rgba(16,185,129,0.12); color: var(--success); }
    .status-pill.debit { background: rgba(239,68,68,0.12); color: var(--danger); }
    .status-pill.draft { background: rgba(148,163,184,0.15); color: var(--text-muted); }
    .status-pill.confirmed { background: rgba(59,130,246,0.12); color: var(--info); }
    .status-pill.received { background: rgba(16,185,129,0.12); color: var(--success); }
    .status-pill.return { background: rgba(245,158,11,0.12); color: var(--gold); }
    .status-pill.pay-out { background: rgba(239,68,68,0.12); color: var(--danger); }
    .status-pill.pay-in { background: rgba(16,185,129,0.12); color: var(--success); }

    /* ============ Charts ============ */
    .charts-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 16px;
      margin-bottom: 16px;
    }
    .chart-wrap {
      position: relative;
      height: 260px;
      padding: 8px;
    }

    /* ============ Top Products ============ */
    .product-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
      gap: 10px;
    }
    .product-row:last-child { border-bottom: none; }
    .product-row .rank {
      width: 26px;
      height: 26px;
      border-radius: 8px;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 800;
      flex-shrink: 0;
    }
    .product-row .name {
      flex: 1;
      font-size: 13px;
      font-weight: 700;
      color: var(--text);
      min-width: 0;
    }
    .product-row .name small {
      display: block;
      font-size: 10px;
      font-weight: 500;
      color: var(--text-muted);
      margin-top: 2px;
    }
    .product-row .value {
      font-size: 13px;
      font-weight: 800;
      color: var(--accent);
      white-space: nowrap;
    }

    /* ============ Empty / Loader ============ */
    .empty-state {
      padding: 60px 20px;
      text-align: center;
      color: var(--text-muted);
    }
    .empty-state i {
      width: 52px;
      height: 52px;
      opacity: 0.3;
      margin-bottom: 14px;
    }
    .empty-state h3 {
      font-size: 16px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 6px;
    }
    .empty-state p { font-size: 13px; }
    .loader { text-align: center; padding: 60px 20px; color: var(--text-muted); }
    .loader i {
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      color: var(--accent);
      margin-bottom: 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ============ Modal ============ */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(11, 44, 77, 0.5);
      backdrop-filter: blur(4px);
      z-index: 200;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      opacity: 0;
      transition: opacity 0.2s;
    }
    .modal-backdrop.show { display: flex; opacity: 1; }
    .modal {
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow-lg);
      width: 100%;
      max-width: 560px;
      max-height: 92vh;
      max-height: 92dvh;
      display: flex;
      flex-direction: column;
      transform: scale(0.95);
      transition: transform 0.2s;
      overflow: hidden;
    }
    .modal-backdrop.show .modal { transform: scale(1); }
    .modal-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-shrink: 0;
    }
    .modal-header h3 {
      font-size: 16px;
      font-weight: 700;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .modal-header h3 i { width: 18px; height: 18px; color: var(--accent); }
    .modal-close {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      flex-shrink: 0;
    }
    .modal-close:hover { background: var(--bg); color: var(--danger); }
    .modal-close i { width: 18px; height: 18px; }
    .modal-body {
      padding: 20px;
      overflow-y: auto;
      flex: 1;
      min-height: 0;
    }
    .modal-body::-webkit-scrollbar { width: 6px; }
    .modal-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }
    .modal-footer {
      padding: 14px 20px;
      padding-bottom: calc(14px + var(--safe-bottom));
      border-top: 1px solid var(--border);
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      background: var(--bg);
      flex-shrink: 0;
      flex-wrap: wrap;
    }

    /* ============ Form ============ */
    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }
    .form-group { display: flex; flex-direction: column; }
    .form-group.full { grid-column: 1 / -1; }
    .form-group label {
      font-size: 12px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .form-group label .req { color: var(--danger); }
    .form-group label .hint {
      color: var(--text-muted);
      font-weight: 500;
      font-size: 11px;
      margin-right: auto;
    }
    .form-group input,
    .form-group select,
    .form-group textarea {
      padding: 10px 14px;
      font-family: inherit;
      font-size: 14px;
      background: var(--bg);
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text);
      outline: none;
      transition: all 0.2s;
      width: 100%;
    }
    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      border-color: var(--accent);
      background: var(--card);
      box-shadow: 0 0 0 3px rgba(20,184,166,0.1);
    }
    .form-group textarea { resize: vertical; min-height: 70px; }

    .form-section-title {
      font-size: 11px;
      font-weight: 800;
      color: var(--purple);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 10px 0 6px;
      border-bottom: 1px solid var(--border);
      margin: 6px 0 12px;
      display: flex;
      align-items: center;
      gap: 6px;
      grid-column: 1 / -1;
    }
    .form-section-title i { width: 14px; height: 14px; }

    .type-picker {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      grid-column: 1 / -1;
    }
    .type-option {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 14px 10px;
      border: 2px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--bg);
      cursor: pointer;
      transition: all 0.2s;
      text-align: center;
    }
    .type-option:hover { border-color: var(--accent); }
    .type-option.selected {
      border-color: var(--accent);
      background: rgba(20,184,166,0.08);
      box-shadow: 0 0 0 3px rgba(20,184,166,0.1);
    }
    .type-option.credit.selected { border-color: var(--success); background: rgba(16,185,129,0.08); }
    .type-option.debit.selected { border-color: var(--danger); background: rgba(239,68,68,0.08); }
    .type-option.pay-out.selected { border-color: var(--success); background: rgba(16,185,129,0.08); }
    .type-option.pay-in.selected { border-color: var(--danger); background: rgba(239,68,68,0.08); }
    .type-option i { width: 24px; height: 24px; color: var(--text-muted); }
    .type-option.selected i { color: var(--accent); }
    .type-option.credit.selected i { color: var(--success); }
    .type-option.debit.selected i { color: var(--danger); }
    .type-option.pay-out.selected i { color: var(--success); }
    .type-option.pay-in.selected i { color: var(--danger); }
    .type-option span { font-size: 13px; font-weight: 800; color: var(--text); }

    /* ============ Overlay ============ */
    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 99;
      opacity: 0;
      transition: opacity 0.3s;
    }
    .overlay.show { display: block; opacity: 1; }

    /* ============ Responsive ============ */

    @media (max-width: 1024px) {
      .sidebar { transform: translateX(100%); }
      .sidebar.open { transform: translateX(0); }
      .main { margin-right: 0; }
      .menu-toggle { display: flex; }
      .user-info { display: none; }
      .content { padding: 16px; }
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
      .charts-grid { grid-template-columns: 1fr; }
    }

    @media (max-width: 640px) {
      .content { padding: 12px; }
      .topbar { padding: 0 12px; gap: 8px; height: 56px; }
      .topbar-title { font-size: 14px; }
      .topbar-title a span, .topbar-title a { font-size: 12px; }
      .icon-btn { width: 34px; height: 34px; }
      .icon-btn i { width: 16px; height: 16px; }
      .user-avatar { width: 30px; height: 30px; font-size: 12px; }

      .page-head { flex-direction: column; align-items: stretch; gap: 12px; margin-bottom: 14px; }
      .page-head h1 { font-size: 18px; }
      .page-head p { font-size: 12px; }
      .back-btn { width: 38px; height: 38px; }
      .page-actions { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
      .page-actions .btn { width: 100%; font-size: 11px; padding: 8px 10px; }

      .profile-hero { flex-direction: column; text-align: center; padding: 18px 16px; gap: 14px; }
      .profile-avatar { width: 70px; height: 70px; font-size: 28px; }
      .profile-name { font-size: 20px; justify-content: center; }
      .profile-meta { justify-content: center; font-size: 12px; gap: 10px; }
      .profile-balance-box { width: 100%; padding: 14px 18px; }
      .profile-balance-box .val { font-size: 22px; }

      .stats-grid { grid-template-columns: 1fr; gap: 10px; }
      .stat-card { padding: 14px; gap: 10px; }
      .stat-icon { width: 40px; height: 40px; }
      .stat-icon i { width: 18px; height: 18px; }
      .stat-body .value { font-size: 16px; }

      .tabs { padding: 4px; gap: 3px; }
      .tab { padding: 8px 12px; font-size: 12px; gap: 6px; }
      .tab i { width: 14px; height: 14px; }
      .tab .count-badge { padding: 1px 6px; font-size: 10px; }

      .card-header { padding: 12px 14px; }
      .card-header h3 { font-size: 14px; }
      .card-body { padding: 14px; }

      .info-grid { grid-template-columns: 1fr; gap: 10px; }
      .info-item { padding: 10px 12px; }
      .info-item .val { font-size: 13px; }

      .form-grid { grid-template-columns: 1fr; }
      .form-section-title { font-size: 10px; }
      .type-picker { grid-template-columns: 1fr; }

      .modal-backdrop { padding: 8px; }
      .modal { max-height: 96vh; max-height: 96dvh; }
      .modal-header { padding: 14px 16px; }
      .modal-header h3 { font-size: 15px; }
      .modal-body { padding: 16px; }
      .modal-footer { padding: 12px 16px; padding-bottom: calc(12px + var(--safe-bottom)); flex-direction: column-reverse; }
      .modal-footer .btn { width: 100%; justify-content: center; }

      .chart-wrap { height: 220px; }
      .product-row { font-size: 12px; }
      .product-row .rank { width: 22px; height: 22px; font-size: 11px; }

      table.data-table { font-size: 12px; min-width: 640px; }
      table.data-table th { padding: 10px 10px; font-size: 10px; }
      table.data-table td { padding: 10px 10px; }
    }

    @media (max-width: 400px) {
      .content { padding: 8px; }
      .topbar { padding: 0 8px; }
      .page-actions .btn { font-size: 10px; padding: 6px 8px; }
      .profile-avatar { width: 60px; height: 60px; font-size: 24px; }
      .profile-name { font-size: 17px; }
      .profile-balance-box .val { font-size: 20px; }
      .stat-body .value { font-size: 15px; }
      .stat-icon { width: 36px; height: 36px; }
      .tab { padding: 6px 10px; font-size: 11px; }
    }

    @media print {
      .sidebar, .topbar, .page-actions, .tabs, .modal-backdrop { display: none !important; }
      .main { margin-right: 0; }
      .content { padding: 0; }
      .card { border: none; box-shadow: none; }
    }
  </style>
</head>
<body>

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo" id="sidebarLogo">
        <img src="logo.png" alt="رفاد" id="sidebarLogoImg" onerror="this.style.display='none';this.parentElement.innerHTML='<span class=fallback>R</span>';">
      </div>
      <div class="sidebar-brand">
        <h2 id="sidebarBrandName">رفاد</h2>
        <p id="sidebarBrandDesc">نظام إدارة الأدوية</p>
      </div>
    </div>
    <nav class="sidebar-nav" id="sidebarNav"></nav>
  </aside>

  <div class="overlay" id="overlay"></div>

  <!-- Main -->
  <div class="main">
    <header class="topbar">
      <button class="menu-toggle" id="menuToggle"><i data-lucide="menu"></i></button>
      <div class="topbar-title">
        <a href="suppliers.html">
          <i data-lucide="arrow-right" style="width:16px;height:16px;"></i>
          الموردين
        </a>
        <i data-lucide="chevron-left" style="width:14px;height:14px;opacity:0.4;"></i>
        <span id="topbarTitle">تفاصيل المورد</span>
      </div>
      <div class="topbar-actions">
        <button class="icon-btn" id="themeToggle" title="الوضع الليلي/النهاري">
          <i data-lucide="moon" id="themeIcon"></i>
        </button>
        <button class="icon-btn" id="notifBtn" title="الإشعارات">
          <i data-lucide="bell"></i>
        </button>
        <div style="position:relative;">
          <div class="user-menu" id="userMenu">
            <div class="user-avatar" id="userAvatar">م</div>
            <div class="user-info">
              <span class="name" id="userName">—</span>
              <span class="role" id="userRole">—</span>
            </div>
          </div>
          <div class="dropdown" id="userDropdown">
            <a href="company-settings.html" class="dropdown-item"><i data-lucide="settings"></i> الإعدادات</a>
            <div class="dropdown-divider"></div>
            <div class="dropdown-item danger" id="logoutBtn"><i data-lucide="log-out"></i> تسجيل الخروج</div>
          </div>
        </div>
      </div>
    </header>

    <main class="content">
      <div class="page-head">
        <div class="page-head-left">
          <a href="suppliers.html" class="back-btn">
            <i data-lucide="arrow-right"></i>
          </a>
          <div style="min-width:0;">
            <h1 id="pageTitle">جارٍ التحميل...</h1>
            <p id="pageSubtitle">—</p>
          </div>
        </div>
        <div class="page-actions">
          <button class="btn btn-outline btn-sm" id="printBtn">
            <i data-lucide="printer"></i> طباعة
          </button>
          <button class="btn btn-outline btn-sm" id="exportBtn">
            <i data-lucide="download"></i> تصدير
          </button>
          <button class="btn btn-danger btn-sm" id="payBtn">
            <i data-lucide="arrow-up-circle"></i> دفع للمورد
          </button>
          <button class="btn btn-success btn-sm" id="receiveBtn">
            <i data-lucide="arrow-down-circle"></i> قبض من المورد
          </button>
          <button class="btn btn-gold btn-sm" id="noteBtn">
            <i data-lucide="file-text"></i> إشعار
          </button>
          <button class="btn btn-primary btn-sm" id="editBtn">
            <i data-lucide="pencil"></i> تعديل
          </button>
        </div>
      </div>

      <div id="alertsArea"></div>

      <div id="contentArea">
        <div class="loader"><i data-lucide="loader-2"></i><p>جارٍ التحميل...</p></div>
      </div>
    </main>
  </div>

  <!-- ========== Modal: Payment ========== -->
  <div class="modal-backdrop" id="paymentModal">
    <div class="modal">
      <div class="modal-header">
        <h3><i data-lucide="banknote"></i> <span id="paymentModalTitle">تسجيل دفعة</span></h3>
        <button class="modal-close" data-close><i data-lucide="x"></i></button>
      </div>
      <form id="paymentForm">
        <div class="modal-body">
          <div class="form-grid">
            <div class="form-section-title">
              <i data-lucide="truck"></i> المورد: <span id="paymentSupplierName" style="color:var(--text);margin-right:4px;">—</span>
            </div>

            <div class="form-section-title"><i data-lucide="tag"></i> نوع العملية</div>
            <div class="type-picker" id="paymentDirectionPicker">
              <div class="type-option pay-out selected" data-direction="out">
                <i data-lucide="arrow-up-circle"></i>
                <span>دفع للمورد</span>
                <small style="font-size:10px;color:var(--text-muted);font-weight:600;">(نسدد له)</small>
              </div>
              <div class="type-option pay-in" data-direction="in">
                <i data-lucide="arrow-down-circle"></i>
                <span>قبض من المورد</span>
                <small style="font-size:10px;color:var(--text-muted);font-weight:600;">(استرداد منه)</small>
              </div>
            </div>
            <input type="hidden" id="paymentDirection" value="out">

            <div class="form-section-title"><i data-lucide="info"></i> تفاصيل الدفعة</div>

            <div class="form-group full" id="paymentReceiptGroup">
              <label>فاتورة الاستلام <span class="hint">اتركها فارغة لدفعة عامة</span></label>
              <select id="paymentReceipt">
                <option value="">— دفعة عامة (FIFO) —</option>
              </select>
            </div>

            <div class="form-group full">
              <label>الحساب <span class="req">*</span> <span class="hint" id="paymentAccountHint">(الحساب الدافع)</span></label>
              <select id="paymentAccount" required>
                <option value="">— اختر الحساب —</option>
              </select>
            </div>

            <div class="form-group">
              <label>المبلغ <span class="req">*</span></label>
              <input type="number" id="paymentAmount" min="0.01" step="0.01" placeholder="0.00" required>
            </div>

            <div class="form-group">
              <label>التاريخ</label>
              <input type="date" id="paymentDate">
            </div>

            <div class="form-group">
              <label>طريقة الدفع</label>
              <select id="paymentMethod">
                <option value="cash">نقدي</option>
                <option value="bank">تحويل بنكي</option>
                <option value="wallet">محفظة إلكترونية</option>
                <option value="cheque">شيك</option>
              </select>
            </div>

            <div class="form-group">
              <label>مرجع (اختياري)</label>
              <input type="text" id="paymentReference" maxlength="50" placeholder="رقم التحويل...">
            </div>

            <div class="form-group full">
              <label>ملاحظات</label>
              <textarea id="paymentNotes" maxlength="255" placeholder="ملاحظات..."></textarea>
            </div>

            <div class="form-group full" id="paymentWarningBox" style="display:none;">
              <div style="padding:10px 14px;background:rgba(245,158,11,0.08);border:1.5px solid rgba(245,158,11,0.3);border-radius:10px;font-size:12px;font-weight:600;line-height:1.6;color:var(--gold);">
                <i data-lucide="alert-triangle" style="width:14px;height:14px;display:inline;vertical-align:middle;"></i>
                <span id="paymentWarningText"></span>
              </div>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline" data-close>إلغاء</button>
          <button type="submit" class="btn btn-success" id="paymentSaveBtn">
            <i data-lucide="check"></i> <span id="paymentSaveBtnText">تسجيل الدفعة</span>
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- ========== Modal: Note ========== -->
  <div class="modal-backdrop" id="noteModal">
    <div class="modal">
      <div class="modal-header">
        <h3><i data-lucide="file-text"></i> إشعار جديد</h3>
        <button class="modal-close" data-close><i data-lucide="x"></i></button>
      </div>
      <form id="noteForm">
        <div class="modal-body">
          <div class="form-grid">
            <div class="form-section-title"><i data-lucide="tag"></i> نوع الإشعار</div>

            <div class="type-picker" id="noteTypePicker">
              <div class="type-option credit" data-type="credit">
                <i data-lucide="arrow-down-circle"></i>
                <span>إشعار دائن</span>
              </div>
              <div class="type-option debit" data-type="debit">
                <i data-lucide="arrow-up-circle"></i>
                <span>إشعار مدين</span>
              </div>
            </div>
            <input type="hidden" id="noteType" value="credit" required>

            <div class="form-section-title"><i data-lucide="info"></i> البيانات</div>

            <div class="form-group">
              <label>المبلغ <span class="req">*</span></label>
              <input type="number" id="noteAmount" min="0.01" step="0.01" placeholder="0.00" required>
            </div>

            <div class="form-group">
              <label>التاريخ</label>
              <input type="date" id="noteDate">
            </div>

            <div class="form-group full">
              <label>السبب <span class="req">*</span></label>
              <input type="text" id="noteReason" maxlength="200" placeholder="مثال: خصم، تصحيح فاتورة..." required>
            </div>

            <div class="form-group full">
              <label>فاتورة استلام مرتبطة (اختياري)</label>
              <select id="noteReceipt">
                <option value="">— بدون فاتورة —</option>
              </select>
            </div>

            <div class="form-group full">
              <label>ملاحظات</label>
              <textarea id="noteNotes" maxlength="500" placeholder="ملاحظات إضافية..."></textarea>
            </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-outline" data-close>إلغاء</button>
          <button type="submit" class="btn btn-gold" id="noteSaveBtn">

          </button>

  </div>

  <script src="refad-core.js"></script>
  <script src="refad-auth.js"></script>
  <script src="refad-theme-sync.js"></script>
  <script src="refad-settings.js"></script>

  <script>
    (function () {
      'use strict';

      // ✅ حماية من Double Submit
      let isSubmittingPayment = false;
      let isSubmittingNote = false;

      const SafeSettings = {
        locale: {
          formatMoney: function (v) {
            try {
              if (window.RefadSettings?.locale?.formatMoney) return RefadSettings.locale.formatMoney(v);
            } catch (e) {}
            return Refad.format.money(v);
          }
        },
        identity: {
          getSystemName: function () {
            try { if (window.RefadSettings?.identity?.getSystemName) return RefadSettings.identity.getSystemName(); } catch (e) {}
            return 'رفاد';
          },
          getTagline: function () {
            try { if (window.RefadSettings?.identity?.getTagline) return RefadSettings.identity.getTagline(); } catch (e) {}
            return 'نظام إدارة الأدوية';
          },
          getLogoUrl: function () {
            try { if (window.RefadSettings?.identity?.getLogoUrl) return RefadSettings.identity.getLogoUrl(); } catch (e) {}
            return null;
          }
        }
      };

      const session = Refad.Auth.guardPage('suppliers.view');
      if (!session) return;

      const supplierId = parseInt(Refad.getParam('id'), 10);
      if (!supplierId) {
        Refad.alert.error('خطأ', 'لم يتم تحديد المورد').then(() => location.href = 'suppliers.html');
        return;
      }

      const canEdit = Refad.Session.has('suppliers.edit') || Refad.Session.has('company.owner');
      const canPay = Refad.Session.has('company.owner') || Refad.Session.has('purchases.pay');

      const state = {
        supplier: null,
        receipts: [],
        orders: [],
        notes: [],
        returns: [],
        payments: [],
        accounts: [],
        users: [],
        statement: [],
        computedBalance: 0,
        computedTotalPurchases: 0,
        computedTotalPaid: 0,
        computedTotalReceived: 0,
        productTotals: {},
        topProducts: [],
        leadTimeData: null,
        monthlyChart: null,
        currentDirection: 'out'
      };

      function esc(s) {
        if (typeof Refad.escapeHtml === 'function') return Refad.escapeHtml(s);
        if (s === null || s === undefined) return '';
        return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
          .replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
      }
      function fmtMoney(v) { return SafeSettings.locale.formatMoney(v); }
      function fmtNumber(v) {
        if (typeof Refad.format?.number === 'function') return Refad.format.number(v);
        return String(v || 0);
      }
      function toNum(v) { return Number(v) || 0; }
      const today = () => Refad.date.today();

      /**
       * ✅ حساب المبلغ المدفوع لفاتورة معينة من payments مباشرة
       * بدل الاعتماد على receipts.paid_amount (اللي ممكن يكون مش محدّث)
       */
      function getReceiptPaidAmount(receiptId) {
        if (!receiptId) return 0;
        return state.payments
          .filter(p => String(p.reference_receipt_id) === String(receiptId) && p.direction === 'out')
          .reduce((sum, p) => sum + toNum(p.amount), 0);
      }

      function applyIdentity() {
        const name = SafeSettings.identity.getSystemName();
        const tagline = SafeSettings.identity.getTagline();
        const logoUrl = SafeSettings.identity.getLogoUrl();
        const brandName = document.getElementById('sidebarBrandName');
        const brandDesc = document.getElementById('sidebarBrandDesc');
        const logoImg = document.getElementById('sidebarLogoImg');
        if (brandName) brandName.textContent = name;
        if (brandDesc) brandDesc.textContent = tagline;
        if (logoImg && logoUrl) {
          logoImg.src = logoUrl;
          logoImg.onerror = function () {
            this.style.display = 'none';
            const parent = this.parentElement;
            if (parent) parent.innerHTML = '<span class="fallback">' + (name.charAt(0) || 'R') + '</span>';
          };
        }
      }

      function setupRealtimeTheme() {
        window.addEventListener('refad:theme-changed', () => {
          applyIdentity();
          if (state.supplier) setTimeout(() => renderCharts(), 100);
        });
      }

      function fillUser() {
        const av = document.getElementById('userAvatar');
        const initial = (session.full_name || '؟').trim().charAt(0);
        if (session.avatar_url) av.innerHTML = `<img src="${esc(session.avatar_url)}" alt="">`;
        else av.textContent = initial;
        document.getElementById('userName').textContent = session.full_name;
        document.getElementById('userRole').textContent = Refad.Session.has('company.owner') ? 'صاحب الشركة' : 'موظف';
      }

      function setupTheme() {
        const btn = document.getElementById('themeToggle');
        const icon = document.getElementById('themeIcon');
        const refresh = () => {
          const isDark = Refad.theme.get() === 'dark';
          icon.setAttribute('data-lucide', isDark ? 'sun' : 'moon');
          if (window.lucide) lucide.createIcons();
        };
        refresh();
        btn.addEventListener('click', () => { Refad.theme.toggle(); refresh(); });
      }

      function setupSidebarMobile() {
        const sb = document.getElementById('sidebar');
        const ov = document.getElementById('overlay');
        document.getElementById('menuToggle').addEventListener('click', () => {
          sb.classList.add('open');
          ov.classList.add('show');
        });
        ov.addEventListener('click', () => {
          sb.classList.remove('open');
          ov.classList.remove('show');
        });
      }

      function setupUserMenu() {
        const m = document.getElementById('userMenu');
        const d = document.getElementById('userDropdown');
        m.addEventListener('click', e => { e.stopPropagation(); d.classList.toggle('show'); });
        document.addEventListener('click', () => d.classList.remove('show'));
        d.addEventListener('click', e => e.stopPropagation());
        document.getElementById('logoutBtn').addEventListener('click', async () => {
          if (await Refad.alert.confirm('تسجيل الخروج', 'هل تريد الخروج؟', 'خروج')) {
            await Refad.Auth.logout();
          }
        });
      }

      function setupNotifBtn() {
        document.getElementById('notifBtn').addEventListener('click', () => {
          window.location.href = 'notifications.html';
        });
      }

      async function loadData() {
        try {
          const supplier = await Refad.db.selectOne('suppliers', {
            eq: { id: supplierId, company_id: session.company_id }
          });

          if (!supplier) {
            Refad.alert.error('غير موجود', 'المورد غير موجود').then(() => location.href = 'suppliers.html');
            return;
          }

          state.supplier = supplier;

          const [
            receipts, orders, notes, returns, payments, accounts, users,
            statementRPC, balanceRPC
          ] = await Promise.all([
            Refad.db.select('receipts', {
              columns: 'id, receipt_number, invoice_number, receipt_date, total_amount, paid_amount, status, created_at, notes',
              eq: { supplier_id: supplierId, company_id: session.company_id },
              order: { column: 'receipt_date', ascending: true },
              limit: 1000
            }).catch(() => []),

            Refad.db.select('purchase_requests', {
              columns: 'id, request_number, status, created_at, total_amount',
              eq: { supplier_id: supplierId, company_id: session.company_id },
              order: { column: 'created_at', ascending: false },
              limit: 300
            }).catch(() => []),

            Refad.db.select('credit_notes', {
              columns: 'id, note_number, note_type, note_date, amount, tax_amount, reason, status, reference_receipt_id, created_at',
              eq: { supplier_id: supplierId, company_id: session.company_id },
              order: { column: 'note_date', ascending: true },
              limit: 300
            }).catch(() => []),

            Refad.db.select('inventory_returns', {
              columns: 'id, return_number, return_date, total_amount, reason, reference_receipt_id, created_at',
              eq: { supplier_id: supplierId, company_id: session.company_id, return_type: 'purchase' },
              order: { column: 'return_date', ascending: true },
              limit: 300
            }).catch(() => []),

            Refad.db.select('payments', {
              columns: 'id, payment_number, payment_type, direction, account_id, supplier_id, amount, method, payment_date, notes, reference_receipt_id, created_by, created_at',
              eq: { supplier_id: supplierId, company_id: session.company_id },
              order: { column: 'payment_date', ascending: true },
              limit: 1000
            }).catch(() => []),

            Refad.db.select('accounts', {
              columns: 'id, name, type, current_balance, is_default, is_active',
              eq: { company_id: session.company_id, is_active: true },
              order: { column: 'is_default', ascending: false }
            }).catch(() => []),

            Refad.db.select('users', {
              columns: 'id, full_name',
              eq: { company_id: session.company_id }
            }).catch(() => []),

            Refad.sb.rpc('get_supplier_statement', {
              p_supplier_id: supplierId, p_date_from: null, p_date_to: null
            }).then(r => r.error ? null : r.data).catch(() => null),

            Refad.sb.rpc('get_supplier_balance', {
              p_supplier_id: supplierId
            }).then(r => r.error ? null : r.data).catch(() => null)
          ]);

          state.receipts = receipts || [];
          state.orders = orders || [];
          state.notes = notes || [];
          state.returns = returns || [];
          state.payments = payments || [];
          state.accounts = accounts || [];
          state.users = users || [];
          state.statement = statementRPC || [];

          // ✅ استخدام get_supplier_balance مع مزامنة الرصيد المخزّن
          if (balanceRPC !== null && balanceRPC !== undefined) {
            state.computedBalance = toNum(balanceRPC);

            // مزامنة الرصيد المخزّن لو مختلف
            if (Math.abs(toNum(supplier.balance) - state.computedBalance) > 0.01) {
              try {
                await Refad.db.update('suppliers', supplier.id, {
                  balance: state.computedBalance
                });
                console.log('[SupplierDetails] Balance synced:', state.computedBalance);
              } catch (e) {
                console.warn('Balance sync failed:', e);
              }
            }
          } else {
            state.computedBalance = toNum(supplier.balance);
          }

          computeTotals();
          await loadProductAnalysis();
          calculateLeadTime();

          renderAlerts();
          renderPage();
          populatePaymentReceipts();
          populatePaymentAccounts();
          populateNoteReceipts();
        } catch (e) {
          console.error('[SupplierDetails] load failed:', e);
          document.getElementById('contentArea').innerHTML = `
            <div class="card"><div class="card-body">
              <div class="empty-state" style="color:var(--danger);">
                <i data-lucide="alert-circle"></i>
                <p>فشل التحميل: ${esc(e.message || '')}</p>
              </div>
            </div></div>`;
          if (window.lucide) lucide.createIcons();
        }
      }

      function computeTotals() {
        state.computedTotalPurchases = state.receipts
          .filter(r => r.status !== 'cancelled')
          .reduce((s, r) => s + toNum(r.total_amount), 0);

        state.computedTotalPaid = state.payments
          .filter(p => p.direction === 'out')
          .reduce((s, p) => s + toNum(p.amount), 0);

        state.computedTotalReceived = state.payments
          .filter(p => p.direction === 'in')
          .reduce((s, p) => s + toNum(p.amount), 0);
      }

      async function loadProductAnalysis() {
        try {
          if (!state.receipts.length) return;

          const receiptIds = state.receipts.map(r => r.id);
          const items = await Refad.db.select('receipt_items', {
            columns: 'product_id, quantity, unit_price, total, purchase_discount, receipt_id, products(id, name, name_en, form, unit, category)',
            in: { receipt_id: receiptIds }
          }).catch(() => []);

          const productTotals = {};
          items.forEach(item => {
            const pid = item.product_id;
            if (!productTotals[pid]) {
              productTotals[pid] = {
                product_id: pid,
                product: item.products,
                total_qty: 0,
                total_value: 0,
                invoices_count: new Set()
              };
            }
            productTotals[pid].total_qty += toNum(item.quantity);
            const qty = toNum(item.quantity);
            const unit_price = toNum(item.unit_price);
            const discount = toNum(item.purchase_discount);
            const netValue = qty * unit_price * (1 - discount / 100);
            productTotals[pid].total_value += netValue;
            productTotals[pid].invoices_count.add(item.receipt_id);
          });

          state.productTotals = productTotals;
          state.topProducts = Object.values(productTotals)
            .sort((a, b) => b.total_value - a.total_value)
            .slice(0, 10)
            .map(p => ({ ...p, invoices_count: p.invoices_count.size }));
        } catch (e) {
          console.warn('Product analysis failed:', e.message);
        }
      }

      function calculateLeadTime() {
        const leadTimes = [];
        state.orders.forEach(pr => {
          const linkedReceipt = state.receipts.find(r =>
            r.receipt_number && pr.request_number &&
            r.receipt_number.includes(pr.request_number)
          );
          if (linkedReceipt && pr.created_at && linkedReceipt.receipt_date) {
            const days = Math.round(
              (new Date(linkedReceipt.receipt_date) - new Date(pr.created_at)) / (1000 * 60 * 60 * 24)
            );
            if (days > 0 && days < 90) leadTimes.push(days);
          }
        });

        state.leadTimeData = leadTimes.length ? {
          avg_days: Math.round(leadTimes.reduce((s, d) => s + d, 0) / leadTimes.length),
          min_days: Math.min(...leadTimes),
          max_days: Math.max(...leadTimes),
          samples: leadTimes.length
        } : null;
      }

      function renderAlerts() {
        const area = document.getElementById('alertsArea');
        if (!area) return;

        const balance = state.computedBalance;
        const alerts = [];

        if (balance > 0 && balance > 10000) {
          alerts.push({
            type: 'warning',
            icon: 'alert-triangle',
            text: `⚠️ <strong>رصيد كبير للمورد</strong> — ${fmtMoney(balance)} مستحقة للمورد.`
          });
        }

        if (balance < -0.01) {
          alerts.push({
            type: 'info',
            icon: 'info',
            text: `💡 <strong>لنا رصيد عند المورد</strong> — ${fmtMoney(Math.abs(balance))} يمكننا استرداده عبر "قبض من المورد".`
          });
        }

        // ✅ استخدام getReceiptPaidAmount بدل paid_amount
        const overdueReceipts = state.receipts.filter(r => {
          if (r.status === 'cancelled') return false;
          const paid = getReceiptPaidAmount(r.id);
          const due = toNum(r.total_amount) - paid;
          if (due <= 0.01) return false;
          const days = Refad.format.daysLeft(r.receipt_date);
          return days !== null && days < -30;
        });

        if (overdueReceipts.length > 0) {
          const totalOverdue = overdueReceipts.reduce((sum, r) => {
            const paid = getReceiptPaidAmount(r.id);
            return sum + (toNum(r.total_amount) - paid);
          }, 0);
          alerts.push({
            type: 'danger',
            icon: 'clock-alert',
            text: `🕐 <strong>${overdueReceipts.length} استلام متأخر</strong> بإجمالي ${fmtMoney(totalOverdue)}.`
          });
        }

        if (!alerts.length) { area.innerHTML = ''; return; }

        area.innerHTML = alerts.map(a => `
          <div class="alert-banner ${a.type}">
            <i data-lucide="${a.icon}"></i>
            <div>${a.text}</div>
          </div>
        `).join('');

        if (window.lucide) lucide.createIcons();
      }

      function renderPage() {
        const s = state.supplier;
        const initials = esc((s.name || '؟').charAt(0));
        const balance = state.computedBalance;
        const paymentTerms = parseInt(s.payment_terms_days, 10) || 0;
        const isActive = s.is_active !== false;

        const balanceColor = balance > 0 ? '#fca5a5' : (balance < 0 ? '#86efac' : 'white');
        const balanceLabel = balance > 0 ? 'علينا له' : (balance < 0 ? 'لنا عنده' : 'مصفّى');

        document.getElementById('pageTitle').textContent = s.name;
        document.getElementById('pageSubtitle').textContent = s.phone || s.email || '—';
        document.getElementById('topbarTitle').textContent = s.name;
        document.title = s.name + ' - رفاد';

        const totalPurchases = state.computedTotalPurchases;
        const totalPaid = state.computedTotalPaid;
        const totalReceived = state.computedTotalReceived;
        const totalDue = Math.max(0, balance);
        const receiptCount = state.receipts.filter(r => r.status !== 'cancelled').length;

        const receiptsCount = state.receipts.length;
        const ordersCount = state.orders.length;
        const notesCount = state.notes.length;
        const returnsCount = state.returns.length;

        document.getElementById('contentArea').innerHTML = `
          <div class="profile-hero">
            <div class="profile-avatar">${initials}</div>
            <div class="profile-info">
              <div class="profile-name">
                ${esc(s.name)}
                <span class="profile-status ${isActive ? 'active' : 'inactive'}">
                  ${isActive ? '✓ نشط' : '✕ موقوف'}
                </span>
              </div>
              <div class="profile-meta">
                ${s.phone ? `<span><i data-lucide="phone"></i> ${esc(s.phone)}</span>` : ''}
                ${s.email ? `<span><i data-lucide="mail"></i> ${esc(s.email)}</span>` : ''}
                ${s.tax_number ? `<span><i data-lucide="file-text"></i> ${esc(s.tax_number)}</span>` : ''}
                ${s.address ? `<span><i data-lucide="map-pin"></i> ${esc(s.address)}</span>` : ''}
                <span><i data-lucide="calendar"></i> مورد منذ ${Refad.format.date(s.created_at)}</span>
              </div>
            </div>
            <div class="profile-balance-box">
              <div class="lbl">الرصيد الحالي</div>
              <div class="val" style="color:${balanceColor};">${fmtMoney(Math.abs(balance))}</div>
              <div class="sub">${balanceLabel}</div>
            </div>
          </div>

          <div class="stats-grid">
            <div class="stat-card info">
              <div class="stat-icon info"><i data-lucide="package-check"></i></div>
              <div class="stat-body">
                <div class="label">إجمالي الاستلامات</div>
                <div class="value info">${fmtNumber(receiptCount)}</div>
                <div class="sub">${fmtNumber(state.orders.length)} طلب شراء</div>
              </div>
            </div>
            <div class="stat-card">
              <div class="stat-icon"><i data-lucide="shopping-bag"></i></div>
              <div class="stat-body">
                <div class="label">إجمالي المشتريات</div>
                <div class="value accent">${fmtMoney(totalPurchases)}</div>
                <div class="sub">${paymentTerms > 0 ? `${paymentTerms} يوم سداد` : 'نقدي'}</div>
              </div>
            </div>
            <div class="stat-card success">
              <div class="stat-icon success"><i data-lucide="arrow-up-circle"></i></div>
              <div class="stat-body">
                <div class="label">إجمالي المدفوع للمورد</div>
                <div class="value success">${fmtMoney(totalPaid)}</div>
                <div class="sub">${totalPurchases > 0 ? Math.round((totalPaid / totalPurchases) * 100) + '%' : '—'}</div>
              </div>
            </div>
            <div class="stat-card gold">
              <div class="stat-icon gold"><i data-lucide="arrow-down-circle"></i></div>
              <div class="stat-body">
                <div class="label">إجمالي المقبوض منه</div>
                <div class="value gold">${fmtMoney(totalReceived)}</div>
                <div class="sub">${state.payments.filter(p => p.direction === 'in').length} استرداد</div>
              </div>
            </div>
            <div class="stat-card danger">
              <div class="stat-icon danger"><i data-lucide="alert-circle"></i></div>
              <div class="stat-body">
                <div class="label">المتبقي علينا</div>
                <div class="value danger">${fmtMoney(totalDue)}</div>
                <div class="sub">${state.receipts.filter(r => r.status !== 'cancelled').length} استلام</div>
              </div>
            </div>
          </div>

          ${paymentTerms > 0 ? `
            <div class="card" style="border-color:rgba(139,92,246,0.2);background:linear-gradient(135deg, rgba(139,92,246,0.06), rgba(20,184,166,0.04));">
              <div class="card-header" style="border-color:rgba(139,92,246,0.15);">
                <h3 style="color:var(--purple);"><i data-lucide="clock"></i> شروط السداد</h3>
              </div>
              <div class="card-body">
                <div class="info-grid">
                  <div class="info-item">
                    <div class="lbl">فترة السداد</div>
                    <div class="val">${paymentTerms} يوم</div>
                  </div>
                  <div class="info-item">
                    <div class="lbl">إجمالي المشتريات</div>
                    <div class="val">${fmtMoney(totalPurchases)}</div>
                  </div>
                  <div class="info-item">
                    <div class="lbl">المدفوع</div>
                    <div class="val" style="color:var(--success);">${fmtMoney(totalPaid)}</div>
                  </div>
                  <div class="info-item">
                    <div class="lbl">المتبقي</div>
                    <div class="val" style="color:${totalDue > 0 ? 'var(--danger)' : 'var(--success)'};">${fmtMoney(totalDue)}</div>
                  </div>
                </div>
              </div>
            </div>
          ` : ''}

      function renderReceiptsTab() {
        const body = document.getElementById('receiptsTabBody');
        if (!body) return;

        if (!state.receipts.length) {
          body.innerHTML = `<div class="empty-state">
            <i data-lucide="package-check"></i>
            <h3>لا توجد استلامات بعد</h3>
          </div>`;
          if (window.lucide) lucide.createIcons();
          return;
        }

        const statusMap = {
          completed: { label: 'مكتمل', cls: 'paid' },
          partial: { label: 'جزئي', cls: 'partial' },
          pending: { label: 'معلق', cls: 'unpaid' },
          cancelled: { label: 'ملغي', cls: 'cancelled' }
        };

        body.innerHTML = `
          <div class="table-wrap">
            <table class="data-table">
              <thead>
                <tr>
                  <th>رقم الفاتورة</th>
                  <th>التاريخ</th>
                  <th>الإجمالي</th>
                  <th>المدفوع</th>
                  <th>المتبقي</th>
                  <th>الحالة</th>
                </tr>
              </thead>
              <tbody>
                ${state.receipts.slice().reverse().map(r => {
                  const total = toNum(r.total_amount);
                  // ✅ احسب المدفوع من payments مباشرة
                  const paid = getReceiptPaidAmount(r.id);
                  const due = total - paid;
                  const s = statusMap[r.status] || { label: r.status, cls: 'cancelled' };

                  return `
                    <tr>
                      <td>
                        <a href="receipt-form.html?id=${r.id}" class="type-link">
                          <i data-lucide="external-link"></i>
                          ${esc(r.receipt_number || r.invoice_number)}

                      <td>${Refad.format.date(r.receipt_date)}</td>
                      <td class="money">${fmtMoney(total)}</td>
                      <td class="money success">${fmtMoney(paid)}</td>
                      <td class="money ${due > 0.01 ? 'danger' : ''}">${fmtMoney(due)}</td>
                      <td><span class="status-pill ${s.cls}">${s.label}</span></td>
                    </tr>
                  `;
                }).join('')}
              </tbody>
            </table>
          </div>

        if (window.lucide) lucide.createIcons();
