      // ============================================================
      // 19) Render Smart Alerts
      // ============================================================
      function renderSmartAlerts() {
        const container = document.getElementById('smartAlerts');
        if (!container) return;

        const alerts = [];
        const s = state.supplier;

        if (Math.abs(s.balance || 0) > 5000) {
          alerts.push({
            type: s.balance > 0 ? 'warning' : 'success',
            icon: 'wallet',
            msg: `الرصيد ${s.balance > 0 ? 'المستحق للمورد' : 'المستحق لنا'}: <strong>${fmtMoney(Math.abs(s.balance))}</strong>`
          });
        }

        if (state.leadTimeData && state.leadTimeData.avg_days > 14) {
          alerts.push({
            type: 'warning',
            icon: 'clock',
            msg: `فترة التسليم المتوسطة: <strong>${state.leadTimeData.avg_days} يوم</strong>`
          });
        }

        if (state.returns.length > 0) {
          const totalReturns = state.returns.reduce((sum, r) => sum + toNum(r.total_amount), 0);
          const totalPurchases = state.receipts.reduce((sum, r) => sum + toNum(r.total_amount), 0);
          const rate = totalPurchases > 0 ? Math.round((totalReturns / totalPurchases) * 100) : 0;
          if (rate > 5) {
            alerts.push({
              type: 'warning',
              icon: 'undo-2',
              msg: `معدل المرتجعات: <strong>${rate}%</strong>`
            });
          }
        }

        if (state.receipts.length >= 5 && state.returns.length <= 1) {
          alerts.push({
            type: 'success',
            icon: 'award',
            msg: `مورد ممتاز — ${state.receipts.length} استلام بأقل من مرتجع واحد`
          });
        }

        if (!alerts.length) {
          container.innerHTML = `<div class="empty-state"><i data-lucide="check-circle"></i><p>لا توجد تنبيهات</p></div>`;
          if (window.lucide) lucide.createIcons();
          return;
        }

        container.innerHTML = alerts.map(a => `
          <div class="insight-box ${a.type}">
            <i data-lucide="${a.icon}"></i>
            <div class="insight-text">${a.msg}</div>
          </div>
        `).join('');
        if (window.lucide) lucide.createIcons();
      }

      // ============================================================
      // 20) Render Charts
      // ============================================================
      function renderCharts() {
        if (typeof Chart === 'undefined') return;

        const textColor = getComputedStyle(document.documentElement).getPropertyValue('--text').trim();
        const borderColor = getComputedStyle(document.documentElement).getPropertyValue('--border').trim();

        Chart.defaults.font.family = 'Cairo, sans-serif';
        Chart.defaults.color = textColor;

        // Monthly Chart
        const monthlyData = {};
        state.receipts.forEach(r => {
          if (!r.receipt_date) return;
          const month = String(r.receipt_date).slice(0, 7);
          monthlyData[month] = (monthlyData[month] || 0) + toNum(r.total_amount);
        });

        const sortedMonths = Object.entries(monthlyData)
          .sort((a, b) => a[0].localeCompare(b[0]))
          .slice(-6);

        if (state.monthlyChart) state.monthlyChart.destroy();
        const monthlyCtx = document.getElementById('monthlyChart');
        if (monthlyCtx && sortedMonths.length) {
          state.monthlyChart = new Chart(monthlyCtx, {
            type: 'line',
            data: {
              labels: sortedMonths.map(m => m[0]),
              datasets: [{
                label: 'المشتريات',
                data: sortedMonths.map(m => m[1]),
                borderColor: '#14B8A6',
                backgroundColor: 'rgba(20,184,166,0.1)',
                tension: 0.4,
                fill: true,
                pointRadius: 5,
                pointBackgroundColor: '#14B8A6',
                pointBorderColor: '#fff',
                pointBorderWidth: 2
              }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: {
                legend: { display: false },
                tooltip: {
                  callbacks: { label: ctx => Refad.format.money(ctx.parsed.y) }
                }
              },
              scales: {
                y: {
                  beginAtZero: true,
                  grid: { color: borderColor, drawBorder: false },
                  ticks: { callback: v => Refad.format.number(v, 0) }
                },
                x: { grid: { display: false } }
              }
            }
          });
        }
      }

      // ============================================================
      // 21) Print / Export
      // ============================================================
      function printStatement() {
        const s = state.supplier;
        if (!s) return;

        const entries = buildStatement();
        const totalPurchases = state.receipts.reduce((sum, r) => sum + toNum(r.total_amount), 0);
        const totalPaid = state.receipts.reduce((sum, r) => sum + toNum(r.paid_amount), 0);
        const balance = toNum(s.balance);

        if (Refad.Print && Refad.Print.html) {
          Refad.Print.html(`
            <div style="text-align:center;margin-bottom:20px;">
              <h1 style="color:#0B2C4D;font-size:22px;">كشف حساب مورد</h1>
              <div style="color:#64748b;font-size:13px;margin-top:4px;">
                ${Refad.format.date(new Date())}
              </div>
            </div>

            <div style="background:#F1F5F9;padding:12px 16px;border-radius:8px;margin-bottom:16px;">
              <div style="display:flex;gap:20px;flex-wrap:wrap;font-size:13px;">
                <div><strong>المورد:</strong> ${esc(s.name)}</div>
                ${s.phone ? `<div><strong>الهاتف:</strong> ${esc(s.phone)}</div>` : ''}
                ${s.address ? `<div><strong>العنوان:</strong> ${esc(s.address)}</div>` : ''}
              </div>
            </div>

            <table style="width:100%;border-collapse:collapse;font-size:12px;">
              <thead>
                <tr style="background:#0B2C4D;color:white;">
                  <th style="padding:8px;text-align:right;">التاريخ</th>
                  <th style="padding:8px;text-align:right;">النوع</th>
                  <th style="padding:8px;text-align:right;">المرجع</th>
                  <th style="padding:8px;text-align:right;">مدين</th>
                  <th style="padding:8px;text-align:right;">دائن</th>
                  <th style="padding:8px;text-align:right;">الرصيد</th>
                </tr>
              </thead>
              <tbody>
                ${entries.map(e => `
                  <tr style="border-bottom:1px solid #e2e8f0;">
                    <td style="padding:6px;">${Refad.format.date(e.date)}</td>
                    <td style="padding:6px;">${esc(e.type)}</td>
                    <td style="padding:6px;">${esc(e.reference)}</td>
                    <td style="padding:6px;color:#ef4444;">${e.debit > 0 ? fmtMoney(e.debit) : '—'}</td>
                    <td style="padding:6px;color:#10b981;">${e.credit > 0 ? fmtMoney(e.credit) : '—'}</td>
                    <td style="padding:6px;font-weight:700;">${fmtMoney(e.balance)}</td>
                  </tr>
                `).join('')}
              </tbody>
            </table>

            <div style="margin-top:20px;text-align:left;font-size:13px;line-height:1.9;">
              <div>إجمالي المشتريات: <strong>${fmtMoney(totalPurchases)}</strong></div>
              <div>إجمالي المدفوع: <strong>${fmtMoney(totalPaid)}</strong></div>
              <div style="font-size:16px;margin-top:8px;padding-top:8px;border-top:2px solid #0B2C4D;">
                الرصيد الحالي: <strong style="color:${balance > 0 ? '#ef4444' : '#14B8A6'};">${fmtMoney(balance)}</strong>
              </div>
            </div>
          `, { title: 'كشف حساب - ' + s.name });
        } else {
          Refad.toast.warning('مكتبة الطباعة غير متوفرة');
        }
      }

      function exportExcel() {
        const s = state.supplier;
        if (!s) return;

        const entries = buildStatement();

        const data = entries.map(e => ({
          'التاريخ': e.date,
          'النوع': e.type,
          'المرجع': e.reference,
          'مدين': e.debit || 0,
          'دائن': e.credit || 0,
          'الرصيد': e.balance || 0,
          'ملاحظات': e.notes || ''
        }));

        const ws = XLSX.utils.json_to_sheet(data);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, 'كشف المورد');
        XLSX.writeFile(wb, `supplier-${s.name}-${today()}.xlsx`);
        Refad.toast.success('تم التصدير');
      }

      // ============================================================
      // 22) Tabs Setup
      // ============================================================
      function setupTabs() {
        document.querySelectorAll('.tab').forEach(tab => {
          tab.addEventListener('click', () => {
            const name = tab.dataset.tab;
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
            tab.classList.add('active');
            const panel = document.querySelector(`.tab-panel[data-panel="${name}"]`);
            if (panel) panel.classList.add('active');
            if (name === 'overview') {
              setTimeout(() => renderCharts(), 100);
            }
            if (window.lucide) lucide.createIcons();
          });
        });
      }

      // ============================================================
      // 23) Payment Modal
      // ============================================================
      function populatePaymentReceipts() {
        const sel = document.getElementById('paymentReceipt');
        if (!sel) return;

        sel.innerHTML = '<option value="">— دفعة عامة (FIFO على الاستلامات) —</option>';

        const unpaidReceipts = state.receipts
          .filter(r =>
            r.status !== 'cancelled' &&
            (toNum(r.total_amount) - toNum(r.paid_amount)) > 0.01
          )
          .sort((a, b) => String(a.receipt_date).localeCompare(String(b.receipt_date)));

        unpaidReceipts.forEach(r => {
          const due = toNum(r.total_amount) - toNum(r.paid_amount);
          const opt = document.createElement('option');
          opt.value = r.id;
          opt.textContent = `${r.receipt_number} — متبقي: ${fmtMoney(due)}`;
          opt.dataset.due = due;
          sel.appendChild(opt);
        });
      }

      function openPaymentModal(receiptId) {
        if (!state.supplier) return;

        document.getElementById('paymentForm').reset();
        document.getElementById('paymentDate').value = today();
        document.getElementById('paymentSupplierName').textContent = state.supplier.name;
        document.getElementById('paymentAmount').value = '';

        populatePaymentReceipts();

        if (receiptId) {
          const sel = document.getElementById('paymentReceipt');
          sel.value = receiptId;
          const opt = sel.selectedOptions[0];
          if (opt?.dataset.due) {
            document.getElementById('paymentAmount').value = opt.dataset.due;
          }
        }

        document.getElementById('paymentModal').classList.add('show');
        if (window.lucide) lucide.createIcons();
      }

      async function submitPayment(e) {
        e.preventDefault();
        const btn = document.getElementById('paymentSaveBtn');
        btn.disabled = true;

        try {
          const receiptId = parseInt(document.getElementById('paymentReceipt').value, 10) || null;
          const amountVal = Refad.toNum(document.getElementById('paymentAmount').value);
          const dateVal = document.getElementById('paymentDate').value || today();
          const method = document.getElementById('paymentMethod').value;
          const reference = document.getElementById('paymentReference').value.trim();
          const notes = document.getElementById('paymentNotes').value.trim();

          if (amountVal <= 0) {
            Refad.toast.warning('أدخل مبلغاً صحيحاً');
            btn.disabled = false;
            return;
          }

          const supplier = state.supplier;

          if (receiptId) {
            const rec = state.receipts.find(r => r.id === receiptId);
            if (!rec) throw new Error('الاستلام غير موجود');

            const due = toNum(rec.total_amount) - toNum(rec.paid_amount);
            if (amountVal > due + 0.01) {
              Refad.toast.warning(`المبلغ أكبر من المتبقي (${fmtMoney(due)})`);
              btn.disabled = false;
              return;
            }

            const newPaid = toNum(rec.paid_amount) + amountVal;
            const newStatus = newPaid >= toNum(rec.total_amount) ? 'completed' : 'partial';

            await Refad.db.update('receipts', rec.id, {
              paid_amount: newPaid,
              status: newStatus
            });

            rec.paid_amount = newPaid;
            rec.status = newStatus;
          } else {
            let remaining = amountVal;
            const unpaid = state.receipts
              .filter(r =>
                r.status !== 'cancelled' &&
                (toNum(r.total_amount) - toNum(r.paid_amount)) > 0.01
              )
              .sort((a, b) => String(a.receipt_date).localeCompare(String(b.receipt_date)));

            for (const rec of unpaid) {
              if (remaining <= 0) break;
              const due = toNum(rec.total_amount) - toNum(rec.paid_amount);
              const applied = Math.min(remaining, due);
              const newPaid = toNum(rec.paid_amount) + applied;
              const newStatus = newPaid >= toNum(rec.total_amount) ? 'completed' : 'partial';

              await Refad.db.update('receipts', rec.id, {
                paid_amount: newPaid,
                status: newStatus
              });

              rec.paid_amount = newPaid;
              rec.status = newStatus;
              remaining -= applied;
            }
          }

          // Update supplier balance (decrease since we're paying off)
          const newBalance = toNum(supplier.balance) - amountVal;
          await Refad.db.update('suppliers', supplier.id, { balance: newBalance });
          supplier.balance = newBalance;

          // Log transaction
          await Refad.db.insert('supplier_transactions', {
            supplier_id: supplier.id,
            company_id: session.company_id,
            type: 'payment',
            amount: amountVal,
            balance_after: newBalance,
            notes: [notes, reference, method].filter(Boolean).join(' • ') || 'دفعة',
            user_id: session.user_id
          });

          await Refad.logActivity('register_payment', 'suppliers',
            `دفعة ${fmtMoney(amountVal)} للمورد ${supplier.name}`, supplier.id);

          Refad.toast.success(`تم تسجيل دفعة ${fmtMoney(amountVal)}`);
          document.getElementById('paymentModal').classList.remove('show');

          await loadData();
        } catch (err) {
          console.error('[SupplierDetails] Payment failed:', err);
          Refad.toast.error('فشل تسجيل الدفعة: ' + err.message);
        } finally {
          btn.disabled = false;
        }
      }

      // ============================================================
      // 24) Note Modal
      // ============================================================
      function setNoteType(type) {
        document.getElementById('noteType').value = type;
        document.querySelectorAll('#noteTypePicker .type-option').forEach(opt => {
          opt.classList.toggle('selected', opt.dataset.type === type);
        });
      }

      function populateNoteReceipts() {
        const sel = document.getElementById('noteReceipt');
        if (!sel) return;
        sel.innerHTML = '<option value="">— بدون فاتورة —</option>';
        state.receipts
          .filter(r => r.status !== 'cancelled')
          .slice(0, 100)
          .forEach(r => {
            const opt = document.createElement('option');
            opt.value = r.id;
            opt.textContent = `${r.receipt_number} — ${fmtMoney(r.total_amount)}`;
            sel.appendChild(opt);
          });
      }

      function openNoteModal() {
        if (!state.supplier) return;
        document.getElementById('noteForm').reset();
        document.getElementById('noteDate').value = today();
        setNoteType('credit');
        populateNoteReceipts();
        document.getElementById('noteModal').classList.add('show');
        if (window.lucide) lucide.createIcons();
      }

      async function submitNote(e) {
        e.preventDefault();
        const btn = document.getElementById('noteSaveBtn');
        btn.disabled = true;

        try {
          const noteType = document.getElementById('noteType').value;
          const amountVal = Refad.toNum(document.getElementById('noteAmount').value);
          const dateVal = document.getElementById('noteDate').value || today();
          const reason = document.getElementById('noteReason').value.trim();
          const receiptId = parseInt(document.getElementById('noteReceipt').value, 10) || null;
          const notes = document.getElementById('noteNotes').value.trim() || null;

          if (amountVal <= 0) { Refad.toast.warning('أدخل مبلغاً صحيحاً'); btn.disabled = false; return; }
          if (!reason) { Refad.toast.warning('السبب مطلوب'); btn.disabled = false; return; }

          const prefix = noteType === 'credit' ? 'CN' : 'DN';
          const year = new Date().getFullYear();
          const count = await Refad.db.count('credit_notes', {
            eq: { company_id: session.company_id }
          });
          const noteNumber = `${prefix}-${year}-${String(count + 1).padStart(5, '0')}`;

          const payload = {
            company_id: session.company_id,
            note_number: noteNumber,
            note_type: noteType,
            party_type: 'supplier',
            supplier_id: state.supplier.id,
            reference_receipt_id: receiptId,
            amount: amountVal,
            tax_amount: 0,
            reason,
            notes,
            note_date: dateVal,
            status: 'active',
            created_by: session.user_id
          };

          const created = await Refad.db.insert('credit_notes', payload);

          await Refad.logActivity('create_credit_note', 'suppliers',
            `إضافة ${noteType === 'credit' ? 'إشعار دائن' : 'إشعار مدين'} ${noteNumber} بمبلغ ${fmtMoney(amountVal)} للمورد ${state.supplier.name}`,
            created?.id);

          Refad.toast.success(`تم إضافة ${noteType === 'credit' ? 'الإشعار الدائن' : 'الإشعار المدين'}`);
          document.getElementById('noteModal').classList.remove('show');

          await loadData();
        } catch (err) {
          console.error('[SupplierDetails] Note failed:', err);
          Refad.toast.error('فشل إضافة الإشعار: ' + err.message);
        } finally {
          btn.disabled = false;
        }
      }

      // ============================================================
      // 25) Edit Modal (redirect to suppliers.html)
      // ============================================================
      function openEdit() {
        location.href = 'suppliers.html?id=' + supplierId;
      }

      // ============================================================
      // 26) Bind Events
      // ============================================================
      function bindEvents() {
        document.getElementById('printBtn').addEventListener('click', printStatement);
        document.getElementById('exportBtn').addEventListener('click', exportExcel);
        document.getElementById('paymentBtn').addEventListener('click', () => openPaymentModal());
        document.getElementById('noteBtn').addEventListener('click', openNoteModal);

        if (canEdit) {
          document.getElementById('editBtn').addEventListener('click', openEdit);
        } else {
          document.getElementById('editBtn').style.display = 'none';
        }

        // Modal close
        document.querySelectorAll('[data-close]').forEach(btn => {
          btn.addEventListener('click', () => {
            document.querySelectorAll('.modal-backdrop').forEach(m => m.classList.remove('show'));
          });
        });

        document.querySelectorAll('.modal-backdrop').forEach(m => {
          m.addEventListener('click', e => {
            if (e.target === m) m.classList.remove('show');
          });
        });

        document.addEventListener('keydown', e => {
          if (e.key === 'Escape') {
            document.querySelectorAll('.modal-backdrop').forEach(m => m.classList.remove('show'));
          }
        });

        // Payment form
        document.getElementById('paymentForm').addEventListener('submit', submitPayment);

        document.getElementById('paymentReceipt').addEventListener('change', e => {
          const opt = e.target.selectedOptions[0];
          if (opt?.dataset.due) {
            document.getElementById('paymentAmount').value = opt.dataset.due;
          }
        });

        // Note form
        document.getElementById('noteForm').addEventListener('submit', submitNote);

        document.querySelectorAll('#noteTypePicker .type-option').forEach(opt => {
          opt.addEventListener('click', () => setNoteType(opt.dataset.type));
        });

        // Statement buttons inside tab
        document.addEventListener('click', (e) => {
          if (e.target.closest('#printStatementBtn')) printStatement();
          if (e.target.closest('#exportStatementBtn')) exportExcel();
          if (e.target.closest('#addNoteBtn')) openNoteModal();
        });
      }

      // ============================================================
      // 27) Init
      // ============================================================
      async function init() {
        buildSidebar();
        fillUser();
        setupTheme();
        setupSidebarMobile();
        setupUserMenu();
        setupNotifBtn();
        bindEvents();

        await loadData();

        if (Refad.registerServiceWorker) Refad.registerServiceWorker();

        console.log('%c[Refad] Supplier Details v2 ready', 'color:#14B8A6;font-weight:bold');
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }

    })();
  </script>
