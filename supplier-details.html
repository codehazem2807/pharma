      function renderCharts() {
        if (typeof Chart === 'undefined') return;

        const textColor = getComputedStyle(document.documentElement).getPropertyValue('--text').trim();
        const borderColor = getComputedStyle(document.documentElement).getPropertyValue('--border').trim();

        Chart.defaults.font.family = 'Cairo, sans-serif';
        Chart.defaults.color = textColor;

        const monthlyData = {};
        state.receipts.forEach(r => {
          if (!r.receipt_date) return;
          const month = String(r.receipt_date).slice(0, 7);
          monthlyData[month] = (monthlyData[month] || 0) + toNum(r.total_amount);
        });

        const sortedMonths = Object.entries(monthlyData)
          .sort((a, b) => a[0].localeCompare(b[0]))
          .slice(-6);

        if (state.monthlyChart) {
          try { state.monthlyChart.destroy(); } catch (e) {}
        }

        const monthlyCtx = document.getElementById('monthlyChart');
        if (monthlyCtx && sortedMonths.length) {
          state.monthlyChart = new Chart(monthlyCtx, {
            type: 'line',
            data: {
              labels: sortedMonths.map(m => m[0]),
              datasets: [{
                label: 'المشتريات',
                data: sortedMonths.map(m => m[1]),
                borderColor: '#14B8A6',
                backgroundColor: 'rgba(20,184,166,0.1)',
                tension: 0.4,
                fill: true,
                pointRadius: 5,
                pointBackgroundColor: '#14B8A6',
                pointBorderColor: '#fff',
                pointBorderWidth: 2
              }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: {
                legend: { display: false },
                tooltip: { callbacks: { label: ctx => Refad.format.money(ctx.parsed.y) } }
              },
              scales: {
                y: {
                  beginAtZero: true,
                  grid: { color: borderColor },
                  ticks: { callback: v => Refad.format.number(v, 0) }
                },
                x: { grid: { display: false } }
              }
            }
          });
        }
      }

      function setupTabs() {
        document.querySelectorAll('.tab').forEach(tab => {
          tab.addEventListener('click', () => {
            const name = tab.dataset.tab;
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
            tab.classList.add('active');
            const panel = document.querySelector(`.tab-panel[data-panel="${name}"]`);
            if (panel) panel.classList.add('active');
            if (name === 'overview') setTimeout(() => renderCharts(), 100);
            if (window.lucide) lucide.createIcons();
          });
        });
      }

      function printStatement() {
        const s = state.supplier;
        if (!s) return;

        const entries = state.statement || [];
        const totalPurchases = state.computedTotalPurchases;
        const totalPaid = state.computedTotalPaid;
        const totalReceived = state.computedTotalReceived;
        const balance = state.computedBalance;
        const openingBalance = toNum(s.opening_balance);

        if (Refad.Print && Refad.Print.html) {
          Refad.Print.html(`
            <div style="text-align:center;margin-bottom:20px;">
              <h1 style="color:#0B2C4D;font-size:22px;">كشف حساب مورد</h1>
              <div style="color:#64748b;font-size:13px;margin-top:4px;">${Refad.format.date(new Date())}</div>
            </div>
            <div style="background:#F1F5F9;padding:12px 16px;border-radius:8px;margin-bottom:16px;">
              <div style="display:flex;gap:20px;flex-wrap:wrap;font-size:13px;">
                <div><strong>المورد:</strong> ${esc(s.name)}</div>
                ${s.phone ? `<div><strong>الهاتف:</strong> ${esc(s.phone)}</div>` : ''}
              </div>
            </div>
            <table style="width:100%;border-collapse:collapse;font-size:12px;">
              <thead>
                <tr style="background:#0B2C4D;color:white;">
                  <th style="padding:8px;text-align:right;">التاريخ</th>
                  <th style="padding:8px;text-align:right;">النوع</th>
                  <th style="padding:8px;text-align:right;">المرجع</th>
                  <th style="padding:8px;text-align:right;">مدين</th>
                  <th style="padding:8px;text-align:right;">دائن</th>
                  <th style="padding:8px;text-align:right;">الرصيد</th>
                </tr>
              </thead>
              <tbody>
                ${openingBalance !== 0 ? `
                  <tr style="border-bottom:1px solid #e2e8f0;background:#f8fafc;">
                    <td style="padding:6px;">${Refad.format.date(s.created_at)}</td>
                    <td style="padding:6px;">رصيد افتتاحي</td>
                    <td style="padding:6px;">—</td>
                    <td style="padding:6px;color:#ef4444;">${openingBalance > 0 ? fmtMoney(openingBalance) : '—'}</td>
                    <td style="padding:6px;color:#10b981;">${openingBalance < 0 ? fmtMoney(Math.abs(openingBalance)) : '—'}</td>
                    <td style="padding:6px;font-weight:700;">${fmtMoney(openingBalance)}</td>
                  </tr>
                ` : ''}
                ${entries.map(e => `
                  <tr style="border-bottom:1px solid #e2e8f0;">
                    <td style="padding:6px;">${Refad.format.date(e.entry_date)}</td>
                    <td style="padding:6px;">${esc(e.entry_type)}</td>
                    <td style="padding:6px;">${esc(e.reference || '—')}</td>
                    <td style="padding:6px;color:#ef4444;">${toNum(e.debit) > 0 ? fmtMoney(e.debit) : '—'}</td>
                    <td style="padding:6px;color:#10b981;">${toNum(e.credit) > 0 ? fmtMoney(e.credit) : '—'}</td>
                    <td style="padding:6px;font-weight:700;">${fmtMoney(e.running_balance)}</td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
            <div style="margin-top:20px;text-align:left;font-size:13px;line-height:1.9;">
              <div>إجمالي المشتريات: <strong>${fmtMoney(totalPurchases)}</strong></div>
              <div>إجمالي المدفوع للمورد: <strong>${fmtMoney(totalPaid)}</strong></div>
              <div>إجمالي المقبوض من المورد: <strong>${fmtMoney(totalReceived)}</strong></div>
              <div style="font-size:16px;margin-top:8px;padding-top:8px;border-top:2px solid #0B2C4D;">
                الرصيد الحالي: <strong style="color:${balance > 0 ? '#ef4444' : '#14B8A6'};">${fmtMoney(Math.abs(balance))}</strong>
                <span style="font-size:12px;color:#64748b;"> (${balance > 0 ? 'علينا له' : (balance < 0 ? 'لنا عنده' : 'مصفّى')})</span>
              </div>
            </div>
          `, { title: 'كشف حساب - ' + s.name });
        } else {
          window.print();
        }
      }

      function exportExcel() {
        const s = state.supplier;
        if (!s) return;

        const entries = state.statement || [];
        const openingBalance = toNum(s.opening_balance);

        const data = [
          ...(openingBalance !== 0 ? [{
            'التاريخ': Refad.format.date(s.created_at),
            'النوع': 'رصيد افتتاحي',
            'المرجع': '—',
            'مدين': openingBalance > 0 ? openingBalance : 0,
            'دائن': openingBalance < 0 ? Math.abs(openingBalance) : 0,
            'الرصيد': openingBalance,
            'ملاحظات': 'بداية كشف الحساب'
          }] : []),
          ...entries.map(e => ({
            'التاريخ': e.entry_date,
            'النوع': e.entry_type,
            'المرجع': e.reference || '',
            'مدين': toNum(e.debit),
            'دائن': toNum(e.credit),
            'الرصيد': toNum(e.running_balance),
            'ملاحظات': e.notes || ''
          }))
        ];

        const ws = XLSX.utils.json_to_sheet(data);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, 'كشف المورد');
        XLSX.writeFile(wb, `supplier-${s.name}-${today()}.xlsx`);
        Refad.toast.success('تم التصدير');
      }

      function populatePaymentReceipts() {
        const sel = document.getElementById('paymentReceipt');
        if (!sel) return;

        sel.innerHTML = '<option value="">— دفعة عامة (FIFO) —</option>';

        // ✅ احسب المتبقي من payments مباشرة
        const unpaidReceipts = state.receipts
          .filter(r => {
            if (r.status === 'cancelled') return false;
            const paid = getReceiptPaidAmount(r.id);
            return (toNum(r.total_amount) - paid) > 0.01;
          })
          .sort((a, b) => String(a.receipt_date).localeCompare(String(b.receipt_date)));

        unpaidReceipts.forEach(r => {
          const paid = getReceiptPaidAmount(r.id);
          const due = toNum(r.total_amount) - paid;
          const opt = document.createElement('option');
          opt.value = r.id;
          opt.textContent = `${r.receipt_number || r.invoice_number} — متبقي: ${fmtMoney(due)}`;
          opt.dataset.due = due;
          sel.appendChild(opt);
        });
      }

      function populatePaymentAccounts() {
        const sel = document.getElementById('paymentAccount');
        if (!sel) return;

        sel.innerHTML = '<option value="">— اختر الحساب —</option>';

        state.accounts.forEach(a => {
          const opt = document.createElement('option');
          opt.value = a.id;
          opt.textContent = `${a.name} — ${fmtMoney(a.current_balance)}`;
          if (a.is_default) opt.selected = true;
          sel.appendChild(opt);
        });
      }

      function setPaymentDirection(direction) {
        state.currentDirection = direction === 'in' ? 'in' : 'out';
        document.getElementById('paymentDirection').value = state.currentDirection;

        document.querySelectorAll('#paymentDirectionPicker .type-option').forEach(opt => {
          opt.classList.toggle('selected', opt.dataset.direction === state.currentDirection);
        });

        const isOut = state.currentDirection === 'out';

        document.getElementById('paymentModalTitle').textContent = isOut ? 'تسجيل دفعة للمورد' : 'قبض من المورد';
        document.getElementById('paymentSaveBtnText').textContent = isOut ? 'تسجيل الدفعة' : 'تسجيل القبض';
        document.getElementById('paymentSaveBtn').className = 'btn ' + (isOut ? 'btn-danger' : 'btn-success');
        document.getElementById('paymentAccountHint').textContent = isOut ? '(الحساب الدافع)' : '(الحساب المستلم)';

        document.getElementById('paymentReceiptGroup').style.display = isOut ? '' : 'none';
        if (!isOut) document.getElementById('paymentReceipt').value = '';

        updatePaymentWarning();
      }

      function updatePaymentWarning() {
        const box = document.getElementById('paymentWarningBox');
        const txt = document.getElementById('paymentWarningText');
        const amount = Refad.toNum(document.getElementById('paymentAmount').value);
        const direction = state.currentDirection;
        const balance = state.computedBalance;

        let warning = '';

        if (amount > 0) {
          if (direction === 'out') {
            if (balance <= 0) {
              warning = `لا يوجد رصيد مستحق للمورد. الدفع سيجعل لنا عنده ${fmtMoney(amount + Math.abs(Math.min(0, balance)))}.`;
            } else if (amount > balance) {
              warning = `المبلغ أكبر من الرصيد (${fmtMoney(balance)}). سيتبقى لنا عنده ${fmtMoney(amount - balance)}.`;
            }
          } else {
            if (balance > 0) {
              warning = `المورد ليس له رصيد عندنا (علينا له ${fmtMoney(balance)}). الاسترداد سيجعل لنا عنده ${fmtMoney(amount + balance)}.`;
            } else if (amount > Math.abs(balance)) {
              warning = `المبلغ أكبر من الرصيد (${fmtMoney(Math.abs(balance))}). سيتبقى علينا ${fmtMoney(amount - Math.abs(balance))}.`;
            }
          }
        }

        if (warning) {
          txt.textContent = warning;
          box.style.display = '';
        } else {
          box.style.display = 'none';
        }
      }

      function openPaymentModal(direction, receiptId) {
        if (!state.supplier) return;

        direction = direction === 'in' ? 'in' : 'out';

        document.getElementById('paymentForm').reset();
        document.getElementById('paymentDate').value = today();
        document.getElementById('paymentSupplierName').textContent = state.supplier.name;
        document.getElementById('paymentAmount').value = '';

        populatePaymentReceipts();
        populatePaymentAccounts();

        setPaymentDirection(direction);

        if (receiptId && direction === 'out') {
          const sel = document.getElementById('paymentReceipt');
          sel.value = receiptId;
          const opt = sel.selectedOptions[0];
          if (opt?.dataset.due) {
            document.getElementById('paymentAmount').value = opt.dataset.due;
          }
        }

        if (direction === 'in' && state.computedBalance < 0) {
          document.getElementById('paymentAmount').value = Math.abs(state.computedBalance).toFixed(2);
        }

        updatePaymentWarning();
        document.getElementById('paymentModal').classList.add('show');
        if (window.lucide) lucide.createIcons();
      }

      // ✅ submitPayment محمي من Double Submit
      async function submitPayment(e) {
        e.preventDefault();

        // حماية من الضغط المزدوج
        if (isSubmittingPayment) {
          console.warn('[SupplierDetails] Payment already in progress, ignoring duplicate submit');
          return;
        }
        isSubmittingPayment = true;

        const btn = document.getElementById('paymentSaveBtn');
        btn.disabled = true;
        const originalHTML = btn.innerHTML;
        btn.innerHTML = '<i data-lucide="loader-2"></i> جارٍ التسجيل...';
        if (window.lucide) lucide.createIcons();

        try {
          const direction = document.getElementById('paymentDirection').value || 'out';
          const receiptId = direction === 'out'
            ? (parseInt(document.getElementById('paymentReceipt').value, 10) || null)
            : null;
          const accountId = parseInt(document.getElementById('paymentAccount').value, 10);
          const amountVal = Refad.toNum(document.getElementById('paymentAmount').value);
          const dateVal = document.getElementById('paymentDate').value || today();
          const method = document.getElementById('paymentMethod').value;
          const reference = document.getElementById('paymentReference').value.trim();
          const notes = document.getElementById('paymentNotes').value.trim();

          if (amountVal <= 0) {
            Refad.toast.warning('أدخل مبلغاً صحيحاً');
            return;
          }

          if (!accountId) {
            Refad.toast.warning('اختر الحساب');
            return;
          }

          const supplier = state.supplier;

          const { data, error } = await Refad.sb.rpc('add_supplier_payment', {
            p_supplier_id: supplier.id,
            p_company_id: session.company_id,
            p_amount: amountVal,
            p_account_id: accountId,
            p_direction: direction,
            p_method: method,
            p_receipt_id: receiptId,
            p_date: dateVal,
            p_notes: [notes, reference].filter(Boolean).join(' • ') || null,
            p_user_id: session.user_id
          });

          if (error) {
            console.error('[SupplierDetails] Payment RPC failed:', error);
            throw new Error(error.message || 'فشل تسجيل الدفعة');
          }

          const result = Array.isArray(data) ? data[0] : data || {};
          const paymentNumber = result.payment_number || '';
          const label = direction === 'out' ? 'دفعة' : 'استرداد';

          // ✅ استخدم الرصيد الجديد من الـ RPC مباشرة
          if (result.new_supplier_balance !== undefined && result.new_supplier_balance !== null) {
            state.computedBalance = toNum(result.new_supplier_balance);
            console.log('[SupplierDetails] New balance from RPC:', state.computedBalance);
          }

          await Refad.logActivity(
            direction === 'out' ? 'register_payment' : 'register_receipt',
            'suppliers',
            `${label} ${fmtMoney(amountVal)} ${direction === 'out' ? 'للمورد' : 'من المورد'} ${supplier.name} - ${paymentNumber}`,
            result.payment_id
          );

          Refad.toast.success(`تم تسجيل ${label} ${fmtMoney(amountVal)} برقم ${paymentNumber}`);
          document.getElementById('paymentModal').classList.remove('show');

          // ✅ انتظر شوية وبعدين أعد التحميل
          await new Promise(r => setTimeout(r, 300));
          await loadData();
        } catch (err) {
          console.error('[SupplierDetails] Payment failed:', err);
          Refad.toast.error('فشل تسجيل الدفعة: ' + err.message);
        } finally {
          isSubmittingPayment = false;
          btn.disabled = false;
          btn.innerHTML = originalHTML;
          if (window.lucide) lucide.createIcons();
        }
      }

      function setNoteType(type) {
        document.getElementById('noteType').value = type;
        document.querySelectorAll('#noteTypePicker .type-option').forEach(opt => {
          opt.classList.toggle('selected', opt.dataset.type === type);
        });
      }

      function populateNoteReceipts() {
        const sel = document.getElementById('noteReceipt');
        if (!sel) return;
        sel.innerHTML = '<option value="">— بدون فاتورة —</option>';
        state.receipts
          .filter(r => r.status !== 'cancelled')
          .slice(0, 100)
          .forEach(r => {
            const opt = document.createElement('option');
            opt.value = r.id;
            opt.textContent = `${r.receipt_number || r.invoice_number} — ${fmtMoney(r.total_amount)}`;
            sel.appendChild(opt);
          });
      }

      function openNoteModal() {
        if (!state.supplier) return;
        document.getElementById('noteForm').reset();
        document.getElementById('noteDate').value = today();
        setNoteType('credit');
        populateNoteReceipts();
        document.getElementById('noteModal').classList.add('show');
        if (window.lucide) lucide.createIcons();
      }

      // ✅ submitNote محمي من Double Submit
      async function submitNote(e) {
        e.preventDefault();

        if (isSubmittingNote) {
          console.warn('[SupplierDetails] Note already in progress');
          return;
        }
        isSubmittingNote = true;

        const btn = document.getElementById('noteSaveBtn');
        btn.disabled = true;
        const originalHTML = btn.innerHTML;
        btn.innerHTML = '<i data-lucide="loader-2"></i> جارٍ الحفظ...';
        if (window.lucide) lucide.createIcons();

        try {
          const noteType = document.getElementById('noteType').value;
          const amountVal = Refad.toNum(document.getElementById('noteAmount').value);
          const dateVal = document.getElementById('noteDate').value || today();
          const reason = document.getElementById('noteReason').value.trim();
          const receiptId = parseInt(document.getElementById('noteReceipt').value, 10) || null;
          const notes = document.getElementById('noteNotes').value.trim() || null;

          if (amountVal <= 0) { Refad.toast.warning('أدخل مبلغاً صحيحاً'); return; }
          if (!reason) { Refad.toast.warning('السبب مطلوب'); return; }

          const prefix = noteType === 'credit' ? 'CN' : 'DN';
          const year = new Date().getFullYear();
          const count = await Refad.db.count('credit_notes', {
            eq: { company_id: session.company_id }
          });
          const noteNumber = `${prefix}-${year}-${String(count + 1).padStart(5, '0')}`;

          const payload = {
            company_id: session.company_id,
            note_number: noteNumber,
            note_type: noteType,
            party_type: 'supplier',
            supplier_id: state.supplier.id,
            reference_receipt_id: receiptId,
            amount: amountVal,
            tax_amount: 0,
            reason,
            notes,
            note_date: dateVal,
            status: 'active',
            created_by: session.user_id
          };

          const created = await Refad.db.insert('credit_notes', payload);

          await Refad.logActivity('create_credit_note', 'suppliers',
            `إضافة ${noteType === 'credit' ? 'إشعار دائن' : 'إشعار مدين'} ${noteNumber} بمبلغ ${fmtMoney(amountVal)} للمورد ${state.supplier.name}`,
            created?.id);

          Refad.toast.success(`تم إضافة ${noteType === 'credit' ? 'الإشعار الدائن' : 'الإشعار المدين'}`);
          document.getElementById('noteModal').classList.remove('show');

          await new Promise(r => setTimeout(r, 300));
          await loadData();
        } catch (err) {
          console.error('[SupplierDetails] Note failed:', err);
          Refad.toast.error('فشل إضافة الإشعار: ' + err.message);
        } finally {
          isSubmittingNote = false;
          btn.disabled = false;
          btn.innerHTML = originalHTML;
          if (window.lucide) lucide.createIcons();
        }
      }

      function openEdit() {
        location.href = 'suppliers.html?id=' + supplierId;
      }

      function bindEvents() {
        document.getElementById('printBtn').addEventListener('click', printStatement);
        document.getElementById('exportBtn').addEventListener('click', exportExcel);
        document.getElementById('payBtn').addEventListener('click', () => openPaymentModal('out'));
        document.getElementById('receiveBtn').addEventListener('click', () => openPaymentModal('in'));
        document.getElementById('noteBtn').addEventListener('click', openNoteModal);

        if (canEdit) {
          document.getElementById('editBtn').addEventListener('click', openEdit);
        } else {
          document.getElementById('editBtn').style.display = 'none';
        }

        if (!canPay) {
          document.getElementById('payBtn').style.display = 'none';
          document.getElementById('receiveBtn').style.display = 'none';
        }

        document.querySelectorAll('[data-close]').forEach(btn => {
          btn.addEventListener('click', () => {
            document.querySelectorAll('.modal-backdrop').forEach(m => m.classList.remove('show'));
          });
        });

        document.querySelectorAll('.modal-backdrop').forEach(m => {
          m.addEventListener('click', e => {
            if (e.target === m) m.classList.remove('show');
          });
        });

        document.addEventListener('keydown', e => {
          if (e.key === 'Escape') {
            document.querySelectorAll('.modal-backdrop').forEach(m => m.classList.remove('show'));
          }
        });

        document.getElementById('paymentForm').addEventListener('submit', submitPayment);

        document.querySelectorAll('#paymentDirectionPicker .type-option').forEach(opt => {
          opt.addEventListener('click', () => setPaymentDirection(opt.dataset.direction));
        });

        document.getElementById('paymentReceipt').addEventListener('change', e => {
          const opt = e.target.selectedOptions[0];
          if (opt?.dataset.due) {
            document.getElementById('paymentAmount').value = opt.dataset.due;
            updatePaymentWarning();
          }
        });

        document.getElementById('paymentAmount').addEventListener('input', updatePaymentWarning);

        document.getElementById('noteForm').addEventListener('submit', submitNote);

        document.querySelectorAll('#noteTypePicker .type-option').forEach(opt => {
          opt.addEventListener('click', () => setNoteType(opt.dataset.type));
        });

        document.addEventListener('click', (e) => {
          if (e.target.closest('#printStatementBtn')) printStatement();
          if (e.target.closest('#exportStatementBtn')) exportExcel();
          if (e.target.closest('#addNoteBtn')) openNoteModal();
          if (e.target.closest('#addPayBtn')) openPaymentModal('out');
          if (e.target.closest('#addReceiveBtn')) openPaymentModal('in');
        });
      }

      async function init() {
        Refad.buildMenu('suppliers.html');
        fillUser();
        applyIdentity();
        setupTheme();
        setupSidebarMobile();
        setupUserMenu();
        setupNotifBtn();
        setupRealtimeTheme();
        bindEvents();

        await loadData();

        if (Refad.registerServiceWorker) Refad.registerServiceWorker();

        console.log('%c[Refad] Supplier Details v7 — Fixed Double Submit + Balance Sync', 'color:#14B8A6;font-weight:bold;font-size:14px');
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }

    })();
  </script>

</body>
