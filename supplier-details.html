<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0B2C4D">
  <title>تفاصيل المورد - رفاد</title>

  <link rel="icon" type="image/png" href="logo.png">
  <link rel="manifest" href="manifest.json">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdn.jsdelivr.net/npm/dayjs@1.11.10/dayjs.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --primary: #0B2C4D;
      --primary-light: #1e4a73;
      --accent: #14B8A6;
      --accent-dark: #0d9488;
      --gold: #F59E0B;
      --bg: #F1F5F9;
      --card: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --danger: #ef4444;
      --success: #10b981;
      --warning: #f59e0b;
      --info: #3b82f6;
      --purple: #8b5cf6;
      --sidebar-bg: #0B2C4D;
      --sidebar-text: #cbd5e1;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
      --shadow: 0 4px 20px rgba(11, 44, 77, 0.08);
      --shadow-lg: 0 10px 40px rgba(11, 44, 77, 0.12);
      --radius: 14px;
      --radius-sm: 10px;
      --sidebar-w: 260px;
      --topbar-h: 64px;
    }

    [data-theme="dark"] {
      --bg: #0a1628;
      --card: #0f2137;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --border: #1e3a5f;
      --sidebar-bg: #061a2e;
      --sidebar-text: #94a3b8;
    }

    html, body {
      height: 100%;
      font-family: 'Cairo', sans-serif;
      background: var(--bg);
      color: var(--text);
      transition: background 0.3s, color 0.3s;
    }

    body { display: flex; min-height: 100vh; overflow-x: hidden; }

    /* ============ Sidebar ============ */
    .sidebar {
      width: var(--sidebar-w);
      height: 100vh;
      background: var(--sidebar-bg);
      color: var(--sidebar-text);
      position: fixed;
      top: 0; right: 0;
      z-index: 100;
      display: flex; flex-direction: column;
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: -4px 0 20px rgba(0,0,0,0.1);
    }
    .sidebar-header {
      padding: 20px 22px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      display: flex; align-items: center; gap: 14px;
      height: var(--topbar-h);
      box-sizing: border-box;
    }
    .sidebar-logo {
      width: 40px; height: 40px;
      background: linear-gradient(135deg, var(--accent), var(--accent-dark));
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 4px 12px rgba(20,184,166,0.4);
    }
    .sidebar-logo img { width: 70%; height: 70%; object-fit: contain; }
    .sidebar-logo .fallback { color: white; font-weight: 800; font-size: 18px; }
    .sidebar-brand h2 { color: white; font-size: 20px; font-weight: 800; line-height: 1.2; }
    .sidebar-brand p { font-size: 10px; color: var(--sidebar-text); opacity: 0.7; font-weight: 500; margin-top: 2px; }
    .sidebar-nav { flex: 1; overflow-y: auto; padding: 12px 0; scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.15) transparent; }
    .sidebar-nav::-webkit-scrollbar { width: 5px; }
    .sidebar-nav::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 10px; }
    .nav-section { padding: 8px 20px 4px; font-size: 10px; font-weight: 700; color: rgba(255,255,255,0.35); text-transform: uppercase; letter-spacing: 1px; margin-top: 8px; }
    .nav-item {
      display: flex; align-items: center; gap: 12px;
      padding: 11px 22px;
      color: var(--sidebar-text);
      text-decoration: none;
      font-size: 14px; font-weight: 500;
      border-right: 3px solid transparent;
      transition: all 0.2s;
      position: relative;
      cursor: pointer;
    }
    .nav-item:hover { background: rgba(255,255,255,0.05); color: white; border-right-color: rgba(20,184,166,0.5); }
    .nav-item.active { background: rgba(20,184,166,0.12); color: white; border-right-color: var(--accent); font-weight: 600; }
    .nav-item.active::before { content: ''; position: absolute; right: 0; top: 50%; transform: translateY(-50%); width: 3px; height: 60%; background: var(--accent); border-radius: 0 4px 4px 0; }
    .nav-item i, .nav-item svg { width: 18px; height: 18px; flex-shrink: 0; opacity: 0.85; }
    .nav-item .badge { margin-right: auto; background: var(--danger); color: white; font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 10px; }
    .nav-item .badge.teal { background: var(--accent); }
    .nav-item .badge.gold { background: var(--gold); }
    .nav-item .badge.new { background: var(--purple); }

    /* ============ Main ============ */
    .main { flex: 1; margin-right: var(--sidebar-w); min-width: 0; display: flex; flex-direction: column; }
    .topbar {
      height: var(--topbar-h);
      background: var(--card);
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 16px;
      padding: 0 24px;
      position: sticky; top: 0;
      z-index: 50;
      box-shadow: var(--shadow-sm);
    }
    .menu-toggle { display: none; background: transparent; border: none; color: var(--text); cursor: pointer; padding: 8px; border-radius: 8px; }
    .menu-toggle:hover { background: var(--bg); }
    .topbar-title { font-size: 18px; font-weight: 700; color: var(--text); flex-shrink: 0; display: flex; align-items: center; gap: 8px; }
    .topbar-title a {
      color: var(--text-muted);
      text-decoration: none;
      font-weight: 500;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: color 0.2s;
    }
    .topbar-title a:hover { color: var(--accent); }
    .topbar-actions { display: flex; align-items: center; gap: 8px; margin-right: auto; }
    .icon-btn {
      width: 40px; height: 40px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      position: relative;
      transition: all 0.2s;
    }
    .icon-btn:hover { border-color: var(--accent); color: var(--accent); }
    .icon-btn i, .icon-btn svg { width: 18px; height: 18px; }
    .icon-btn .dot { position: absolute; top: 8px; left: 8px; width: 8px; height: 8px; background: var(--danger); border-radius: 50%; border: 2px solid var(--card); }
    .user-menu {
      display: flex; align-items: center; gap: 10px;
      padding: 5px 12px 5px 5px;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.2s;
      border: 1px solid var(--border);
      background: var(--card);
    }
    .user-menu:hover { background: var(--bg); }
    .user-avatar {
      width: 34px; height: 34px;
      border-radius: 9px;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      display: flex; align-items: center; justify-content: center;
      color: white; font-weight: 700; font-size: 14px;
      flex-shrink: 0; overflow: hidden;
    }
    .user-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .user-info { display: flex; flex-direction: column; line-height: 1.2; }
    .user-info .name { font-size: 13px; font-weight: 700; color: var(--text); }
    .user-info .role { font-size: 11px; color: var(--text-muted); }
    .dropdown { position: absolute; top: calc(100% + 8px); left: 0; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-sm); box-shadow: var(--shadow-lg); min-width: 200px; padding: 6px; opacity: 0; visibility: hidden; transform: translateY(-8px); transition: all 0.2s; z-index: 100; }
    .dropdown.show { opacity: 1; visibility: visible; transform: translateY(0); }
    .dropdown-item { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 8px; color: var(--text); font-size: 13px; font-weight: 500; cursor: pointer; transition: background 0.15s; text-decoration: none; }
    .dropdown-item:hover { background: var(--bg); }
    .dropdown-item.danger { color: var(--danger); }
    .dropdown-item.danger:hover { background: rgba(239,68,68,0.08); }
    .dropdown-item i { width: 16px; height: 16px; }
    .dropdown-divider { height: 1px; background: var(--border); margin: 6px 0; }

    /* ============ Content ============ */
    .content { padding: 24px; flex: 1; }

    .btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 10px 18px;
      font-family: inherit;
      font-size: 14px; font-weight: 600;
      border-radius: var(--radius-sm);
      border: none;
      cursor: pointer;
      transition: all 0.2s;
      text-decoration: none;
      white-space: nowrap;
    }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .btn i { width: 16px; height: 16px; }
    .btn-primary { background: linear-gradient(135deg, var(--primary), var(--accent)); color: white; }
    .btn-primary:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(20,184,166,0.35); }
    .btn-outline { background: var(--card); color: var(--text); border: 1px solid var(--border); }
    .btn-outline:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
    .btn-success { background: var(--success); color: white; }
    .btn-success:hover:not(:disabled) { background: #047857; }
    .btn-danger { background: var(--danger); color: white; }
    .btn-danger:hover:not(:disabled) { background: #b91c1c; }
    .btn-gold { background: var(--gold); color: white; }
    .btn-gold:hover:not(:disabled) { background: #d97706; }
    .btn-sm { padding: 6px 12px; font-size: 12px; }

    /* ============ Page Head ============ */
    .page-head {
      display: flex; align-items: center; justify-content: space-between;
      gap: 16px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .page-head-left {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
      flex: 1;
    }
    .back-btn {
      width: 42px; height: 42px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.2s;
      text-decoration: none;
      flex-shrink: 0;
    }
    .back-btn:hover { border-color: var(--accent); color: var(--accent); transform: translateX(-2px); }
    .back-btn i { width: 18px; height: 18px; }
    .page-head h1 { font-size: 22px; font-weight: 800; color: var(--text); margin-bottom: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .page-head p { font-size: 13px; color: var(--text-muted); }

    /* ============ Alert Banners ============ */
    .alert-banner {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 14px 18px;
      border-radius: var(--radius);
      margin-bottom: 16px;
      font-size: 13px;
      line-height: 1.6;
      font-weight: 600;
    }
    .alert-banner.danger {
      background: rgba(239,68,68,0.08);
      border: 1.5px solid rgba(239,68,68,0.25);
      color: var(--danger);
    }
    .alert-banner.warning {
      background: rgba(245,158,11,0.08);
      border: 1.5px solid rgba(245,158,11,0.25);
      color: var(--gold);
    }
    .alert-banner i { width: 20px; height: 20px; flex-shrink: 0; margin-top: 2px; }
    .alert-banner strong { font-weight: 800; }

    /* ============ Profile Hero ============ */
    .profile-hero {
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      color: white;
      padding: 24px;
      border-radius: var(--radius);
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
      position: relative;
      overflow: hidden;
      box-shadow: var(--shadow-lg);
    }
    .profile-hero::before {
      content: '';
      position: absolute;
      top: -50%; left: -20%;
      width: 60%; height: 200%;
      background: radial-gradient(circle, rgba(20,184,166,0.25), transparent 70%);
      pointer-events: none;
    }
    .profile-hero::after {
      content: '';
      position: absolute;
      bottom: -50%; right: -20%;
      width: 60%; height: 200%;
      background: radial-gradient(circle, rgba(245,158,11,0.15), transparent 70%);
      pointer-events: none;
    }
    .profile-hero > * { position: relative; z-index: 1; }

    .profile-avatar {
      width: 88px; height: 88px;
      border-radius: 22px;
      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(10px);
      border: 2px solid rgba(255,255,255,0.3);
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 36px;
      flex-shrink: 0;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0,0,0,0.2);
    }
    .profile-avatar img { width: 100%; height: 100%; object-fit: cover; }

    .profile-info { flex: 1; min-width: 200px; }
    .profile-name {
      font-size: 26px;
      font-weight: 800;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .profile-status {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(10px);
    }
    .profile-status.active { background: rgba(16,185,129,0.25); }
    .profile-status.inactive { background: rgba(239,68,68,0.25); }

    .profile-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      font-size: 13px;
      opacity: 0.9;
    }
    .profile-meta span { display: flex; align-items: center; gap: 6px; }
    .profile-meta i { width: 14px; height: 14px; opacity: 0.85; }

    .profile-balance-box {
      background: rgba(255,255,255,0.12);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.2);
      padding: 16px 24px;
      border-radius: 14px;
      text-align: center;
      min-width: 180px;
    }
    .profile-balance-box .lbl {
      font-size: 11px;
      opacity: 0.85;
      font-weight: 600;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .profile-balance-box .val {
      font-size: 26px;
      font-weight: 800;
      line-height: 1.1;
    }

    /* ============ Stats Grid ============ */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 14px;
      margin-bottom: 20px;
    }
    .stat-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
      display: flex; align-items: center; gap: 14px;
      box-shadow: var(--shadow-sm);
      position: relative;
      overflow: hidden;
      transition: all 0.2s;
    }
    .stat-card:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
    .stat-card::before { content: ''; position: absolute; top: 0; right: 0; width: 4px; height: 100%; background: var(--accent); }
    .stat-card.info::before { background: var(--info); }
    .stat-card.success::before { background: var(--success); }
    .stat-card.danger::before { background: var(--danger); }
    .stat-card.gold::before { background: var(--gold); }
    .stat-card.purple::before { background: var(--purple); }
    .stat-icon {
      width: 48px; height: 48px;
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      background: rgba(20,184,166,0.12);
      color: var(--accent);
    }
    .stat-icon.info { background: rgba(59,130,246,0.12); color: var(--info); }
    .stat-icon.success { background: rgba(16,185,129,0.12); color: var(--success); }
    .stat-icon.danger { background: rgba(239,68,68,0.12); color: var(--danger); }
    .stat-icon.gold { background: rgba(245,158,11,0.12); color: var(--gold); }
    .stat-icon.purple { background: rgba(139,92,246,0.12); color: var(--purple); }
    .stat-icon i { width: 22px; height: 22px; }
    .stat-body { flex: 1; min-width: 0; }
    .stat-body .label { font-size: 12px; font-weight: 600; color: var(--text-muted); margin-bottom: 4px; }
    .stat-body .value { font-size: 20px; font-weight: 800; color: var(--text); line-height: 1.2; overflow-wrap: anywhere; }
    .stat-body .value.danger { color: var(--danger); }
    .stat-body .value.success { color: var(--success); }
    .stat-body .value.gold { color: var(--gold); }
    .stat-body .value.info { color: var(--info); }
    .stat-body .sub { font-size: 11px; color: var(--text-muted); margin-top: 2px; }

    /* ============ Payment Terms Card ============ */
    .payment-terms-card {
      background: linear-gradient(135deg, rgba(139,92,246,0.06), rgba(20,184,166,0.04));
      border: 1.5px solid rgba(139,92,246,0.2);
      border-radius: var(--radius);
      padding: 18px;
      margin-bottom: 20px;
    }
    .payment-terms-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }
    .payment-terms-title {
      font-size: 13px;
      font-weight: 800;
      color: var(--purple);
      display: flex; align-items: center; gap: 6px;
    }
    .payment-terms-title i { width: 16px; height: 16px; }

    .payment-info-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 12px;
    }
    .payment-info-item {
      background: var(--card);
      border-radius: 10px;
      padding: 10px 12px;
      border: 1px solid var(--border);
    }
    .payment-info-item .lbl {
      font-size: 10px;
      color: var(--text-muted);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      margin-bottom: 4px;
    }
    .payment-info-item .val {
      font-size: 15px;
      font-weight: 800;
      color: var(--text);
    }

    /* ============ Tabs ============ */
    .tabs {
      display: flex;
      gap: 4px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 6px;
      margin-bottom: 16px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .tabs::-webkit-scrollbar { display: none; }
    .tab {
      display: flex; align-items: center; gap: 8px;
      padding: 10px 18px;
      font-family: inherit;
      font-size: 13px; font-weight: 600;
      color: var(--text-muted);
      background: transparent;
      border: none;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .tab:hover { background: var(--bg); color: var(--text); }
    .tab.active { background: linear-gradient(135deg, var(--primary), var(--accent)); color: white; box-shadow: 0 4px 12px rgba(20,184,166,0.3); }
    .tab i { width: 16px; height: 16px; }
    .tab .count-badge {
      background: rgba(255,255,255,0.2);
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 11px;
    }
    .tab:not(.active) .count-badge { background: rgba(148,163,184,0.2); color: var(--text-muted); }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; animation: fadeIn 0.3s; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ============ Cards ============ */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
      overflow: hidden;
      margin-bottom: 16px;
    }
    .card-header {
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    .card-header h3 { font-size: 15px; font-weight: 700; color: var(--text); display: flex; align-items: center; gap: 8px; }
    .card-header h3 i { width: 18px; height: 18px; color: var(--accent); }
    .card-body { padding: 18px; }

    /* ============ Info Grid ============ */
    .info-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
    .info-item {
      background: var(--bg);
      border-radius: 10px;
      padding: 12px 14px;
    }
    .info-item .lbl {
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .info-item .lbl i { width: 12px; height: 12px; }
    .info-item .val {
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
      word-break: break-word;
    }

    /* ============ Table ============ */
    .table-wrap { overflow-x: auto; }
    table.data-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      min-width: 800px;
    }
    table.data-table thead { background: var(--bg); border-bottom: 1px solid var(--border); }
    table.data-table th {
      text-align: right;
      padding: 12px 14px;
      font-size: 11px; font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.3px;
      white-space: nowrap;
    }
    table.data-table tbody tr {
      border-bottom: 1px solid var(--border);
      transition: background 0.15s;
    }
    table.data-table tbody tr:hover { background: var(--bg); }
    table.data-table tbody tr:last-child { border-bottom: none; }
    table.data-table td { padding: 12px 14px; color: var(--text); vertical-align: middle; }

    .money { font-weight: 700; color: var(--text); }
    .money.danger { color: var(--danger); }
    .money.success { color: var(--success); }
    .money.gold { color: var(--gold); }
    .money.accent { color: var(--accent); }
    .money.purple { color: var(--purple); }

    .type-link {
      color: var(--accent);
      font-weight: 700;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: opacity 0.2s;
    }
    .type-link:hover { opacity: 0.8; text-decoration: underline; }
    .type-link i { width: 12px; height: 12px; }

    .status-pill {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 11px; font-weight: 700;
      white-space: nowrap;
    }
    .status-pill.paid { background: rgba(16,185,129,0.12); color: var(--success); }
    .status-pill.partial { background: rgba(245,158,11,0.12); color: var(--gold); }
    .status-pill.unpaid { background: rgba(239,68,68,0.12); color: var(--danger); }
    .status-pill.cancelled { background: rgba(148,163,184,0.15); color: var(--text-muted); }
    .status-pill.active { background: rgba(16,185,129,0.12); color: var(--success); }
    .status-pill.applied { background: rgba(59,130,246,0.12); color: var(--info); }
    .status-pill.credit { background: rgba(16,185,129,0.12); color: var(--success); }
    .status-pill.debit { background: rgba(239,68,68,0.12); color: var(--danger); }
    .status-pill.draft { background: rgba(148,163,184,0.15); color: var(--text-muted); }
    .status-pill.confirmed { background: rgba(59,130,246,0.12); color: var(--info); }
    .status-pill.received { background: rgba(16,185,129,0.12); color: var(--success); }
    .status-pill.return { background: rgba(245,158,11,0.12); color: var(--gold); }

    /* ============ Charts ============ */
    .charts-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
      gap: 16px;
      margin-bottom: 16px;
    }
    .chart-wrap {
      position: relative;
      height: 260px;
      padding: 8px;
    }

    /* ============ Top Products ============ */
    .product-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
      gap: 10px;
    }
    .product-row:last-child { border-bottom: none; }
    .product-row .rank {
      width: 26px; height: 26px;
      border-radius: 8px;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: white;
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 800;
      flex-shrink: 0;
    }
    .product-row .name { flex: 1; font-size: 13px; font-weight: 700; color: var(--text); min-width: 0; }
    .product-row .name small { display: block; font-size: 10px; font-weight: 500; color: var(--text-muted); margin-top: 2px; }
    .product-row .value { font-size: 13px; font-weight: 800; color: var(--accent); white-space: nowrap; }

    /* ============ Insight Box ============ */
    .insight-box {
      padding: 12px 14px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      display: flex;
      align-items: flex-start;
      gap: 10px;
      font-size: 12px;
      margin-bottom: 8px;
    }
    .insight-box i { width: 18px; height: 18px; flex-shrink: 0; margin-top: 2px; }
    .insight-box.success { border-right: 3px solid var(--success); }
    .insight-box.success i { color: var(--success); }
    .insight-box.warning { border-right: 3px solid var(--warning); }
    .insight-box.warning i { color: var(--warning); }
    .insight-box.danger { border-right: 3px solid var(--danger); }
    .insight-box.danger i { color: var(--danger); }
    .insight-box.info { border-right: 3px solid var(--info); }
    .insight-box.info i { color: var(--info); }
    .insight-box .insight-text strong { font-weight: 800; }

    /* ============ Statement rows ============ */
    .statement-row-opening { background: rgba(148,163,184,0.08); }
    .statement-row-in { background: rgba(16,185,129,0.04); }
    .statement-row-out { background: rgba(239,68,68,0.04); }

    /* ============ Empty / Loader ============ */
    .empty-state {
      padding: 60px 20px;
      text-align: center;
      color: var(--text-muted);
    }
    .empty-state i { width: 52px; height: 52px; opacity: 0.3; margin-bottom: 14px; }
    .empty-state h3 { font-size: 16px; font-weight: 700; color: var(--text); margin-bottom: 6px; }
    .empty-state p { font-size: 13px; }

    .loader { text-align: center; padding: 60px 20px; color: var(--text-muted); }
    .loader i { width: 40px; height: 40px; animation: spin 1s linear infinite; color: var(--accent); margin-bottom: 12px; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ============ KPI Grid ============ */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 12px;
    }
    .kpi-box {
      background: var(--bg);
      border-radius: 12px;
      padding: 14px;
      text-align: center;
      border: 1px solid var(--border);
    }
    .kpi-box .label {
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      margin-bottom: 6px;
    }
    .kpi-box .value {
      font-size: 20px;
      font-weight: 800;
      color: var(--text);
      line-height: 1;
    }
    .kpi-box .value.success { color: var(--success); }
    .kpi-box .value.danger { color: var(--danger); }
    .kpi-box .value.gold { color: var(--gold); }
    .kpi-box .value.info { color: var(--info); }
    .kpi-box .sub { font-size: 10px; color: var(--text-muted); margin-top: 4px; }

    /* ============ Modal ============ */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(11, 44, 77, 0.5);
      backdrop-filter: blur(4px);
      z-index: 200;
      display: none;
      align-items: center; justify-content: center;
      padding: 20px;
      opacity: 0;
      transition: opacity 0.2s;
    }
    .modal-backdrop.show { display: flex; opacity: 1; }
    .modal {
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow-lg);
      width: 100%;
      max-width: 560px;
      max-height: 90vh;
      display: flex; flex-direction: column;
      transform: scale(0.95);
      transition: transform 0.2s;
      overflow: hidden;
    }
    .modal.modal-lg { max-width: 800px; }
    .modal-backdrop.show .modal { transform: scale(1); }
    .modal-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px;
      flex-shrink: 0;
    }
    .modal-header h3 { font-size: 16px; font-weight: 700; color: var(--text); display: flex; align-items: center; gap: 8px; }
    .modal-header h3 i { width: 18px; height: 18px; color: var(--accent); }
    .modal-close {
      width: 32px; height: 32px;
      border-radius: 8px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.2s;
    }
    .modal-close:hover { background: var(--bg); color: var(--danger); }
    .modal-close i { width: 18px; height: 18px; }
    .modal-body { padding: 20px; overflow-y: auto; flex: 1; min-height: 0; }
    .modal-body::-webkit-scrollbar { width: 8px; }
    .modal-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }
    .modal-footer {
      padding: 14px 20px;
      border-top: 1px solid var(--border);
      display: flex; gap: 10px; justify-content: flex-end;
      background: var(--bg);
      flex-shrink: 0;
    }

    /* ============ Form ============ */
    .form-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
    .form-group { display: flex; flex-direction: column; }
    .form-group.full { grid-column: 1 / -1; }
    .form-group label {
      font-size: 12px; font-weight: 700;
      color: var(--text);
      margin-bottom: 6px;
      display: flex; align-items: center; gap: 4px;
    }
    .form-group label .req { color: var(--danger); }
    .form-group label .hint { color: var(--text-muted); font-weight: 500; font-size: 11px; margin-right: auto; }
    .form-group input, .form-group select, .form-group textarea {
      padding: 10px 14px;
      font-family: inherit;
      font-size: 14px;
      background: var(--bg);
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text);
      outline: none;
      transition: all 0.2s;
      width: 100%;
    }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
      border-color: var(--accent);
      background: var(--card);
      box-shadow: 0 0 0 3px rgba(20,184,166,0.1);
    }
    .form-group textarea { resize: vertical; min-height: 70px; }

    .form-section-title {
      font-size: 11px;
      font-weight: 800;
      color: var(--purple);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 10px 0 6px;
      border-bottom: 1px solid var(--border);
      margin: 6px 0 12px;
      display: flex; align-items: center; gap: 6px;
      grid-column: 1 / -1;
    }
    .form-section-title i { width: 14px; height: 14px; }

    .type-picker {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      grid-column: 1 / -1;
    }
    .type-option {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 6px;
      padding: 14px 10px;
      border: 2px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--bg);
      cursor: pointer;
      transition: all 0.2s;
      text-align: center;
    }
    .type-option:hover { border-color: var(--accent); }
    .type-option.selected {
      border-color: var(--accent);
      background: rgba(20,184,166,0.08);
      box-shadow: 0 0 0 3px rgba(20,184,166,0.1);
    }
    .type-option.credit.selected { border-color: var(--success); background: rgba(16,185,129,0.08); box-shadow: 0 0 0 3px rgba(16,185,129,0.1); }
    .type-option.debit.selected { border-color: var(--danger); background: rgba(239,68,68,0.08); box-shadow: 0 0 0 3px rgba(239,68,68,0.1); }
    .type-option i { width: 24px; height: 24px; color: var(--text-muted); }
    .type-option.credit.selected i { color: var(--success); }
    .type-option.debit.selected i { color: var(--danger); }
    .type-option span { font-size: 13px; font-weight: 800; color: var(--text); }

    /* ============ Overlay ============ */
    .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 99; opacity: 0; transition: opacity 0.3s; }
    .overlay.show { display: block; opacity: 1; }

    /* ============ Responsive ============ */
    @media (max-width: 1024px) {
      .sidebar { transform: translateX(100%); }
      .sidebar.open { transform: translateX(0); }
      .main { margin-right: 0; }
      .menu-toggle { display: flex; }
      .user-info { display: none; }
    }
    @media (max-width: 640px) {
      .content { padding: 16px; }
      .topbar { padding: 0 14px; gap: 10px; }
      .topbar-title { font-size: 15px; }
      .page-head { flex-direction: column; align-items: stretch; }
      .page-head h1 { font-size: 18px; }
      .profile-hero { flex-direction: column; text-align: center; padding: 20px; }
      .profile-name { justify-content: center; }
      .profile-meta { justify-content: center; }
      .profile-balance-box { width: 100%; }
      .stats-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
      .stat-card { padding: 14px; }
      .stat-icon { width: 40px; height: 40px; }
      .stat-body .value { font-size: 16px; }
      .form-grid { grid-template-columns: 1fr; }
      .modal-footer { flex-direction: column-reverse; }
      .modal-footer .btn { width: 100%; justify-content: center; }
      .type-picker { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo">
        <img src="logo.png" alt="رفاد" onerror="this.style.display='none';this.parentElement.innerHTML='<span class=fallback>R</span>';">
      </div>
      <div class="sidebar-brand">
        <h2>رفاد</h2>
        <p>نظام إدارة الأدوية</p>
      </div>
    </div>
    <nav class="sidebar-nav" id="sidebarNav"></nav>
  </aside>

  <div class="overlay" id="overlay"></div>

  <!-- Main -->
  <div class="main">
    <header class="topbar">
      <button class="menu-toggle" id="menuToggle"><i data-lucide="menu"></i></button>
      <div class="topbar-title">
        <a href="suppliers.html">
          <i data-lucide="arrow-right" style="width:16px;height:16px;"></i>
          الموردين
        </a>
        <i data-lucide="chevron-left" style="width:14px;height:14px;opacity:0.4;"></i>
        <span id="topbarTitle">تفاصيل المورد</span>
      </div>
      <div class="topbar-actions">
        <button class="icon-btn" id="themeToggle" title="الوضع الليلي/النهاري">
          <i data-lucide="moon" id="themeIcon"></i>
        </button>
        <button class="icon-btn" id="notifBtn" title="الإشعارات" style="position:relative;">
          <i data-lucide="bell"></i>
          <span class="dot" id="notifDot" style="display:none;"></span>
        </button>
        <div style="position:relative;">
          <div class="user-menu" id="userMenu">
            <div class="user-avatar" id="userAvatar">م</div>
            <div class="user-info">
              <span class="name" id="userName">—</span>
              <span class="role" id="userRole">—</span>
            </div>
            <i data-lucide="chevron-down" style="width:14px;height:14px;opacity:0.5;"></i>
          </div>
          <div class="dropdown" id="userDropdown">
            <a href="company-settings.html" class="dropdown-item"><i data-lucide="settings"></i> الإعدادات</a>
            <a href="employees.html" class="dropdown-item"><i data-lucide="user-cog"></i> الملف الشخصي</a>
            <div class="dropdown-divider"></div>
            <div class="dropdown-item danger" id="logoutBtn"><i data-lucide="log-out"></i> تسجيل الخروج</div>
          </div>
        </div>
      </div>
    </header>

    <main class="content">
      <div class="page-head">
        <div class="page-head-left">
          <a href="suppliers.html" class="back-btn">
            <i data-lucide="arrow-right"></i>
          </a>
          <div style="min-width:0;">
            <h1 id="pageTitle">جارٍ التحميل...</h1>
            <p id="pageSubtitle">—</p>
          </div>
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;">
          <button class="btn btn-outline btn-sm" id="printBtn">
            <i data-lucide="printer"></i> طباعة
          </button>
          <button class="btn btn-outline btn-sm" id="exportBtn">
            <i data-lucide="download"></i> تصدير
          </button>
          <button class="btn btn-success btn-sm" id="paymentBtn">
            <i data-lucide="banknote"></i> تسجيل دفعة
          </button>
          <button class="btn btn-gold btn-sm" id="noteBtn">
            <i data-lucide="file-text"></i> إشعار
          </button>
          <button class="btn btn-primary btn-sm" id="editBtn">
            <i data-lucide="pencil"></i> تعديل
          </button>
        </div>
      </div>

      <!-- Alerts -->
      <div id="alertsArea"></div>

      <div id="contentArea">
        <div class="loader"><i data-lucide="loader-2"></i><p>جارٍ التحميل...</p></div>
      </div>
    </main>
  </div>

  <!-- ========== Modal: Payment ========== -->
  <div class="modal-backdrop" id="paymentModal">
    <div class="modal">
      <div class="modal-header">
        <h3><i data-lucide="banknote"></i> تسجيل دفعة للمورد</h3>
        <button class="modal-close" data-close><i data-lucide="x"></i></button>
      </div>
      <form id="paymentForm">
        <div class="modal-body">
          <div class="form-grid">
            <div class="form-section-title">
              <i data-lucide="truck"></i> المورد: <span id="paymentSupplierName" style="color:var(--text);margin-right:4px;">—</span>
            </div>

            <div class="form-group full">
              <label>فاتورة الاستلام <span class="hint">اتركها فارغة لدفعة عامة</span></label>
              <select id="paymentReceipt">
                <option value="">— دفعة عامة (FIFO على الاستلامات) —</option>
              </select>
            </div>

            <div class="form-group">
              <label>المبلغ <span class="req">*</span></label>
              <input type="number" id="paymentAmount" min="0.01" step="0.01" placeholder="0.00" required>
            </div>

            <div class="form-group">
              <label>التاريخ</label>
              <input type="date" id="paymentDate">
            </div>

            <div class="form-group">
              <label>طريقة الدفع</label>
              <select id="paymentMethod">
                <option value="cash">نقدي</option>
                <option value="bank">تحويل بنكي</option>
                <option value="wallet">محفظة إلكترونية</option>
                <option value="cheque">شيك</option>
              </select>
            </div>

            <div class="form-group">
              <label>مرجع (اختياري)</label>
              <input type="text" id="paymentReference" maxlength="50" placeholder="رقم التحويل...">
            </div>

            <div class="form-group full">
              <label>ملاحظات</label>
              <textarea id="paymentNotes" maxlength="255" placeholder="ملاحظات..."></textarea>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline" data-close>إلغاء</button>
          <button type="submit" class="btn btn-success" id="paymentSaveBtn">
            <i data-lucide="check"></i> تسجيل الدفعة
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- ========== Modal: Note ========== -->
  <div class="modal-backdrop" id="noteModal">
    <div class="modal">
      <div class="modal-header">
        <h3><i data-lucide="file-text"></i> إشعار جديد</h3>
        <button class="modal-close" data-close><i data-lucide="x"></i></button>
      </div>
      <form id="noteForm">
        <div class="modal-body">
          <div class="form-grid">
            <div class="form-section-title"><i data-lucide="tag"></i> نوع الإشعار</div>

            <div class="type-picker" id="noteTypePicker">
              <div class="type-option credit" data-type="credit">
                <i data-lucide="arrow-down-circle"></i>
                <span>إشعار دائن</span>
              </div>
              <div class="type-option debit" data-type="debit">
                <i data-lucide="arrow-up-circle"></i>
                <span>إشعار مدين</span>
              </div>
            </div>
            <input type="hidden" id="noteType" value="credit" required>

            <div class="form-section-title"><i data-lucide="info"></i> البيانات</div>

            <div class="form-group">
              <label>المبلغ <span class="req">*</span></label>
              <input type="number" id="noteAmount" min="0.01" step="0.01" placeholder="0.00" required>
            </div>

            <div class="form-group">
              <label>التاريخ</label>
              <input type="date" id="noteDate">
            </div>

            <div class="form-group full">
              <label>السبب <span class="req">*</span></label>
              <input type="text" id="noteReason" maxlength="200" placeholder="مثال: خصم، تصحيح فاتورة..." required>
            </div>

            <div class="form-group full">
              <label>فاتورة استلام مرتبطة (اختياري)</label>
              <select id="noteReceipt">
                <option value="">— بدون فاتورة —</option>
              </select>
            </div>

            <div class="form-group full">
              <label>ملاحظات</label>
              <textarea id="noteNotes" maxlength="500" placeholder="ملاحظات إضافية..."></textarea>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline" data-close>إلغاء</button>
          <button type="submit" class="btn btn-gold" id="noteSaveBtn">
            <i data-lucide="save"></i> إضافة الإشعار
          </button>
        </div>
      </form>
    </div>
  </div>

  <script src="refad-core.js"></script>
  <script src="refad-auth.js"></script>
  <script>
    (function () {
      'use strict';

      // ============================================================
      // 1) Guard & Param
      // ============================================================
      const session = Refad.Auth.guardPage('suppliers.view');
      if (!session) return;

      const supplierId = parseInt(Refad.getParam('id'), 10);
      if (!supplierId) {
        Refad.alert.error('خطأ', 'لم يتم تحديد المورد').then(() => location.href = 'suppliers.html');
        return;
      }

      const canEdit = Refad.Session.has('suppliers.edit') || Refad.Session.has('company.owner');

      // ============================================================
      // 2) State
      // ============================================================
      const state = {
        supplier: null,
        receipts: [],
        orders: [],
        notes: [],
        returns: [],

      // ============================================================
      // 6) Load Data
      // ============================================================
      async function loadData() {
        try {
          let supplier;
          try {
            supplier = await Refad.db.selectOne('suppliers', { eq: { id: supplierId } });
          } catch (e) {
            console.warn('Failed to load full supplier, fallback', e.message);
            supplier = await Refad.db.selectOne('suppliers', { eq: { id: supplierId } });
          }

          if (!supplier || String(supplier.company_id) !== String(session.company_id)) {
            Refad.alert.error('غير موجود', 'المورد غير موجود').then(() => location.href = 'suppliers.html');
            return;
          }

          state.supplier = supplier;

          const [receipts, orders, notes, returns, transactions, users] = await Promise.all([
            Refad.db.select('receipts', {
              columns: 'id, receipt_number, receipt_date, total_amount, paid_amount, status, created_at, notes',
              eq: { supplier_id: supplierId, company_id: session.company_id },
              order: { column: 'receipt_date', ascending: false },
              limit: 500
            }).catch(() => []),
            Refad.db.select('purchase_requests', {
              columns: 'id, request_number, status, created_at',
              eq: { supplier_id: supplierId, company_id: session.company_id },
              order: { column: 'created_at', ascending: false },
              limit: 200
            }).catch(() => []),
            Refad.db.select('credit_notes', {
              columns: 'id, note_number, note_type, note_date, amount, tax_amount, reason, status, reference_receipt_id, created_at',
              eq: { supplier_id: supplierId, company_id: session.company_id },
              order: { column: 'note_date', ascending: false },
              limit: 200
            }).catch(() => []),
            Refad.db.select('inventory_returns', {
              columns: 'id, return_number, return_date, total_amount, reason, reference_receipt_id, created_at',
              eq: { supplier_id: supplierId, company_id: session.company_id, return_type: 'purchase' },
              order: { column: 'return_date', ascending: false },
              limit: 200
            }).catch(() => []),
            Refad.db.select('supplier_transactions', {
              columns: 'id, type, amount, balance_after, notes, user_id, created_at',
              eq: { supplier_id: supplierId, company_id: session.company_id },
              order: { column: 'created_at', ascending: false },
              limit: 500
            }).catch(() => []),
            Refad.db.select('users', {
              columns: 'id, full_name',
              eq: { company_id: session.company_id }
            }).catch(() => [])
          ]);

          state.receipts = receipts || [];
          state.orders = orders || [];
          state.notes = notes || [];
          state.returns = returns || [];
          state.transactions = transactions || [];
          state.users = users || [];

          // تحليل الأصناف
          await loadProductAnalysis();

          // حساب فترة التسليم
          calculateLeadTime();

          renderAlerts();
          renderPage();
          populatePaymentReceipts();
          populateNoteReceipts();
        } catch (e) {
          console.error('[SupplierDetails] load failed:', e);
          document.getElementById('contentArea').innerHTML = `
            <div class="card"><div class="card-body">
              <div class="empty-state" style="color:var(--danger);">
                <i data-lucide="alert-circle"></i>
                <p>فشل التحميل: ${esc(e.message || '')}</p>

            </div></div>`;
          if (window.lucide) lucide.createIcons();
        }
      }

      // ============================================================
      // 7) Load Product Analysis
      // ============================================================
      async function loadProductAnalysis() {
        try {
          if (!state.receipts.length) return;

          const receiptIds = state.receipts.map(r => r.id);
          const items = await Refad.db.select('receipt_items', {
            columns: 'product_id, quantity, unit_price, total, purchase_discount, receipt_id, products(id, name, name_en, form, unit, category)',
            in: { receipt_id: receiptIds }
          }).catch(() => []);

          const productTotals = {};
          items.forEach(item => {
            const pid = item.product_id;
            if (!productTotals[pid]) {
              productTotals[pid] = {
                product_id: pid,
                product: item.products,
                total_qty: 0,
                total_value: 0,
                invoices_count: new Set()
              };
            }
            productTotals[pid].total_qty += toNum(item.quantity);
            const qty = toNum(item.quantity);
            const unit_price = toNum(item.unit_price);
            const discount = toNum(item.purchase_discount);
            const netValue = qty * unit_price * (1 - discount / 100);
            productTotals[pid].total_value += netValue;
            productTotals[pid].invoices_count.add(item.receipt_id);
          });

          state.productTotals = productTotals;
          state.topProducts = Object.values(productTotals)
            .sort((a, b) => b.total_value - a.total_value)
            .slice(0, 10)
            .map(p => ({ ...p, invoices_count: p.invoices_count.size }));
        } catch (e) {
          console.warn('Product analysis failed:', e.message);
        }
      }

      // ============================================================
      // 8) Calculate Lead Time
      // ============================================================
      function calculateLeadTime() {
        const leadTimes = [];
        state.orders.forEach(pr => {
          const linkedReceipt = state.receipts.find(r =>
            r.receipt_number && pr.request_number &&
            r.receipt_number.includes(pr.request_number)
          );
          if (linkedReceipt && pr.created_at && linkedReceipt.receipt_date) {
            const days = Math.round(
              (new Date(linkedReceipt.receipt_date) - new Date(pr.created_at)) / (1000 * 60 * 60 * 24)
            );
            if (days > 0 && days < 90) leadTimes.push(days);
          }
        });

        state.leadTimeData = leadTimes.length ? {
          avg_days: Math.round(leadTimes.reduce((s, d) => s + d, 0) / leadTimes.length),
          min_days: Math.min(...leadTimes),
          max_days: Math.max(...leadTimes),
          samples: leadTimes.length
        } : null;
      }

      // ============================================================
      // 9) Render Alerts
      // ============================================================
      function renderAlerts() {
        const s = state.supplier;
        const area = document.getElementById('alertsArea');
        if (!s || !area) return;

        const balance = toNum(s.balance);
        const alerts = [];

        // رصيد كبير للمورد (علينا)
        if (balance > 0 && balance > 10000) {
          alerts.push({
            type: 'warning',
            icon: 'alert-triangle',
            text: `⚠️ <strong>رصيد كبير للمورد</strong> — ${fmtMoney(balance)} مستحقة للمورد.`
          });
        }

        // فواتير استلام متأخرة
        const overdueReceipts = state.receipts.filter(r => {
          if (r.status === 'completed' || r.status === 'cancelled') return false;
          const due = toNum(r.total_amount) - toNum(r.paid_amount);
          if (due <= 0.01) return false;
          const days = Refad.format.daysLeft(r.receipt_date);
          return days !== null && days < -30;
        });

        if (overdueReceipts.length > 0) {
          const totalOverdue = overdueReceipts.reduce((sum, r) =>
            sum + (toNum(r.total_amount) - toNum(r.paid_amount)), 0);
          alerts.push({
            type: 'danger',
            icon: 'clock-alert',
            text: `🕐 <strong>${overdueReceipts.length} استلام متأخر</strong> بإجمالي ${fmtMoney(totalOverdue)}.`
          });
        }

        // فترة تسليم طويلة
        if (state.leadTimeData && state.leadTimeData.avg_days > 14) {
          alerts.push({
            type: 'warning',
            icon: 'clock',
            text: `⏱️ <strong>فترة التسليم المتوسطة ${state.leadTimeData.avg_days} يوم</strong> — أطول من المعتاد.`
          });
        }

        if (!alerts.length) {
          area.innerHTML = '';
          return;
        }

        area.innerHTML = alerts.map(a => `
          <div class="alert-banner ${a.type}">
            <i data-lucide="${a.icon}"></i>
            <div>${a.text}</div>
          </div>
        `).join('');

        if (window.lucide) lucide.createIcons();
      }

      // ============================================================
      // 17) Build Statement
      // ============================================================
      function buildStatement() {
        const entries = [];

        // Receipts → debit (فاتورة استلام = زيادة ما علينا)
        state.receipts.forEach(r => {
          if (r.status === 'cancelled') return;
          const total = toNum(r.total_amount);
          if (total <= 0) return;

          entries.push({
            date: r.receipt_date,
            type: 'فاتورة استلام',
            typeClass: 'unpaid',
            reference: r.receipt_number,
            link: `receipt-form.html?id=${r.id}`,
            debit: total,
            credit: 0,
            notes: ''
          });

          // Payments on receipt → credit
          const paid = toNum(r.paid_amount);
          if (paid > 0) {
            entries.push({
              date: r.receipt_date,
              type: 'دفعة',
              typeClass: 'paid',
              reference: `دفعة على ${r.receipt_number}`,
              link: `receipt-form.html?id=${r.id}`,
              debit: 0,
              credit: paid,
              notes: ''
            });
          }
        });

        // Notes
        state.notes.forEach(n => {
          if (n.status === 'cancelled') return;
          const isCredit = n.note_type === 'credit';
          const total = toNum(n.amount) + toNum(n.tax_amount);
          if (total <= 0) return;

          entries.push({
            date: n.note_date,
            type: isCredit ? 'إشعار دائن' : 'إشعار مدين',
            typeClass: isCredit ? 'credit' : 'debit',
            reference: n.note_number,
            link: null,
            debit: isCredit ? 0 : total,
            credit: isCredit ? total : 0,
            notes: n.reason || ''
          });
        });

        // Sort by date
        entries.sort((a, b) => String(a.date).localeCompare(String(b.date)));

        // Running balance (for supplier: positive = علينا له)
        let balance = 0;
        const finalEntries = [];

        finalEntries.push({
          date: state.supplier.created_at ? String(state.supplier.created_at).slice(0, 10) : '—',
          type: 'رصيد افتتاحي',
          typeClass: 'cancelled',
          reference: '—',
          link: null,
          debit: 0,
          credit: 0,
          balance: 0,
          notes: 'بداية كشف الحساب',
          rowClass: 'statement-row-opening'
        });

        entries.forEach(e => {
          // debit يزيد ما علينا (للمورد)
          // credit يقللها (الدفعات)
          balance = balance + e.debit - e.credit;
          finalEntries.push({
            ...e,
            balance,
            rowClass: e.debit > 0 ? 'statement-row-out' : 'statement-row-in'
          });
        });

        return finalEntries;
      }
