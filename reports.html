<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0B2C4D">
  <title>التقارير - رفاد</title>

  <link rel="icon" type="image/png" href="logo.png">
  <link rel="manifest" href="manifest.json">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdn.jsdelivr.net/npm/dayjs@1.11.10/dayjs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --primary: #0B2C4D;
      --primary-light: #1e4a73;
      --accent: #14B8A6;
      --accent-dark: #0d9488;
      --gold: #F59E0B;
      --bg: #F1F5F9;
      --card: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --danger: #ef4444;
      --success: #10b981;
      --warning: #f59e0b;
      --info: #3b82f6;
      --sidebar-bg: #0B2C4D;
      --sidebar-text: #cbd5e1;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
      --shadow: 0 4px 20px rgba(11, 44, 77, 0.08);
      --shadow-lg: 0 10px 40px rgba(11, 44, 77, 0.12);
      --radius: 14px;
      --radius-sm: 10px;
      --sidebar-w: 260px;
      --topbar-h: 64px;
    }

    [data-theme="dark"] {
      --bg: #0a1628;
      --card: #0f2137;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --border: #1e3a5f;
      --sidebar-bg: #061a2e;
      --sidebar-text: #94a3b8;
    }

    html, body {
      height: 100%;
      font-family: 'Cairo', sans-serif;
      background: var(--bg);
      color: var(--text);
      transition: background 0.3s, color 0.3s;
    }

    body { display: flex; min-height: 100vh; overflow-x: hidden; }

    /* Sidebar */
    .sidebar {
      width: var(--sidebar-w);
      height: 100vh;
      background: var(--sidebar-bg);
      color: var(--sidebar-text);
      position: fixed;
      top: 0;
      right: 0;
      z-index: 100;
      display: flex;
      flex-direction: column;
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: -4px 0 20px rgba(0,0,0,0.1);
    }

    .sidebar-header {
      padding: 20px 22px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      display: flex;
      align-items: center;
      gap: 14px;
      height: var(--topbar-h);
      box-sizing: border-box;
    }

    .sidebar-logo {
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, var(--accent), var(--accent-dark));
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 4px 12px rgba(20,184,166,0.4);
    }
    .sidebar-logo img { width: 70%; height: 70%; object-fit: contain; }
    .sidebar-logo .fallback { color: white; font-weight: 800; font-size: 18px; }

    .sidebar-brand h2 { color: white; font-size: 20px; font-weight: 800; letter-spacing: -0.5px; line-height: 1.2; }
    .sidebar-brand p { font-size: 10px; color: var(--sidebar-text); opacity: 0.7; font-weight: 500; margin-top: 2px; }

    .sidebar-nav { flex: 1; overflow-y: auto; padding: 12px 0; scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.15) transparent; }
    .sidebar-nav::-webkit-scrollbar { width: 5px; }
    .sidebar-nav::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 10px; }

    .nav-section { padding: 8px 20px 4px; font-size: 10px; font-weight: 700; color: rgba(255,255,255,0.35); text-transform: uppercase; letter-spacing: 1px; margin-top: 8px; }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 11px 22px;
      color: var(--sidebar-text);
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      border-right: 3px solid transparent;
      transition: all 0.2s;
      position: relative;
      cursor: pointer;
    }
    .nav-item:hover { background: rgba(255,255,255,0.05); color: white; border-right-color: rgba(20,184,166,0.5); }
    .nav-item.active { background: rgba(20,184,166,0.12); color: white; border-right-color: var(--accent); font-weight: 600; }
    .nav-item.active::before { content: ''; position: absolute; right: 0; top: 50%; transform: translateY(-50%); width: 3px; height: 60%; background: var(--accent); border-radius: 0 4px 4px 0; }
    .nav-item i, .nav-item svg { width: 18px; height: 18px; flex-shrink: 0; opacity: 0.85; }
    .nav-item .badge { margin-right: auto; background: var(--danger); color: white; font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 10px; }
    .nav-item .badge.teal { background: var(--accent); }
    .nav-item .badge.gold { background: var(--gold); }

    /* Main */
    .main { flex: 1; margin-right: var(--sidebar-w); min-width: 0; display: flex; flex-direction: column; }

    .topbar {
      height: var(--topbar-h);
      background: var(--card);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 0 24px;
      position: sticky;
      top: 0;
      z-index: 50;
      box-shadow: var(--shadow-sm);
    }

    .menu-toggle { display: none; background: transparent; border: none; color: var(--text); cursor: pointer; padding: 8px; border-radius: 8px; }
    .menu-toggle:hover { background: var(--bg); }

    .topbar-title { font-size: 18px; font-weight: 700; color: var(--text); flex-shrink: 0; }
    .topbar-actions { display: flex; align-items: center; gap: 8px; margin-right: auto; }

    .icon-btn {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      transition: all 0.2s;
    }
    .icon-btn:hover { border-color: var(--accent); color: var(--accent); }
    .icon-btn i, .icon-btn svg { width: 18px; height: 18px; }
    .icon-btn .dot { position: absolute; top: 8px; left: 8px; width: 8px; height: 8px; background: var(--danger); border-radius: 50%; border: 2px solid var(--card); }

    .user-menu {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 5px 12px 5px 5px;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.2s;
      border: 1px solid var(--border);
      background: var(--card);
    }
    .user-menu:hover { background: var(--bg); }

    .user-avatar {
      width: 34px;
      height: 34px;
      border-radius: 9px;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 700;
      font-size: 14px;
      flex-shrink: 0;
      overflow: hidden;
    }
    .user-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .user-info { display: flex; flex-direction: column; line-height: 1.2; }
    .user-info .name { font-size: 13px; font-weight: 700; color: var(--text); }
    .user-info .role { font-size: 11px; color: var(--text-muted); }

    .dropdown { position: absolute; top: calc(100% + 8px); left: 0; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-sm); box-shadow: var(--shadow-lg); min-width: 200px; padding: 6px; opacity: 0; visibility: hidden; transform: translateY(-8px); transition: all 0.2s; z-index: 100; }
    .dropdown.show { opacity: 1; visibility: visible; transform: translateY(0); }
    .dropdown-item { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 8px; color: var(--text); font-size: 13px; font-weight: 500; cursor: pointer; transition: background 0.15s; text-decoration: none; }
    .dropdown-item:hover { background: var(--bg); }
    .dropdown-item.danger { color: var(--danger); }
    .dropdown-item.danger:hover { background: rgba(239,68,68,0.08); }
    .dropdown-item i { width: 16px; height: 16px; }
    .dropdown-divider { height: 1px; background: var(--border); margin: 6px 0; }

    /* Content */
    .content { padding: 24px; flex: 1; }

    .page-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .page-head h1 { font-size: 24px; font-weight: 800; color: var(--text); margin-bottom: 4px; }
    .page-head p { font-size: 13px; color: var(--text-muted); }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 18px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      border-radius: var(--radius-sm);
      border: none;
      cursor: pointer;
      transition: all 0.2s;
      text-decoration: none;
      white-space: nowrap;
    }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .btn i { width: 16px; height: 16px; }

    .btn-primary { background: linear-gradient(135deg, var(--primary), var(--accent)); color: white; }
    .btn-primary:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(20,184,166,0.35); }

    .btn-outline { background: var(--card); color: var(--text); border: 1px solid var(--border); }
    .btn-outline:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }

    .btn-sm { padding: 6px 12px; font-size: 12px; }

    /* Reports grid (selector) */
    .reports-selector {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 10px;
      margin-bottom: 20px;
    }

    .report-card {
      background: var(--card);
      border: 2px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 12px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 8px;
      box-shadow: var(--shadow-sm);
    }
    .report-card:hover { border-color: var(--accent); transform: translateY(-2px); box-shadow: var(--shadow); }
    .report-card.active { border-color: var(--accent); background: rgba(20,184,166,0.06); }

    .report-icon {
      width: 46px;
      height: 46px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .report-icon i { width: 22px; height: 22px; color: white; }
    .report-icon.sales      { background: linear-gradient(135deg, #10b981, #047857); }
    .report-icon.purchases  { background: linear-gradient(135deg, #3b82f6, #1d4ed8); }
    .report-icon.profit     { background: linear-gradient(135deg, #F59E0B, #d97706); }
    .report-icon.inventory  { background: linear-gradient(135deg, #8b5cf6, #6d28d9); }
    .report-icon.attendance { background: linear-gradient(135deg, #14B8A6, #0d9488); }
    .report-icon.expenses   { background: linear-gradient(135deg, #ef4444, #b91c1c); }
    .report-icon.customers  { background: linear-gradient(135deg, #ec4899, #be185d); }
    .report-icon.suppliers  { background: linear-gradient(135deg, #f97316, #ea580c); }

    .report-name {
      font-size: 12px;
      font-weight: 700;
      color: var(--text);
      line-height: 1.3;
    }

    /* Date filters */
    .date-filters {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 18px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      box-shadow: var(--shadow-sm);
    }

    .date-filters .period-chips {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .period-chip {
      padding: 7px 14px;
      border-radius: 20px;
      border: 1.5px solid var(--border);
      background: var(--card);
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
    }
    .period-chip:hover { border-color: var(--accent); color: var(--accent); }
    .period-chip.active { background: var(--accent); color: white; border-color: var(--accent); }

    .date-inputs {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-right: auto;
    }

    .date-inputs input[type="date"] {
      padding: 8px 12px;
      font-family: inherit;
      font-size: 13px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text);
      outline: none;
      cursor: pointer;
    }
    .date-inputs input[type="date"]:focus { border-color: var(--accent); }

    /* Summary cards */
    .summary-cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
      margin-bottom: 20px;
    }

    .summary-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: var(--shadow-sm);
      transition: all 0.2s;
    }
    .summary-card:hover { border-color: var(--accent); transform: translateY(-2px); box-shadow: var(--shadow); }

    .summary-icon {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .summary-icon i { width: 24px; height: 24px; color: white; }
    .summary-icon.green  { background: linear-gradient(135deg, #10b981, #047857); }
    .summary-icon.blue   { background: linear-gradient(135deg, #3b82f6, #1d4ed8); }
    .summary-icon.gold   { background: linear-gradient(135deg, #F59E0B, #d97706); }
    .summary-icon.red    { background: linear-gradient(135deg, #ef4444, #b91c1c); }
    .summary-icon.teal   { background: linear-gradient(135deg, #14B8A6, #0d9488); }
    .summary-icon.purple { background: linear-gradient(135deg, #8b5cf6, #6d28d9); }

    .summary-body { flex: 1; min-width: 0; }
    .summary-body .label { font-size: 11px; color: var(--text-muted); font-weight: 700; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
    .summary-body .value { font-size: 22px; font-weight: 800; color: var(--text); line-height: 1.1; font-family: 'Cairo', monospace; }
    .summary-body .sub { font-size: 11px; color: var(--text-muted); margin-top: 4px; }

    /* Charts area */
    .charts-grid {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 16px;
      margin-bottom: 20px;
    }

    .chart-box {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
      box-shadow: var(--shadow-sm);
    }

    .chart-box h3 {
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .chart-box h3 i { width: 18px; height: 18px; color: var(--accent); }

    .chart-wrap {
      position: relative;
      height: 300px;
    }

    /* Table */
    .table-wrap {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
      overflow: hidden;
      margin-top: 16px;
    }

    .table-header {
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    .table-header h3 { font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
    .table-header h3 i { width: 18px; height: 18px; color: var(--accent); }

    .table-scroll { overflow-x: auto; }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    thead { background: var(--bg); border-bottom: 1px solid var(--border); }

    th {
      text-align: right;
      padding: 12px 16px;
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }

    tbody tr { border-bottom: 1px solid var(--border); transition: background 0.15s; }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: var(--bg); }

    td { padding: 12px 16px; color: var(--text); vertical-align: middle; }

    .money-cell {
      font-family: 'Courier New', monospace;
      font-weight: 700;
    }
    .money-cell.green { color: var(--success); }
    .money-cell.red { color: var(--danger); }
    .money-cell.accent { color: var(--accent); }
    .money-cell.gold { color: var(--warning); }

    .num-cell { text-align: center; font-weight: 700; }

    .badge-tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 10px;
      font-size: 11px;
      font-weight: 700;
      border-radius: 20px;
      white-space: nowrap;
    }
    .badge-tag.green  { background: rgba(16,185,129,0.12); color: var(--success); }
    .badge-tag.red    { background: rgba(239,68,68,0.12); color: var(--danger); }
    .badge-tag.gold   { background: rgba(245,158,11,0.12); color: var(--warning); }
    .badge-tag.gray   { background: rgba(148,163,184,0.15); color: var(--text-muted); }
    .badge-tag.blue   { background: rgba(59,130,246,0.12); color: var(--info); }

    .empty-state {
      padding: 60px 20px;
      text-align: center;
      color: var(--text-muted);
    }
    .empty-state i { width: 56px; height: 56px; opacity: 0.3; margin-bottom: 12px; }
    .empty-state h3 { font-size: 16px; font-weight: 700; color: var(--text); margin-bottom: 6px; }
    .empty-state p { font-size: 13px; }

    /* Loading */
    .loader {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-muted);
    }
    .loader i {
      width: 32px;
      height: 32px;
      animation: spin 1s linear infinite;
      color: var(--accent);
      margin-bottom: 10px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Overlay (mobile) */
    .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 99; opacity: 0; transition: opacity 0.3s; }
    .overlay.show { display: block; opacity: 1; }

    /* Responsive */
    @media (max-width: 1024px) {
      .sidebar { transform: translateX(100%); }
      .sidebar.open { transform: translateX(0); }
      .main { margin-right: 0; }
      .menu-toggle { display: flex; }
      .user-info { display: none; }
      .charts-grid { grid-template-columns: 1fr; }
    }

    @media (max-width: 640px) {
      .content { padding: 16px; }
      .topbar { padding: 0 14px; gap: 10px; }
      .topbar-title { font-size: 15px; }
      .page-head { flex-direction: column; align-items: stretch; }
      .page-head h1 { font-size: 20px; }
      .reports-selector { grid-template-columns: repeat(2, 1fr); }
      .date-filters { padding: 12px; flex-direction: column; align-items: stretch; }
      .date-inputs { flex-direction: column; width: 100%; }
      .date-inputs input { width: 100%; }
      .summary-cards { grid-template-columns: repeat(2, 1fr); }
      .summary-body .value { font-size: 18px; }
    }
  </style>
</head>
<body>

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo">
        <img src="logo.png" alt="رفاد" onerror="this.style.display='none';this.parentElement.innerHTML='<span class=fallback>R</span>';">
      </div>
      <div class="sidebar-brand">
        <h2>رفاد</h2>
        <p>نظام إدارة الأدوية</p>
      </div>
    </div>
    <nav class="sidebar-nav" id="sidebarNav"></nav>
  </aside>

  <div class="overlay" id="overlay"></div>

  <!-- Main -->
  <div class="main">

    <header class="topbar">
      <button class="menu-toggle" id="menuToggle"><i data-lucide="menu"></i></button>
      <div class="topbar-title">التقارير</div>
      <div class="topbar-actions">
        <button class="icon-btn" id="themeToggle" title="الوضع الليلي/النهاري">
          <i data-lucide="moon" id="themeIcon"></i>
        </button>
        <button class="icon-btn" id="notifBtn" title="الإشعارات" style="position:relative;">
          <i data-lucide="bell"></i>
          <span class="dot" id="notifDot" style="display:none;"></span>
        </button>
        <div style="position:relative;">
          <div class="user-menu" id="userMenu">
            <div class="user-avatar" id="userAvatar">م</div>
            <div class="user-info">
              <span class="name" id="userName">—</span>
              <span class="role" id="userRole">—</span>
            </div>
            <i data-lucide="chevron-down" style="width:14px;height:14px;opacity:0.5;"></i>
          </div>
          <div class="dropdown" id="userDropdown">
            <a href="company-settings.html" class="dropdown-item"><i data-lucide="settings"></i> الإعدادات</a>
            <a href="employees.html" class="dropdown-item"><i data-lucide="user-cog"></i> الملف الشخصي</a>
            <div class="dropdown-divider"></div>
            <div class="dropdown-item danger" id="logoutBtn"><i data-lucide="log-out"></i> تسجيل الخروج</div>

    </header>

    <main class="content">

        <div>

          <div class="report-icon expenses"><i data-lucide="banknote"></i></div>
          <div class="report-name">المصاريف</div>

        <div class="report-card" data-report="customers">
          <div class="report-icon customers"><i data-lucide="users"></i></div>
          <div class="report-name">العملاء</div>

          <div class="report-icon suppliers"><i data-lucide="truck"></i></div>

      <!-- Date Filters -->
      <div class="date-filters">
        <div class="period-chips" id="periodChips">

        <div class="date-inputs" id="customDates" style="display:none;">
          <input type="date" id="dateFrom">
          <span style="color:var(--text-muted);font-weight:700;">إلى</span>
          <input type="date" id="dateTo">
          <button class="btn btn-primary btn-sm" id="applyCustomBtn">
            <i data-lucide="check"></i> تطبيق
          </button>

        <div id="dateRangeDisplay" style="font-size:13px;color:var(--text-muted);font-weight:700;margin-right:auto;"></div>

      <!-- Report Content -->
      <div id="reportContent">

          <i data-lucide="loader-2"></i>
          <p>جارٍ تحميل التقرير...</p>
        </div>

    </main>
  </div>

  <script src="refad-core.js"></script>
  <script src="refad-auth.js"></script>
  <script>
    (function () {
      'use strict';

      // ============================================================
      // 1) Guard
      // ============================================================
      const session = Refad.Auth.guardPage('company.owner');
      if (!session) return;

      // ============================================================
      // 2) State
      // ============================================================
      const state = {
        currentReport: 'sales',
        period: 'month',
        dateFrom: null,
        dateTo: null,
        data: null,
        charts: [],
        purchaseRecommendations: []
      };

      // ============================================================
      // 3) Sidebar
      // ============================================================
      const MENU = [
        { section: 'الرئيسية', items: [
          { label: 'لوحة التحكم', icon: 'layout-dashboard', href: 'dashboard.html' },
          { label: 'الشات', icon: 'message-circle', href: 'chat.html', permission: 'chat.use' },
          { label: 'الإشعارات', icon: 'bell', href: 'notifications.html', permission: 'notifications.view' }
        ]},
        { section: 'العمليات', items: [
          { label: 'الأصناف', icon: 'package', href: 'products.html', permission: 'products.view' },
          { label: 'المخزون', icon: 'warehouse', href: 'inventory.html', permission: 'inventory.view' },
          { label: 'طلبات الشراء', icon: 'clipboard-list', href: 'purchase-requests.html', permission: 'purchases.view' },
          { label: 'الاستلامات', icon: 'package-check', href: 'receipts.html', permission: 'purchases.receive' },
          { label: 'طلبات البيع', icon: 'shopping-cart', href: 'sales-orders.html', permission: 'sales.view' },
          { label: 'نقطة البيع', icon: 'scan-barcode', href: 'pos.html', permission: 'sales.pos', badge: 'POS', badgeClass: 'teal' },
          { label: 'الفواتير', icon: 'receipt', href: 'invoices.html', permission: 'sales.view' }
        ]},
        { section: 'الأطراف', items: [
          { label: 'الموردين', icon: 'truck', href: 'suppliers.html', permission: 'suppliers.view' },
          { label: 'العملاء', icon: 'users', href: 'customers.html', permission: 'customers.view' }
        ]},
        { section: 'المخزون', items: [
          { label: 'الجرد', icon: 'clipboard-check', href: 'stocktake.html', permission: 'inventory.stocktake' },
          { label: 'التسويات', icon: 'sliders-horizontal', href: 'adjustments.html', permission: 'inventory.adjust' }
        ]},
        { section: 'الموارد البشرية', items: [
          { label: 'الموظفين', icon: 'user-cog', href: 'employees.html', permission: 'employees.view' },
          { label: 'الصلاحيات', icon: 'shield-check', href: 'permissions.html', permission: 'permissions.manage' },
          { label: 'الحضور', icon: 'calendar-check', href: 'attendance.html', permission: 'attendance.view' },
          { label: 'الرواتب', icon: 'wallet', href: 'payroll.html', permission: 'payroll.view' }
        ]},
        { section: 'المالية', items: [
          { label: 'المصاريف', icon: 'banknote', href: 'expenses.html', permission: 'expenses.view' },
          { label: 'التقارير', icon: 'bar-chart-3', href: 'reports.html', permission: 'reports.view' }
        ]},
        { section: 'النظام', items: [
          { label: 'إعدادات الشركة', icon: 'settings', href: 'company-settings.html', permission: 'settings.view' },
          { label: 'شاشة الأدمن', icon: 'shield', href: 'admin.html', permission: 'admin.full', badge: 'Admin', badgeClass: 'gold' }
        ]}
      ];

      function buildSidebar() {
        const nav = document.getElementById('sidebarNav');
        const currentPage = 'reports.html';
        const frag = document.createDocumentFragment();
        MENU.forEach(group => {
          const allowed = group.items.filter(it => !it.permission || Refad.Session.has(it.permission));
          if (!allowed.length) return;
          frag.appendChild(Refad.el('div', { class: 'nav-section' }, group.section));
          allowed.forEach(item => {
            const a = Refad.el('a', {
              href: item.href,
              class: 'nav-item' + (item.href === currentPage ? ' active' : '')
            });
            a.innerHTML = `<i data-lucide="${item.icon}"></i><span>${Refad.escapeHtml(item.label)}</span>${item.badge ? `<span class="badge ${item.badgeClass || ''}">${item.badge}</span>` : ''}`;
            frag.appendChild(a);
          });
        });
        nav.innerHTML = '';
        nav.appendChild(frag);
        if (window.lucide) lucide.createIcons();
      }

      // ============================================================
      // 4) UI helpers
      // ============================================================
      function fillUser() {
        const av = document.getElementById('userAvatar');
        const initial = (session.full_name || '؟').trim().charAt(0);
        if (session.avatar_url) av.innerHTML = `<img src="${Refad.escapeHtml(session.avatar_url)}" alt="">`;
        else av.textContent = initial;
        document.getElementById('userName').textContent = session.full_name;
        document.getElementById('userRole').textContent = Refad.Session.has('company.owner') ? 'صاحب الشركة' : 'موظف';
      }

      function setupTheme() {
        const btn = document.getElementById('themeToggle');
        const icon = document.getElementById('themeIcon');
        const refresh = () => {
          const isDark = Refad.theme.get() === 'dark';
          icon.setAttribute('data-lucide', isDark ? 'sun' : 'moon');
          if (window.lucide) lucide.createIcons();
        };
        refresh();
        btn.addEventListener('click', () => {
          Refad.theme.toggle();
          refresh();
          // Re-render current report to update chart colors
          loadCurrentReport();
        });
      }

      function setupSidebarMobile() {
        const sb = document.getElementById('sidebar');
        const ov = document.getElementById('overlay');
        document.getElementById('menuToggle').addEventListener('click', () => {
          sb.classList.add('open'); ov.classList.add('show');
        });
        ov.addEventListener('click', () => {
          sb.classList.remove('open'); ov.classList.remove('show');
        });
      }

      function setupUserMenu() {
        const m = document.getElementById('userMenu');
        const d = document.getElementById('userDropdown');
        m.addEventListener('click', e => { e.stopPropagation(); d.classList.toggle('show'); });
        document.addEventListener('click', () => d.classList.remove('show'));
        d.addEventListener('click', e => e.stopPropagation());
        document.getElementById('logoutBtn').addEventListener('click', async () => {
          if (await Refad.alert.confirm('تسجيل الخروج', 'هل تريد الخروج؟', 'خروج')) {
            await Refad.Auth.logout();
          }
        });
      }

      function setupNotifBtn() {
        document.getElementById('notifBtn').addEventListener('click', () => {
          window.location.href = 'notifications.html';
        });
      }

      // ============================================================
      // 5) Date handling
      // ============================================================
      function getDateRange() {
        const today = Refad.date.today();
        let from, to;

        switch (state.period) {
          case 'today':
            from = today; to = today;
            break;
          case 'yesterday':
            from = Refad.date.addDays(today, -1);
            to = from;
            break;
          case 'week':
            from = dayjs().startOf('week').format('YYYY-MM-DD');
            to = today;
            break;
          case 'month':
            from = dayjs().startOf('month').format('YYYY-MM-DD');
            to = dayjs().endOf('month').format('YYYY-MM-DD');
            break;
          case 'lastMonth':
            from = dayjs().subtract(1, 'month').startOf('month').format('YYYY-MM-DD');
            to = dayjs().subtract(1, 'month').endOf('month').format('YYYY-MM-DD');
            break;
          case 'year':
            from = dayjs().startOf('year').format('YYYY-MM-DD');
            to = dayjs().endOf('year').format('YYYY-MM-DD');
            break;
          case 'custom':
            from = state.dateFrom; to = state.dateTo;
            break;
          default:
            from = dayjs().startOf('month').format('YYYY-MM-DD');
            to = today;
        }

        return { from, to };
      }

      function updateDateDisplay() {
        const { from, to } = getDateRange();
        if (!from || !to) {
          document.getElementById('dateRangeDisplay').textContent = '';
          return;
        }
        const fromStr = Refad.format.date(from);
        const toStr = Refad.format.date(to);
        const days = dayjs(to).diff(dayjs(from), 'day') + 1;
        document.getElementById('dateRangeDisplay').textContent = `${fromStr} ← ${toStr} (${days} يوم)`;
      }

      function setupPeriodChips() {
        document.querySelectorAll('.period-chip').forEach(chip => {
          chip.addEventListener('click', () => {
            document.querySelectorAll('.period-chip').forEach(c => c.classList.remove('active'));
            chip.classList.add('active');
            state.period = chip.dataset.period;

            if (state.period === 'custom') {
              document.getElementById('customDates').style.display = 'flex';
              // Set defaults
              const today = Refad.date.today();
              const monthStart = dayjs().startOf('month').format('YYYY-MM-DD');
              document.getElementById('dateFrom').value = state.dateFrom || monthStart;
              document.getElementById('dateTo').value = state.dateTo || today;
              state.dateFrom = document.getElementById('dateFrom').value;
              state.dateTo = document.getElementById('dateTo').value;
            } else {
              document.getElementById('customDates').style.display = 'none';
            }

            updateDateDisplay();
            loadCurrentReport();
          });
        });

        document.getElementById('applyCustomBtn').addEventListener('click', () => {
          const from = document.getElementById('dateFrom').value;
          const to = document.getElementById('dateTo').value;
          if (!from || !to) {
            Refad.toast.warning('اختر تاريخ البداية والنهاية');
            return;
          }
          if (from > to) {
            Refad.toast.warning('تاريخ البداية يجب أن يكون قبل النهاية');
            return;
          }
          state.dateFrom = from;
          state.dateTo = to;
          updateDateDisplay();
          loadCurrentReport();
        });
      }

      // ============================================================
      // 6) Report selector
      // ============================================================
      function setupReportSelector() {
        document.querySelectorAll('.report-card').forEach(card => {
          card.addEventListener('click', () => {
            document.querySelectorAll('.report-card').forEach(c => c.classList.remove('active'));
            card.classList.add('active');
            state.currentReport = card.dataset.report;
            loadCurrentReport();
          });
        });
      }

      // ============================================================
      // 7) Destroy old charts
      // ============================================================
      function destroyCharts() {
        state.charts.forEach(c => { try { c.destroy(); } catch (e) {} });
        state.charts = [];
      }

      // ============================================================
      // 8) Load current report
      // ============================================================
      async function loadCurrentReport() {
        destroyCharts();
        const content = document.getElementById('reportContent');
        content.innerHTML = `
          <div class="loader">
            <i data-lucide="loader-2"></i>
            <p>جارٍ تحميل التقرير...</p>
          </div>
        `;
        if (window.lucide) lucide.createIcons();

        try {
          const { from, to } = getDateRange();
          if (!from || !to) throw new Error('فترة غير صحيحة');

          switch (state.currentReport) {
            case 'sales':      await renderSalesReport(from, to); break;
            case 'purchases':  await renderPurchasesReport(from, to); break;
            case 'profit':     await renderProfitReport(from, to); break;
            case 'inventory':  await renderInventoryReport(); break;
            case 'attendance': await renderAttendanceReport(from, to); break;
            case 'expenses':   await renderExpensesReport(from, to); break;
            case 'customers':  await renderCustomersReport(from, to); break;
            case 'suppliers':  await renderSuppliersReport(from, to); break;
          }
        } catch (e) {
          console.error('Report load failed:', e);
          content.innerHTML = `
            <div class="empty-state">
              <i data-lucide="alert-triangle"></i>
              <h3>تعذّر تحميل التقرير</h3>
              <p>${Refad.escapeHtml(e.message)}</p>
            </div>
          `;
          if (window.lucide) lucide.createIcons();
        }
      }

      // ============================================================
      // 9) Sales Report
      // ============================================================
      async function renderSalesReport(from, to) {
        const invoices = await Refad.db.select('sales_invoices', {
          columns: `id, invoice_number, invoice_date, grand_total, total_profit, discount_total,
                    customers(id, name)`,
          eq: { company_id: session.company_id, status: 'paid', invoice_type: 'sale' },
          gte: { invoice_date: from },
          lte: { invoice_date: to },
          order: { column: 'invoice_date', ascending: false }
        });

        const totalSales = invoices.reduce((s, i) => s + (Number(i.grand_total) || 0), 0);
        const totalProfit = invoices.reduce((s, i) => s + (Number(i.total_profit) || 0), 0);
        const totalDiscount = invoices.reduce((s, i) => s + (Number(i.discount_total) || 0), 0);
        const avgInvoice = invoices.length ? totalSales / invoices.length : 0;
        const lossInvoices = invoices.filter(invoice => (Number(invoice.total_profit) || 0) < 0);
        const totalLoss = lossInvoices.reduce((sum, invoice) => sum + Math.abs(Number(invoice.total_profit) || 0), 0);

        // Group by day
        const byDay = {};
        invoices.forEach(inv => {
          const d = inv.invoice_date;
          if (!byDay[d]) byDay[d] = { sales: 0, profit: 0, count: 0 };
          byDay[d].sales += Number(inv.grand_total) || 0;
          byDay[d].profit += Number(inv.total_profit) || 0;
          byDay[d].count += 1;
        });

        const sortedDays = Object.keys(byDay).sort();

        // Render
        renderReportLayout({
          title: 'تقرير المبيعات',
          icon: 'trending-up',
          cards: [
            { label: 'إجمالي المبيعات', value: Refad.format.money(totalSales), icon: 'dollar-sign', color: 'green' },
            { label: 'عدد الفواتير', value: Refad.format.number(invoices.length), icon: 'receipt', color: 'blue', sub: `متوسط الفاتورة: ${Refad.format.money(avgInvoice)}` },
            { label: 'إجمالي الربح', value: Refad.format.money(totalProfit), icon: 'trending-up', color: 'gold' },
            { label: 'إجمالي الخصم', value: Refad.format.money(totalDiscount), icon: 'percent', color: 'red' },
            { label: 'فواتير بربح سلبي', value: Refad.format.number(lossInvoices.length), icon: 'circle-alert', color: 'red', sub: `إجمالي الخسارة: ${Refad.format.money(totalLoss)}` }
          ],
          charts: [
            { id: 'salesChart', title: 'المبيعات اليومية', icon: 'bar-chart-3', type: 'line', span: 'wide' },
            { id: 'profitChart', title: 'توزيع الأرباح', icon: 'pie-chart', type: 'doughnut', span: 'narrow' }
          ],
          table: {
            title: 'تفاصيل الفواتير',
            icon: 'list',
            columns: ['رقم الفاتورة', 'التاريخ', 'العميل', 'الإجمالي', 'الخصم', 'الربح'],
            rows: invoices.map(inv => [
              Refad.escapeHtml(inv.invoice_number),
              Refad.format.date(inv.invoice_date),
              Refad.escapeHtml(inv.customers?.name || 'نقدي'),
              `<span class="money-cell accent">${Refad.format.money(inv.grand_total)}</span>`,
              `<span class="money-cell red">${Refad.format.money(inv.discount_total)}</span>`,
              `<span class="money-cell ${Number(inv.total_profit) < 0 ? 'red' : 'green'}">${Refad.format.money(inv.total_profit)}</span>`
            ])
          },
          additionalTables: [{
            title: 'مراجعة فواتير المبيعات ذات الربح السلبي',
            icon: 'circle-alert',
            emptyTitle: 'لا توجد فواتير بربح سلبي',
            emptyMessage: 'لا تظهر فواتير خاسرة في الفترة المحددة.',
            columns: ['رقم الفاتورة', 'التاريخ', 'العميل', 'قيمة البيع', 'الخسارة'],
            rows: lossInvoices.map(invoice => [
              `<a href="invoices.html?id=${Number(invoice.id)}" style="color:var(--accent);font-weight:700;">${Refad.escapeHtml(invoice.invoice_number)}</a>`,
              Refad.format.date(invoice.invoice_date),
              Refad.escapeHtml(invoice.customers?.name || 'نقدي'),
              Refad.format.money(invoice.grand_total),
              `<strong style="color:var(--danger);">${Refad.format.money(Math.abs(Number(invoice.total_profit) || 0))}</strong>`
            ])
          }]
        });

        // Chart 1: Sales by day (line)
        if (sortedDays.length) {
          const ctx1 = document.getElementById('salesChart').getContext('2d');
          const chart1 = new Chart(ctx1, {
            type: 'line',
            data: {
              labels: sortedDays.map(d => Refad.format.date(d, 'DD/MM')),
              datasets: [
                {
                  label: 'المبيعات',
                  data: sortedDays.map(d => byDay[d].sales),
                  borderColor: '#10b981',
                  backgroundColor: 'rgba(16,185,129,0.1)',
                  fill: true,
                  tension: 0.35,
                  borderWidth: 3,
                  pointRadius: 4,
                  pointHoverRadius: 6
                },
                {
                  label: 'الربح',
                  data: sortedDays.map(d => byDay[d].profit),
                  borderColor: '#F59E0B',
                  backgroundColor: 'rgba(245,158,11,0.1)',
                  fill: true,
                  tension: 0.35,
                  borderWidth: 3,
                  pointRadius: 4,
                  pointHoverRadius: 6
                }
              ]
            },
            options: getChartOptions()
          });
          state.charts.push(chart1);

          // Chart 2: Sales vs Profit doughnut
          const ctx2 = document.getElementById('profitChart').getContext('2d');
          const chart2 = new Chart(ctx2, {
            type: 'doughnut',
            data: {
              labels: ['تكلفة', 'ربح'],
              datasets: [{
                data: [totalSales - totalProfit, totalProfit],
                backgroundColor: ['#ef4444', '#10b981'],
                borderWidth: 2,
                borderColor: Refad.theme.get() === 'dark' ? '#0f2137' : '#ffffff'
              }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              cutout: '65%',
              plugins: {
                legend: {
                  position: 'bottom',
                  labels: {
                    font: { family: 'Cairo', size: 11, weight: '600' },
                    color: Refad.theme.get() === 'dark' ? '#f1f5f9' : '#0f172a',
                    padding: 12,
                    boxWidth: 10,
                    usePointStyle: true
                  }
                },
                tooltip: {
                  rtl: true,
                  callbacks: {
                    label: ctx => ` ${Refad.format.money(ctx.parsed)}`
                  }
                }
              }
            }
          });
          state.charts.push(chart2);
        }
      }

      // ============================================================
      // 10) Purchases Report
      // ============================================================
      async function renderPurchasesReport(from, to) {
        const receipts = await Refad.db.select('receipts', {
          columns: `id, receipt_number, receipt_date, total_amount, paid_amount, status,
                    suppliers(id, name)`,
          eq: { company_id: session.company_id },
          gte: { receipt_date: from },
          lte: { receipt_date: to },
          order: { column: 'receipt_date', ascending: false }
        });

        const totalPurchases = receipts.reduce((s, r) => s + (Number(r.total_amount) || 0), 0);
        const totalPaid = receipts.reduce((s, r) => s + (Number(r.paid_amount) || 0), 0);
        const totalUnpaid = totalPurchases - totalPaid;

        renderReportLayout({
          title: 'تقرير المشتريات',
          icon: 'shopping-bag',
          cards: [
            { label: 'إجمالي المشتريات', value: Refad.format.money(totalPurchases), icon: 'shopping-bag', color: 'blue' },
            { label: 'عدد الفواتير', value: Refad.format.number(receipts.length), icon: 'receipt', color: 'teal' },

      // 11) Profit Report
      // ============================================================
      async function renderProfitReport(from, to) {
        const invoices = await Refad.db.select('sales_invoices', {
          columns: 'invoice_date, grand_total, total_profit, discount_total',
          eq: { company_id: session.company_id, status: 'paid' },
          gte: { invoice_date: from },
          lte: { invoice_date: to }
        });

        const expenses = await Refad.db.select('expenses', {
          columns: 'expense_date, amount, category',
          eq: { company_id: session.company_id },
          gte: { expense_date: from },
          lte: { expense_date: to }
        });

        const totalSales = invoices.reduce((s, i) => s + (Number(i.grand_total) || 0), 0);
        const grossProfit = invoices.reduce((s, i) => s + (Number(i.total_profit) || 0), 0);
        const totalExpenses = expenses.reduce((s, e) => s + (Number(e.amount) || 0), 0);
        const netProfit = grossProfit - totalExpenses;

        // Group by day
        const byDay = {};
        invoices.forEach(inv => {
          const d = inv.invoice_date;
          if (!byDay[d]) byDay[d] = { gross: 0, expenses: 0 };
          byDay[d].gross += Number(inv.total_profit) || 0;
        });
        expenses.forEach(e => {
          const d = e.expense_date;
          if (!byDay[d]) byDay[d] = { gross: 0, expenses: 0 };
          byDay[d].expenses += Number(e.amount) || 0;
        });
        const sortedDays = Object.keys(byDay).sort();

        renderReportLayout({
          title: 'تقرير الأرباح والخسائر',
          icon: 'dollar-sign',
          cards: [
            { label: 'إجمالي المبيعات', value: Refad.format.money(totalSales), icon: 'trending-up', color: 'green' },
            { label: 'الربح الإجمالي', value: Refad.format.money(grossProfit), icon: 'dollar-sign', color: 'gold' },
            { label: 'إجمالي المصاريف', value: Refad.format.money(totalExpenses), icon: 'banknote', color: 'red' },
            { label: 'الربح الصافي', value: Refad.format.money(netProfit), icon: 'award', color: netProfit >= 0 ? 'green' : 'red', sub: netProfit >= 0 ? 'ربح' : 'خسارة' }
          ],
          charts: [
            { id: 'profitChart', title: 'الأرباح والمصاريف اليومية', icon: 'line-chart', type: 'line', span: 'wide' }
          ],
          table: {
            title: 'تفاصيل يومية',
            icon: 'calendar',
            columns: ['التاريخ', 'الربح الإجمالي', 'المصاريف', 'الصافي'],
            rows: sortedDays.map(d => {
              const net = byDay[d].gross - byDay[d].expenses;
              return [
                Refad.format.date(d),
                `<span class="money-cell green">${Refad.format.money(byDay[d].gross)}</span>`,
                `<span class="money-cell red">${Refad.format.money(byDay[d].expenses)}</span>`,
                `<span class="money-cell ${net >= 0 ? 'accent' : 'red'}">${Refad.format.money(net)}</span>`
              ];
            })
          }
        });

        if (sortedDays.length) {
          const ctx = document.getElementById('profitChart').getContext('2d');
          const chart = new Chart(ctx, {
            type: 'line',
            data: {
              labels: sortedDays.map(d => Refad.format.date(d, 'DD/MM')),
              datasets: [
                {
                  label: 'الربح الإجمالي',
                  data: sortedDays.map(d => byDay[d].gross),
                  borderColor: '#10b981',
                  backgroundColor: 'rgba(16,185,129,0.1)',
                  fill: true,
                  tension: 0.35,
                  borderWidth: 3
                },
                {
                  label: 'المصاريف',
                  data: sortedDays.map(d => byDay[d].expenses),
                  borderColor: '#ef4444',
                  backgroundColor: 'rgba(239,68,68,0.1)',
                  fill: true,
                  tension: 0.35,
                  borderWidth: 3
                },
                {
                  label: 'الصافي',
                  data: sortedDays.map(d => byDay[d].gross - byDay[d].expenses),
                  borderColor: '#F59E0B',
                  backgroundColor: 'rgba(245,158,11,0.05)',
                  borderDash: [5, 5],

      // ============================================================
      // 12) Inventory Report
      // ============================================================
      async function renderInventoryReport() {
        const [products, batches] = await Promise.all([
          Refad.db.select('products', {
            columns: 'id, name, name_en, form, unit, reorder_level, min_order_qty, is_active',
            eq: { company_id: session.company_id, is_active: true }
          }),
          Refad.db.select('batches', {
            columns: 'id, product_id, batch_number, quantity_left, cost_price, sale_price, expiry_date',
            eq: { company_id: session.company_id },
            gt: { quantity_left: 0 }
          })
        ]);
        const salesSince = Refad.date.addDays(Refad.date.today(), -90);
        const soldItems = await Refad.db.select('sales_invoice_items', {
          columns: 'product_id, quantity, sales_invoices!inner(invoice_date, company_id, status, invoice_type)',
          gte: { 'sales_invoices.invoice_date': salesSince },
          eq: { 'sales_invoices.company_id': session.company_id, 'sales_invoices.invoice_type': 'sale' },
          neq: { 'sales_invoices.status': 'cancelled' },
          limit: 10000
        });

        const byProduct = {};
        batches.forEach(b => {
          if (!byProduct[b.product_id]) byProduct[b.product_id] = [];
          byProduct[b.product_id].push(b);
        });
        const salesByProduct = {};
        soldItems.forEach(item => {
          salesByProduct[item.product_id] = (salesByProduct[item.product_id] || 0) + (Number(item.quantity) || 0);
        });

        const today = Refad.date.today();
        const expiryWindow = Refad.date.addDays(today, 30);
        const productStats = products.map(p => {
          const pbs = byProduct[p.id] || [];
          const qty = pbs.reduce((sum, batch) => sum + (Number(batch.quantity_left) || 0), 0);
          const expiredQty = pbs
            .filter(batch => batch.expiry_date && batch.expiry_date < today)
            .reduce((sum, batch) => sum + (Number(batch.quantity_left) || 0), 0);
          const sellableQty = qty - expiredQty;
          const expiringQty = pbs
            .filter(batch => batch.expiry_date && batch.expiry_date >= today && batch.expiry_date <= expiryWindow)
            .reduce((sum, batch) => sum + (Number(batch.quantity_left) || 0), 0);
          const costValue = pbs.reduce((sum, batch) =>
            sum + (Number(batch.quantity_left) || 0) * (Number(batch.cost_price) || 0), 0);
          let nearest = null;
          pbs.forEach(b => {
            if (!b.expiry_date || b.expiry_date < today) return;
            if (!nearest || b.expiry_date < nearest) nearest = b.expiry_date;
          });
          let status = 'ok';
          if (sellableQty === 0) status = 'out';
          else if (sellableQty <= (p.reorder_level || 0)) status = 'low';
          const dailySales = (salesByProduct[p.id] || 0) / 90;
          const targetStock = Math.max(Number(p.reorder_level) || 0, Math.ceil(dailySales * 30));
          const needed = Math.max(0, targetStock - sellableQty);
          return {
            ...p,
            total_qty: qty,
            sellable_qty: sellableQty,
            expired_qty: expiredQty,
            expiring_qty: expiringQty,
            cost_value: costValue,
            nearest_expiry: nearest,
            status,
            daily_sales: dailySales,
            recommended_order_qty: needed > 0
              ? Math.max(Number(p.min_order_qty) || 1, needed)
              : 0
          };
        });
        const purchaseRecommendations = productStats
          .filter(product => product.recommended_order_qty > 0)
          .sort((a, b) => b.recommended_order_qty - a.recommended_order_qty);

        const totalProducts = productStats.length;
        const inStock = productStats.filter(p => p.status === 'ok').length;
        const lowStock = productStats.filter(p => p.status === 'low').length;
        const outOfStock = productStats.filter(p => p.status === 'out').length;
        const totalValue = productStats.reduce((s, p) => s + p.cost_value, 0);
        const expiredBatches = batches
          .filter(batch => batch.expiry_date && batch.expiry_date <= expiryWindow)
          .map(batch => ({
            ...batch,
            product: products.find(product => product.id === batch.product_id),
            is_expired: batch.expiry_date < today
          }))
          .filter(batch => batch.product)
          .sort((a, b) => a.expiry_date.localeCompare(b.expiry_date));
        state.purchaseRecommendations = purchaseRecommendations.map(product => ({
          product_id: product.id,
          quantity: product.recommended_order_qty,
          daily_rate: product.daily_sales
        }));

        renderReportLayout({
          title: 'تقرير المخزون',
          icon: 'warehouse',
          cards: [
            { label: 'إجمالي الأصناف', value: Refad.format.number(totalProducts), icon: 'package', color: 'blue' },
            { label: 'متوفر', value: Refad.format.number(inStock), icon: 'check-circle', color: 'green' },
            { label: 'مخزون منخفض', value: Refad.format.number(lowStock), icon: 'alert-triangle', color: 'gold' },
            { label: 'نفد', value: Refad.format.number(outOfStock), icon: 'x-circle', color: 'red' },
            { label: 'قيمة المخزون', value: Refad.format.money(totalValue), icon: 'dollar-sign', color: 'teal' },
            { label: 'كمية الشراء المقترحة', value: Refad.format.number(purchaseRecommendations.reduce((sum, product) => sum + product.recommended_order_qty, 0)), icon: 'shopping-cart', color: 'blue' }
          ],
          charts: [
            { id: 'inventoryChart', title: 'حالة المخزون', icon: 'pie-chart', type: 'doughnut', span: 'narrow' },
            { id: 'topProductsChart', title: 'أعلى 10 أصناف قيمة', icon: 'bar-chart-3', type: 'bar', span: 'wide' }
          ],
          table: {
            title: 'الأصناف',
            icon: 'list',
            columns: ['الصنف', 'الشكل', 'الرصيد القابل للبيع', 'منتهي الصلاحية', 'حد الطلب', 'قيمة المخزون', 'الحالة'],
            rows: productStats.sort((a, b) => b.cost_value - a.cost_value).map(p => {
              const statusMap = {
                ok:   '<span class="badge-tag green">متوفر</span>',
                low:  '<span class="badge-tag gold">منخفض</span>',
                out:  '<span class="badge-tag red">نفد</span>'
              };
              return [
                Refad.escapeHtml(p.name),
                Refad.escapeHtml(p.form || '—'),
                Refad.format.number(p.sellable_qty),
                p.expired_qty > 0
                  ? `<span class="badge-tag red">${Refad.format.number(p.expired_qty)}</span>`
                  : Refad.format.number(0),
                Refad.format.number(p.reorder_level || 0),
                `<span class="money-cell accent">${Refad.format.money(p.cost_value)}</span>`,
                statusMap[p.status]
              ];
            })
          },
          additionalTables: [{
            title: 'أصناف مرشحة للشراء',
            icon: 'shopping-cart',
            action: Refad.Session.has('purchases.create') && purchaseRecommendations.length
              ? { key: 'purchase-suggestions', label: 'إنشاء مسودة طلب شراء' }
              : null,
            emptyTitle: 'لا توجد توصيات شراء',
            emptyMessage: 'الأرصدة الحالية تغطي حد إعادة الطلب أو التغطية التقديرية لمدة 30 يوماً.',
            columns: ['الصنف', 'الرصيد القابل للبيع', 'حد إعادة الطلب', 'متوسط البيع اليومي', 'سبب التوصية', 'الكمية المقترح شراؤها'],
            rows: purchaseRecommendations.map(product => [
              Refad.escapeHtml(product.name),
              Refad.format.number(product.sellable_qty),
              Refad.format.number(product.reorder_level || 0),
              Refad.format.number(product.daily_sales, 1),
              product.sellable_qty <= 0 ? 'نفد المخزون' :
                product.sellable_qty <= (Number(product.reorder_level) || 0) ? 'وصل لحد إعادة الطلب' : 'التغطية أقل من 30 يوماً',
              `<strong style="color:var(--accent);">${Refad.format.number(product.recommended_order_qty)}</strong>`
            ])
          }, {
            title: 'تنبيهات الصلاحية',
            icon: 'calendar-clock',
            emptyTitle: 'لا توجد تنبيهات صلاحية',
            emptyMessage: 'لا توجد تشغيلات منتهية أو تنتهي خلال الثلاثين يوماً القادمة.',
            columns: ['الصنف', 'رقم التشغيلة', 'تاريخ الانتهاء', 'الكمية', 'الحالة'],
            rows: expiredBatches.map(batch => [
              Refad.escapeHtml(batch.product.name),
              Refad.escapeHtml(batch.batch_number || '—'),
              Refad.format.date(batch.expiry_date),
              Refad.format.number(batch.quantity_left),
              batch.is_expired
                ? '<span class="badge-tag red">منتهي</span>'
                : '<span class="badge-tag gold">قارب على الانتهاء</span>'
            ])
          }]
        });

        // Chart 1: Status doughnut
        const ctx1 = document.getElementById('inventoryChart').getContext('2d');
        const chart1 = new Chart(ctx1, {
          type: 'doughnut',
          data: {
            labels: ['متوفر', 'منخفض', 'نفد'],
            datasets: [{
              data: [inStock, lowStock, outOfStock],
              backgroundColor: ['#10b981', '#F59E0B', '#ef4444'],
              borderWidth: 2,
              borderColor: Refad.theme.get() === 'dark' ? '#0f2137' : '#ffffff'
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            cutout: '65%',
            plugins: {
              legend: {
                position: 'bottom',
                labels: {
                  font: { family: 'Cairo', size: 11, weight: '600' },
                  color: Refad.theme.get() === 'dark' ? '#f1f5f9' : '#0f172a',
                  padding: 12,
                  boxWidth: 10,
                  usePointStyle: true
                }
              }
            }
          }
        });
        state.charts.push(chart1);

        // Chart 2: Top products
        const top = productStats.slice(0, 10);
        if (top.length) {
          const ctx2 = document.getElementById('topProductsChart').getContext('2d');
          const chart2 = new Chart(ctx2, {
            type: 'bar',
            data: {
              labels: top.map(p => p.name.length > 20 ? p.name.slice(0, 20) + '...' : p.name),
              datasets: [{
                label: 'قيمة المخزون',
                data: top.map(p => p.cost_value),
                backgroundColor: '#14B8A6',
                borderRadius: 6
              }]
            },
            options: {

            }

      // 13) Attendance Report

      async function renderAttendanceReport(from, to) {
        const [employees, attendance] = await Promise.all([
          Refad.db.select('users', {
            columns: 'id, full_name, username',
            eq: { company_id: session.company_id, is_active: true }
          }),
          Refad.db.select('attendance', {
            columns: 'user_id, att_date, status, work_hours',
            eq: { company_id: session.company_id },
            gte: { att_date: from },
            lte: { att_date: to }
          }).catch(() => [])
        ]);

        const empMap = {};
        employees.forEach(e => { empMap[e.id] = e; });

        // Stats per employee
        const stats = employees.map(emp => {
          const recs = attendance.filter(a => a.user_id === emp.id);
          const present = recs.filter(r => r.status === 'present').length;
          const late = recs.filter(r => r.status === 'late').length;
          const absent = recs.filter(r => r.status === 'absent').length;
          const leave = recs.filter(r => r.status === 'leave').length;
          const totalHours = recs.reduce((s, r) => s + (Number(r.work_hours) || 0), 0);
          const daysWorked = present + late;
          return { ...emp, present, late, absent, leave, totalHours, daysWorked };
        });

        const totalPresent = stats.reduce((s, e) => s + e.present, 0);
        const totalLate = stats.reduce((s, e) => s + e.late, 0);
        const totalAbsent = stats.reduce((s, e) => s + e.absent, 0);
        const totalHours = stats.reduce((s, e) => s + e.totalHours, 0);

        renderReportLayout({
          title: 'تقرير الحضور',

            title: 'تفاصيل الحضور',
            icon: 'list',
            columns: ['الموظف', 'حاضر', 'متأخر', 'غائب', 'إجازة', 'إجمالي الساعات'],
            rows: stats.sort((a, b) => b.totalHours - a.totalHours).map(e => [
              Refad.escapeHtml(e.full_name),
              `<span class="badge-tag green">${e.present}</span>`,
              `<span class="badge-tag gold">${e.late}</span>`,
              `<span class="badge-tag red">${e.absent}</span>`,
              `<span class="badge-tag blue">${e.leave}</span>`,
              `<span class="money-cell accent">${Refad.format.number(e.totalHours, 1)}</span>`
            ])
          }
        });

        if (stats.length) {
          const ctx = document.getElementById('attendanceChart').getContext('2d');
          const chart = new Chart(ctx, {
            type: 'bar',
            data: {
              labels: stats.map(e => e.full_name),
              datasets: [
                {
                  label: 'حاضر',
                  data: stats.map(e => e.present),
                  backgroundColor: '#10b981',
                  borderRadius: 6,
                  stack: 'a'
                },
                {
                  label: 'متأخر',
                  data: stats.map(e => e.late),
                  backgroundColor: '#F59E0B',
                  borderRadius: 6,
                  stack: 'a'
                },
                {
                  label: 'غائب',

                  backgroundColor: '#ef4444',
