      // ============================================================
      // 14) Expenses Report
      // ============================================================
      async function renderExpensesReport(from, to) {
        const expenses = await Refad.db.select('expenses', {
          columns: 'id, category, amount, description, expense_date, users(full_name)',
          eq: { company_id: session.company_id },
          gte: { expense_date: from },
          lte: { expense_date: to },
          order: { column: 'expense_date', ascending: false }
        });

        const CATEGORIES = {
          rent: 'إيجار', salary: 'مرتبات', utilities: 'مرافق',
          transport: 'نقل', maintenance: 'صيانة', marketing: 'تسويق',
          supplies: 'مستلزمات', other: 'أخرى'
        };

        const total = expenses.reduce((s, e) => s + (Number(e.amount) || 0), 0);
        const byCat = {};
        expenses.forEach(e => {
          const c = CATEGORIES[e.category] || e.category;
          byCat[c] = (byCat[c] || 0) + (Number(e.amount) || 0);
        });

        const topCat = Object.entries(byCat).sort((a, b) => b[1] - a[1])[0];

        renderReportLayout({
          title: 'تقرير المصاريف',
          icon: 'banknote',
          cards: [
            { label: 'إجمالي المصاريف', value: Refad.format.money(total), icon: 'banknote', color: 'red' },
            { label: 'عدد المصاريف', value: Refad.format.number(expenses.length), icon: 'list', color: 'blue' },
            { label: 'متوسط المصروف', value: Refad.format.money(expenses.length ? total / expenses.length : 0), icon: 'calculator', color: 'teal' },
            { label: 'أكبر تصنيف', value: topCat ? topCat[0] : '—', icon: 'trending-up', color: 'gold', sub: topCat ? Refad.format.money(topCat[1]) : '' }
          ],
          charts: [
            { id: 'expensesCatChart', title: 'التوزيع حسب التصنيف', icon: 'pie-chart', type: 'doughnut', span: 'narrow' },
            { id: 'expensesDailyChart', title: 'المصاريف اليومية', icon: 'line-chart', type: 'line', span: 'wide' }
          ],
          table: {
            title: 'تفاصيل المصاريف',
            icon: 'list',
            columns: ['التصنيف', 'الوصف', 'التاريخ', 'المبلغ', 'المستخدم'],
            rows: expenses.slice(0, 200).map(e => [
              Refad.escapeHtml(CATEGORIES[e.category] || e.category),
              Refad.escapeHtml(e.description || '—'),
              Refad.format.date(e.expense_date),
              `<span class="money-cell red">${Refad.format.money(e.amount)}</span>`,
              Refad.escapeHtml(e.users?.full_name || '—')
            ])
          }
        });

        // Chart 1: by category
        const catEntries = Object.entries(byCat).sort((a, b) => b[1] - a[1]);
        if (catEntries.length) {
          const colors = ['#ef4444', '#F59E0B', '#3b82f6', '#8b5cf6', '#14B8A6', '#ec4899', '#f97316', '#64748b'];
          const ctx1 = document.getElementById('expensesCatChart').getContext('2d');
          const chart1 = new Chart(ctx1, {
            type: 'doughnut',
            data: {
              labels: catEntries.map(([c]) => c),
              datasets: [{
                data: catEntries.map(([, v]) => v),
                backgroundColor: colors.slice(0, catEntries.length),
                borderWidth: 2,
                borderColor: Refad.theme.get() === 'dark' ? '#0f2137' : '#ffffff'
              }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              cutout: '60%',
              plugins: {
                legend: {
                  position: 'bottom',
                  labels: {
                    font: { family: 'Cairo', size: 10, weight: '600' },
                    color: getTextColor(),
                    padding: 10,
                    boxWidth: 10,
                    usePointStyle: true
                  }
                },
                tooltip: { rtl: true, callbacks: { label: c => ` ${Refad.format.money(c.parsed)}` } }
              }
            }
          });
          state.charts.push(chart1);
        }

        // Chart 2: daily
        const byDay = {};
        expenses.forEach(e => {
          byDay[e.expense_date] = (byDay[e.expense_date] || 0) + (Number(e.amount) || 0);
        });
        const sortedDays = Object.keys(byDay).sort();

        if (sortedDays.length) {
          const ctx2 = document.getElementById('expensesDailyChart').getContext('2d');
          const chart2 = new Chart(ctx2, {
            type: 'line',
            data: {
              labels: sortedDays.map(d => Refad.format.date(d, 'DD/MM')),
              datasets: [{
                label: 'المصاريف',
                data: sortedDays.map(d => byDay[d]),
                borderColor: '#ef4444',
                backgroundColor: 'rgba(239,68,68,0.1)',
                fill: true,
                tension: 0.35,
                borderWidth: 3
              }]
            },
            options: getChartOptions()
          });
          state.charts.push(chart2);
        }
      }

      // ============================================================
      // 15) Customers Report
      // ============================================================
      async function renderCustomersReport(from, to) {
        const [customers, invoices] = await Promise.all([
          Refad.db.select('customers', {
            columns: 'id, name, phone, balance',
            eq: { company_id: session.company_id, is_active: true }
          }),
          Refad.db.select('sales_invoices', {
            columns: 'customer_id, grand_total, total_profit',
            eq: { company_id: session.company_id, status: 'paid' },
            gte: { invoice_date: from },
            lte: { invoice_date: to }
          }).catch(() => [])
        ]);

        const stats = customers.map(c => {
          const invs = invoices.filter(i => i.customer_id === c.id);
          const totalSales = invs.reduce((s, i) => s + (Number(i.grand_total) || 0), 0);
          const totalProfit = invs.reduce((s, i) => s + (Number(i.total_profit) || 0), 0);
          return { ...c, invoicesCount: invs.length, totalSales, totalProfit };
        }).sort((a, b) => b.totalSales - a.totalSales);

        const totalSales = stats.reduce((s, c) => s + c.totalSales, 0);
        const activeCustomers = stats.filter(c => c.invoicesCount > 0).length;
        const topCustomer = stats[0];

        renderReportLayout({
          title: 'تقرير العملاء',
          icon: 'users',
          cards: [
            { label: 'إجمالي العملاء', value: Refad.format.number(customers.length), icon: 'users', color: 'blue' },
            { label: 'عملاء نشطين', value: Refad.format.number(activeCustomers), icon: 'user-check', color: 'green' },
            { label: 'إجمالي المبيعات', value: Refad.format.money(totalSales), icon: 'dollar-sign', color: 'gold' },
            { label: 'أفضل عميل', value: topCustomer?.name || '—', icon: 'award', color: 'purple', sub: topCustomer ? Refad.format.money(topCustomer.totalSales) : '' }
          ],
          charts: [
            { id: 'topCustomersChart', title: 'أعلى 10 عملاء', icon: 'bar-chart-3', type: 'bar', span: 'wide' }
          ],
          table: {
            title: 'تفاصيل العملاء',
            icon: 'list',
            columns: ['العميل', 'الهاتف', 'عدد الفواتير', 'إجمالي المبيعات', 'إجمالي الربح', 'الرصيد'],
            rows: stats.map(c => [
              Refad.escapeHtml(c.name),
              Refad.escapeHtml(c.phone || '—'),
              Refad.format.number(c.invoicesCount),
              `<span class="money-cell accent">${Refad.format.money(c.totalSales)}</span>`,
              `<span class="money-cell green">${Refad.format.money(c.totalProfit)}</span>`,
              `<span class="money-cell ${c.balance > 0 ? 'red' : 'green'}">${Refad.format.money(c.balance || 0)}</span>`
            ])
          }
        });

        const top = stats.slice(0, 10);
        if (top.length) {
          const ctx = document.getElementById('topCustomersChart').getContext('2d');
          const chart = new Chart(ctx, {
            type: 'bar',
            data: {
              labels: top.map(c => c.name),
              datasets: [{
                label: 'إجمالي المبيعات',
                data: top.map(c => c.totalSales),
                backgroundColor: '#ec4899',
                borderRadius: 6
              }]
            },
            options: { ...getBarOptions(), indexAxis: 'y' }
          });
          state.charts.push(chart);
        }
      }

      // ============================================================
      // 16) Suppliers Report
      // ============================================================
      async function renderSuppliersReport(from, to) {
        const [suppliers, receipts] = await Promise.all([
          Refad.db.select('suppliers', {
            columns: 'id, name, phone, balance',
            eq: { company_id: session.company_id, is_active: true }
          }),
          Refad.db.select('receipts', {
            columns: 'supplier_id, total_amount, paid_amount',
            eq: { company_id: session.company_id },
            gte: { receipt_date: from },
            lte: { receipt_date: to }
          }).catch(() => [])
        ]);

        const stats = suppliers.map(s => {
          const rs = receipts.filter(r => r.supplier_id === s.id);
          const totalPurchases = rs.reduce((acc, r) => acc + (Number(r.total_amount) || 0), 0);
          const totalPaid = rs.reduce((acc, r) => acc + (Number(r.paid_amount) || 0), 0);
          return { ...s, receiptsCount: rs.length, totalPurchases, totalPaid };
        }).sort((a, b) => b.totalPurchases - a.totalPurchases);

        const totalPurchases = stats.reduce((s, x) => s + x.totalPurchases, 0);
        const activeSuppliers = stats.filter(s => s.receiptsCount > 0).length;
        const topSupplier = stats[0];

        renderReportLayout({
          title: 'تقرير الموردين',
          icon: 'truck',
          cards: [
            { label: 'إجمالي الموردين', value: Refad.format.number(suppliers.length), icon: 'truck', color: 'blue' },
            { label: 'موردين نشطين', value: Refad.format.number(activeSuppliers), icon: 'check-circle', color: 'green' },
            { label: 'إجمالي المشتريات', value: Refad.format.money(totalPurchases), icon: 'shopping-bag', color: 'gold' },
            { label: 'أكبر مورد', value: topSupplier?.name || '—', icon: 'award', color: 'purple', sub: topSupplier ? Refad.format.money(topSupplier.totalPurchases) : '' }
          ],
          charts: [
            { id: 'topSuppliersChart', title: 'أعلى 10 موردين', icon: 'bar-chart-3', type: 'bar', span: 'wide' }
          ],
          table: {
            title: 'تفاصيل الموردين',
            icon: 'list',
            columns: ['المورد', 'الهاتف', 'عدد الفواتير', 'إجمالي المشتريات', 'المدفوع', 'الرصيد'],
            rows: stats.map(s => [
              Refad.escapeHtml(s.name),
              Refad.escapeHtml(s.phone || '—'),
              Refad.format.number(s.receiptsCount),
              `<span class="money-cell accent">${Refad.format.money(s.totalPurchases)}</span>`,
              `<span class="money-cell green">${Refad.format.money(s.totalPaid)}</span>`,
              `<span class="money-cell ${s.balance > 0 ? 'red' : 'green'}">${Refad.format.money(s.balance || 0)}</span>`
            ])
          }
        });

        const top = stats.slice(0, 10);
        if (top.length) {
          const ctx = document.getElementById('topSuppliersChart').getContext('2d');
          const chart = new Chart(ctx, {
            type: 'bar',
            data: {
              labels: top.map(s => s.name),
              datasets: [{
                label: 'إجمالي المشتريات',
                data: top.map(s => s.totalPurchases),
                backgroundColor: '#f97316',
                borderRadius: 6
              }]
            },
            options: { ...getBarOptions(), indexAxis: 'y' }
          });
          state.charts.push(chart);
        }
      }

      // ============================================================
      // 17) Layout renderer
      // ============================================================
      function renderReportLayout({ title, icon, cards, charts, table, additionalTables = [] }) {
        const content = document.getElementById('reportContent');

        const cardsHtml = cards.map(c => `
          <div class="summary-card">
            <div class="summary-icon ${c.color}">
              <i data-lucide="${c.icon}"></i>
            </div>
            <div class="summary-body">
              <div class="label">${Refad.escapeHtml(c.label)}</div>
              <div class="value" style="font-size:${String(c.value).length > 15 ? '16px' : '22px'};">${Refad.escapeHtml(String(c.value))}</div>
              ${c.sub ? `<div class="sub">${Refad.escapeHtml(c.sub)}</div>` : ''}
            </div>
          </div>
        `).join('');

        const wideCharts = charts.filter(ch => ch.span === 'wide');
        const narrowCharts = charts.filter(ch => ch.span === 'narrow');

        let chartsHtml = '';
        if (wideCharts.length && narrowCharts.length) {
          // Mixed layout
          chartsHtml = `
            <div class="charts-grid">
              ${wideCharts.map(ch => `
                <div class="chart-box">
                  <h3><i data-lucide="${ch.icon}"></i> ${Refad.escapeHtml(ch.title)}</h3>
                  <div class="chart-wrap"><canvas id="${ch.id}"></canvas></div>
                </div>
              `).join('')}
              ${narrowCharts.map(ch => `
                <div class="chart-box">
                  <h3><i data-lucide="${ch.icon}"></i> ${Refad.escapeHtml(ch.title)}</h3>
                  <div class="chart-wrap"><canvas id="${ch.id}"></canvas></div>
                </div>
              `).join('')}
            </div>
          `;
        } else {
          chartsHtml = `
            <div class="charts-grid" style="grid-template-columns:1fr;">
              ${charts.map(ch => `
                <div class="chart-box">
                  <h3><i data-lucide="${ch.icon}"></i> ${Refad.escapeHtml(ch.title)}</h3>
                  <div class="chart-wrap"><canvas id="${ch.id}"></canvas></div>
                </div>
              `).join('')}
            </div>
          `;
        }

        const tableHtml = table ? `
          <div class="table-wrap">
            <div class="table-header">
              <h3><i data-lucide="${table.icon}"></i> ${Refad.escapeHtml(table.title)}</h3>
              <span style="font-size:12px;color:var(--text-muted);font-weight:600;">${table.rows.length} سجل</span>
            </div>
            <div class="table-scroll">
              ${table.rows.length === 0 ? `
                <div class="empty-state">
                  <i data-lucide="inbox"></i>
                  <h3>لا توجد بيانات</h3>
                  <p>لا توجد سجلات في هذه الفترة</p>
                </div>
              ` : `
                <table>
                  <thead>
                    <tr>${table.columns.map(c => `<th>${Refad.escapeHtml(c)}</th>`).join('')}</tr>
                  </thead>
                  <tbody>
                    ${table.rows.slice(0, 500).map(row => `
                      <tr>${row.map(cell => `<td>${cell}</td>`).join('')}</tr>
                    `).join('')}
                  </tbody>
                </table>
              `}
            </div>
          </div>
        ` : '';
        const additionalTablesHtml = additionalTables.map(extraTable => `
          <div class="table-wrap">
            <div class="table-header">
              <h3><i data-lucide="${extraTable.icon}"></i> ${Refad.escapeHtml(extraTable.title)}</h3>
              <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
                ${extraTable.action && extraTable.rows.length
                  ? `<button type="button" class="btn btn-primary btn-sm" data-report-action="${Refad.escapeHtml(extraTable.action.key)}"><i data-lucide="shopping-cart"></i> ${Refad.escapeHtml(extraTable.action.label)}</button>`
                  : ''}
                <span style="font-size:12px;color:var(--text-muted);font-weight:600;">${extraTable.rows.length} صنف</span>
              </div>
            </div>
            <div class="table-scroll">
              ${extraTable.rows.length === 0 ? `
                <div class="empty-state">
                  <i data-lucide="check-circle-2"></i>
                  <h3>${Refad.escapeHtml(extraTable.emptyTitle || 'لا توجد بيانات')}</h3>
                  <p>${Refad.escapeHtml(extraTable.emptyMessage || 'لا توجد سجلات حالياً.')}</p>
                </div>
              ` : `
                <table>
                  <thead><tr>${extraTable.columns.map(column => `<th>${Refad.escapeHtml(column)}</th>`).join('')}</tr></thead>
                  <tbody>${extraTable.rows.slice(0, 500).map(row => `<tr>${row.map(cell => `<td>${cell}</td>`).join('')}</tr>`).join('')}</tbody>
                </table>
              `}
            </div>
          </div>
        `).join('');

        content.innerHTML = `
          <div class="summary-cards">${cardsHtml}</div>
          ${chartsHtml}
          ${tableHtml}
          ${additionalTablesHtml}
        `;

        if (window.lucide) lucide.createIcons();
      }

      // ============================================================
      // 18) Chart options helpers
      // ============================================================
      function getTextColor() {
        return Refad.theme.get() === 'dark' ? '#f1f5f9' : '#0f172a';
      }
      function getGridColor() {
        return Refad.theme.get() === 'dark' ? 'rgba(255,255,255,0.08)' : 'rgba(0,0,0,0.06)';
      }

      function getChartOptions() {
        return {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: {
              position: 'top',
              labels: {
                font: { family: 'Cairo', size: 11, weight: '600' },
                color: getTextColor(),
                padding: 12,
                boxWidth: 12,
                usePointStyle: true
              }
            },
            tooltip: {
              rtl: true,
              textDirection: 'rtl',
              backgroundColor: Refad.theme.get() === 'dark' ? '#0f2137' : '#0B2C4D',
              padding: 12,
              cornerRadius: 10,
              titleFont: { family: 'Cairo', size: 12, weight: '700' },
              bodyFont: { family: 'Cairo', size: 12 },
              callbacks: {
                label: (ctx) => ` ${ctx.dataset.label}: ${Refad.format.money(ctx.parsed.y ?? ctx.parsed)}`
              }
            }
          },
          scales: {
            y: {
              beginAtZero: true,
              grid: { color: getGridColor(), drawBorder: false },
              ticks: { color: getTextColor(), font: { family: 'Cairo', size: 10 } }
            },
            x: {
              grid: { display: false },
              ticks: { color: getTextColor(), font: { family: 'Cairo', size: 10 }, maxRotation: 0, autoSkip: true, maxTicksLimit: 12 }
            }
          }
        };
      }

      function getBarOptions() {
        return {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { display: false },
            tooltip: {
              rtl: true,
              textDirection: 'rtl',
              backgroundColor: Refad.theme.get() === 'dark' ? '#0f2137' : '#0B2C4D',
              padding: 12,
              cornerRadius: 10,
              titleFont: { family: 'Cairo', size: 12, weight: '700' },
              bodyFont: { family: 'Cairo', size: 12 },
              callbacks: {
                label: (ctx) => ` ${Refad.format.money(ctx.parsed.x ?? ctx.parsed.y ?? ctx.parsed)}`
              }
            }
          },
          scales: {
            y: {
              beginAtZero: true,
              grid: { color: getGridColor(), drawBorder: false },
              ticks: { color: getTextColor(), font: { family: 'Cairo', size: 10 } }
            },
            x: {
              grid: { display: false },
              ticks: { color: getTextColor(), font: { family: 'Cairo', size: 10 }, maxRotation: 45, autoSkip: false }
            }
          }
        };
      }

      // ============================================================
      // 19) Export / Print
      // ============================================================
      function exportCurrentReport() {
        const content = document.getElementById('reportContent');
        const tables = Array.from(content.querySelectorAll('table'));
        if (!tables.length) {
          Refad.toast.warning('لا توجد بيانات للتصدير');
          return;
        }

        const wb = XLSX.utils.book_new();
        tables.forEach((table, index) => {
          const title = table.closest('.table-wrap')?.querySelector('.table-header h3')?.textContent?.trim();
          const sheetName = (title || (index ? `Report ${index + 1}` : 'Report')).replace(/[\\/?*[\]:]/g, '').slice(0, 31) || `Report ${index + 1}`;
          const ws = XLSX.utils.table_to_sheet(table);
          XLSX.utils.book_append_sheet(wb, ws, sheetName);
        });
        const { from, to } = getDateRange();
        XLSX.writeFile(wb, `report-${state.currentReport}-${from}-${to}.xlsx`);
        Refad.toast.success('تم التصدير');
      }

      function printCurrentReport() {
        window.print();
      }

      // ============================================================
      // 20) Events
      // ============================================================
      function bindEvents() {
        document.getElementById('exportBtn').addEventListener('click', exportCurrentReport);
        document.getElementById('printBtn').addEventListener('click', printCurrentReport);
        document.getElementById('reportContent').addEventListener('click', event => {
          const button = event.target.closest('[data-report-action="purchase-suggestions"]');
          if (!button) return;
          if (!Refad.Session.has('purchases.create')) {
            Refad.toast.error('ليس لديك صلاحية إنشاء طلب شراء');
            return;
          }
          if (!state.purchaseRecommendations.length) {
            Refad.toast.info('لا توجد أصناف مقترحة لإعادة الطلب');
            return;
          }
          try {
            sessionStorage.setItem('refad_purchase_suggestions', JSON.stringify({
              companyId: session.company_id,
              createdAt: Date.now(),
              items: state.purchaseRecommendations
            }));
            window.location.href = 'purchase-request-form.html?smart=1';
          } catch (error) {
            console.error('[Reports] Could not stage purchase recommendations:', error);
            Refad.toast.error('تعذّر تجهيز مسودة طلب الشراء: ' + error.message);
          }
        });
      }

      // ============================================================
      // 21) Init
      // ============================================================
      async function init() {
        buildSidebar();
        fillUser();
        setupTheme();
        setupSidebarMobile();
        setupUserMenu();
        setupNotifBtn();
        setupReportSelector();
        setupPeriodChips();
        bindEvents();

        updateDateDisplay();
        await loadCurrentReport();

        Refad.registerServiceWorker();
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }

      console.log('%c[Refad] Reports ready', 'color:#14B8A6;font-weight:bold');

    })();
  </script>
