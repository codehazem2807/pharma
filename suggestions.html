<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>اقتراحات الطلب | Pharma Cloud</title><style>@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap');:root{--p:#0d6e6e;--a:#12a3a3;--bg:#f2f6f8;--ink:#183238;--muted:#6d8085;--line:#dce7ea;--bad:#bf4141}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px Cairo,Arial}.shell{display:flex;min-height:100vh}.side{position:fixed;right:0;top:0;bottom:0;width:244px;background:var(--p);padding:22px 13px;color:#fff;z-index:20;transition:.25s}.brand{font-size:20px;font-weight:800;padding:0 12px 22px;border-bottom:1px solid #ffffff2b}.brand small{display:block;font-size:11px;font-weight:400;opacity:.72}.nav{padding-top:15px}.nav a{display:block;text-decoration:none;color:#d9f5f5;padding:10px 12px;margin:3px 0;border-radius:9px}.nav a:hover,.nav a.active{background:#ffffff25;color:white}.side-foot{position:absolute;bottom:20px;right:13px;left:13px}.signout{width:100%;padding:10px;border-radius:8px;border:1px solid #ffffff35;background:#ffffff16;color:#fff;font:inherit;cursor:pointer}.main{margin-right:244px;width:calc(100% - 244px)}.top{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;padding:0 29px;position:sticky;top:0;z-index:10}.who{display:flex;gap:9px;align-items:center}.avatar{display:grid;place-items:center;border-radius:50%;width:38px;height:38px;background:#d9f4f4;color:var(--p);font-weight:800}.who b,.who small{display:block}.who small{font-size:11px;color:var(--muted)}.hamb{display:none;font-size:25px;border:0;background:none;color:var(--p)}.page{max-width:1500px;margin:auto;padding:28px}.title{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px}.title h1{font-size:24px;margin:0}.title p{margin:4px 0;color:var(--muted)}button,.btn{font:inherit;cursor:pointer;border:0;border-radius:8px;padding:10px 14px}.btn{display:inline-block;text-decoration:none}.primary{background:var(--a);color:#fff}.secondary{background:#e0f2f2;color:var(--p)}.danger{background:#fff0f0;color:var(--bad)}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-bottom:16px}.card,.panel{background:white;border:1px solid var(--line);border-radius:13px;box-shadow:0 2px 8px #17434a08}.card{padding:15px}.card small{color:var(--muted)}.card b{display:block;color:var(--p);font-size:21px;margin-top:5px}.panel{padding:17px}.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:10px}.toolbar span{color:var(--muted);font-size:12px}table{width:100%;border-collapse:collapse}th,td{text-align:right;padding:11px 8px;border-bottom:1px solid var(--line);font-size:12px}th{color:var(--muted);font-size:11px}.urgency{color:#b45b11;font-weight:700}.zero{color:var(--bad);font-weight:700}.badge{font-size:10px;padding:3px 8px;border-radius:99px;background:#e0f3f2;color:var(--p)}.empty{padding:32px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:10px}.modal-back{display:none;position:fixed;inset:0;background:#001a1d80;z-index:50;align-items:center;justify-content:center;padding:15px}.modal-back.open{display:flex}.modal{background:#fff;width:min(650px,100%);max-height:90vh;overflow:auto;border-radius:14px;padding:21px}.modal h2{margin:0 0 15px;font-size:19px}.close{float:left;background:transparent;color:var(--muted);font-size:22px;padding:0}label{display:block;font-size:12px;color:var(--muted);margin:12px 0 5px}select,input{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:#fff;font:inherit}.modal-row{display:grid;grid-template-columns:1fr 110px;gap:9px;align-items:end}.selected{background:#f2fbfb;border:1px solid #cbe8e7;border-radius:9px;padding:10px;margin:12px 0;max-height:230px;overflow:auto}.selected div{padding:5px 0;border-bottom:1px solid #d8eeee;font-size:12px}.modal-actions{display:flex;justify-content:flex-start;gap:8px;margin-top:17px}.toast{position:fixed;z-index:70;bottom:22px;left:22px;background:#183238;color:#fff;padding:12px 16px;border-radius:8px;opacity:0;transform:translateY(15px);transition:.2s}.toast.show{opacity:1;transform:none}.toast.error{background:var(--bad)}.veil{display:none}@media(max-width:900px){.side{transform:translateX(100%)}.side.open{transform:none;box-shadow:-5px 0 18px #0004}.main{margin:0;width:100%}.hamb{display:block}.veil.open{display:block;position:fixed;inset:0;background:#0005;z-index:19}.page{padding:20px}.summary{grid-template-columns:repeat(2,1fr)}}@media(max-width:570px){.page{padding:14px}.top{height:63px;padding:0 15px}.title h1{font-size:20px}.title{align-items:start}.title .primary{padding:8px}.table-wrap{overflow:auto}.summary{gap:8px}.modal-row{grid-template-columns:1fr}.card b{font-size:18px}}</style></head>
<body><div class="shell"><aside class="side" id="side"><div class="brand">Pharma Cloud<small>نظام إدارة الصيدليات</small></div><nav class="nav" id="nav"></nav><div class="side-foot"><button class="signout" onclick="signout()">تسجيل الخروج</button></div></aside><div class="veil" id="veil" onclick="toggleMenu()"></div><main class="main"><header class="top"><button class="hamb" onclick="toggleMenu()">☰</button><span></span><div class="who"><div class="avatar" id="initial"></div><div><b id="userName"></b><small>مدير المنشأة</small></div></div></header><section class="page"><div class="title"><div><h1>اقتراحات الطلب الذكية</h1><p>تقدير احتياج 12 يوماً: 7 أيام توريد + 5 أيام هامش أمان</p></div><button class="primary" id="bulkBtn" onclick="openOrder()">طلب المحدد</button></div><div class="summary" id="summary"></div><section class="panel"><div class="toolbar"><b>الأصناف حسب أولوية التغطية</b><span>المبيعات المحللة: آخر 30 يوماً</span></div><div class="table-wrap"><table><thead><tr><th><input id="all" type="checkbox" onchange="pickAll(this.checked)"></th><th>الصنف</th><th>المبيعات</th><th>المتاح</th><th>المتوسط اليومي</th><th>تغطية المخزون</th><th>المقترح</th><th>إجراء</th></tr></thead><tbody id="rows"></tbody></table></div></section></section></main></div><div class="modal-back" id="modal"><div class="modal"><button class="close" onclick="closeModal()">×</button><h2>إنشاء طلب شراء</h2><form onsubmit="submitOrder(event)"><label>المنشأة المستهدفة</label><select id="target" required></select><label>الأصناف والكميات</label><div class="selected" id="selected"></div><label>تاريخ التوريد المتوقع (اختياري)</label><input id="expected" type="date"><div class="modal-actions"><button class="primary">إرسال الطلب</button><button type="button" class="secondary" onclick="closeModal()">إلغاء</button></div></form></div></div><div class="toast" id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const URL='https://jlpjqwlwwuknabfekbth.supabase.co',KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJIUzI1NiIsInJlZiI6ImpscGpxd2x3d3VrbmFiZmVrYnRoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAyOTYxNTAsImV4cCI6MjEwNTg3MjE1MH0.8tcgNJnwGYbKlNZx3899k-h6E7dKWxl2vM9uD3pPFZ0';
let session;try{session=JSON.parse(localStorage.getItem('pharma_session')||'null')}catch(e){}if(!session)location.replace('index.html');else if(session.role==='super')location.replace('tenants.html');else if(session.role!=='admin')location.replace('dashboard.html');const db=supabase.createClient(URL,KEY),$=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));let suggestions=[],tenants=[],orders=[];
function menu(){const l=[['dashboard.html','لوحة التحكم'],['pos.html','نقطة البيع'],['purchase.html','المشتريات'],['products.html','الأصناف'],['stock.html','المخزون'],['ledger.html','الحسابات'],['suggestions.html','اقتراحات الطلب'],['orders.html','الطلبات'],['directory.html','دليل المنشآت'],['chat.html','المحادثات'],['users.html','المستخدمون']];$('#nav').innerHTML=l.map(x=>`<a class="${x[0]==='suggestions.html'?'active':''}" href="${x[0]}">${x[1]}</a>`).join('')}function toggleMenu(){$('#side').classList.toggle('open');$('#veil').classList.toggle('open')}function signout(){localStorage.removeItem('pharma_session');location.replace('index.html')}function toast(t,b=false){let e=$('#toast');e.textContent=t;e.className='toast show '+(b?'error':'');setTimeout(()=>e.className='toast',3500)}function n(v){return +v||0}function num(v){return new Intl.NumberFormat('ar-SA',{maximumFractionDigits:2}).format(n(v))}
function parse(v){if(typeof v!=='string')return v;try{return JSON.parse(v)}catch(e){return null}}function lines(invoice){let roots=['items','items_json','invoice_items','invoiceItems','order_items','lines','line_items','lineItems','details','details_json','products','products_json','cart'];let out=[];function walk(v,depth=0){v=parse(v);if(!v||depth>5)return;if(Array.isArray(v)){v.forEach(x=>walk(x,depth+1));return}if(typeof v!=='object')return;let pid=v.product_id??v.productId??v.product?.id??v.product?.product_id??(typeof v.product==='string'?v.product:null),qty=v.quantity??v.qty??v.count??v.units??v.amount;if(pid&&qty!==undefined)out.push({id:String(pid),qty:n(qty)});else roots.forEach(k=>k in v&&walk(v[k],depth+1))}roots.forEach(k=>walk(invoice[k]));return out}
function pickAll(yes){document.querySelectorAll('.pick').forEach(x=>x.checked=yes)}function render(){let need=suggestions.filter(x=>x.suggested>0),urgent=need.filter(x=>x.coverage<7);$('#summary').innerHTML=[['أصناف محللة',suggestions.length],['تحتاج طلباً',need.length],['حرجة (أقل من 7 أيام)',urgent.length],['إجمالي وحدات مقترحة',need.reduce((a,x)=>a+x.suggested,0)]].map(x=>`<div class="card"><small>${x[0]}</small><b>${num(x[1])}</b></div>`).join('');$('#rows').innerHTML=suggestions.map((x,i)=>`<tr><td><input class="pick" type="checkbox" value="${i}" ${x.suggested?'checked':''} ${x.suggested?'':'disabled'}></td><td><b>${esc(x.name)}</b><br><small>${esc(x.sku||'')}</small></td><td>${num(x.sales)}</td><td>${num(x.stock)}</td><td>${num(x.avg)}</td><td class="${x.coverage<7?'urgency':''}">${x.avg?num(x.coverage)+' يوم':'—'}</td><td class="${x.suggested?'zero':''}">${num(x.suggested)}</td><td>${x.suggested?`<button class="secondary" onclick="openOrder(${i})">طلب</button>`:'—'}</td></tr>`).join('')||'<tr><td colspan="8"><div class="empty">لا توجد أصناف نشطة لاحتساب الاقتراحات.</div></td></tr>'}
function openOrder(i){let selected=Number.isInteger(i)?[suggestions[i]]:Array.from(document.querySelectorAll('.pick:checked')).map(e=>suggestions[+e.value]).filter(Boolean);if(!selected.length){toast('اختر صنفاً واحداً على الأقل',true);return}$('#target').innerHTML='<option value="">اختر منشأة نشطة</option>'+tenants.map(t=>`<option value="${t.id}">${esc(t.name)} — ${t.type==='company'?'شركة':'صيدلية'}</option>`).join('');$('#selected').innerHTML=selected.map(x=>`<div data-id="${x.id}"><b>${esc(x.name)}</b><span> — ${num(x.suggested)} ${esc(x.unit||'وحدة')}</span><input type="hidden" value="${x.suggested}"></div>`).join('');$('#modal').classList.add('open')}function closeModal(){$('#modal').classList.remove('open')}
async function submitOrder(e){e.preventDefault();const targetId=$('#target').value,target=tenants.find(x=>x.id===targetId);if(!target){toast('اختر المنشأة المستهدفة',true);return}const items=Array.from($('#selected').querySelectorAll('div')).map(d=>{let x=suggestions.find(y=>y.id===d.dataset.id);return {product_id:x.id,productId:x.id,name:x.name,quantity:x.suggested,qty:x.suggested,unit_price:n(x.purchase_price)}});if(!items.length)return;let max=orders.reduce((m,o)=>Math.max(m,+(String(o.order_no||'').match(/(\d+)$/)||[,0])[1]),0),orderNo='PO-'+String(max+1).padStart(4,'0'),total=items.reduce((s,x)=>s+x.quantity*x.unit_price,0);let extended={tenant_id:session.tenantId,order_no:orderNo,supplier_name:target.name,status:'sent',total,expected_date:$('#expected').value||null,created_by:session.userId,target_tenant_id:target.id,supplier_tenant_id:target.id,items,order_items:items};let r=await db.from('purchase_orders').insert(extended).select().single();if(r.error){let core={tenant_id:session.tenantId,order_no:orderNo,supplier_name:target.name,status:'sent',total,expected_date:$('#expected').value||null,created_by:session.userId};r=await db.from('purchase_orders').insert(core).select().single()}if(r.error){toast('تعذر إنشاء الطلب: '+r.error.message,true);return}orders.unshift(r.data);closeModal();toast('تم إرسال '+orderNo+' إلى '+target.name)}
async function load(){menu();$('#userName').textContent=session.name||'مدير';$('#initial').textContent=(session.name||'م')[0];const since=new Date();since.setDate(since.getDate()-30);try{const [p,b,iv,t,o]=await Promise.all([db.from('products').select('id,name,sku,unit,purchase_price,reorder_level').eq('tenant_id',session.tenantId).eq('active',true),db.from('batches').select('product_id,quantity').eq('tenant_id',session.tenantId),db.from('invoices').select('*').eq('tenant_id',session.tenantId).gte('created_at',since.toISOString()),db.from('tenants').select('id,name,type').eq('active',true).neq('id',session.tenantId).order('name'),db.from('purchase_orders').select('*').eq('tenant_id',session.tenantId)]);for(const r of [p,b,iv,t,o])if(r.error)throw r.error;tenants=t.data||[];orders=o.data||[];let sold={},stock={};(iv.data||[]).filter(x=>x.status!=='cancelled').forEach(inv=>lines(inv).forEach(x=>sold[x.id]=(sold[x.id]||0)+x.qty));(b.data||[]).forEach(x=>stock[x.product_id]=(stock[x.product_id]||0)+n(x.quantity));suggestions=(p.data||[]).map(x=>{let sales=sold[x.id]||0,avail=stock[x.id]||0,avg=sales/30,suggested=Math.max(0,Math.ceil(avg*12-avail));return {...x,sales,stock:avail,avg,suggested,coverage:avg?avail/avg:Infinity}}).sort((a,b)=>a.coverage-b.coverage||b.suggested-a.suggested);render()}catch(err){console.error(err);toast('تعذر تحميل اقتراحات الطلب: '+(err.message||''),true);$('#rows').innerHTML='<tr><td colspan="8"><div class="empty">تعذر الوصول إلى البيانات.</div></td></tr>'}}
load();
</script></body></html>
