<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>دليل المنشآت | Pharma Cloud</title><style>@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap');:root{--p:#0d6e6e;--a:#12a3a3;--bg:#f2f6f8;--ink:#183238;--muted:#6d8085;--line:#dce7ea;--bad:#bf4141}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px Cairo,Arial}.shell{display:flex;min-height:100vh}.side{position:fixed;right:0;top:0;bottom:0;width:244px;background:var(--p);padding:22px 13px;color:#fff;z-index:20;transition:.25s}.brand{font-size:20px;font-weight:800;padding:0 12px 22px;border-bottom:1px solid #ffffff2b}.brand small{display:block;font-size:11px;font-weight:400;opacity:.72}.nav{padding-top:15px}.nav a{display:block;text-decoration:none;color:#d9f5f5;padding:10px 12px;margin:3px 0;border-radius:9px}.nav a:hover,.nav a.active{background:#ffffff25;color:white}.side-foot{position:absolute;bottom:20px;right:13px;left:13px}.signout{width:100%;padding:10px;border-radius:8px;border:1px solid #ffffff35;background:#ffffff16;color:#fff;font:inherit;cursor:pointer}.main{margin-right:244px;width:calc(100% - 244px)}.top{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;padding:0 29px;position:sticky;top:0;z-index:10}.who{display:flex;gap:9px;align-items:center}.avatar{display:grid;place-items:center;border-radius:50%;width:38px;height:38px;background:#d9f4f4;color:var(--p);font-weight:800}.who b,.who small{display:block}.who small{font-size:11px;color:var(--muted)}.hamb{display:none;font-size:25px;border:0;background:none;color:var(--p)}.page{max-width:1500px;margin:auto;padding:28px}.title{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px}.title h1{font-size:24px;margin:0}.title p{margin:4px 0;color:var(--muted)}.search{background:white;border:1px solid var(--line);border-radius:10px;padding:11px 14px;width:min(390px,100%);font:inherit}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.card{background:white;border:1px solid var(--line);border-radius:13px;padding:18px;box-shadow:0 2px 8px #17434a08}.type{font-size:11px;color:var(--p);background:#e1f4f3;border-radius:99px;padding:3px 9px;display:inline-block}.card h2{font-size:17px;margin:11px 0 7px}.detail{color:var(--muted);font-size:12px;margin:4px 0}.actions{display:flex;gap:7px;margin-top:15px;flex-wrap:wrap}button,.btn{font:inherit;cursor:pointer;border:0;border-radius:8px;padding:9px 12px}.btn{display:inline-block;text-decoration:none}.primary{background:var(--a);color:#fff}.secondary{background:#e0f2f2;color:var(--p)}.empty{grid-column:1/-1;padding:36px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:11px}.modal-back{display:none;position:fixed;inset:0;background:#001a1d80;z-index:50;align-items:center;justify-content:center;padding:15px}.modal-back.open{display:flex}.modal{background:#fff;width:min(700px,100%);max-height:90vh;overflow:auto;border-radius:14px;padding:21px}.modal h2{margin:0 0 15px;font-size:19px}.close{float:left;background:transparent;color:var(--muted);font-size:22px;padding:0}label{display:block;font-size:12px;color:var(--muted);margin:12px 0 5px}select,input{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:#fff;font:inherit}.item{display:grid;grid-template-columns:2fr 90px 90px 35px;gap:7px;align-items:end;margin:8px 0;padding:8px;background:#f7fbfb;border-radius:8px}.item button{padding:8px;background:#fff0f0;color:var(--bad)}.modal-actions{display:flex;gap:8px;margin-top:17px}.toast{position:fixed;z-index:70;bottom:22px;left:22px;background:#183238;color:#fff;padding:12px 16px;border-radius:8px;opacity:0;transform:translateY(15px);transition:.2s}.toast.show{opacity:1;transform:none}.toast.error{background:var(--bad)}.veil{display:none}@media(max-width:950px){.side{transform:translateX(100%)}.side.open{transform:none;box-shadow:-5px 0 18px #0004}.main{margin:0;width:100%}.hamb{display:block}.veil.open{display:block;position:fixed;inset:0;background:#0005;z-index:19}.page{padding:20px}.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:570px){.page{padding:14px}.top{height:63px;padding:0 15px}.title{align-items:start;flex-direction:column}.title h1{font-size:20px}.search{width:100%}.grid{grid-template-columns:1fr}.item{grid-template-columns:1fr 1fr 1fr 35px}.modal{padding:16px}}</style></head>
<body><div class="shell"><aside class="side" id="side"><div class="brand">Pharma Cloud<small>نظام إدارة الصيدليات</small></div><nav class="nav" id="nav"></nav><div class="side-foot"><button class="signout" onclick="signout()">تسجيل الخروج</button></div></aside><div class="veil" id="veil" onclick="toggleMenu()"></div><main class="main"><header class="top"><button class="hamb" onclick="toggleMenu()">☰</button><span></span><div class="who"><div class="avatar" id="initial"></div><div><b id="userName"></b><small id="roleText"></small></div></div></header><section class="page"><div class="title"><div><h1>دليل المنشآت</h1><p>تواصل مع الشركات والصيدليات النشطة في المنصة</p></div><input class="search" id="search" oninput="render()" placeholder="ابحث بالاسم أو النوع أو الهاتف أو العنوان"></div><div class="grid" id="cards"></div></section></main></div><div class="modal-back" id="orderModal"><div class="modal"><button class="close" onclick="closeModal()">×</button><h2>إنشاء طلب إلى <span id="targetName"></span></h2><form onsubmit="submitOrder(event)"><input id="targetId" type="hidden"><label>تاريخ التوريد المتوقع (اختياري)</label><input type="date" id="expected"><label>الأصناف من منشأتك</label><div id="items"></div><button type="button" class="secondary" onclick="addItem()">+ إضافة صنف</button><div class="modal-actions"><button class="primary">إرسال الطلب</button><button type="button" class="secondary" onclick="closeModal()">إلغاء</button></div></form></div></div><div class="toast" id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const URL='https://jlpjqwlwwuknabfekbth.supabase.co',KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJIUzI1NiIsInJlZiI6ImpscGpxd2x3d3VrbmFiZmVrYnRoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAyOTYxNTAsImV4cCI6MjEwNTg3MjE1MH0.8tcgNJnwGYbKlNZx3899k-h6E7dKWxl2vM9uD3pPFZ0';let session;try{session=JSON.parse(localStorage.getItem('pharma_session')||'null')}catch(e){}if(!session)location.replace('index.html');const db=supabase.createClient(URL,KEY),$=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));let tenants=[],products=[],orders=[];
function menu(){let l=session.role==='super'?[['tenants.html','المنشآت'],['users.html','المستخدمون'],['chat.html','المحادثات'],['directory.html','دليل المنشآت']]:session.role==='admin'?[['dashboard.html','لوحة التحكم'],['pos.html','نقطة البيع'],['purchase.html','المشتريات'],['products.html','الأصناف'],['stock.html','المخزون'],['ledger.html','الحسابات'],['suggestions.html','اقتراحات الطلب'],['orders.html','الطلبات'],['directory.html','دليل المنشآت'],['chat.html','المحادثات'],['users.html','المستخدمون']]:[['dashboard.html','لوحة التحكم'],['pos.html','نقطة البيع'],['products.html','الأصناف'],['stock.html','المخزون'],['ledger.html','الحسابات'],['directory.html','دليل المنشآت'],['chat.html','المحادثات']];$('#nav').innerHTML=l.map(x=>`<a class="${x[0]==='directory.html'?'active':''}" href="${x[0]}">${x[1]}</a>`).join('')}function toggleMenu(){$('#side').classList.toggle('open');$('#veil').classList.toggle('open')}function signout(){localStorage.removeItem('pharma_session');location.replace('index.html')}function toast(t,b=false){let e=$('#toast');e.textContent=t;e.className='toast show '+(b?'error':'');setTimeout(()=>e.className='toast',3500)}function money(v){return new Intl.NumberFormat('ar-SA',{maximumFractionDigits:2}).format(+v||0)+' ر.س'}
function render(){let q=$('#search').value.trim().toLowerCase(),list=tenants.filter(t=>[t.name,t.type,t.phone,t.address].join(' ').toLowerCase().includes(q));$('#cards').innerHTML=list.map(t=>`<article class="card"><span class="type">${t.type==='company'?'شركة توزيع':'صيدلية'}</span><h2>${esc(t.name)}</h2><div class="detail">الهاتف: ${esc(t.phone||'غير مسجل')}</div><div class="detail">العنوان: ${esc(t.address||'غير مسجل')}</div><div class="actions"><a class="btn primary" href="chat.html?tenant=${encodeURIComponent(t.id)}">محادثة</a>${session.role==='admin'?`<button class="secondary" onclick="openOrder('${t.id}')">طلب شراء</button>`:''}</div></article>`).join('')||'<div class="empty">لا توجد منشآت مطابقة للبحث.</div>'}
function openOrder(id){let t=tenants.find(x=>x.id===id);if(!t)return;$('#targetId').value=id;$('#targetName').textContent=t.name;$('#items').innerHTML='';addItem();$('#orderModal').classList.add('open')}function closeModal(){$('#orderModal').classList.remove('open')}function addItem(){let row=document.createElement('div');row.className='item';row.innerHTML=`<select class="p" required><option value="">اختر الصنف</option>${products.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select><input class="q" type="number" min="1" step="1" required placeholder="الكمية"><input class="price" type="number" min="0" step=".01" placeholder="السعر"><button type="button" onclick="this.parentElement.remove()">×</button>`;$('#items').append(row)}
async function submitOrder(e){e.preventDefault();let target=tenants.find(x=>x.id===$('#targetId').value);let items=Array.from(document.querySelectorAll('.item')).map(r=>{let p=products.find(x=>x.id===r.querySelector('.p').value),q=+r.querySelector('.q').value,price=+r.querySelector('.price').value||+(p?.purchase_price||0);return p&&q>0?{product_id:p.id,productId:p.id,name:p.name,quantity:q,qty:q,unit_price:price,price}:null}).filter(Boolean);if(!target||!items.length){toast('أضف صنفاً واحداً على الأقل',true);return}let max=orders.reduce((m,x)=>Math.max(m,+(String(x.order_no||'').match(/(\d+)$/)||[,0])[1]),0),order_no='PO-'+String(max+1).padStart(4,'0'),total=items.reduce((s,x)=>s+x.qty*x.price,0),base={tenant_id:session.tenantId,order_no,supplier_name:target.name,status:'sent',total,expected_date:$('#expected').value||null,created_by:session.userId};let r=await db.from('purchase_orders').insert({...base,target_tenant_id:target.id,supplier_tenant_id:target.id,items,order_items:items}).select().single();if(r.error)r=await db.from('purchase_orders').insert(base).select().single();if(r.error){toast('تعذر إنشاء الطلب: '+r.error.message,true);return}orders.push(r.data);closeModal();toast('تم إرسال '+order_no+' إلى '+target.name)}
async function load(){menu();$('#userName').textContent=session.name||'مستخدم';$('#initial').textContent=(session.name||'م')[0];$('#roleText').textContent=session.role==='super'?'مدير المنصة':session.role==='admin'?'مدير المنشأة':'مستخدم';try{let query=db.from('tenants').select('id,name,type,phone,address').eq('active',true).order('name');if(session.tenantId)query=query.neq('id',session.tenantId);let [tr,pr,orr]=await Promise.all([query,session.role==='admin'?db.from('products').select('id,name,purchase_price').eq('tenant_id',session.tenantId).eq('active',true):Promise.resolve({data:[]}),session.role==='admin'?db.from('purchase_orders').select('order_no').eq('tenant_id',session.tenantId):Promise.resolve({data:[]})]);if(tr.error||pr.error||orr.error)throw tr.error||pr.error||orr.error;tenants=tr.data||[];products=pr.data||[];orders=orr.data||[];render()}catch(err){console.error(err);toast('تعذر تحميل الدليل: '+(err.message||''),true);$('#cards').innerHTML='<div class="empty">تعذر الوصول إلى بيانات الدليل.</div>'}}
load();
</script></body></html>
