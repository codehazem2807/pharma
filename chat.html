  <div class="lightbox" id="lightbox">
    <button class="lightbox-close" id="lightboxClose"><i data-lucide="x"></i></button>
    <img id="lightboxImg" src="" alt="">
  </div>
    <script src="refad-core.js"></script>
  <script src="refad-auth.js"></script>
  <script>
    (function () {
      'use strict';

      // ============================================================
      // Helpers محلية
      // ============================================================
      function formatFileSize(bytes) {
        if (!bytes || bytes === 0 || isNaN(bytes)) return '0 B';
        const units = ['B', 'KB', 'MB', 'GB'];
        let i = 0;
        let size = Number(bytes);
        while (size >= 1024 && i < units.length - 1) {
          size /= 1024;
          i++;
        }
        return `${size.toFixed(1)} ${units[i]}`;
      }

      function getFileIcon(type, name) {
        const t = (type || '').toLowerCase();
        const n = (name || '').toLowerCase();

        if (t.startsWith('image/')) return 'image';
        if (t === 'application/pdf' || n.endsWith('.pdf')) return 'file-text';
        if (t.includes('word') || n.endsWith('.doc') || n.endsWith('.docx')) return 'file-text';
        if (t.includes('sheet') || t.includes('excel') || n.endsWith('.xls') || n.endsWith('.xlsx') || n.endsWith('.csv')) return 'file-spreadsheet';
        if (t.includes('zip') || t.includes('rar') || n.endsWith('.zip') || n.endsWith('.rar')) return 'file-archive';
        return 'file';
      }

      // ============================================================
      // Guard
      // ============================================================
      const session = Refad.Auth.guardPage('chat.use');
      if (!session) return;

      const companyId = parseInt(session.company_id, 10);
      const myUserId = parseInt(session.user_id, 10);

      // ============================================================
      // State
      // ============================================================
      const state = {
        conversations: [],
        usersMap: {},
        users: [],
        participantsMap: {},
        activeConvId: null,
        activeConv: null,
        messages: [],
        realtimeChannel: null,
        selectedUsers: new Set(),
        unreadMap: {},
        searchTerm: '',
        replyTo: null,
        isUserScrolledUp: false,
        pendingNewMsgs: 0
      };

      const EMOJIS = ['😀','😂','😍','🥰','😎','🤔','😅','😢','😡','🥳','👍','👎','👏','🙏','💪','🔥','✨','⭐','❤️','💔','🎉','🎁','💯','✅','❌','⚠️','📌','📎','📞','📧','💬','🕐','📅','🏥','💊','🩺','📊','📈','💰','💵','🛒','🚚','📦','⚡','🌟','🎯','🚀','🔔','👋','🤝'];

      // ============================================================
      // Sidebar
      // ============================================================
      const MENU = [
        { section: 'الرئيسية', items: [
          { label: 'لوحة التحكم', icon: 'layout-dashboard', href: 'dashboard.html' },
          { label: 'الشات', icon: 'message-circle', href: 'chat.html', permission: 'chat.use' },
          { label: 'الإشعارات', icon: 'bell', href: 'notifications.html', permission: 'notifications.view' }
        ]},
        { section: 'العمليات', items: [
          { label: 'الأصناف', icon: 'package', href: 'products.html', permission: 'products.view' },
          { label: 'المخزون', icon: 'warehouse', href: 'inventory.html', permission: 'inventory.view' },
          { label: 'طلبات الشراء', icon: 'clipboard-list', href: 'purchase-requests.html', permission: 'purchases.view' },
          { label: 'الاستلامات', icon: 'package-check', href: 'receipts.html', permission: 'purchases.receive' },
          { label: 'طلبات البيع', icon: 'shopping-cart', href: 'sales-orders.html', permission: 'sales.view' },
          { label: 'نقطة البيع', icon: 'scan-barcode', href: 'pos.html', permission: 'sales.pos', badge: 'POS', badgeClass: 'teal' },
          { label: 'الفواتير', icon: 'receipt', href: 'invoices.html', permission: 'sales.view' }
        ]},
        { section: 'الأطراف', items: [
          { label: 'الموردين', icon: 'truck', href: 'suppliers.html', permission: 'suppliers.view' },
          { label: 'العملاء', icon: 'users', href: 'customers.html', permission: 'customers.view' }
        ]},
        { section: 'المخزون', items: [
          { label: 'الجرد', icon: 'clipboard-check', href: 'stocktake.html', permission: 'inventory.stocktake' },
          { label: 'التسويات', icon: 'sliders-horizontal', href: 'adjustments.html', permission: 'inventory.adjust' }
        ]},
        { section: 'الموارد البشرية', items: [
          { label: 'الموظفين', icon: 'user-cog', href: 'employees.html', permission: 'employees.view' },
          { label: 'الصلاحيات', icon: 'shield-check', href: 'permissions.html', permission: 'permissions.manage' },
          { label: 'الحضور', icon: 'calendar-check', href: 'attendance.html', permission: 'attendance.view' },
          { label: 'الرواتب', icon: 'wallet', href: 'payroll.html', permission: 'payroll.view' }
        ]},
        { section: 'المالية', items: [
          { label: 'المصاريف', icon: 'banknote', href: 'expenses.html', permission: 'expenses.view' },
          { label: 'التقارير', icon: 'bar-chart-3', href: 'reports.html', permission: 'reports.view' }
        ]},
        { section: 'النظام', items: [
          { label: 'إعدادات الشركة', icon: 'settings', href: 'company-settings.html', permission: 'settings.view' },
          { label: 'شاشة الأدمن', icon: 'shield', href: 'admin.html', permission: 'admin.full', badge: 'Admin', badgeClass: 'gold' }
        ]}
      ];

      function buildSidebar() {
        const nav = document.getElementById('sidebarNav');
        const frag = document.createDocumentFragment();
        MENU.forEach(group => {
          const allowed = group.items.filter(it => !it.permission || Refad.Session.has(it.permission));
          if (!allowed.length) return;
          frag.appendChild(Refad.el('div', { class: 'nav-section' }, group.section));
          allowed.forEach(item => {
            const a = Refad.el('a', {
              href: item.href,
              class: 'nav-item' + (item.href === 'chat.html' ? ' active' : '')
            });
            a.innerHTML = `<i data-lucide="${item.icon}"></i><span>${Refad.escapeHtml(item.label)}</span>${item.badge ? `<span class="badge ${item.badgeClass || ''}">${item.badge}</span>` : ''}`;
            frag.appendChild(a);
          });
        });
        nav.innerHTML = '';
        nav.appendChild(frag);
        if (window.lucide) lucide.createIcons();
      }

      // ============================================================
      // UI helpers
      // ============================================================
      function fillUser() {
        const av = document.getElementById('userAvatar');
        const initial = (session.full_name || '؟').trim().charAt(0);
        if (session.avatar_url) av.innerHTML = `<img src="${Refad.escapeHtml(session.avatar_url)}" alt="">`;
        else av.textContent = initial;
        document.getElementById('userName').textContent = session.full_name;
        document.getElementById('userRole').textContent = Refad.Session.has('company.owner') ? 'صاحب الشركة' : 'موظف';
      }

      function setupTheme() {
        const btn = document.getElementById('themeToggle');
        const icon = document.getElementById('themeIcon');
        const refresh = () => {
          const isDark = Refad.theme.get() === 'dark';
          icon.setAttribute('data-lucide', isDark ? 'sun' : 'moon');
          if (window.lucide) lucide.createIcons();
        };
        refresh();
        btn.addEventListener('click', () => { Refad.theme.toggle(); refresh(); });
      }

      function setupSidebarMobile() {
        const sb = document.getElementById('sidebar');
        const ov = document.getElementById('overlay');
        document.getElementById('menuToggle').addEventListener('click', () => {
          sb.classList.add('open'); ov.classList.add('show');
        });
        ov.addEventListener('click', () => {
          sb.classList.remove('open'); ov.classList.remove('show');
        });
      }

      function setupUserMenu() {
        const m = document.getElementById('userMenu');
        const d = document.getElementById('userDropdown');
        m.addEventListener('click', e => { e.stopPropagation(); d.classList.toggle('show'); });
        document.addEventListener('click', () => d.classList.remove('show'));
        d.addEventListener('click', e => e.stopPropagation());
        document.getElementById('logoutBtn').addEventListener('click', async () => {
          if (await Refad.alert.confirm('تسجيل الخروج', 'هل تريد الخروج؟', 'خروج')) {
            await Refad.Auth.logout();
          }
        });
      }

      function setupEmojiPicker() {
        const picker = document.getElementById('emojiPicker');
        picker.innerHTML = EMOJIS.map(e => `<button type="button">${e}</button>`).join('');

        document.getElementById('emojiBtn').addEventListener('click', e => {
          e.stopPropagation();
          picker.classList.toggle('show');
        });

        picker.addEventListener('click', e => {
          if (e.target.tagName === 'BUTTON') {
            const input = document.getElementById('msgInput');
            input.value += e.target.textContent;
            input.dispatchEvent(new Event('input'));
            input.focus();
          }
        });

        document.addEventListener('click', e => {
          if (!e.target.closest('#emojiPicker') && !e.target.closest('#emojiBtn')) {
            picker.classList.remove('show');
          }
        });
      }

      function setupDragDrop() {
        const chatPanel = document.getElementById('chatPanel');
        const overlay = document.getElementById('dragOverlay');
        let dragCounter = 0;

        ['dragenter', 'dragover'].forEach(evt => {
          chatPanel.addEventListener(evt, e => {
            e.preventDefault();
            e.stopPropagation();
            if (!state.activeConvId) return;
            if (evt === 'dragenter') dragCounter++;
            overlay.classList.add('show');
          });
        });

        ['dragleave', 'drop'].forEach(evt => {
          chatPanel.addEventListener(evt, e => {
            e.preventDefault();
            e.stopPropagation();
            if (evt === 'dragleave') dragCounter--;
            if (dragCounter <= 0) {
              dragCounter = 0;
              overlay.classList.remove('show');
            }
            if (evt === 'drop') {
              const file = e.dataTransfer?.files?.[0];
              if (file) sendFile(file);
            }
          });
        });
      }

      // ============================================================
      // Load users
      // ============================================================
      async function loadUsers() {
        try {
          const rows = await Refad.db.select('users', {
            columns: 'id, full_name, username, avatar_url, role_id, is_active',
            eq: { company_id: companyId },
            order: { column: 'full_name', ascending: true },
            limit: 500
          });
          state.users = rows.filter(u => u.is_active !== false && u.id !== myUserId);
          state.usersMap = {};
          rows.forEach(u => { state.usersMap[u.id] = u; });
          state.usersMap[myUserId] = {
            id: myUserId,
            full_name: session.full_name,
            avatar_url: session.avatar_url,
            username: session.username
          };
        } catch (e) {
          console.error('[Chat] users load failed:', e);
        }
      }

      // ============================================================
      // Load conversations
      // ============================================================
      async function loadConversations() {
        try {
          const myParts = await Refad.db.select('chat_participants', {
            columns: 'conversation_id, last_read_at',
            eq: { user_id: myUserId }
          });

          const convIds = myParts.map(p => p.conversation_id);
          if (!convIds.length) {
            state.conversations = [];
            state.participantsMap = {};
            renderConversations();
            return;
          }

          const convs = await Refad.db.select('chat_conversations', {
            columns: 'id, company_id, type, title, created_by, last_message_at, created_at',
            in: { id: convIds },
            order: { column: 'last_message_at', ascending: false },
            limit: 200
          });
          state.conversations = convs;

          const parts = await Refad.db.select('chat_participants', {
            columns: 'conversation_id, user_id',
            in: { conversation_id: convIds }
          });
          state.participantsMap = {};
          parts.forEach(p => {
            if (!state.participantsMap[p.conversation_id]) state.participantsMap[p.conversation_id] = [];
            state.participantsMap[p.conversation_id].push(p.user_id);
          });

          const lastMsgs = await Refad.db.select('chat_messages', {
            columns: 'id, conversation_id, sender_id, content, message_type, created_at',
            in: { conversation_id: convIds },
            order: { column: 'created_at', ascending: false },
            limit: 300
          });
          const lastMap = {};
          lastMsgs.forEach(m => {
            if (!lastMap[m.conversation_id]) lastMap[m.conversation_id] = m;
          });

          const readMap = {};
          myParts.forEach(p => { readMap[p.conversation_id] = p.last_read_at; });

          const unread = {};
          lastMsgs.forEach(m => {
            if (m.sender_id === myUserId) return;
            const readAt = readMap[m.conversation_id];
            if (!readAt || new Date(m.created_at) > new Date(readAt)) {
              unread[m.conversation_id] = (unread[m.conversation_id] || 0) + 1;
            }
          });
          state.unreadMap = unread;

          state.conversations.forEach(c => {
            c._lastMsg = lastMap[c.id];
            c._unread = unread[c.id] || 0;
          });

          renderConversations();
        } catch (e) {
          console.error('[Chat] conversations load failed:', e);
          document.getElementById('convList').innerHTML = `
            <div class="chat-loading" style="color:var(--danger);">
              فشل تحميل المحادثات
            </div>`;
        }
      }

      // ============================================================
      // Render conversations
      // ============================================================
      function getConvDisplay(conv) {
        if (conv.type === 'group') {
          return {
            name: conv.title || 'مجموعة',
            avatar: (conv.title || 'G').charAt(0),
            isGroup: true,
            sub: `${(state.participantsMap[conv.id] || []).length} أعضاء`
          };
        }
        const parts = state.participantsMap[conv.id] || [];
        const otherId = parts.find(id => id !== myUserId);
        const other = state.usersMap[otherId];
        return {
          name: other?.full_name || 'مستخدم محذوف',
          avatar: (other?.full_name || '؟').charAt(0),
          isGroup: false,
          avatarUrl: other?.avatar_url,
          sub: other?.username ? '@' + other.username : ''
        };
      }

      function renderConversations() {
        const list = document.getElementById('convList');
        let convs = state.conversations.slice();

        if (state.searchTerm) {
          const q = state.searchTerm.toLowerCase();
          convs = convs.filter(c => {
            const d = getConvDisplay(c);
            return d.name.toLowerCase().includes(q);
          });
        }

        if (!convs.length) {
          list.innerHTML = `
            <div class="chat-loading">
              ${state.searchTerm ? 'لا توجد نتائج' : 'لا توجد محادثات بعد<br><small style="font-size:11px;opacity:0.7;">ابدأ محادثة جديدة</small>'}
            </div>`;
          return;
        }

        list.innerHTML = convs.map(c => {
          const d = getConvDisplay(c);
          const last = c._lastMsg;
          const isActive = c.id === state.activeConvId;
          const unread = c._unread || 0;

          let lastText = 'لا توجد رسائل';
          let lastIcon = '';
          if (last) {
            const isMine = last.sender_id === myUserId;
            const prefix = isMine ? 'أنت: ' : '';
            if (last.message_type === 'file') {
              lastIcon = `<i data-lucide="paperclip"></i>`;
              lastText = prefix + (last.content || 'ملف');
            } else {
              lastText = prefix + (last.content || '');
            }
          }

          let timeStr = '';
          if (last) timeStr = Refad.format.relative(last.created_at);

          const avatarHtml = d.avatarUrl
            ? `<img src="${Refad.escapeHtml(d.avatarUrl)}" alt="">`
            : Refad.escapeHtml(d.avatar);

          return `
            <div class="conv-item ${isActive ? 'active' : ''}" data-id="${c.id}">
              <div class="conv-avatar ${d.isGroup ? 'group' : ''}">
                ${avatarHtml}
                ${!d.isGroup ? '<span class="online-dot"></span>' : ''}
              </div>
              <div class="conv-body">
                <div class="conv-top">
                  <div class="conv-name">${Refad.escapeHtml(d.name)}</div>
                  ${timeStr ? `<div class="conv-time">${timeStr}</div>` : ''}
                </div>
                <div class="conv-last ${unread ? 'unread' : ''}">
                  ${lastIcon}
                  <span style="overflow:hidden;text-overflow:ellipsis;">${Refad.escapeHtml(lastText).slice(0, 55)}</span>
                </div>
              </div>
              ${unread ? `<div class="conv-unread-badge">${unread > 99 ? '99+' : unread}</div>` : ''}
            </div>
          `;
        }).join('');

        if (window.lucide) lucide.createIcons();

        list.querySelectorAll('.conv-item').forEach(el => {
          el.addEventListener('click', () => {
            const id = parseInt(el.dataset.id, 10);
            openConversation(id);
          });
        });
      }

      // ============================================================
      // Open conversation
      // ============================================================
      async function openConversation(convId) {
        state.activeConvId = convId;
        state.activeConv = state.conversations.find(c => c.id === convId);
        if (!state.activeConv) return;

        document.getElementById('chatEmpty').style.display = 'none';
        const active = document.getElementById('chatActive');
        active.style.display = 'flex';

        const d = getConvDisplay(state.activeConv);
        document.getElementById('chatName').textContent = d.name;
        document.getElementById('chatStatus').innerHTML = d.isGroup
          ? `<span>${d.sub}</span>`
          : `<span class="pulse"></span> <span style="color:var(--success);font-weight:700;">متصل الآن</span>`;
        const av = document.getElementById('chatAvatar');
        if (d.avatarUrl) av.innerHTML = `<img src="${Refad.escapeHtml(d.avatarUrl)}" alt="">`;
        else av.textContent = d.avatar;

        if (window.innerWidth <= 768) {
          document.getElementById('convPanel').classList.add('hidden');
        }

        await markAsRead(convId);
        await loadMessages(convId);

        state.unreadMap[convId] = 0;
        if (state.activeConv) state.activeConv._unread = 0;
        renderConversations();

        document.getElementById('msgInput').focus();
        cancelReply();
      }

      async function markAsRead(convId) {
        try {
          const parts = await Refad.db.select('chat_participants', {
            columns: 'id',
            eq: { conversation_id: convId, user_id: myUserId },
            limit: 1
          });
          if (parts.length) {
            await Refad.db.update('chat_participants', parts[0].id, {
              last_read_at: new Date().toISOString()
            });
          }
        } catch (e) {
          console.warn('[Chat] markAsRead failed:', e);
        }
      }

      // ============================================================
      // Load messages
      // ============================================================
      async function loadMessages(convId) {
        const body = document.getElementById('chatBody');
        body.innerHTML = '<div class="chat-loading">جارٍ التحميل...</div>';

        try {
          const rows = await Refad.db.select('chat_messages', {
            columns: 'id, conversation_id, sender_id, content, message_type, created_at',
            eq: { conversation_id: convId },
            order: { column: 'created_at', ascending: true },
            limit: 500
          });
          state.messages = rows;

          if (rows.length) {
            const msgIds = rows.filter(r => r.message_type === 'file').map(r => r.id);
            if (msgIds.length) {
              const files = await Refad.db.select('chat_files', {
                columns: 'id, message_id, file_url, file_name, file_size, file_type',
                in: { message_id: msgIds }
              });
              const fileMap = {};
              files.forEach(f => { fileMap[f.message_id] = f; });
              state.messages.forEach(m => {
                if (fileMap[m.id]) m._file = fileMap[m.id];
              });
            }
          }

          renderMessages();
          scrollToBottom(true);
        } catch (e) {
          console.error('[Chat] messages load failed:', e);
          body.innerHTML = `<div class="chat-loading" style="color:var(--danger);">فشل تحميل الرسائل: ${Refad.escapeHtml(e.message || '')}</div>`;
        }
      }

      // ============================================================
      // Render messages
      // ============================================================
      function renderMessages() {
        const body = document.getElementById('chatBody');
        const msgs = state.messages;

        if (!msgs.length) {
          body.innerHTML = '<div class="chat-loading">لا توجد رسائل بعد. ابدأ المحادثة!</div>';
          return;
        }

        let html = '';
        let lastDate = '';

        msgs.forEach(m => {
          const msgDate = dayjs(m.created_at).format('YYYY-MM-DD');
          if (msgDate !== lastDate) {
            lastDate = msgDate;
            const today = Refad.date.today();
            const yesterday = Refad.date.addDays(today, -1);
            let lbl = Refad.format.date(msgDate);
            if (msgDate === today) lbl = 'اليوم';
            else if (msgDate === yesterday) lbl = 'أمس';
            html += `<div class="chat-date-sep">${lbl}</div>`;
          }

          html += renderMessageHtml(m);
        });

        body.innerHTML = html;
        if (window.lucide) lucide.createIcons();
        bindLightbox();
      }

      function renderMessageHtml(m) {
        if (!m || !m.id) return '';

        const isOut = m.sender_id === myUserId;
        const sender = state.usersMap[m.sender_id] || { full_name: 'مستخدم', id: m.sender_id };
        const initials = (sender?.full_name || '؟').charAt(0);

        let contentHtml = '';

        if (m._replyTo) {
          const replyTo = state.messages.find(x => x.id === m._replyTo);
          if (replyTo) {
            const replySender = state.usersMap[replyTo.sender_id];
            contentHtml += `
              <div class="msg-reply-quote">
                <div class="q-name">${Refad.escapeHtml(replySender?.full_name || '؟')}</div>
                <div class="q-text">${Refad.escapeHtml((replyTo.content || 'ملف').slice(0, 60))}</div>
              </div>
            `;
          }
        }

        if (m.message_type === 'file' && m._file) {
          const f = m._file;
          const isImage = (f.file_type || '').startsWith('image/');
          const sizeStr = f.file_size ? formatFileSize(f.file_size) : '';

          if (isImage) {
            contentHtml += `
              <img src="${Refad.escapeHtml(f.file_url)}" alt="${Refad.escapeHtml(f.file_name || 'صورة')}"
                   class="msg-image" data-lightbox="${Refad.escapeHtml(f.file_url)}"
                   onerror="this.style.display='none'">
            `;
          } else {
            contentHtml += `
              <a href="${Refad.escapeHtml(f.file_url)}" target="_blank" class="msg-file" rel="noopener">
                <div class="msg-file-icon"><i data-lucide="${getFileIcon(f.file_type, f.file_name)}"></i></div>
                <div class="msg-file-info">
                  <div class="msg-file-name">${Refad.escapeHtml(f.file_name || 'ملف')}</div>
                  <div class="msg-file-size">${sizeStr}</div>
                </div>
                <i data-lucide="download" style="width:16px;height:16px;opacity:0.7;"></i>
              </a>
            `;
          }
        } else if (m.content) {
          contentHtml += `<div>${linkifyText(m.content)}</div>`;
        }

        return `
          <div class="msg-row ${isOut ? 'out' : 'in'}" data-id="${m.id}">
            ${!isOut ? `<div class="msg-avatar">${sender?.avatar_url ? `<img src="${Refad.escapeHtml(sender.avatar_url)}" alt="">` : Refad.escapeHtml(initials)}</div>` : ''}
            <div class="msg-content">
              ${!isOut && state.activeConv?.type === 'group' ? `<div class="msg-sender">${Refad.escapeHtml(sender?.full_name || '؟')}</div>` : ''}
              <div class="msg-bubble">
                ${contentHtml}
                <div class="msg-time">
                  ${dayjs(m.created_at).format('HH:mm')}
                  ${isOut ? `<i data-lucide="${m._read ? 'check-check' : 'check'}" class="msg-check ${m._read ? 'read' : 'sent'}"></i>` : ''}
                </div>
              </div>
            </div>
            <div class="msg-actions">
              <button class="msg-action-btn" data-reply="${m.id}" title="رد">
                <i data-lucide="reply"></i>
              </button>
            </div>
          </div>
        `;
      }

      function linkifyText(text) {
        const escaped = Refad.escapeHtml(text);
        return escaped.replace(/(https?:\/\/[^\s]+)/g, '<a href="$1" target="_blank" style="color:inherit;text-decoration:underline;">$1</a>');
      }

      function appendMessage(m) {
        if (!m || typeof m !== 'object') return;
        if (!m.id || !m.sender_id) return;

        state.messages.push(m);
        const body = document.getElementById('chatBody');
        if (!body) return;

        const empty = body.querySelector('.chat-loading');
        if (empty) empty.remove();

        const lastMsg = state.messages[state.messages.length - 2];
        const needSep = !lastMsg || dayjs(m.created_at).format('YYYY-MM-DD') !== dayjs(lastMsg.created_at).format('YYYY-MM-DD');

        let html = '';
        if (needSep) {
          const msgDate = dayjs(m.created_at).format('YYYY-MM-DD');
          const today = Refad.date.today();
          const yesterday = Refad.date.addDays(today, -1);
          let lbl = Refad.format.date(msgDate);
          if (msgDate === today) lbl = 'اليوم';
          else if (msgDate === yesterday) lbl = 'أمس';
          html += `<div class="chat-date-sep">${lbl}</div>`;
        }

        html += renderMessageHtml(m);
        body.insertAdjacentHTML('beforeend', html);
        if (window.lucide) lucide.createIcons();
        bindLightbox();
      }

      function scrollToBottom(smooth) {
        const body = document.getElementById('chatBody');
        requestAnimationFrame(() => {
          body.scrollTo({ top: body.scrollHeight, behavior: smooth ? 'smooth' : 'auto' });
          state.pendingNewMsgs = 0;
          updateScrollBtn();
        });
      }

      function updateScrollBtn() {
        const btn = document.getElementById('scrollBottomBtn');
        const badge = document.getElementById('scrollBadge');
        if (state.isUserScrolledUp) {
          btn.classList.add('show');
          if (state.pendingNewMsgs > 0) {
            badge.style.display = 'flex';
            badge.textContent = state.pendingNewMsgs > 9 ? '9+' : state.pendingNewMsgs;
          } else {
            badge.style.display = 'none';
          }
        } else {
          btn.classList.remove('show');
        }
      }

      function setupScrollListener() {
        const body = document.getElementById('chatBody');
        body.addEventListener('scroll', () => {
          const diff = body.scrollHeight - body.scrollTop - body.clientHeight;
          state.isUserScrolledUp = diff > 200;
          updateScrollBtn();
        });

        document.getElementById('scrollBottomBtn').addEventListener('click', () => {
          scrollToBottom(true);
          state.isUserScrolledUp = false;
          updateScrollBtn();
        });
      }

      // ============================================================
      // Send message
      // ============================================================
      async function sendMessage() {
        const input = document.getElementById('msgInput');
        const content = input.value.trim();
        if (!content || !state.activeConvId) return;

        const btn = document.getElementById('sendBtn');
        btn.disabled = true;
        input.value = '';
        autoResize(input);

        const replyToId = state.replyTo?.id || null;

        try {
          const payload = {
            conversation_id: state.activeConvId,
            sender_id: myUserId,
            content: content,
            message_type: 'text'
          };
          const created = await Refad.db.insert('chat_messages', payload);

          try {
            await Refad.db.update('chat_conversations', state.activeConvId, {
              last_message_at: new Date().toISOString()
            });
          } catch (e) {}

          const newMsg = {
            id: created.id,
            conversation_id: state.activeConvId,
            sender_id: myUserId,
            content: content,
            message_type: 'text',
            created_at: created.created_at || new Date().toISOString(),
            _replyTo: replyToId
          };
          appendMessage(newMsg);
          scrollToBottom();

          const c = state.conversations.find(x => x.id === state.activeConvId);
          if (c) {
            c._lastMsg = created;
            c.last_message_at = created.created_at;
            state.conversations = [c].concat(state.conversations.filter(x => x.id !== c.id));
            renderConversations();
          }

          cancelReply();
        } catch (e) {
          console.error('[Chat] send failed:', e);
          Refad.toast.error('فشل الإرسال: ' + (e.message || e));
          input.value = content;
        } finally {
          btn.disabled = !input.value.trim();
        }
      }

      // ============================================================
      // Send file (مع ضغط الصور)
      // ============================================================
      async function sendFile(file) {
        if (!file || !state.activeConvId) return;
        if (file.size > 10 * 1024 * 1024) {
          Refad.toast.warning('حجم الملف أكبر من 10 ميجا');
          return;
        }

        try {
          let uploadBlob = file;
          let uploadType = file.type;
          let uploadName = file.name;

          if (file.type.startsWith('image/') && file.size > 100 * 1024) {
            try {
              Refad.toast.info('جارٍ ضغط الصورة...');
              uploadBlob = await Refad.storage.compressImage(file, 1200, 0.82);
              uploadType = 'image/jpeg';
              uploadName = file.name.replace(/\.[^.]+$/, '.jpg');
            } catch (err) {
              console.warn('Image compression failed:', err);
            }
          }

          Refad.toast.info('جارٍ رفع الملف...');

          const ext = (uploadName.split('.').pop() || 'bin').toLowerCase();
          const path = `conv-${state.activeConvId}/${Date.now()}-${Math.random().toString(36).slice(2, 8)}.${ext}`;

          const { data, error } = await Refad.sb.storage
            .from('chat-files')
            .upload(path, uploadBlob, { upsert: false, contentType: uploadType });

          if (error) {
            console.error('[Chat] Storage error:', error);
            let errMsg = 'فشل رفع الملف';
            if (error.message?.toLowerCase().includes('bucket')) {
              errMsg = '⚠️ bucket "chat-files" غير موجود في Storage';
            } else if (error.message?.toLowerCase().includes('size')) {
              errMsg = 'حجم الملف كبير جداً';
            } else if (error.message) {
              errMsg = error.message;
            }
            Refad.toast.error(errMsg, 5000);
            return;
          }

          const { data: urlData } = Refad.sb.storage.from('chat-files').getPublicUrl(data.path);
          const fileUrl = urlData.publicUrl;

          const msg = await Refad.db.insert('chat_messages', {
            conversation_id: state.activeConvId,
            sender_id: myUserId,
            content: uploadName,
            message_type: 'file'
          });

          await Refad.db.insert('chat_files', {
            message_id: msg.id,
            file_url: fileUrl,
            file_name: uploadName,
            file_size: uploadBlob.size || file.size,
            file_type: uploadType
          });

          try {
            await Refad.db.update('chat_conversations', state.activeConvId, {
              last_message_at: new Date().toISOString()
            });
          } catch (e) {}

          appendMessage({
            id: msg.id,
            conversation_id: state.activeConvId,
            sender_id: myUserId,
            content: uploadName,
            message_type: 'file',
            created_at: msg.created_at || new Date().toISOString(),
            _file: {
              file_url: fileUrl,
              file_name: uploadName,
              file_size: uploadBlob.size || file.size,
              file_type: uploadType
            }
          });
          scrollToBottom();
          Refad.toast.success('تم إرسال الملف');
        } catch (e) {
          console.error('[Chat] file send failed:', e);
          Refad.toast.error('فشل إرسال الملف: ' + (e.message || e));
        }
      }      // ============================================================
      // Reply
      // ============================================================
      function setReply(messageId) {
        const m = state.messages.find(x => x.id === messageId);
        if (!m) return;
        state.replyTo = m;
        const sender = state.usersMap[m.sender_id];
        document.getElementById('rpName').textContent = sender?.full_name || '؟';
        document.getElementById('rpText').textContent = m.content || 'ملف';
        document.getElementById('replyPreview').classList.add('show');
        document.getElementById('msgInput').focus();
      }

      function cancelReply() {
        state.replyTo = null;
        document.getElementById('replyPreview').classList.remove('show');
      }

      // ============================================================
      // New conversation
      // ============================================================
      async function openNewChatModal() {
        state.selectedUsers = new Set();
        const modal = document.getElementById('newChatModal');
        const list = document.getElementById('userPickList');
        document.getElementById('newChatType').value = 'direct';
        document.getElementById('groupTitleGroup').style.display = 'none';
        document.getElementById('groupTitle').value = '';
        document.getElementById('createChatBtn').disabled = true;

        if (!state.users.length) {
          list.innerHTML = '<div class="chat-loading" style="padding:20px;">لا يوجد مستخدمون آخرون</div>';
        } else {
          list.innerHTML = state.users.map(u => `
            <div class="user-pick-item" data-id="${u.id}">
              <div class="user-pick-avatar">${u.avatar_url ? `<img src="${Refad.escapeHtml(u.avatar_url)}" alt="">` : Refad.escapeHtml((u.full_name || '؟').charAt(0))}</div>
              <div class="user-pick-info">
                <div class="name">${Refad.escapeHtml(u.full_name)}</div>
                <div class="role">@${Refad.escapeHtml(u.username || '')}</div>
              </div>
              <div class="user-pick-check"><i data-lucide="check"></i></div>
            </div>
          `).join('');

          list.querySelectorAll('.user-pick-item').forEach(el => {
            el.addEventListener('click', () => {
              const id = parseInt(el.dataset.id, 10);
              const type = document.getElementById('newChatType').value;
              if (type === 'direct') {
                state.selectedUsers.clear();
                state.selectedUsers.add(id);
                list.querySelectorAll('.user-pick-item').forEach(x => x.classList.remove('selected'));
                el.classList.add('selected');
              } else {
                if (state.selectedUsers.has(id)) {
                  state.selectedUsers.delete(id);
                  el.classList.remove('selected');
                } else {
                  state.selectedUsers.add(id);
                  el.classList.add('selected');
                }
              }
              updateCreateBtn();
            });
          });
        }

        if (window.lucide) lucide.createIcons();
        modal.classList.add('show');
      }

      function updateCreateBtn() {
        const type = document.getElementById('newChatType').value;
        const btn = document.getElementById('createChatBtn');
        if (type === 'direct') {
          btn.disabled = state.selectedUsers.size !== 1;
        } else {
          const title = document.getElementById('groupTitle').value.trim();
          btn.disabled = state.selectedUsers.size < 1 || !title;
        }
      }

      async function createConversation() {
        const type = document.getElementById('newChatType').value;
        const title = document.getElementById('groupTitle').value.trim();
        const userIds = Array.from(state.selectedUsers);

        if (type === 'direct' && userIds.length !== 1) return;
        if (type === 'group' && (!title || userIds.length < 1)) return;

        const btn = document.getElementById('createChatBtn');
        btn.disabled = true;

        try {
          if (type === 'direct') {
            const otherId = userIds[0];
            const existing = await findExistingDirect(otherId);
            if (existing) {
              document.getElementById('newChatModal').classList.remove('show');
              await loadConversations();
              openConversation(existing.id);
              return;
            }
          }

          const conv = await Refad.db.insert('chat_conversations', {
            company_id: companyId,
            type: type,
            title: type === 'group' ? title : null,
            created_by: myUserId,
            last_message_at: new Date().toISOString()
          });

          const allUsers = [myUserId].concat(userIds);
          for (const uid of allUsers) {
            await Refad.db.insert('chat_participants', {
              conversation_id: conv.id,
              user_id: uid,
              last_read_at: new Date().toISOString()
            });
          }

          document.getElementById('newChatModal').classList.remove('show');
          Refad.toast.success('تم إنشاء المحادثة');

          await loadConversations();
          openConversation(conv.id);
        } catch (e) {
          console.error('[Chat] create failed:', e);
          Refad.toast.error('فشل الإنشاء: ' + (e.message || e));
        } finally {
          btn.disabled = false;
        }
      }

      async function findExistingDirect(otherId) {
        try {
          const myConvs = state.conversations.filter(c => c.type === 'direct');
          for (const c of myConvs) {
            const parts = state.participantsMap[c.id] || [];
            if (parts.length === 2 && parts.includes(myUserId) && parts.includes(otherId)) {
              return c;
            }
          }
        } catch (e) {}
        return null;
      }

      // ============================================================
      // Realtime
      // ============================================================
      function setupRealtime() {
        try {
          state.realtimeChannel = Refad.sb
            .channel('chat-realtime')
            .on('postgres_changes', {
              event: 'INSERT',
              schema: 'public',
              table: 'chat_messages'
            }, async (payload) => {
              const m = payload.new;
              const inConv = state.conversations.some(c => c.id === m.conversation_id);
              if (!inConv) {
                await loadConversations();
                return;
              }

              if (state.messages.some(x => x.id === m.id)) return;

              if (m.message_type === 'file') {
                try {
                  const files = await Refad.db.select('chat_files', {
                    columns: '*',
                    eq: { message_id: m.id },
                    limit: 1
                  });
                  if (files.length) m._file = files[0];
                } catch (e) {}
              }

              if (m.conversation_id === state.activeConvId) {
                appendMessage(m);
                if (!state.isUserScrolledUp) {
                  scrollToBottom();
                } else {
                  state.pendingNewMsgs++;
                  updateScrollBtn();
                }
                markAsRead(m.conversation_id);
              } else {
                const sender = state.usersMap[m.sender_id];
                Refad.toast.info(`💬 رسالة من ${sender?.full_name || 'مستخدم'}`);
                state.unreadMap[m.conversation_id] = (state.unreadMap[m.conversation_id] || 0) + 1;

                if (window.Notification && Notification.permission === 'granted' && m.sender_id !== myUserId) {
                  try {
                    new Notification(sender?.full_name || 'رسالة جديدة', {
                      body: m.content || 'أرسل ملفاً',
                      icon: 'icon-192.png'
                    });
                  } catch (e) {}
                }
              }

              const c = state.conversations.find(x => x.id === m.conversation_id);
              if (c) {
                c._lastMsg = m;
                c._unread = state.unreadMap[c.id] || 0;
                c.last_message_at = m.created_at;
                state.conversations = [c].concat(state.conversations.filter(x => x.id !== c.id));
              }
              renderConversations();
            })
            .subscribe();
        } catch (e) {
          console.warn('[Chat] Realtime not available:', e.message);
        }
      }

      // ============================================================
      // Input helpers
      // ============================================================
      function autoResize(el) {
        el.style.height = 'auto';
        el.style.height = Math.min(el.scrollHeight, 140) + 'px';
      }

      function setupInput() {
        const input = document.getElementById('msgInput');
        const sendBtn = document.getElementById('sendBtn');

        input.addEventListener('input', () => {
          autoResize(input);
          sendBtn.disabled = !input.value.trim();
        });

        input.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
          }
          if (e.key === 'Escape' && state.replyTo) {
            cancelReply();
          }
          if (e.key === 'ArrowUp' && !input.value && state.messages.length) {
            const lastIn = [...state.messages].reverse().find(m => m.sender_id !== myUserId);
            if (lastIn) setReply(lastIn.id);
          }
        });

        sendBtn.addEventListener('click', sendMessage);

        document.getElementById('attachBtn').addEventListener('click', () => {
          document.getElementById('fileInput').click();
        });
        document.getElementById('fileInput').addEventListener('change', (e) => {
          const f = e.target.files[0];
          if (f) sendFile(f);
          e.target.value = '';
        });

        document.getElementById('rpClose').addEventListener('click', cancelReply);
      }

      function setupLightbox() {
        document.getElementById('lightboxClose').addEventListener('click', () => {
          document.getElementById('lightbox').classList.remove('show');
        });
        document.getElementById('lightbox').addEventListener('click', (e) => {
          if (e.target.id === 'lightbox') {
            e.target.classList.remove('show');
          }
        });
        bindLightbox();
      }

      function bindLightbox() {
        document.querySelectorAll('[data-lightbox]').forEach(img => {
          img.addEventListener('click', () => {
            document.getElementById('lightboxImg').src = img.dataset.lightbox;
            document.getElementById('lightbox').classList.add('show');
          });
        });
      }

      function requestNotifPermission() {
        if ('Notification' in window && Notification.permission === 'default') {
          Notification.requestPermission();
        }
      }

      // ============================================================
      // Events
      // ============================================================
      function bindEvents() {
        document.getElementById('newChatBtn').addEventListener('click', openNewChatModal);
        document.getElementById('createChatBtn').addEventListener('click', createConversation);

        document.getElementById('newChatType').addEventListener('change', (e) => {
          document.getElementById('groupTitleGroup').style.display = e.target.value === 'group' ? 'block' : 'none';
          updateCreateBtn();
        });
        document.getElementById('groupTitle').addEventListener('input', updateCreateBtn);

        document.querySelectorAll('#newChatModal [data-close]').forEach(b => {
          b.addEventListener('click', () => document.getElementById('newChatModal').classList.remove('show'));
        });
        document.getElementById('newChatModal').addEventListener('click', (e) => {
          if (e.target.id === 'newChatModal') e.target.classList.remove('show');
        });

        document.getElementById('convSearch').addEventListener('input', Refad.debounce((e) => {
          state.searchTerm = e.target.value.trim();
          renderConversations();
        }, 200));

        document.getElementById('refreshBtn').addEventListener('click', async () => {
          Refad.toast.info('جارٍ التحديث...');
          await loadConversations();
          if (state.activeConvId) await loadMessages(state.activeConvId);
          Refad.toast.success('تم التحديث');
        });

        document.getElementById('backBtn').addEventListener('click', () => {
          document.getElementById('convPanel').classList.remove('hidden');
          document.getElementById('chatActive').style.display = 'none';
          document.getElementById('chatEmpty').style.display = 'flex';
          state.activeConvId = null;
          state.activeConv = null;
        });

        document.getElementById('chatInfoBtn').addEventListener('click', () => {
          if (!state.activeConv) return;
          const parts = state.participantsMap[state.activeConv.id] || [];
          const names = parts.map(id => state.usersMap[id]?.full_name || '؟');
          Refad.alert.info(
            state.activeConv.type === 'group' ? (state.activeConv.title || 'مجموعة') : 'محادثة مباشرة',
            'المشاركون: ' + names.join('، ')
          );
        });

        document.getElementById('chatSearchBtn').addEventListener('click', () => {
          const q = prompt('ابحث في الرسائل:');
          if (!q) return;
          const found = document.querySelector(`.msg-row[data-id]`);
          const q2 = q.toLowerCase();
          const allMsgs = document.querySelectorAll('.msg-bubble');
          let found1 = false;
          allMsgs.forEach(b => {
            if (b.textContent.toLowerCase().includes(q2)) {
              b.scrollIntoView({ behavior: 'smooth', block: 'center' });
              b.style.background = '#FEF3C7';
              setTimeout(() => { b.style.background = ''; }, 2000);
              found1 = true;
            }
          });
          if (!found1) Refad.toast.info('لا توجد نتائج');
        });

        document.getElementById('chatBody').addEventListener('click', (e) => {
          const btn = e.target.closest('[data-reply]');
          if (!btn) return;
          setReply(parseInt(btn.dataset.reply, 10));
        });

        document.addEventListener('keydown', (e) => {
          if (e.key === 'Escape') {
            document.querySelectorAll('.modal-backdrop.show').forEach(m => m.classList.remove('show'));
            document.getElementById('lightbox').classList.remove('show');
            document.getElementById('emojiPicker').classList.remove('show');
          }
          if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
            e.preventDefault();
            document.getElementById('convSearch').focus();
          }
        });
      }

      // ============================================================
      // Init
      // ============================================================
      async function init() {
        buildSidebar();
        fillUser();
        setupTheme();
        setupSidebarMobile();
        setupUserMenu();
        setupEmojiPicker();
        setupInput();
        setupScrollListener();
        setupLightbox();
        setupDragDrop();
        bindEvents();

        await loadUsers();
        await loadConversations();
        setupRealtime();
        requestNotifPermission();

        const cid = parseInt(Refad.getParam('id'), 10);
        if (cid) {
          await openConversation(cid);
        }

        if (Refad.registerServiceWorker) Refad.registerServiceWorker();
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }

      console.log('%c[Refad] Chat ready (Pro)', 'color:#14B8A6;font-weight:bold');
    })();
  </script>

</body>
