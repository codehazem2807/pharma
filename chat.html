<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>المحادثات | Pharma Cloud</title><style>@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap');:root{--p:#0d6e6e;--a:#12a3a3;--bg:#f2f6f8;--ink:#183238;--muted:#6d8085;--line:#dce7ea;--bad:#bf4141}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px Cairo,Arial}.shell{display:flex;min-height:100vh}.side{position:fixed;right:0;top:0;bottom:0;width:244px;background:var(--p);padding:22px 13px;color:#fff;z-index:20;transition:.25s}.brand{font-size:20px;font-weight:800;padding:0 12px 22px;border-bottom:1px solid #ffffff2b}.brand small{display:block;font-size:11px;font-weight:400;opacity:.72}.nav{padding-top:15px}.nav a{display:block;text-decoration:none;color:#d9f5f5;padding:10px 12px;margin:3px 0;border-radius:9px}.nav a:hover,.nav a.active{background:#ffffff25;color:white}.side-foot{position:absolute;bottom:20px;right:13px;left:13px}.signout{width:100%;padding:10px;border-radius:8px;border:1px solid #ffffff35;background:#ffffff16;color:#fff;font:inherit;cursor:pointer}.main{margin-right:244px;width:calc(100% - 244px)}.top{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;padding:0 29px;position:sticky;top:0;z-index:10}.who{display:flex;gap:9px;align-items:center}.avatar{display:grid;place-items:center;border-radius:50%;width:38px;height:38px;background:#d9f4f4;color:var(--p);font-weight:800}.who b,.who small{display:block}.who small{font-size:11px;color:var(--muted)}.hamb{display:none;font-size:25px;border:0;background:none;color:var(--p)}.page{max-width:1500px;margin:auto;padding:25px}.chat{height:calc(100vh - 122px);min-height:530px;background:#fff;border:1px solid var(--line);border-radius:14px;display:grid;grid-template-columns:300px 1fr;overflow:hidden;box-shadow:0 2px 8px #17434a08}.contacts{border-left:1px solid var(--line);display:flex;flex-direction:column}.contacts h1{font-size:18px;margin:0;padding:18px}.contact-search{margin:0 12px 12px;padding:9px;border:1px solid var(--line);border-radius:8px;font:inherit}.contact-list{overflow:auto}.contact{display:flex;gap:10px;padding:12px;border-top:1px solid #edf2f3;cursor:pointer;align-items:center}.contact:hover,.contact.active{background:#edf9f8}.dot{width:37px;height:37px;flex:0 0 37px;border-radius:50%;display:grid;place-items:center;background:#d9f4f4;color:var(--p);font-weight:800}.contact b,.contact small{display:block}.contact small{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:185px}.contact-info{min-width:0;flex:1}.unread{background:#c74646;color:#fff;border-radius:99px;min-width:19px;height:19px;display:grid;place-items:center;font-size:10px}.conversation{display:flex;flex-direction:column;min-width:0}.conv-head{padding:15px 19px;border-bottom:1px solid var(--line);min-height:68px}.conv-head b,.conv-head small{display:block}.conv-head small{color:var(--muted);font-size:11px}.messages{flex:1;overflow:auto;padding:20px;background:#f7fbfb;display:flex;flex-direction:column;gap:10px}.bubble{max-width:min(76%,560px);padding:10px 13px;border-radius:12px;background:#fff;border:1px solid var(--line);align-self:flex-start;white-space:pre-wrap;word-break:break-word}.bubble.mine{background:var(--p);border-color:var(--p);color:#fff;align-self:flex-end}.bubble small{display:block;opacity:.72;font-size:10px;margin-top:4px}.composer{padding:11px;border-top:1px solid var(--line);display:flex;gap:8px}.composer textarea{resize:none;flex:1;height:45px;border:1px solid var(--line);border-radius:9px;padding:10px;font:inherit}.composer button{border:0;border-radius:9px;background:var(--a);color:#fff;padding:0 17px;font:inherit;cursor:pointer}.notice,.empty{margin:auto;color:var(--muted);text-align:center;padding:25px}.notice{border:1px dashed var(--line);border-radius:10px;background:#fff}.toast{position:fixed;z-index:70;bottom:22px;left:22px;background:#183238;color:#fff;padding:12px 16px;border-radius:8px;opacity:0;transform:translateY(15px);transition:.2s}.toast.show{opacity:1;transform:none}.toast.error{background:var(--bad)}.veil{display:none}@media(max-width:900px){.side{transform:translateX(100%)}.side.open{transform:none;box-shadow:-5px 0 18px #0004}.main{margin:0;width:100%}.hamb{display:block}.veil.open{display:block;position:fixed;inset:0;background:#0005;z-index:19}.page{padding:14px}.chat{height:calc(100vh - 91px);min-height:0;grid-template-columns:1fr}.contacts{border-left:0;border-bottom:1px solid var(--line);max-height:200px}.contacts h1{padding:11px 14px;font-size:16px}.contact{padding:8px 12px}.conversation{min-height:300px}}@media(max-width:520px){.top{height:63px;padding:0 15px}.contact-list{display:flex;overflow:auto}.contact{min-width:190px;border-left:1px solid #edf2f3;border-top:0}.contact-search{display:none}.bubble{max-width:88%}.messages{padding:12px}.composer{padding:8px}}</style></head>
<body><div class="shell"><aside class="side" id="side"><div class="brand">Pharma Cloud<small>نظام إدارة الصيدليات</small></div><nav class="nav" id="nav"></nav><div class="side-foot"><button class="signout" onclick="signout()">تسجيل الخروج</button></div></aside><div class="veil" id="veil" onclick="toggleMenu()"></div><main class="main"><header class="top"><button class="hamb" onclick="toggleMenu()">☰</button><span></span><div class="who"><div class="avatar" id="initial"></div><div><b id="userName"></b><small id="roleText"></small></div></div></header><section class="page"><section class="chat"><aside class="contacts"><h1>المحادثات</h1><input class="contact-search" id="search" oninput="renderContacts()" placeholder="بحث في الدليل"><div class="contact-list" id="contactList"></div></aside><section class="conversation"><header class="conv-head" id="convHead"><b>اختر منشأة</b><small>ابدأ محادثة من قائمة الدليل</small></header><div class="messages" id="messages"><div class="empty">اختر منشأة لعرض المحادثة.</div></div><form class="composer" onsubmit="send(event)"><textarea id="body" maxlength="2000" placeholder="اكتب رسالتك..." disabled></textarea><button id="sendBtn" disabled>إرسال</button></form></section></section></section></main></div><div class="toast" id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const URL='https://jlpjqwlwwuknabfekbth.supabase.co',KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJIUzI1NiIsInJlZiI6ImpscGpxd2x3d3VrbmFiZmVrYnRoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAyOTYxNTAsImV4cCI6MjEwNTg3MjE1MH0.8tcgNJnwGYbKlNZx3899k-h6E7dKWxl2vM9uD3pPFZ0';let session;try{session=JSON.parse(localStorage.getItem('pharma_session')||'null')}catch(e){}if(!session)location.replace('index.html');const db=supabase.createClient(URL,KEY),$=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));let contacts=[],activeId=new URLSearchParams(location.search).get('tenant'),messages=[],unread={},mode='unsupported',channels=[];
function menu(){let l=session.role==='super'?[['tenants.html','المنشآت'],['users.html','المستخدمون'],['chat.html','المحادثات'],['directory.html','دليل المنشآت']]:session.role==='admin'?[['dashboard.html','لوحة التحكم'],['pos.html','نقطة البيع'],['purchase.html','المشتريات'],['products.html','الأصناف'],['stock.html','المخزون'],['ledger.html','الحسابات'],['suggestions.html','اقتراحات الطلب'],['orders.html','الطلبات'],['directory.html','دليل المنشآت'],['chat.html','المحادثات'],['users.html','المستخدمون']]:[['dashboard.html','لوحة التحكم'],['pos.html','نقطة البيع'],['products.html','الأصناف'],['stock.html','المخزون'],['ledger.html','الحسابات'],['directory.html','دليل المنشآت'],['chat.html','المحادثات']];$('#nav').innerHTML=l.map(x=>`<a class="${x[0]==='chat.html'?'active':''}" href="${x[0]}">${x[1]}</a>`).join('')}function toggleMenu(){$('#side').classList.toggle('open');$('#veil').classList.toggle('open')}function signout(){localStorage.removeItem('pharma_session');location.replace('index.html')}function toast(t,b=false){let e=$('#toast');e.textContent=t;e.className='toast show '+(b?'error':'');setTimeout(()=>e.className='toast',3600)}function date(d){return new Date(d).toLocaleString('ar-SA',{hour:'2-digit',minute:'2-digit',day:'numeric',month:'short'})}
function renderContacts(){let q=$('#search').value.toLowerCase(),list=contacts.filter(x=>[x.name,x.type].join(' ').toLowerCase().includes(q));$('#contactList').innerHTML=list.map(t=>`<div class="contact ${t.id===activeId?'active':''}" onclick="choose('${t.id}')"><div class="dot">${esc(t.name[0]||'م')}</div><div class="contact-info"><b>${esc(t.name)}</b><small>${t.type==='company'?'شركة توزيع':'صيدلية'}</small></div>${unread[t.id]?`<span class="unread">${unread[t.id]}</span>`:''}</div>`).join('')||'<div class="empty">لا توجد منشآت نشطة.</div>'}
function renderMessages(){let target=contacts.find(x=>x.id===activeId);if(!target){$('#convHead').innerHTML='<b>اختر منشأة</b><small>ابدأ محادثة من قائمة الدليل</small>';$('#messages').innerHTML='<div class="empty">اختر منشأة لعرض المحادثة.</div>';return}$('#convHead').innerHTML=`<b>${esc(target.name)}</b><small>${target.type==='company'?'شركة توزيع':'صيدلية'}</small>`;$('#messages').innerHTML=messages.length?messages.map(m=>{let mine=m.from_tenant_id===session.tenantId;return `<div class="bubble ${mine?'mine':''}">${esc(m.body)}<small>${date(m.created_at)}</small></div>`}).join(''):'<div class="empty">لا توجد رسائل بعد. ابدأ المحادثة.</div>';let box=$('#messages');box.scrollTop=box.scrollHeight}
async function choose(id){activeId=id;history.replaceState(null,'','chat.html?tenant='+encodeURIComponent(id));unread[id]=0;renderContacts();if(session.role==='super'){messages=[];renderMessages();$('#body').disabled=true;$('#sendBtn').disabled=true;$('#body').placeholder='مراسلة مدير المنصة غير مدعومة لأن الرسائل تتطلب منشأة مرسلة.';return}if(mode!=='extended'){messages=[];renderMessages();$('#body').disabled=true;$('#sendBtn').disabled=true;$('#body').placeholder='مخطط الرسائل الحالي لا يدعم توجيه الرسائل بين المنشآت.';return}$('#body').disabled=false;$('#sendBtn').disabled=false;$('#body').placeholder='اكتب رسالتك...';try{let r=await db.from('messages').select('*').or(`and(from_tenant_id.eq.${session.tenantId},to_tenant_id.eq.${id}),and(from_tenant_id.eq.${id},to_tenant_id.eq.${session.tenantId})`).order('created_at');if(r.error)throw r.error;messages=r.data||[];renderMessages();let unreadRows=messages.filter(m=>m.to_tenant_id===session.tenantId&&!m.read_at).map(m=>m.id);if(unreadRows.length){let up=await db.from('messages').update({read_at:new Date().toISOString()}).in('id',unreadRows).eq('to_tenant_id',session.tenantId);if(up.error)console.warn(up.error)} }catch(e){toast('تعذر تحميل المحادثة: '+e.message,true)}}
async function send(e){e.preventDefault();if(session.role==='super'){toast('لا يمكن للمدير العام إرسال رسالة بلا منشأة.',true);return}let body=$('#body').value.trim();if(!body||!activeId||mode!=='extended')return;$('#sendBtn').disabled=true;let payload={tenant_id:session.tenantId,from_tenant_id:session.tenantId,to_tenant_id:activeId,sender_id:session.userId,body};let r=await db.from('messages').insert(payload).select().single();$('#sendBtn').disabled=false;if(r.error){toast('تعذر إرسال الرسالة: '+r.error.message,true);return}$('#body').value='';if(!messages.some(x=>x.id===r.data.id)){messages.push(r.data);renderMessages()}}
function relevant(m){return m&&(m.from_tenant_id===session.tenantId||m.to_tenant_id===session.tenantId)}function onMessage(payload){let m=payload.new;if(!relevant(m))return;let other=m.from_tenant_id===session.tenantId?m.to_tenant_id:m.from_tenant_id;if(other===activeId){if(!messages.some(x=>x.id===m.id)){messages.push(m);renderMessages()}if(m.to_tenant_id===session.tenantId&&!m.read_at)db.from('messages').update({read_at:new Date().toISOString()}).eq('id',m.id).eq('to_tenant_id',session.tenantId)}else if(m.to_tenant_id===session.tenantId){unread[other]=(unread[other]||0)+1;renderContacts()}}
function subscribe(){if(mode!=='extended'||session.role==='super')return;let a=db.channel('chat-from-'+session.tenantId).on('postgres_changes',{event:'INSERT',schema:'public',table:'messages',filter:'from_tenant_id=eq.'+session.tenantId},onMessage).subscribe(),b=db.channel('chat-to-'+session.tenantId).on('postgres_changes',{event:'INSERT',schema:'public',table:'messages',filter:'to_tenant_id=eq.'+session.tenantId},onMessage).subscribe();channels=[a,b]}function cleanup(){channels.forEach(c=>db.removeChannel(c));channels=[]}window.addEventListener('beforeunload',cleanup);
async function detect(){if(session.role==='super')return;let probe=await db.from('messages').select('id,from_tenant_id,to_tenant_id').eq('from_tenant_id',session.tenantId).limit(1);if(!probe.error){mode='extended';let unreadResult=await db.from('messages').select('from_tenant_id').eq('to_tenant_id',session.tenantId).is('read_at',null);if(!unreadResult.error)(unreadResult.data||[]).forEach(m=>unread[m.from_tenant_id]=(unread[m.from_tenant_id]||0)+1);subscribe()}else{mode='unsupported';console.info('رسائل بين المنشآت تحتاج حقلي from_tenant_id وto_tenant_id:',probe.error.message)}}
async function load(){menu();$('#userName').textContent=session.name||'مستخدم';$('#initial').textContent=(session.name||'م')[0];$('#roleText').textContent=session.role==='super'?'مدير المنصة':session.role==='admin'?'مدير المنشأة':'مستخدم';try{let q=db.from('tenants').select('id,name,type').eq('active',true).order('name');if(session.tenantId)q=q.neq('id',session.tenantId);let r=await q;if(r.error)throw r.error;contacts=r.data||[];if(activeId&&!contacts.some(t=>t.id===activeId))activeId=null;await detect();renderContacts();if(activeId)choose(activeId);else renderMessages();if(session.role==='super'){$('#body').placeholder='مراسلة مدير المنصة غير مدعومة لأن الرسائل تتطلب منشأة مرسلة.'}}catch(e){console.error(e);toast('تعذر تحميل جهات الاتصال: '+e.message,true);$('#contactList').innerHTML='<div class="empty">تعذر الوصول إلى الدليل.</div>'}}
load();
</script></body></html>
