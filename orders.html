<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الطلبات | Pharma Cloud</title><style>@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap');:root{--p:#0d6e6e;--a:#12a3a3;--bg:#f2f6f8;--ink:#183238;--muted:#6d8085;--line:#dce7ea;--bad:#bf4141;--warn:#a96f12}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px Cairo,Arial}.shell{display:flex;min-height:100vh}.side{position:fixed;right:0;top:0;bottom:0;width:244px;background:var(--p);padding:22px 13px;color:#fff;z-index:20;transition:.25s}.brand{font-size:20px;font-weight:800;padding:0 12px 22px;border-bottom:1px solid #ffffff2b}.brand small{display:block;font-size:11px;font-weight:400;opacity:.72}.nav{padding-top:15px}.nav a{display:block;text-decoration:none;color:#d9f5f5;padding:10px 12px;margin:3px 0;border-radius:9px}.nav a:hover,.nav a.active{background:#ffffff25;color:white}.side-foot{position:absolute;bottom:20px;right:13px;left:13px}.signout{width:100%;padding:10px;border-radius:8px;border:1px solid #ffffff35;background:#ffffff16;color:#fff;font:inherit;cursor:pointer}.main{margin-right:244px;width:calc(100% - 244px)}.top{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;padding:0 29px;position:sticky;top:0;z-index:10}.who{display:flex;gap:9px;align-items:center}.avatar{display:grid;place-items:center;border-radius:50%;width:38px;height:38px;background:#d9f4f4;color:var(--p);font-weight:800}.who b,.who small{display:block}.who small{font-size:11px;color:var(--muted)}.hamb{display:none;font-size:25px;border:0;background:none;color:var(--p)}.page{max-width:1500px;margin:auto;padding:28px}.title{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px}.title h1{font-size:24px;margin:0}.title p{margin:4px 0;color:var(--muted)}button,.btn{font:inherit;cursor:pointer;border:0;border-radius:8px;padding:10px 14px}.btn{display:inline-block;text-decoration:none}.primary{background:var(--a);color:#fff}.secondary{background:#e0f2f2;color:var(--p)}.muted{background:#edf1f2;color:#65777c}.danger{background:#fff0f0;color:var(--bad)}.tabs{display:flex;gap:7px;margin-bottom:15px}.tabs button.active{background:var(--p);color:white}.panel{background:white;border:1px solid var(--line);border-radius:13px;padding:17px;box-shadow:0 2px 8px #17434a08}.orders{display:grid;gap:11px}.order{border:1px solid var(--line);border-radius:11px;padding:14px;display:grid;grid-template-columns:1.1fr 1fr auto;gap:12px;align-items:center}.order b{display:block}.order small{color:var(--muted);display:block;margin-top:3px}.order-actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-start}.badge{font-size:10px;padding:3px 8px;border-radius:99px;background:#e0f3f2;color:var(--p)}.badge.draft{background:#fff3d8;color:var(--warn)}.badge.received{background:#ddf3e7;color:#267649}.empty{padding:34px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:10px}.modal-back{display:none;position:fixed;inset:0;background:#001a1d80;z-index:50;align-items:center;justify-content:center;padding:15px}.modal-back.open{display:flex}.modal{background:#fff;width:min(760px,100%);max-height:90vh;overflow:auto;border-radius:14px;padding:21px}.modal h2{margin:0 0 15px;font-size:19px}.close{float:left;background:transparent;color:var(--muted);font-size:22px;padding:0}label{display:block;font-size:12px;color:var(--muted);margin:12px 0 5px}select,input{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:#fff;font:inherit}.item-row{display:grid;grid-template-columns:2fr 90px 90px 35px;gap:7px;align-items:end;margin:8px 0;padding:8px;background:#f7fbfb;border-radius:8px}.item-row button{padding:8px;background:#fff0f0;color:var(--bad)}.add-line{margin-top:6px}.modal-actions{display:flex;gap:8px;margin-top:17px}.batch-row{border-bottom:1px solid var(--line);padding:10px 0}.batch-grid{display:grid;grid-template-columns:1fr 1fr 90px;gap:7px;margin-top:6px}.toast{position:fixed;z-index:70;bottom:22px;left:22px;background:#183238;color:#fff;padding:12px 16px;border-radius:8px;opacity:0;transform:translateY(15px);transition:.2s}.toast.show{opacity:1;transform:none}.toast.error{background:var(--bad)}.veil{display:none}@media(max-width:900px){.side{transform:translateX(100%)}.side.open{transform:none;box-shadow:-5px 0 18px #0004}.main{margin:0;width:100%}.hamb{display:block}.veil.open{display:block;position:fixed;inset:0;background:#0005;z-index:19}.page{padding:20px}}@media(max-width:600px){.page{padding:14px}.top{height:63px;padding:0 15px}.title h1{font-size:20px}.order{grid-template-columns:1fr}.item-row{grid-template-columns:1fr 1fr 1fr 35px}.batch-grid{grid-template-columns:1fr}.modal{padding:16px}}</style></head>
<body><div class="shell"><aside class="side" id="side"><div class="brand">Pharma Cloud<small>نظام إدارة الصيدليات</small></div><nav class="nav" id="nav"></nav><div class="side-foot"><button class="signout" onclick="signout()">تسجيل الخروج</button></div></aside><div class="veil" id="veil" onclick="toggleMenu()"></div><main class="main"><header class="top"><button class="hamb" onclick="toggleMenu()">☰</button><span></span><div class="who"><div class="avatar" id="initial"></div><div><b id="userName"></b><small>مدير المنشأة</small></div></div></header><section class="page"><div class="title"><div><h1>طلبات الشراء بين المنشآت</h1><p>إنشاء الطلبات ومتابعة الوارد والصادر</p></div><button class="primary" onclick="openCreate()">طلب جديد</button></div><div class="tabs"><button class="secondary active" data-tab="out" onclick="setTab('out')">الطلبات الصادرة</button><button class="secondary" data-tab="in" onclick="setTab('in')">الطلبات الواردة</button></div><section class="panel"><div class="orders" id="orderList"></div></section></section></main></div>
<div class="modal-back" id="createModal"><div class="modal"><button class="close" onclick="closeModal('createModal')">×</button><h2>طلب شراء جديد</h2><form onsubmit="createOrder(event)"><label>المنشأة المستهدفة</label><select id="supplier" required></select><label>تاريخ التوريد المتوقع</label><input id="expected" type="date"><label>أصناف من مخزونك</label><div id="itemLines"></div><button type="button" class="secondary add-line" onclick="addLine()">+ إضافة صنف</button><div class="modal-actions"><button class="primary">إرسال الطلب</button><button type="button" class="muted" onclick="closeModal('createModal')">إلغاء</button></div></form></div></div>
<div class="modal-back" id="receiveModal"><div class="modal"><button class="close" onclick="closeModal('receiveModal')">×</button><h2 id="receiveTitle">استلام الطلب</h2><p style="color:#6d8085;font-size:12px">أدخل بيانات الدفعات. الأصناف غير الموجودة في منشأتك لن تُسجل كمخزون.</p><form onsubmit="receiveOrder(event)"><div id="batchLines"></div><div class="modal-actions"><button class="primary">تأكيد الاستلام</button><button type="button" class="muted" onclick="closeModal('receiveModal')">إلغاء</button></div></form></div></div><div class="toast" id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const URL='https://jlpjqwlwwuknabfekbth.supabase.co',KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJIUzI1NiIsInJlZiI6ImpscGpxd2x3d3VrbmFiZmVrYnRoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAyOTYxNTAsImV4cCI6MjEwNTg3MjE1MH0.8tcgNJnwGYbKlNZx3899k-h6E7dKWxl2vM9uD3pPFZ0';let session;try{session=JSON.parse(localStorage.getItem('pharma_session')||'null')}catch(e){}if(!session)location.replace('index.html');else if(session.role==='super')location.replace('tenants.html');else if(session.role!=='admin')location.replace('dashboard.html');const db=supabase.createClient(URL,KEY),$=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));let products=[],tenants=[],outgoing=[],incoming=[],active='out',receiving=null;
function menu(){const l=[['dashboard.html','لوحة التحكم'],['pos.html','نقطة البيع'],['purchase.html','المشتريات'],['products.html','الأصناف'],['stock.html','المخزون'],['ledger.html','الحسابات'],['suggestions.html','اقتراحات الطلب'],['orders.html','الطلبات'],['directory.html','دليل المنشآت'],['chat.html','المحادثات'],['users.html','المستخدمون']];$('#nav').innerHTML=l.map(x=>`<a class="${x[0]==='orders.html'?'active':''}" href="${x[0]}">${x[1]}</a>`).join('')}function toggleMenu(){$('#side').classList.toggle('open');$('#veil').classList.toggle('open')}function signout(){localStorage.removeItem('pharma_session');location.replace('index.html')}function toast(t,b=false){const e=$('#toast');e.textContent=t;e.className='toast show '+(b?'error':'');setTimeout(()=>e.className='toast',3600)}function money(v){return new Intl.NumberFormat('ar-SA',{maximumFractionDigits:2}).format(+v||0)+' ر.س'}function date(d){return d?new Date(d).toLocaleDateString('ar-SA'):'—'}function closeModal(id){$('#'+id).classList.remove('open')}function parse(v){if(typeof v!=='string')return v;try{return JSON.parse(v)}catch(e){return null}}
function orderItems(o){let v=parse(o.items??o.order_items??o.lines??o.details);if(!Array.isArray(v))return[];return v.map(x=>({id:x.product_id??x.productId??x.target_product_id??x.product?.id,name:x.name??x.product_name??x.product?.name??'صنف',qty:+(x.quantity??x.qty??x.count??0),price:+(x.unit_price??x.price??0)})).filter(x=>x.id&&x.qty>0)}function setTab(tab){active=tab;document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x.dataset.tab===tab));render()}
function render(){let list=active==='out'?outgoing:incoming;$('#orderList').innerHTML=list.map(o=>{let badge=o.status==='received'?'received':o.status==='draft'?'draft':'';return `<article class="order"><div><b>${esc(o.order_no)}</b><small>${active==='out'?'إلى: ':'من: '}${esc(o.supplier_name||o.target_name||'—')}</small><small>${date(o.created_at)}</small></div><div><span class="badge ${badge}">${esc(o.status)}</span><small>الإجمالي: ${money(o.total)} · ${orderItems(o).length?orderItems(o).length+' صنف':'تفاصيل الأصناف غير متاحة'}</small></div><div class="order-actions">${active==='in'&&o.status==='draft'?`<button class="secondary" onclick="approve('${o.id}')">اعتماد</button>`:''}${active==='in'&&o.status==='sent'?`<button class="primary" onclick="openReceive('${o.id}')">استلام</button>`:''}${o.status==='received'?'<span class="badge received">مستلم</span>':''}</div></article>`}).join('')||`<div class="empty">لا توجد طلبات ${active==='out'?'صادرة':'واردة'} حالياً.</div>`}
function openCreate(){$('#supplier').innerHTML='<option value="">اختر المنشأة النشطة</option>'+tenants.map(t=>`<option value="${t.id}">${esc(t.name)} — ${t.type==='company'?'شركة':'صيدلية'}</option>`).join('');$('#itemLines').innerHTML='';addLine();$('#createModal').classList.add('open')}function addLine(){let div=document.createElement('div');div.className='item-row';div.innerHTML=`<select class="line-product" required><option value="">اختر الصنف</option>${products.map(p=>`<option value="${p.id}">${esc(p.name)} (${money(p.purchase_price)})</option>`).join('')}</select><input class="line-qty" required min="1" step="1" type="number" placeholder="الكمية"><input class="line-price" min="0" step="0.01" type="number" placeholder="السعر"><button type="button" onclick="this.parentElement.remove()">×</button>`;$('#itemLines').append(div)}
async function createOrder(e){e.preventDefault();let target=tenants.find(x=>x.id===$('#supplier').value);let lines=Array.from(document.querySelectorAll('.item-row')).map(row=>{let p=products.find(x=>x.id===row.querySelector('.line-product').value),qty=+row.querySelector('.line-qty').value,price=+row.querySelector('.line-price').value||+(p?.purchase_price||0);return p&&qty>0?{product_id:p.id,productId:p.id,name:p.name,quantity:qty,qty,unit_price:price,price}:null}).filter(Boolean);if(!target||!lines.length){toast('اختر المنشأة وأضف صنفاً صالحاً',true);return}let max=outgoing.reduce((m,o)=>Math.max(m,+(String(o.order_no||'').match(/(\d+)$/)||[,0])[1]),0),order_no='PO-'+String(max+1).padStart(4,'0'),total=lines.reduce((s,x)=>s+x.qty*x.price,0),base={tenant_id:session.tenantId,order_no,supplier_name:target.name,status:'sent',total,expected_date:$('#expected').value||null,created_by:session.userId},full={...base,target_tenant_id:target.id,supplier_tenant_id:target.id,items:lines,order_items:lines};let r=await db.from('purchase_orders').insert(full).select().single();if(r.error)r=await db.from('purchase_orders').insert(base).select().single();if(r.error){toast('تعذر إنشاء الطلب: '+r.error.message,true);return}outgoing.unshift(r.data);closeModal('createModal');render();toast('تم إرسال الطلب '+order_no)}
async function approve(id){let r=await db.from('purchase_orders').update({status:'sent'}).eq('id',id).select().single();if(r.error){toast('تعذر اعتماد الطلب: '+r.error.message,true);return}incoming=incoming.map(x=>x.id===id?r.data:x);render();toast('تم اعتماد الطلب وهو جاهز للاستلام')}
function openReceive(id){receiving=incoming.find(x=>x.id===id);let lines=orderItems(receiving);if(!lines.length){toast('لا توجد بنود محفوظة لهذا الطلب، لا يمكن إنشاء دفعات.',true);return}let next=new Date();next.setFullYear(next.getFullYear()+1);$('#receiveTitle').textContent='استلام '+receiving.order_no;$('#batchLines').innerHTML=lines.map((x,i)=>`<div class="batch-row" data-id="${x.id}" data-qty="${x.qty}" data-price="${x.price}"><b>${esc(x.name)}</b> — ${x.qty} وحدة<div class="batch-grid"><input class="batch-no" required value="${esc('REC-'+receiving.order_no+'-'+(i+1))}" placeholder="رقم الدفعة"><input class="expiry" required type="date" value="${next.toISOString().slice(0,10)}"><input class="received-qty" required type="number" min="0.01" step="0.01" value="${x.qty}"></div></div>`).join('');$('#receiveModal').classList.add('open')}
async function receiveOrder(e){e.preventDefault();if(!receiving)return;let values=Array.from(document.querySelectorAll('.batch-row')).map(x=>({product_id:x.dataset.id,quantity:+x.querySelector('.received-qty').value,purchase_price:+x.dataset.price||0,batch_no:x.querySelector('.batch-no').value.trim(),expiry_date:x.querySelector('.expiry').value})).filter(x=>x.product_id&&x.quantity>0&&x.batch_no&&x.expiry_date);if(!values.length){toast('أدخل بيانات دفعة واحدة على الأقل',true);return}let accepted=[],skipped=[];for(const b of values){if(!products.some(p=>p.id===b.product_id)){skipped.push(b);continue}let old=await db.from('batches').select('id,quantity').eq('tenant_id',session.tenantId).eq('product_id',b.product_id).eq('batch_no',b.batch_no).maybeSingle();let br=old.data?await db.from('batches').update({quantity:(+old.data.quantity||0)+b.quantity,expiry_date:b.expiry_date,purchase_price:b.purchase_price}).eq('id',old.data.id).select().single():await db.from('batches').insert({...b,tenant_id:session.tenantId}).select().single();if(br.error){toast('تعذر حفظ دفعة '+b.batch_no+': '+br.error.message,true);return}let mv=await db.from('movements').insert({tenant_id:session.tenantId,product_id:b.product_id,batch_id:br.data.id,type:'in',quantity:b.quantity,reference_no:receiving.order_no,notes:'استلام طلب شراء',created_by:session.userId});if(mv.error){console.warn(mv.error)}accepted.push(b)}if(!accepted.length){toast('لا تتطابق أصناف الطلب مع أصناف منشأتك.',true);return}let invoiceBase={tenant_id:session.tenantId,invoice_no:'PUR-'+receiving.order_no,customer_name:'مورد: '+(receiving.supplier_name||''),status:'paid',subtotal:accepted.reduce((s,x)=>s+x.quantity*x.purchase_price,0),discount:0,tax:0,total:accepted.reduce((s,x)=>s+x.quantity*x.purchase_price,0),created_by:session.userId};let ir=await db.from('invoices').insert({...invoiceBase,type:'purchase',items:accepted}).select().single();if(ir.error)ir=await db.from('invoices').insert(invoiceBase).select().single();if(ir.error)console.warn('invoice',ir.error);let up=await db.from('purchase_orders').update({status:'received'}).eq('id',receiving.id).select().single();if(up.error){toast('تم حفظ الدفعات لكن تعذر تغيير حالة الطلب: '+up.error.message,true);return}incoming=incoming.map(x=>x.id===receiving.id?up.data:x);closeModal('receiveModal');render();toast('تم استلام الطلب وإنشاء قيد المخزون'+(skipped.length?'؛ تم تجاوز أصناف غير مطابقة.':''))}
async function load(){menu();$('#userName').textContent=session.name||'مدير';$('#initial').textContent=(session.name||'م')[0];try{let [p,t,out,inc]=await Promise.all([db.from('products').select('id,name,purchase_price').eq('tenant_id',session.tenantId).eq('active',true),db.from('tenants').select('id,name,type').eq('active',true).neq('id',session.tenantId).order('name'),db.from('purchase_orders').select('*').eq('tenant_id',session.tenantId).order('created_at',{ascending:false}),db.from('purchase_orders').select('*').or(`target_tenant_id.eq.${session.tenantId},supplier_tenant_id.eq.${session.tenantId}`).order('created_at',{ascending:false})]);if(p.error||t.error||out.error)throw p.error||t.error||out.error;products=p.data||[];tenants=t.data||[];outgoing=out.data||[];incoming=inc.error?[]:(inc.data||[]);if(inc.error)console.info('لا يدعم مخطط قاعدة البيانات حقول توجيه الطلبات:',inc.error.message);render()}catch(err){console.error(err);toast('تعذر تحميل الطلبات: '+(err.message||''),true);$('#orderList').innerHTML='<div class="empty">تعذر الوصول إلى الطلبات.</div>'}}
load();
</script></body></html>
