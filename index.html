<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0B2C4D">
  <meta name="description" content="نظام رفاد - إدارة شركات توزيع الأدوية">
  <title>تسجيل الدخول - رفاد</title>

  <link rel="icon" type="image/png" href="logo.png">
  <link rel="apple-touch-icon" href="icon-192.png">

  <link rel="manifest" href="manifest.json">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdn.jsdelivr.net/npm/dayjs@1.11.10/dayjs.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary: #0B2C4D;
      --primary-light: #1e4a73;
      --primary-dark: #061a2e;
      --accent: #14B8A6;
      --accent-dark: #0d9488;
      --gold: #F59E0B;
      --bg: #F1F5F9;
      --card: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --danger: #ef4444;
      --success: #10b981;
      --shadow: 0 10px 40px rgba(11, 44, 77, 0.08);
      --shadow-hover: 0 20px 60px rgba(11, 44, 77, 0.15);
      --radius: 16px;
      --radius-sm: 10px;
    }

    [data-theme="dark"] {
      --bg: #0a1628;
      --card: #0f2137;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --border: #1e3a5f;
      --shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
      --shadow-hover: 0 20px 60px rgba(0, 0, 0, 0.6);
    }

    html, body {
      height: 100%;
      font-family: 'Cairo', sans-serif;
      background: var(--bg);
      color: var(--text);
      transition: background 0.3s, color 0.3s;
      overflow-x: hidden;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      position: relative;
    }

    /* Background Decoration */
    .bg-decoration {
      position: fixed;
      inset: 0;
      z-index: -1;
      overflow: hidden;
      background:
        radial-gradient(circle at 10% 20%, rgba(20, 184, 166, 0.15), transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(11, 44, 77, 0.15), transparent 40%),
        radial-gradient(circle at 50% 50%, rgba(245, 158, 11, 0.06), transparent 60%);
    }

    .bg-decoration::before,
    .bg-decoration::after {
      content: '';
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.5;
      animation: float 12s ease-in-out infinite;
    }

    .bg-decoration::before {
      width: 400px;
      height: 400px;
      background: var(--accent);
      top: -100px;
      right: -100px;
    }

    .bg-decoration::after {
      width: 350px;
      height: 350px;
      background: var(--primary);
      bottom: -100px;
      left: -100px;
      animation-delay: -6s;
    }

    @keyframes float {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(30px, -30px) scale(1.1); }
    }

    /* Theme Toggle */
    .theme-toggle {
      position: fixed;
      top: 20px;
      left: 20px;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--shadow);
      transition: all 0.3s;
      z-index: 10;
    }

    .theme-toggle:hover {
      transform: rotate(180deg) scale(1.1);
      border-color: var(--accent);
      color: var(--accent);
    }

    /* Install App Button */
    .install-btn {
      position: fixed;
      top: 20px;
      left: 76px;
      height: 44px;
      padding: 0 18px;
      border-radius: 22px;
      background: linear-gradient(135deg, var(--accent), var(--accent-dark));
      border: none;
      color: white;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 20px rgba(20, 184, 166, 0.4);
      transition: all 0.3s;
      z-index: 10;
      font-family: inherit;
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
    }

    .install-btn.show {
      display: flex;
    }

    .install-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(20, 184, 166, 0.55);
    }

    .install-btn i {
      width: 18px;
      height: 18px;
    }

    /* Network Status */
    .network-status {
      position: fixed;
      top: 20px;
      right: 20px;
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      display: none;
      align-items: center;
      gap: 6px;
      z-index: 10;
      box-shadow: var(--shadow);
    }

    .network-status.show {
      display: flex;
    }

    .network-status.offline {
      background: rgba(239, 68, 68, 0.15);
      color: var(--danger);
      border: 1px solid rgba(239, 68, 68, 0.3);
    }

    .network-status.online {
      background: rgba(16, 185, 129, 0.15);
      color: var(--success);
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    /* Login Card */
    .login-wrapper {
      width: 100%;
      max-width: 440px;
      animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .login-card {
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 40px 32px;
      border: 1px solid var(--border);
      transition: box-shadow 0.3s;
    }

    .login-card:hover {
      box-shadow: var(--shadow-hover);
    }

    /* Brand */
    .brand {
      text-align: center;
      margin-bottom: 32px;
    }

    .brand-logo {
      width: 90px;
      height: 90px;
      margin: 0 auto 16px;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 30px rgba(20, 184, 166, 0.3);
      position: relative;
      overflow: hidden;
    }

    .brand-logo::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, transparent 40%, rgba(255,255,255,0.2));
    }

    .brand-logo img {
      width: 70%;
      height: 70%;
      object-fit: contain;
      position: relative;
      z-index: 1;
    }

    .brand-logo .fallback-text {
      color: white;
      font-size: 36px;
      font-weight: 800;
      letter-spacing: -2px;
      position: relative;
      z-index: 1;
    }

    .brand h1 {
      font-size: 28px;
      font-weight: 800;
      color: var(--primary);
      margin-bottom: 6px;
      letter-spacing: -1px;
    }

    [data-theme="dark"] .brand h1 {
      color: var(--accent);
    }

    .brand p {
      color: var(--text-muted);
      font-size: 14px;
      font-weight: 500;
    }

    /* Form */
    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 8px;
    }

    .input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-wrap .icon-left {
      position: absolute;
      right: 14px;
      color: var(--text-muted);
      pointer-events: none;
      transition: color 0.2s;
      width: 20px;
      height: 20px;
    }

    .input-wrap input {
      width: 100%;
      padding: 14px 44px 14px 44px;
      font-family: inherit;
      font-size: 15px;
      background: var(--bg);
      border: 2px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text);
      transition: all 0.2s;
      outline: none;
    }

    .input-wrap input:focus {
      border-color: var(--accent);
      background: var(--card);
      box-shadow: 0 0 0 4px rgba(20, 184, 166, 0.1);
    }

    .input-wrap input:focus ~ .icon-left {
      color: var(--accent);
    }

    .input-wrap input::placeholder {
      color: var(--text-muted);
      opacity: 0.7;
    }

    .input-wrap input:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .toggle-password {
      position: absolute;
      left: 12px;
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 6px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    .toggle-password:hover {
      color: var(--accent);
      background: var(--bg);
    }

    /* Options Row */
    .options-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
      font-size: 13px;
      flex-wrap: wrap;
      gap: 10px;
    }

    .checkbox-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      user-select: none;
      color: var(--text-muted);
    }

    .checkbox-wrap input {
      width: 18px;
      height: 18px;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .checkbox-wrap:hover {
      color: var(--text);
    }

    .forgot-link {
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .forgot-link:hover {
      text-decoration: underline;
    }

    /* Submit Button */
    .btn-login {
      width: 100%;
      padding: 15px;
      font-family: inherit;
      font-size: 16px;
      font-weight: 700;
      color: white;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      border: none;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: all 0.3s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      position: relative;
      overflow: hidden;
    }

    .btn-login::before {
      content: '';
      position: absolute;
      top: 0;
      right: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
      transition: right 0.5s;
    }

    .btn-login:hover:not(:disabled)::before {
      right: 100%;
    }

    .btn-login:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(20, 184, 166, 0.35);
    }

    .btn-login:active:not(:disabled) {
      transform: translateY(0);
    }

    .btn-login:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    .btn-login .spinner {
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      display: none;
    }

    .btn-login.loading .spinner {
      display: block;
    }

    .btn-login.loading .btn-text {
      display: none;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Alerts */
    .alert {
      padding: 12px 16px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 18px;
      display: none;
      align-items: center;
      gap: 10px;
      animation: shake 0.4s;
    }

    .alert.show {
      display: flex;
    }

    .alert.error {
      background: rgba(239, 68, 68, 0.1);
      color: var(--danger);
      border: 1px solid rgba(239, 68, 68, 0.3);
    }

    .alert.warning {
      background: rgba(245, 158, 11, 0.1);
      color: #b45309;
      border: 1px solid rgba(245, 158, 11, 0.3);
    }

    .alert.success {
      background: rgba(16, 185, 129, 0.1);
      color: var(--success);
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      75% { transform: translateX(6px); }
    }

    /* Footer */
    .login-footer {
      text-align: center;
      margin-top: 24px;
      font-size: 12px;
      color: var(--text-muted);
    }

    .login-footer .version {
      display: inline-block;
      padding: 3px 10px;
      background: var(--bg);
      border-radius: 20px;
      margin-top: 8px;
      font-weight: 600;
    }

    /* Install Helper Modal */
    .install-helper {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(11, 44, 77, 0.7);
      backdrop-filter: blur(6px);
      z-index: 300;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .install-helper.show {
      display: flex;
    }

    .install-helper-content {
      background: var(--card);
      border-radius: var(--radius);
      padding: 28px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: var(--shadow-hover);
    }

    .install-helper-content h2 {
      font-size: 20px;
      font-weight: 800;
      color: var(--text);
      margin-bottom: 8px;
    }

    .install-helper-content p {
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.7;
      margin-bottom: 20px;
    }

    .install-helper-content .steps {
      text-align: right;
      background: var(--bg);
      padding: 16px;
      border-radius: 10px;
      margin-bottom: 20px;
      font-size: 13px;
      line-height: 2;
    }

    .install-helper-content .steps strong {
      color: var(--accent);
    }

    /* Responsive */
    @media (max-width: 480px) {
      .login-card {
        padding: 28px 22px;
      }
      .brand-logo {
        width: 72px;
        height: 72px;
      }
      .brand h1 {
        font-size: 24px;
      }
      .theme-toggle {
        top: 12px;
        left: 12px;
        width: 40px;
        height: 40px;
      }
      .install-btn {
        top: 12px;
        left: 60px;
        height: 40px;
        padding: 0 14px;
        font-size: 12px;
      }
      .network-status {
        top: 12px;
        right: 12px;
      }
    }
  </style>
</head>
<body>

  <div class="bg-decoration"></div>

  <button class="theme-toggle" id="themeToggle" title="الوضع الليلي/النهاري">
    <i data-lucide="moon" id="themeIcon" style="width:20px;height:20px;"></i>
  </button>

  <button class="install-btn" id="installBtn" title="تثبيت التطبيق">
    <i data-lucide="download"></i>
    <span>تثبيت التطبيق</span>
  </button>

  <div class="network-status" id="networkStatus">
    <i data-lucide="wifi-off" style="width:14px;height:14px;"></i>
    <span id="networkText">غير متصل</span>
  </div>

  <div class="login-wrapper">
    <div class="login-card">

      <div class="brand">
        <div class="brand-logo">
          <img src="logo.png" alt="رفاد" onerror="this.style.display='none';this.nextElementSibling.style.display='block';">
          <span class="fallback-text" style="display:none;">R</span>
        </div>
        <h1>رفاد</h1>
        <p>نظام إدارة شركات توزيع الأدوية</p>
      </div>

      <div class="alert error" id="alertBox">
        <i data-lucide="alert-circle" style="width:18px;height:18px;flex-shrink:0;"></i>
        <span id="alertMessage"></span>
      </div>

      <form id="loginForm" autocomplete="off">

        <div class="form-group">
          <label for="username">اسم المستخدم</label>
          <div class="input-wrap">
            <input
              type="text"
              id="username"
              name="username"
              placeholder="أدخل اسم المستخدم"
              autocomplete="username"
              required
              autofocus>
            <i data-lucide="user" class="icon-left"></i>
          </div>
        </div>

        <div class="form-group">
          <label for="password">كلمة المرور</label>
          <div class="input-wrap">
            <input
              type="password"
              id="password"
              name="password"
              placeholder="أدخل كلمة المرور"
              autocomplete="current-password"
              required>
            <i data-lucide="lock" class="icon-left"></i>
            <button type="button" class="toggle-password" id="togglePassword" title="إظهار/إخفاء">
              <i data-lucide="eye" id="eyeIcon" style="width:18px;height:18px;"></i>
            </button>
          </div>
        </div>

        <div class="options-row">
          <label class="checkbox-wrap">
            <input type="checkbox" id="rememberMe">
            <span>تذكرني</span>
          </label>
          <a class="forgot-link" id="forgotLink">نسيت كلمة المرور؟</a>
        </div>

        <button type="submit" class="btn-login" id="loginBtn">
          <span class="btn-text" style="display:flex;align-items:center;gap:10px;">
            <i data-lucide="log-in" style="width:18px;height:18px;"></i>
            دخول
          </span>
          <span class="spinner"></span>
        </button>

      </form>

      <p style="margin-top:16px;text-align:center;font-size:12px;color:var(--text-muted);">
        للدخول لإدارة الشركات استخدم حساب مدير الشركات.
      </p>

      <div class="login-footer">
        <div>© <span id="year"></span> رفاد - جميع الحقوق محفوظة</div>
        <span class="version" id="appVersion">v1.0.0</span>
      </div>

    </div>
  </div>

  <!-- Install Helper Modal -->
  <div class="install-helper" id="installHelper">
    <div class="install-helper-content">
      <div style="width:70px;height:70px;background:linear-gradient(135deg,var(--primary),var(--accent));border-radius:20px;margin:0 auto 16px;display:flex;align-items:center;justify-content:center;">
        <i data-lucide="download" style="width:34px;height:34px;color:white;"></i>
      </div>
      <h2>تثبيت تطبيق رفاد</h2>
      <p id="installInstruction">لتثبيت التطبيق على جهازك، اتبع الخطوات:</p>
      <div class="steps" id="installSteps"></div>
      <button class="btn-login" onclick="document.getElementById('installHelper').classList.remove('show')">
        <span style="display:flex;align-items:center;gap:8px;">
          <i data-lucide="check" style="width:18px;height:18px;"></i>
          فهمت
        </span>
      </button>
    </div>
  </div>

  <script src="refad-core.js"></script>
  <script src="refad-auth.js"></script>

  <script>
    (function () {
      'use strict';

      // ============================================================
      // Elements
      // ============================================================
      const form          = document.getElementById('loginForm');
      const usernameInput = document.getElementById('username');
      const passwordInput = document.getElementById('password');
      const rememberMe    = document.getElementById('rememberMe');
      const loginBtn      = document.getElementById('loginBtn');
      const togglePwd     = document.getElementById('togglePassword');
      const eyeIcon       = document.getElementById('eyeIcon');
      const alertBox      = document.getElementById('alertBox');
      const alertMessage  = document.getElementById('alertMessage');
      const themeToggle   = document.getElementById('themeToggle');
      const themeIcon     = document.getElementById('themeIcon');
      const installBtn    = document.getElementById('installBtn');
      const installHelper = document.getElementById('installHelper');
      const networkStatus = document.getElementById('networkStatus');
      const networkText   = document.getElementById('networkText');

      // ============================================================
      // Init Lucide
      // ============================================================
      if (window.lucide) lucide.createIcons();

      // ============================================================
      // Year & Version
      // ============================================================
      document.getElementById('year').textContent = new Date().getFullYear();
      document.getElementById('appVersion').textContent = 'v' + (window.Refad?.version || '1.0.0');

      // ============================================================
      // Theme
      // ============================================================
      function refreshThemeIcon() {
        const isDark = Refad.theme.get() === 'dark';
        themeIcon.setAttribute('data-lucide', isDark ? 'sun' : 'moon');
        if (window.lucide) lucide.createIcons();
      }
      refreshThemeIcon();

      themeToggle.addEventListener('click', () => {
        Refad.theme.toggle();
        refreshThemeIcon();
      });

      // ============================================================
      // Network Status
      // ============================================================
      function updateNetworkStatus() {
        if (!navigator.onLine) {
          networkStatus.classList.add('show', 'offline');
          networkStatus.classList.remove('online');
          networkText.textContent = 'غير متصل بالإنترنت';
          const icon = networkStatus.querySelector('i');
          if (icon) icon.setAttribute('data-lucide', 'wifi-off');
        } else {
          networkStatus.classList.remove('show', 'offline', 'online');
        }
        if (window.lucide) lucide.createIcons();
      }

      window.addEventListener('online', updateNetworkStatus);
      window.addEventListener('offline', updateNetworkStatus);
      updateNetworkStatus();

      // ============================================================
      // PWA Install
      // ============================================================
      let deferredPrompt = null;
      const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
      const isAndroid = /Android/.test(navigator.userAgent);
      const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;

      // إذا كان مثبتاً، لا نعرض الزر
      if (isStandalone) {
        installBtn.style.display = 'none';
      }

      // استقبال Prompt للتثبيت (Android/Chrome/Edge)
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        installBtn.classList.add('show');
      });

      // iOS: لا يوجد Prompt، نعرض الزر مع إرشادات
      if (isIOS && !isStandalone) {
        setTimeout(() => {
          installBtn.classList.add('show');
        }, 2000);
      }

      // Handle install button click
      installBtn.addEventListener('click', async () => {
        // إذا كان Android/Desktop مع prompt
        if (deferredPrompt) {
          deferredPrompt.prompt();
          const { outcome } = await deferredPrompt.userChoice;
          console.log('[PWA] Install outcome:', outcome);
          if (outcome === 'accepted') {
            Refad.toast.success('✅ تم تثبيت التطبيق');
            installBtn.style.display = 'none';
          }
          deferredPrompt = null;
          return;
        }

        // iOS أو حالة عدم وجود prompt
        showInstallInstructions();
      });

      function showInstallInstructions() {
        const stepsEl = document.getElementById('installSteps');
        const instructionEl = document.getElementById('installInstruction');

        if (isIOS) {
          instructionEl.textContent = 'لتثبيت التطبيق على iPhone/iPad:';
          stepsEl.innerHTML = `
            <div><strong>1.</strong> اضغط على زر <strong>المشاركة</strong> <span style="font-family:serif;">⎙</span> في Safari</div>
            <div><strong>2.</strong> اختر <strong>"إضافة إلى الشاشة الرئيسية"</strong></div>
            <div><strong>3.</strong> اضغط <strong>"إضافة"</strong></div>
          `;
        } else if (isAndroid) {
          instructionEl.textContent = 'لتثبيت التطبيق على Android:';
          stepsEl.innerHTML = `
            <div><strong>1.</strong> افتح القائمة <strong>(⋮)</strong> في المتصفح</div>
            <div><strong>2.</strong> اختر <strong>"تثبيت التطبيق"</strong> أو <strong>"إضافة إلى الشاشة الرئيسية"</strong></div>
            <div><strong>3.</strong> اضغط <strong>"تثبيت"</strong></div>
          `;
        } else {
          instructionEl.textContent = 'لتثبيت التطبيق على الكمبيوتر:';
          stepsEl.innerHTML = `
            <div><strong>1.</strong> في Chrome/Edge: ابحث عن أيقونة <strong>تثبيت</strong> <span style="font-family:serif;">⊕</span> في شريط العنوان</div>
            <div><strong>2.</strong> أو افتح قائمة المتصفح <strong>(⋮)</strong></div>
            <div><strong>3.</strong> اختر <strong>"تثبيت رفاد"</strong></div>
          `;
        }

        installHelper.classList.add('show');
        if (window.lucide) lucide.createIcons();
      }

      // إخفاء عند انتهاء التثبيت
      window.addEventListener('appinstalled', () => {
        installBtn.style.display = 'none';
        Refad.toast.success('✅ تم تثبيت التطبيق بنجاح');
      });

      // ============================================================
      // Session Check
      // ============================================================
      (function checkExistingSession() {
        const s = Refad.Session.get();
        if (s) {
          Refad.db.selectOne('users', { eq: { id: s.user_id } })
            .then(user => {
              if (user && user.is_active) {
                window.location.replace(s.is_superadmin ? 'admin.html' : 'dashboard.html');
              } else {
                Refad.Session.clear();
              }
            })
            .catch(() => {
              // لا نحذف الجلسة عند فشل الاتصال
            });
        }
      })();

      // ============================================================
      // Remember Me
      // ============================================================
      const savedUser = localStorage.getItem('refad_last_user');
      if (savedUser) {
        usernameInput.value = savedUser;
        rememberMe.checked = true;
        passwordInput.focus();
      } else {
        usernameInput.focus();
      }

      // ============================================================
      // Toggle Password
      // ============================================================
      togglePwd.addEventListener('click', () => {
        const isPwd = passwordInput.type === 'password';
        passwordInput.type = isPwd ? 'text' : 'password';
        eyeIcon.setAttribute('data-lucide', isPwd ? 'eye-off' : 'eye');
        if (window.lucide) lucide.createIcons();
      });

      // ============================================================
      // Alert
      // ============================================================
      function showAlert(message, type) {
        alertMessage.textContent = message;
        alertBox.className = 'alert ' + (type || 'error') + ' show';
        alertBox.style.animation = 'none';
        void alertBox.offsetWidth;
        alertBox.style.animation = '';
      }

      function hideAlert() {
        alertBox.classList.remove('show');
      }

      // ============================================================
      // Loading State
      // ============================================================
      function setLoading(loading) {
        loginBtn.disabled = loading;
        loginBtn.classList.toggle('loading', loading);
        usernameInput.disabled = loading;
        passwordInput.disabled = loading;
      }

      // ============================================================
      // Forgot Password
      // ============================================================
      document.getElementById('forgotLink').addEventListener('click', (e) => {
        e.preventDefault();
        Refad.alert.info(
          'نسيت كلمة المرور؟',
          `تواصل مع مدير النظام أو الشركة لإعادة تعيين كلمة المرور.\n\n`
        );
      });

      // ============================================================
      // Company Validation
      // ============================================================
      async function validateCompanyAccess(companyId) {
        if (!companyId) {
          return { valid: true, reason: null };
        }

        try {
          const company = await Refad.db.selectOne('companies', {
            columns: 'id, name, is_active, subscription_end',
            eq: { id: companyId }
          });

          if (!company) {
            return {
              valid: false,
              reason: 'الشركة المرتبطة بحسابك غير موجودة. تواصل مع مدير النظام.'
            };
          }

          // 1) الشركة موقوفة
          if (company.is_active === false) {
            return {
              valid: false,
              reason: `⚠️ تم إيقاف شركة "${company.name}" من قِبل الإدارة.\n\nتواصل مع مدير النظام لتفعيل الحساب.`
            };
          }

          // 2) الاشتراك منتهي
          if (company.subscription_end) {
            const days = Refad.date.diffDays(company.subscription_end);
            if (days < 0) {
              return {
                valid: false,
                reason: `⚠️ انتهى اشتراك شركة "${company.name}" منذ ${Math.abs(days)} يوم.\n\nتواصل مع مدير النظام لتجديد الاشتراك.`
              };
            }
          }

          return { valid: true, reason: null, company };
        } catch (e) {
          console.warn('[Login] Company validation failed:', e);
          // في حالة فشل الاتصال، نسمح بالدخول (أفضل من منع المستخدم)
          return { valid: true, reason: null };
        }
      }

      // ============================================================
      // Submit Handler
      // ============================================================
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        hideAlert();

        const username = usernameInput.value.trim();
        const password = passwordInput.value.trim();

        if (!username || !password) {
          showAlert('الرجاء إدخال اسم المستخدم وكلمة المرور');
          return;
        }

        // Check network
        if (!navigator.onLine) {
          showAlert('لا يوجد اتصال بالإنترنت. تحقق من الشبكة وحاول مرة أخرى.', 'warning');
          return;
        }

        setLoading(true);

        try {
          // 1) تسجيل الدخول
          const session = await Refad.Auth.login(username, password, rememberMe.checked);

          // 2) فحص حالة الشركة (لغير superadmin)
          if (!session.is_superadmin && session.company_id) {
            const companyCheck = await validateCompanyAccess(session.company_id);

            if (!companyCheck.valid) {
              // امسح الجلسة
              Refad.Session.clear();
              setLoading(false);
              showAlert(companyCheck.reason, 'error');

              // تفاصيل إضافية
              await Refad.alert.error('🚫 لا يمكن الدخول', companyCheck.reason);

              // Log
              try {
                await Refad.logActivity('login_blocked', 'auth',
                  `محاولة دخول مرفوضة - ${companyCheck.reason}`, session.user_id);
              } catch (logErr) { /* ignore */ }

              return;
            }
          }

          // 3) حفظ "تذكرني"
          if (rememberMe.checked) {
            localStorage.setItem('refad_last_user', username);
          } else {
            localStorage.removeItem('refad_last_user');
          }

          // 4) Success Toast
          if (window.Toastify) {
            Toastify({
              text: `✅ أهلاً بك، ${session.full_name}`,
              duration: 2000,
              gravity: 'top',
              position: 'left',
              style: {
                background: 'linear-gradient(to right, #14B8A6, #0d9488)',
                borderRadius: '10px',
                fontFamily: 'Cairo, sans-serif',
                padding: '12px 20px'
              }
            }).showToast();
          }

          // 5) Redirect
          setTimeout(() => {
            window.location.href = session.is_superadmin ? 'admin.html' : 'dashboard.html';
          }, 500);

        } catch (err) {
          setLoading(false);
          showAlert(err.message || 'حدث خطأ غير متوقع');
          passwordInput.focus();
          passwordInput.select();
        }
      });

      // ============================================================
      // Keyboard Shortcuts
      // ============================================================
      document.addEventListener('keydown', (e) => {
        // Escape → إغلاق modal
        if (e.key === 'Escape' && installHelper.classList.contains('show')) {
          installHelper.classList.remove('show');
        }
      });

      // ============================================================
      // PWA Service Worker
      // ============================================================
      if ('serviceWorker' in navigator && location.protocol === 'https:') {
        navigator.serviceWorker.register('sw.js').catch(err => {
          console.log('[PWA] SW registration skipped:', err.message);
        });
      }

      console.log('%c[Refad] Login page PRO ready', 'color:#14B8A6;font-weight:bold');

    })();
  </script>
