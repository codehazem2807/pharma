<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pharma Cloud ERP — تسجيل الدخول</title>

<!-- خط Cairo -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet" />

<!-- Supabase JS -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
/* ═══════════════════════════════════════════════════════════
   الثيم الطبي الموحد
   ═══════════════════════════════════════════════════════════ */
:root {
  --primary:  #0d6e6e;
  --primary2: #12a3a3;
  --danger:   #e5484d;
  --success:  #17a673;
  --warning:  #f5a524;
  --bg:       #f2f6f8;
  --card:     #ffffff;
  --text:     #1e2a32;
  --muted:    #6b7c8a;
  --border:   #e3eaef;
  --shadow:   0 10px 40px rgba(13, 110, 110, .18);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  font-family: 'Cairo', system-ui, -apple-system, sans-serif;
  color: var(--text);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
}

/* ═══════════════════════════════════════════════════════════
   خلفية متدرجة طبية
   ═══════════════════════════════════════════════════════════ */
body {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  padding: 20px;
  position: relative;
  overflow: hidden;
  background:
    radial-gradient(1200px 600px at 10% 10%, rgba(18, 163, 163, .25), transparent 60%),
    radial-gradient(1000px 500px at 90% 90%, rgba(13, 110, 110, .35), transparent 60%),
    linear-gradient(135deg, #0a5757 0%, #0d6e6e 45%, #0b3d3d 100%);
}

/* دوائر زخرفية عائمة */
body::before,
body::after {
  content: '';
  position: absolute;
  border-radius: 50%;
  filter: blur(80px);
  opacity: .35;
  pointer-events: none;
}
body::before {
  width: 420px; height: 420px;
  background: #12a3a3;
  top: -120px; right: -100px;
  animation: float1 14s ease-in-out infinite;
}
body::after {
  width: 360px; height: 360px;
  background: #17a673;
  bottom: -100px; left: -80px;
  animation: float2 16s ease-in-out infinite;
}
@keyframes float1 {
  0%, 100% { transform: translate(0, 0) scale(1); }
  50%      { transform: translate(-30px, 30px) scale(1.08); }
}
@keyframes float2 {
  0%, 100% { transform: translate(0, 0) scale(1); }
  50%      { transform: translate(30px, -20px) scale(1.1); }
}

/* ═══════════════════════════════════════════════════════════
   بطاقة الدخول (زجاجية)
   ═══════════════════════════════════════════════════════════ */
.login-wrap {
  position: relative;
  z-index: 2;
  width: 100%;
  max-width: 440px;
}

.brand {
  text-align: center;
  margin-bottom: 22px;
  color: #fff;
}
.brand-logo {
  width: 76px; height: 76px;
  margin: 0 auto 14px;
  border-radius: 22px;
  background: linear-gradient(135deg, #12a3a3, #0d6e6e);
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 12px 30px rgba(0, 0, 0, .28), inset 0 0 0 3px rgba(255,255,255,.12);
}
.brand-logo svg { width: 42px; height: 42px; color: #fff; }
.brand h1 {
  font-size: 24px;
  font-weight: 800;
  letter-spacing: .3px;
  margin-bottom: 4px;
}
.brand p {
  font-size: 13.5px;
  opacity: .8;
  font-weight: 500;
}

.card {
  background: rgba(255, 255, 255, .96);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-radius: 22px;
  padding: 30px 26px;
  box-shadow: var(--shadow);
  border: 1px solid rgba(255, 255, 255, .5);
  animation: cardIn .5s cubic-bezier(.2, .8, .2, 1);
}
@keyframes cardIn {
  from { opacity: 0; transform: translateY(20px) scale(.97); }
  to   { opacity: 1; transform: translateY(0)    scale(1); }
}

.card h2 {
  font-size: 19px;
  font-weight: 700;
  margin-bottom: 6px;
  color: var(--text);
}
.card .sub {
  font-size: 13px;
  color: var(--muted);
  margin-bottom: 22px;
}

/* ═══════════════════════════════════════════════════════════
   الحقول
   ═══════════════════════════════════════════════════════════ */
.field { margin-bottom: 16px; }
.field label {
  display: block;
  font-size: 13px;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 7px;
}
.field .input-wrap {
  position: relative;
  display: flex;
  align-items: center;
}
.field .input-wrap .ico {
  position: absolute;
  right: 14px;
  width: 18px; height: 18px;
  color: var(--muted);
  pointer-events: none;
  transition: color .2s;
}
.field input {
  width: 100%;
  padding: 13px 44px 13px 44px;
  font-family: inherit;
  font-size: 14.5px;
  color: var(--text);
  background: #f6fafb;
  border: 1.5px solid var(--border);
  border-radius: 12px;
  outline: none;
  transition: all .2s;
}
.field input:focus {
  background: #fff;
  border-color: var(--primary2);
  box-shadow: 0 0 0 4px rgba(18, 163, 163, .12);
}
.field input:focus ~ .ico { color: var(--primary); }

/* زر إظهار كلمة المرور */
.toggle-pass {
  position: absolute;
  left: 12px;
  background: transparent;
  border: none;
  cursor: pointer;
  padding: 6px;
  border-radius: 8px;
  color: var(--muted);
  display: flex;
  align-items: center;
  transition: all .15s;
}
.toggle-pass:hover { color: var(--primary); background: rgba(13, 110, 110, .08); }
.toggle-pass svg { width: 18px; height: 18px; }

/* ═══════════════════════════════════════════════════════════
   خيارات (تذكرني)
   ═══════════════════════════════════════════════════════════ */
.opts {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 20px;
  font-size: 13px;
}
.chk {
  display: flex;
  align-items: center;
  gap: 8px;
  cursor: pointer;
  user-select: none;
  color: var(--text);
  font-weight: 500;
}
.chk input { display: none; }
.chk .box {
  width: 18px; height: 18px;
  border: 1.5px solid var(--border);
  border-radius: 6px;
  background: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all .15s;
}
.chk .box svg { width: 12px; height: 12px; color: #fff; opacity: 0; transition: opacity .15s; }
.chk input:checked + .box {
  background: var(--primary);
  border-color: var(--primary);
}
.chk input:checked + .box svg { opacity: 1; }

/* ═══════════════════════════════════════════════════════════
   زر الدخول
   ═══════════════════════════════════════════════════════════ */
.btn-login {
  width: 100%;
  padding: 14px;
  font-family: inherit;
  font-size: 15px;
  font-weight: 700;
  color: #fff;
  background: linear-gradient(135deg, var(--primary2), var(--primary));
  border: none;
  border-radius: 12px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  box-shadow: 0 8px 22px rgba(13, 110, 110, .35);
  transition: all .2s;
  position: relative;
  overflow: hidden;
}
.btn-login:hover:not(:disabled) {
  transform: translateY(-2px);
  box-shadow: 0 12px 28px rgba(13, 110, 110, .45);
}
.btn-login:active:not(:disabled) { transform: translateY(0); }
.btn-login:disabled {
  opacity: .75;
  cursor: not-allowed;
  transform: none;
}

/* سبينر التحميل */
.spinner {
  width: 18px; height: 18px;
  border: 2.5px solid rgba(255, 255, 255, .35);
  border-top-color: #fff;
  border-radius: 50%;
  animation: spin .7s linear infinite;
  display: none;
}
.btn-login.loading .spinner { display: block; }
.btn-login.loading .arrow   { display: none; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ═══════════════════════════════════════════════════════════
   حسابات تجريبية
   ═══════════════════════════════════════════════════════════ */
.demo {
  margin-top: 22px;
  padding-top: 18px;
  border-top: 1px dashed var(--border);
  text-align: center;
}
.demo .lbl {
  font-size: 12px;
  color: var(--muted);
  margin-bottom: 10px;
  font-weight: 600;
}
.demo-btns {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  justify-content: center;
}
.demo-btn {
  padding: 7px 14px;
  font-family: inherit;
  font-size: 12.5px;
  font-weight: 600;
  color: var(--primary);
  background: rgba(13, 110, 110, .08);
  border: 1px solid rgba(13, 110, 110, .15);
  border-radius: 20px;
  cursor: pointer;
  transition: all .15s;
}
.demo-btn:hover {
  background: var(--primary);
  color: #fff;
  transform: translateY(-1px);
}

/* ═══════════════════════════════════════════════════════════
   Toast
   ═══════════════════════════════════════════════════════════ */
.toast-wrap {
  position: fixed;
  top: 20px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 9999;
  display: flex;
  flex-direction: column;
  gap: 10px;
  pointer-events: none;
  width: calc(100% - 40px);
  max-width: 400px;
}
.toast {
  padding: 13px 18px;
  border-radius: 12px;
  font-size: 13.5px;
  font-weight: 600;
  color: #fff;
  box-shadow: 0 10px 30px rgba(0, 0, 0, .25);
  display: flex;
  align-items: center;
  gap: 10px;
  animation: toastIn .35s cubic-bezier(.2, .8, .2, 1);
  pointer-events: auto;
}
.toast.err { background: linear-gradient(135deg, #e5484d, #b83a3e); }
.toast.ok  { background: linear-gradient(135deg, #17a673, #0e7d55); }
.toast svg { width: 18px; height: 18px; flex-shrink: 0; }
@keyframes toastIn {
  from { opacity: 0; transform: translateY(-14px) scale(.95); }
  to   { opacity: 1; transform: translateY(0)    scale(1); }
}
.toast.out {
  animation: toastOut .3s ease forwards;
}
@keyframes toastOut {
  to { opacity: 0; transform: translateY(-10px) scale(.95); }
}

/* ═══════════════════════════════════════════════════════════
   Responsive
   ═══════════════════════════════════════════════════════════ */
@media (max-width: 480px) {
  body { padding: 14px; align-items: flex-start; padding-top: 40px; }
  .card { padding: 24px 20px; border-radius: 18px; }
  .brand h1 { font-size: 21px; }
  .brand-logo { width: 66px; height: 66px; border-radius: 18px; }
  .brand-logo svg { width: 36px; height: 36px; }
}
@media (max-width: 360px) {
  .card { padding: 20px 16px; }
  .demo-btn { font-size: 11.5px; padding: 6px 11px; }
}
</style>
</head>
<body>

<!-- ═══ Toast Container ═══ -->
<div class="toast-wrap" id="toastWrap"></div>

<!-- ═══ Login Card ═══ -->
<div class="login-wrap">

  <!-- Brand -->
  <div class="brand">
    <div class="brand-logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M10.5 20.5 3.5 13.5a5 5 0 0 1 7-7l7 7a5 5 0 0 1-7 7Z"/>
        <path d="m8.5 8.5 7 7"/>
        <circle cx="17" cy="7" r="3"/>
      </svg>
    </div>
    <h1>Pharma Cloud ERP</h1>
    <p>نظام إدارة مخازن الأدوية والصيدليات</p>
  </div>

  <!-- Card -->
  <div class="card">
    <h2>تسجيل الدخول</h2>
    <p class="sub">أدخل بياناتك للوصول إلى لوحة التحكم</p>

    <form id="loginForm" autocomplete="off">
      <!-- Username -->
      <div class="field">
        <label for="username">اسم المستخدم</label>
        <div class="input-wrap">
          <input type="text" id="username" name="username" placeholder="مثال: shifa" required />
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
        </div>
      </div>

      <!-- Password -->
      <div class="field">
        <label for="password">كلمة المرور</label>
        <div class="input-wrap">
          <input type="password" id="password" name="password" placeholder="••••••••" required />
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
          <button type="button" class="toggle-pass" id="togglePass" tabindex="-1" title="إظهار/إخفاء">
            <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>

      <!-- Options -->
      <div class="opts">
        <label class="chk">
          <input type="checkbox" id="remember" />
          <span class="box">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="20 6 9 17 4 12"/>
            </svg>
          </span>
          <span>تذكرني</span>
        </label>
      </div>

      <!-- Submit -->
      <button type="submit" class="btn-login" id="btnLogin">
        <span class="spinner"></span>
        <span class="txt">دخول</span>
        <svg class="arrow" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12"/>
          <polyline points="12 19 5 12 12 5"/>
        </svg>
      </button>
    </form>

    <!-- Demo accounts -->
    <div class="demo">
      <div class="lbl">حسابات تجريبية سريعة</div>
      <div class="demo-btns">
        <button type="button" class="demo-btn" data-u="super" data-p="super123">👑 Super</button>
        <button type="button" class="demo-btn" data-u="shifa" data-p="123456">🏢 شركة الشفاء</button>
        <button type="button" class="demo-btn" data-u="nour"  data-p="123456">💊 صيدلية النور</button>
      </div>
    </div>
  </div>

</div>

<script>
/* ═══════════════════════════════════════════════════════════
   إعداد Supabase
   ═══════════════════════════════════════════════════════════ */
const SUPABASE_URL = "https://jlpjqwlwwuknabfekbth.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpscGpxd2x3d3VrbmFiZmVrYnRoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAyOTYxNTAsImV4cCI6MjEwNTg3MjE1MH0.8tcgNJnwGYbKlNZx3899k-h6E7dKWxl2vM9uD3pPFZ0";
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* ═══════════════════════════════════════════════════════════
   ثوابت
   ═══════════════════════════════════════════════════════════ */
const SESSION_KEY  = 'pharma_session';
const REMEMBER_KEY = 'pharma_remember';

/* ═══════════════════════════════════════════════════════════
   Toast Helper
   ═══════════════════════════════════════════════════════════ */
function toast(msg, type = 'err') {
  const wrap = document.getElementById('toastWrap');
  const el = document.createElement('div');
  el.className = 'toast ' + type;

  const icon = type === 'ok'
    ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>'
    : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>';

  el.innerHTML = icon + '<span>' + msg + '</span>';
  wrap.appendChild(el);

  setTimeout(() => {
    el.classList.add('out');
    setTimeout(() => el.remove(), 300);
  }, 3200);
}

/* ═══════════════════════════════════════════════════════════
   Loading state للزر
   ═══════════════════════════════════════════════════════════ */
function setLoading(on) {
  const btn = document.getElementById('btnLogin');
  const txt = btn.querySelector('.txt');
  if (on) {
    btn.classList.add('loading');
    btn.disabled = true;
    txt.textContent = 'جارٍ التحقق...';
  } else {
    btn.classList.remove('loading');
    btn.disabled = false;
    txt.textContent = 'دخول';
  }
}

/* ═══════════════════════════════════════════════════════════
   إظهار / إخفاء كلمة المرور
   ═══════════════════════════════════════════════════════════ */
document.getElementById('togglePass').addEventListener('click', () => {
  const input = document.getElementById('password');
  const icon  = document.getElementById('eyeIcon');
  const isPass = input.type === 'password';
  input.type = isPass ? 'text' : 'password';
  icon.innerHTML = isPass
    ? '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-10-8-10-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 10 8 10 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="2" y1="2" x2="22" y2="22"/>'
    : '<path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/>';
});

/* ═══════════════════════════════════════════════════════════
   أزرار الحسابات التجريبية
   ═══════════════════════════════════════════════════════════ */
document.querySelectorAll('.demo-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.getElementById('username').value = btn.dataset.u;
    document.getElementById('password').value = btn.dataset.p;
    document.getElementById('username').focus();
  });
});

/* ═══════════════════════════════════════════════════════════
   استرجاع "تذكرني" عند تحميل الصفحة
   ═══════════════════════════════════════════════════════════ */
(function restoreRemembered() {
  try {
    const saved = localStorage.getItem(REMEMBER_KEY);
    if (saved) {
      const { username, password } = JSON.parse(saved);
      document.getElementById('username').value = username || '';
      document.getElementById('password').value = password || '';
      document.getElementById('remember').checked = true;
    }
  } catch (e) { /* تجاهل */ }
})();

/* ═══════════════════════════════════════════════════════════
   الدالة الأساسية: تسجيل الدخول
   ═══════════════════════════════════════════════════════════ */
async function login(username, password) {
  // 1) جلب المستخدم من جدول users
  const { data: users, error: userErr } = await supabase
    .from('users')
    .select('id, tenant_id, username, name, role, active')
    .eq('username', username.trim())
    .eq('password', password)
    .limit(1);

  if (userErr) {
    console.error('login user err:', userErr);
    throw new Error('تعذّر الاتصال بالخادم، حاول مرة أخرى');
  }

  if (!users || users.length === 0) {
    throw new Error('اسم المستخدم أو كلمة المرور غير صحيحة');
  }

  const user = users[0];

  // 2) التحقق من active للمستخدم
  if (!user.active) {
    throw new Error('هذا الحساب موقوف، تواصل مع المدير');
  }

  // 3) لو المستخدم ليس super → تحقق من المنشأة
  let tenant = null;
  if (user.role !== 'super') {
    if (!user.tenant_id) {
      throw new Error('هذا الحساب غير مرتبط بأي منشأة');
    }

    const { data: tenants, error: tenErr } = await supabase
      .from('tenants')
      .select('id, name, type, active')
      .eq('id', user.tenant_id)
      .limit(1);

    if (tenErr) {
      console.error('login tenant err:', tenErr);
      throw new Error('تعذّر التحقق من بيانات المنشأة');
    }

    if (!tenants || tenants.length === 0) {
      throw new Error('المنشأة غير موجودة');
    }

    tenant = tenants[0];

    if (!tenant.active) {
      throw new Error('المنشأة موقوفة من قِبل الإدارة، تواصل مع الدعم');
    }
  }

  // 4) بناء الجلسة
  const session = {
    userId:     user.id,
    username:   user.username,
    name:       user.name,
    role:       user.role,
    tenantId:   user.tenant_id,
    tenantName: tenant ? tenant.name : null,
    tenantType: tenant ? tenant.type : null,
    loginAt:    Date.now()
  };

  // 5) حفظ الجلسة
  localStorage.setItem(SESSION_KEY, JSON.stringify(session));

  // 6) حفظ "تذكرني" اختياريًا
  const remember = document.getElementById('remember').checked;
  if (remember) {
    localStorage.setItem(REMEMBER_KEY, JSON.stringify({
      username: user.username,
      password: password
    }));
  } else {
    localStorage.removeItem(REMEMBER_KEY);
  }

  return { user, tenant };
}

/* ═══════════════════════════════════════════════════════════
   التوجيه حسب الدور
   ═══════════════════════════════════════════════════════════ */
function redirectByRole(role) {
  if (role === 'super') {
    window.location.href = 'tenants.html';
  } else if (role === 'admin') {
    window.location.href = 'dashboard.html';
  } else {
    window.location.href = 'pos.html';
  }
}

/* ═══════════════════════════════════════════════════════════
   معالج إرسال الفورم
   ═══════════════════════════════════════════════════════════ */
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();

  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;

  if (!username || !password) {
    toast('يرجى إدخال اسم المستخدم وكلمة المرور');
    return;
  }

  setLoading(true);

  try {
    const { user } = await login(username, password);

    toast('مرحباً ' + user.name + ' 👋', 'ok');

    // تأخير بسيط لإظهار رسالة الترحيب
    setTimeout(() => redirectByRole(user.role), 700);

  } catch (err) {
    console.error('login failed:', err);
    toast(err.message || 'حدث خطأ غير متوقع');
    setLoading(false);
  }
});

/* ═══════════════════════════════════════════════════════════
   إذا كان هناك جلسة سابقة صالحة → توجيه تلقائي
   ═══════════════════════════════════════════════════════════ */
(function autoRedirectIfLoggedIn() {
  try {
    const raw = localStorage.getItem(SESSION_KEY);
    if (!raw) return;
    const s = JSON.parse(raw);
    if (s && s.role && s.loginAt) {
      // جلسة أقل من 12 ساعة → توجيه مباشر
      const age = Date.now() - s.loginAt;
      if (age < 12 * 60 * 60 * 1000) {
        redirectByRole(s.role);
      } else {
        localStorage.removeItem(SESSION_KEY);
      }
    }
  } catch (e) {
    localStorage.removeItem(SESSION_KEY);
  }
})();

/* ═══════════════════════════════════════════════════════════
   تركيز تلقائي على حقل اسم المستخدم
   ═══════════════════════════════════════════════════════════ */
window.addEventListener('load', () => {
  const u = document.getElementById('username');
  if (!u.value) u.focus();
});
</script>
