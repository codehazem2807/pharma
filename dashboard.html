        }
      }

      function performSearch(query) {
        const q = String(query || '').trim().toLowerCase();
        if (!q || q.length < 1) return [];
        const results = [];
        const data = state.searchData;

        data.products
          .filter(p =>
            (p.name || '').toLowerCase().includes(q) ||
            (p.name_en || '').toLowerCase().includes(q) ||
            (p.form || '').toLowerCase().includes(q)
          )
          .slice(0, 5)
          .forEach(p => {
            results.push({
              type: 'product',
              icon: 'package',
              iconClass: 'product',
              title: p.name,
              sub: [p.form, p.unit].filter(Boolean).join(' • ') || 'صنف',
              href: 'products.html?id=' + p.id
            });
          });

        data.customers
          .filter(c =>
            (c.name || '').toLowerCase().includes(q) ||
            (c.phone || '').toLowerCase().includes(q)
          )
          .slice(0, 4)
          .forEach(c => {
            const balance = Number(c.balance) || 0;
            const balanceText = balance !== 0
              ? (balance > 0 ? 'علينا: ' : 'لنا: ') + SafeSettings.locale.formatMoney(Math.abs(balance))
              : 'مصفّى';
            results.push({
              type: 'customer',
              icon: 'user',
              iconClass: 'customer',
              title: c.name,
              sub: (c.phone ? c.phone + ' • ' : '') + balanceText,
              href: 'customer-details.html?id=' + c.id
            });
          });

        data.suppliers
          .filter(s =>
            (s.name || '').toLowerCase().includes(q) ||
            (s.phone || '').toLowerCase().includes(q)
          )
          .slice(0, 4)
          .forEach(s => {
            const balance = Number(s.balance) || 0;
            const balanceText = balance !== 0
              ? 'رصيد: ' + SafeSettings.locale.formatMoney(balance)
              : 'مصفّى';
            results.push({
              type: 'supplier',
              icon: 'truck',
              iconClass: 'supplier',
              title: s.name,
              sub: (s.phone ? s.phone + ' • ' : '') + balanceText,
              href: 'supplier-details.html?id=' + s.id
            });
          });

        data.invoices
          .filter(inv => (inv.invoice_number || '').toLowerCase().includes(q))
          .slice(0, 4)
          .forEach(inv => {
            results.push({
              type: 'invoice',
              icon: 'receipt',
              iconClass: 'invoice',
              title: inv.invoice_number,
              sub: Refad.format.date(inv.invoice_date) + ' • ' + SafeSettings.locale.formatMoney(inv.grand_total),
              href: 'invoices.html?id=' + inv.id
            });
          });

        return results;
      }

      function renderSearchResults(results, query) {
        const container = document.getElementById('searchResults');
        if (!container) return;

        if (!query || query.trim().length < 1) {
          container.classList.remove('show');
          container.innerHTML = '';
          return;
        }

        container.classList.add('show');
        state.searchResults = results;
        state.searchHighlightIndex = -1;

        if (results.length === 0) {
          container.innerHTML = '<div class="search-empty">' +
            '<i data-lucide="search-x"></i>' +
            '<p>لا توجد نتائج لـ "' + Refad.escapeHtml(query) + '"</p>' +
            '<small>جرّب كلمات أخرى</small>' +
            '</div>' +
            '<div class="search-results-footer">' +
              '<span class="hint"><span class="kbd">Esc</span> إغلاق</span>' +
            '</div>';
          if (window.lucide) lucide.createIcons();
          return;
        }

        const groups = {
          product: { label: 'الأصناف', icon: 'package', items: [] },
          customer: { label: 'العملاء', icon: 'user', items: [] },
          supplier: { label: 'الموردين', icon: 'truck', items: [] },
          invoice: { label: 'الفواتير', icon: 'receipt', items: [] }
        };

        results.forEach(r => {
          if (groups[r.type]) groups[r.type].items.push(r);
        });

        let html = '<div class="search-results-header">' +
          '<span><i data-lucide="search" style="width:12px;height:12px;display:inline-block;vertical-align:middle;"></i> نتائج البحث</span>' +
          '<span class="count">' + results.length + ' نتيجة</span>' +
          '</div>';

        let globalIndex = 0;
        Object.keys(groups).forEach(type => {
          const group = groups[type];
          if (!group.items.length) return;

          html += '<div class="search-section">' +
            '<div class="search-section-title">' +
              '<i data-lucide="' + group.icon + '"></i>' +
              group.label + ' (' + group.items.length + ')' +
            '</div>';

          group.items.forEach(item => {
            html += '<a href="' + item.href + '" class="search-result-item" data-result-index="' + globalIndex + '">' +
              '<div class="result-icon ' + item.iconClass + '">' +
                '<i data-lucide="' + item.icon + '"></i>' +
              '</div>' +
              '<div class="result-body">' +
                '<div class="result-name">' + Refad.escapeHtml(item.title) + '</div>' +
                '<div class="result-sub">' + Refad.escapeHtml(item.sub) + '</div>' +
              '</div>' +
              '<i data-lucide="chevron-left" class="result-arrow" style="width:16px;height:16px;"></i>' +
              '</a>';
            globalIndex++;
          });

          html += '</div>';
        });

        html += '<div class="search-results-footer">' +
          '<span class="hint"><span class="kbd">↑</span><span class="kbd">↓</span> للتنقل</span>' +
          '<span class="hint"><span class="kbd">Enter</span> فتح</span>' +
          '<span class="hint"><span class="kbd">Esc</span> إغلاق</span>' +
          '</div>';

        container.innerHTML = html;
        if (window.lucide) lucide.createIcons();
      }

      function navigateSearchResults(direction) {
        const items = document.querySelectorAll('.search-result-item');
        if (!items.length) return;

        items.forEach(item => item.classList.remove('highlighted'));

        if (direction === 'down') {
          state.searchHighlightIndex = (state.searchHighlightIndex + 1) % items.length;
        } else if (direction === 'up') {
          state.searchHighlightIndex = state.searchHighlightIndex <= 0
            ? items.length - 1
            : state.searchHighlightIndex - 1;
        }

        const current = items[state.searchHighlightIndex];
        if (current) {
          current.classList.add('highlighted');
          current.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
        }
      }

      function handleSearchInput(value) {
        const q = value.trim();
        if (!q) {
          renderSearchResults([], '');
          return;
        }

        if (!state.searchData.loaded) {
          const container = document.getElementById('searchResults');
          container.classList.add('show');
          container.innerHTML = '<div class="search-loading"><i data-lucide="loader-2"></i></div>';
          if (window.lucide) lucide.createIcons();
          preloadSearchData().then(() => {
            const results = performSearch(q);
            renderSearchResults(results, q);
          });
          return;
        }

        const results = performSearch(q);
        renderSearchResults(results, q);
      }

      function closeSearch() {
        const container = document.getElementById('searchResults');
        const input = document.getElementById('globalSearch');
        if (container) container.classList.remove('show');
        if (input) input.value = '';
        state.searchHighlightIndex = -1;
      }

      function setupSearch() {
        const input = document.getElementById('globalSearch');
        const container = document.getElementById('searchResults');
        if (!input || !container) return;

        const debouncedSearch = Refad.debounce(handleSearchInput, 200);

        input.addEventListener('input', (e) => debouncedSearch(e.target.value));
        input.addEventListener('focus', async () => {
          if (!state.searchData.loaded) await preloadSearchData();
          if (input.value.trim()) handleSearchInput(input.value);
        });

        input.addEventListener('keydown', (e) => {
          if (e.key === 'ArrowDown') { e.preventDefault(); navigateSearchResults('down'); }
          else if (e.key === 'ArrowUp') { e.preventDefault(); navigateSearchResults('up'); }
          else if (e.key === 'Enter') {
            e.preventDefault();
            const items = document.querySelectorAll('.search-result-item');
            if (state.searchHighlightIndex >= 0 && items[state.searchHighlightIndex]) {
              items[state.searchHighlightIndex].click();
            } else if (items.length > 0) {
              items[0].click();
            }
            closeSearch();
          } else if (e.key === 'Escape') {
            closeSearch();
            input.blur();
          }
        });

        document.addEventListener('click', (e) => {
          if (!e.target.closest('.search-wrapper')) container.classList.remove('show');
        });

        container.addEventListener('click', (e) => {
          if (e.target.closest('.search-result-item')) closeSearch();
        });

        document.addEventListener('keydown', (e) => {
          if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
            e.preventDefault();
            input.focus();
            input.select();
          }
        });
      }

      // ============================================================
      // 12) Notifications
      // ============================================================
      async function checkNotifications() {
        if (!Refad.Session.has('notifications.view')) {
          const btn = document.getElementById('notifBtn');
          if (btn) btn.style.display = 'none';
          return;
        }
        try {
          const unread = await Refad.db.select('notifications', {
            columns: 'id',
            eq: { user_id: session.user_id, is_read: false },
            limit: 100
          });
          const countEl = document.getElementById('notifCount');
          const navItem = document.getElementById('notifNavItem');
          if (unread.length > 0 && countEl) {
            countEl.style.display = 'flex';
            countEl.textContent = unread.length > 99 ? '99+' : unread.length;
            if (navItem && !navItem.querySelector('.badge')) {
              const b = document.createElement('span');
              b.className = 'badge';
              b.textContent = unread.length > 99 ? '99+' : unread.length;
              navItem.appendChild(b);
            }
          }
        } catch (e) {
          console.warn('[Dashboard] Notif check failed:', e.message);
        }
      }

      // ============================================================
      // 13) Theme
      // ============================================================
      function setupTheme() {
        const btn = document.getElementById('themeToggle');
        const icon = document.getElementById('themeIcon');
        if (!btn || !icon) return;
        const refresh = () => {
          const isDark = Refad.theme.get() === 'dark';
          icon.setAttribute('data-lucide', isDark ? 'sun' : 'moon');
          if (window.lucide) lucide.createIcons();
        };
        refresh();
        btn.addEventListener('click', () => {
          Refad.theme.toggle();
          refresh();
          setTimeout(loadChart, 100);
        });
      }

      function setupSidebar() {
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('overlay');
        const btn = document.getElementById('menuToggle');
        if (!btn || !sidebar || !overlay) return;
        btn.addEventListener('click', () => { sidebar.classList.add('open'); overlay.classList.add('show'); });
        overlay.addEventListener('click', () => { sidebar.classList.remove('open'); overlay.classList.remove('show'); });
      }

      function setupUserMenu() {
        const menu = document.getElementById('userMenu');
        const dropdown = document.getElementById('userDropdown');
        if (!menu || !dropdown) return;
        menu.addEventListener('click', (e) => { e.stopPropagation(); dropdown.classList.toggle('show'); });
        document.addEventListener('click', () => dropdown.classList.remove('show'));
        dropdown.addEventListener('click', (e) => e.stopPropagation());
        const logoutBtn = document.getElementById('logoutBtn');
        if (logoutBtn) {
          logoutBtn.addEventListener('click', async () => {
            if (await Refad.alert.confirm('تسجيل الخروج', 'هل تريد الخروج من النظام؟', 'خروج')) {
              await Refad.Auth.logout();
            }
          });
        }
      }

      function setupNotifBtn() {
        const btn = document.getElementById('notifBtn');
        if (!btn) return;
        btn.addEventListener('click', () => {
          window.location.href = 'notifications.html';
        });
      }

      function setupChartRange() {
        document.querySelectorAll('.chart-range-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            document.querySelectorAll('.chart-range-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            state.chartRange = parseInt(btn.dataset.range, 10) || 14;
            loadChart();
          });
        });
      }

      // ============================================================
      // 14) Export
      // ============================================================
      function exportDashboard() {
        try {
          const data = [
            ['تقرير لوحة التحكم - ' + SafeSettings.identity.getSystemName()],
            ['التاريخ', new Date().toLocaleString('ar-EG')],
            ['المستخدم', session.full_name],
            ['']
          ];

          const stats = Array.from(document.querySelectorAll('.stat-card')).map(card => {
            const label = card.querySelector('.label') ? card.querySelector('.label').textContent : '';
            const value = card.querySelector('.value') ? card.querySelector('.value').textContent : '';
            return [label, value];
          });

          data.push(['الإحصائيات', '']);
          stats.forEach(s => data.push(s));

          const alerts = Array.from(document.querySelectorAll('.alert-item')).map(item => {
            const title = item.querySelector('.title') ? item.querySelector('.title').textContent : '';
            const sub = item.querySelector('.sub') ? item.querySelector('.sub').textContent : '';
            return [title, sub];
          });

          if (alerts.length) {
            data.push([''], ['التنبيهات', '']);
            alerts.forEach(a => data.push(a));
          }

          const ws = XLSX.utils.aoa_to_sheet(data);
          const wb = XLSX.utils.book_new();
          XLSX.utils.book_append_sheet(wb, ws, 'Dashboard');
          XLSX.writeFile(wb, 'dashboard-' + Refad.date.today() + '.xlsx');
          Refad.toast.success('تم التصدير');
        } catch (e) {
          console.error('Export failed:', e);
          Refad.toast.error('فشل التصدير: ' + e.message);
        }
      }

      // ============================================================
      // 15) Bind Events
      // ============================================================
      function bindEvents() {
        const refreshBtn = document.getElementById('refreshBtn');
        if (refreshBtn) {
          refreshBtn.addEventListener('click', async () => {
            Refad.toast.info('جارٍ التحديث...');
            state.searchData.loaded = false;
            await Promise.all([loadStats(), loadChart(), loadAlerts(), loadActivity(), checkNotifications(), preloadSearchData()]);
            Refad.toast.success('تم التحديث');
          });
        }

        const exportBtn = document.getElementById('exportBtn');
        if (exportBtn) exportBtn.addEventListener('click', exportDashboard);

        const newSaleBtn = document.getElementById('newSaleBtn');
        if (newSaleBtn) {
          newSaleBtn.addEventListener('click', () => {
            window.location.href = 'pos.html';
          });
        }
      }

      // ============================================================
      // 16) Realtime Theme Listener
      // ============================================================
      function setupRealtimeTheme() {
        window.addEventListener('refad:theme-changed', () => {
          applyIdentity();
          setTimeout(loadChart, 100);
        });
      }

      // ============================================================
      // 17) Load Settings
      // ============================================================
      function loadSettings() {
        try {
          if (window.RefadSettings) {
            state.expiryAlertDays = SafeSettings.inventory.getExpiryAlertDays();
          }
        } catch (e) { console.warn('[loadSettings]', e); }
      }

      // ============================================================
      // 18) Init
      // ============================================================
      async function init() {
        loadSettings();
        buildSidebar();
        buildQuickActions();
        fillUserData();
        setupTheme();
        setupSidebar();
        setupUserMenu();
        setupNotifBtn();
        setupSearch();
        setupChartRange();
        bindEvents();
        applyIdentity();
        setupRealtimeTheme();

        await Promise.all([
          loadStats(),
          loadChart(),
          loadAlerts(),
          loadActivity(),
          checkNotifications()
        ]);

        setTimeout(() => preloadSearchData(), 1500);

        if (Refad.registerServiceWorker) Refad.registerServiceWorker();

        console.log('%c[Refad] Dashboard v4 ready (Theme Sync + Settings)', 'color:#14B8A6;font-weight:bold');
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }
    })();
  </script>

</body>
