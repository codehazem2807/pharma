<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>لوحة التحكم | Pharma Cloud</title>
<style>@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap');:root{--p:#0d6e6e;--a:#12a3a3;--bg:#f2f6f8;--ink:#183238;--muted:#6d8085;--line:#dce7ea;--white:#fff;--danger:#c74646;--warn:#b67717}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Cairo,Arial,sans-serif;font-size:14px}.shell{min-height:100vh;display:flex}.side{width:244px;background:var(--p);color:#fff;padding:22px 13px;position:fixed;right:0;top:0;bottom:0;z-index:20;transition:.25s}.brand{font-size:20px;font-weight:800;padding:0 12px 22px;border-bottom:1px solid #ffffff2b}.brand small{display:block;font-size:11px;font-weight:400;opacity:.7}.nav{padding-top:15px}.nav a{display:block;color:#d9f5f5;text-decoration:none;padding:11px 12px;border-radius:9px;margin:3px 0}.nav a:hover,.nav a.active{background:#ffffff24;color:#fff}.side-foot{position:absolute;bottom:20px;right:13px;left:13px}.signout{width:100%;background:#ffffff17;color:white;border:1px solid #ffffff38;padding:10px;border-radius:8px;font-family:inherit;cursor:pointer}.main{width:calc(100% - 244px);margin-right:244px}.top{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 30px;position:sticky;top:0;z-index:10}.hamb{display:none;border:0;background:transparent;font-size:25px;color:var(--p)}.who{display:flex;align-items:center;gap:10px}.avatar{width:38px;height:38px;border-radius:50%;background:#d9f4f4;color:var(--p);display:grid;place-items:center;font-weight:800}.who b,.who small{display:block}.who small{color:var(--muted);font-size:11px}.page{padding:28px;max-width:1500px;margin:auto}.title{display:flex;justify-content:space-between;align-items:end;margin-bottom:22px}.title h1{font-size:24px;margin:0}.title p{margin:4px 0 0;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:15px}.card{background:#fff;border:1px solid var(--line);border-radius:13px;padding:17px;box-shadow:0 2px 8px #17434a08}.metric .label{color:var(--muted);font-size:12px}.metric .num{font-size:24px;font-weight:800;margin-top:7px;color:var(--p)}.metric .hint{font-size:11px;color:var(--muted);margin-top:4px}.panes{display:grid;grid-template-columns:1.15fr .85fr;gap:16px;margin-top:16px}.panel{background:#fff;border:1px solid var(--line);border-radius:13px;padding:18px}.panel h2{font-size:16px;margin:0 0 15px}.chart-wrap{height:250px;position:relative}canvas{width:100%;height:100%}.alerts{display:grid;gap:9px}.alert{border:1px solid var(--line);border-right:4px solid var(--warn);background:#fffdf8;padding:10px;border-radius:7px}.alert b{display:block;font-size:13px}.alert small{color:var(--muted)}table{width:100%;border-collapse:collapse}th,td{text-align:right;padding:10px 7px;border-bottom:1px solid var(--line);white-space:nowrap}th{font-size:11px;color:var(--muted);font-weight:600}td{font-size:12px}.badge{border-radius:99px;padding:3px 8px;font-size:10px;background:#e1f5f3;color:var(--p)}.empty{padding:30px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:10px}.toast{position:fixed;bottom:22px;left:22px;z-index:60;background:#183238;color:#fff;padding:12px 17px;border-radius:9px;opacity:0;transform:translateY(12px);pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:none}.toast.error{background:var(--danger)}.veil{display:none}@media(max-width:950px){.grid{grid-template-columns:repeat(3,1fr)}.panes{grid-template-columns:1fr}.main{width:100%;margin:0}.side{transform:translateX(100%);box-shadow:-5px 0 20px #0003}.side.open{transform:none}.hamb{display:block}.veil.open{display:block;position:fixed;inset:0;background:#0005;z-index:19}.top{padding:0 18px}.page{padding:20px}}@media(max-width:570px){.grid{grid-template-columns:repeat(2,1fr);gap:10px}.page{padding:15px}.metric{padding:13px}.metric .num{font-size:19px}.title h1{font-size:20px}.top{height:63px}.table-scroll{overflow:auto}.panes{margin-top:10px}}</style>
</head>
<body>
<div class="shell"><aside class="side" id="side"><div class="brand">Pharma Cloud<small>نظام إدارة الصيدليات</small></div><nav class="nav" id="nav"></nav><div class="side-foot"><button class="signout" onclick="signout()">تسجيل الخروج</button></div></aside><div class="veil" id="veil" onclick="toggleMenu()"></div>
<main class="main"><header class="top"><button class="hamb" onclick="toggleMenu()">☰</button><div></div><div class="who"><div class="avatar" id="initial">م</div><div><b id="userName">...</b><small id="roleName">...</small></div></div></header><section class="page"><div class="title"><div><h1>لوحة التحكم</h1><p id="welcome">نظرة مباشرة على أداء منشأتك</p></div><span id="today" class="badge"></span></div><div class="grid" id="metrics"></div><div class="panes"><section class="panel"><h2>المبيعات خلال آخر 7 أيام</h2><div class="chart-wrap"><canvas id="salesChart"></canvas></div></section><section class="panel"><h2>تنبيهات المخزون</h2><div class="alerts" id="alerts"></div></section></div><section class="panel" style="margin-top:16px"><h2>أحدث الفواتير</h2><div class="table-scroll"><table><thead><tr><th>رقم الفاتورة</th><th>العميل</th><th>الحالة</th><th>الإجمالي</th><th>التاريخ</th></tr></thead><tbody id="invoiceRows"></tbody></table></div></section></section></main></div><div class="toast" id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const URL='https://jlpjqwlwwuknabfekbth.supabase.co',KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJpYXQiOjE3OTAyOTYxNTAsImV4cCI6MjEwNTg3MjE1MH0.8tcgNJnwGYbKlNZx3899k-h6E7dKWxl2vM9uD3pPFZ0';
let session;try{session=JSON.parse(localStorage.getItem('pharma_session')||'null')}catch(e){}if(!session)location.replace('index.html');else if(session.role==='super')location.replace('tenants.html');else if(!['admin','user'].includes(session.role)||!session.tenantId)location.replace('index.html');
const db=supabase.createClient(URL,KEY),$=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));let salesPoints=[];
function menu(){const links=session.role==='admin'?[['dashboard.html','لوحة التحكم'],['pos.html','نقطة البيع'],['purchase.html','المشتريات'],['products.html','الأصناف'],['stock.html','المخزون'],['ledger.html','الحسابات'],['suggestions.html','اقتراحات الطلب'],['orders.html','الطلبات'],['directory.html','دليل المنشآت'],['chat.html','المحادثات'],['users.html','المستخدمون']]:[['dashboard.html','لوحة التحكم'],['pos.html','نقطة البيع'],['products.html','الأصناف'],['stock.html','المخزون'],['ledger.html','الحسابات'],['directory.html','دليل المنشآت'],['chat.html','المحادثات']];$('#nav').innerHTML=links.map(x=>`<a class="${x[0]==='dashboard.html'?'active':''}" href="${x[0]}">${x[1]}</a>`).join('')}
function toggleMenu(){$('#side').classList.toggle('open');$('#veil').classList.toggle('open')}function signout(){localStorage.removeItem('pharma_session');location.replace('index.html')}function toast(t,bad=false){const el=$('#toast');el.textContent=t;el.className='toast show '+(bad?'error':'');setTimeout(()=>el.className='toast',3300)}function money(n){return new Intl.NumberFormat('ar-SA',{maximumFractionDigits:2}).format(+n||0)+' ر.س'}function day(d){return new Date(d).toLocaleDateString('ar-SA',{month:'short',day:'numeric'})}
function dateKey(d){const x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')}function draw(points){const c=$('#salesChart'),ctx=c.getContext('2d'),r=c.getBoundingClientRect(),ratio=devicePixelRatio||1;c.width=r.width*ratio;c.height=r.height*ratio;ctx.scale(ratio,ratio);const w=r.width,h=r.height,p=34,max=Math.max(...points.map(x=>x.total),1);ctx.clearRect(0,0,w,h);ctx.strokeStyle='#dce7ea';ctx.fillStyle='#6d8085';ctx.font='11px Cairo';for(let i=0;i<4;i++){let y=18+i*(h-p-18)/3;ctx.beginPath();ctx.moveTo(p,y);ctx.lineTo(w-8,y);ctx.stroke();ctx.fillText(Math.round(max*(1-i/3)).toLocaleString('ar-SA'),2,y+4)}const step=(w-p-10)/6;ctx.beginPath();points.forEach((x,i)=>{let px=p+i*step,py=18+(h-p-18)*(1-x.total/max);i?ctx.lineTo(px,py):ctx.moveTo(px,py)});ctx.strokeStyle='#12a3a3';ctx.lineWidth=3;ctx.stroke();ctx.lineTo(p+6*step,h-p);ctx.lineTo(p,h-p);ctx.fillStyle='#12a3a322';ctx.fill();ctx.fillStyle='#6d8085';points.forEach((x,i)=>ctx.fillText(x.label,p+i*step-12,h-8))}
async function load(){menu();$('#userName').textContent=session.name||'مستخدم';$('#initial').textContent=(session.name||'م').slice(0,1);$('#roleName').textContent=session.role==='admin'?'مدير المنشأة':'مستخدم';$('#today').textContent=new Date().toLocaleDateString('ar-SA',{weekday:'long',year:'numeric',month:'long',day:'numeric'});const now=new Date(),start=new Date(now.getFullYear(),now.getMonth(),now.getDate()),month=new Date(now.getFullYear(),now.getMonth(),1),week=new Date(start);week.setDate(start.getDate()-6);try{const [pr,ba,sales,latest]=await Promise.all([db.from('products').select('id,name,min_stock').eq('tenant_id',session.tenantId).eq('active',true),db.from('batches').select('product_id,quantity,cost,expiry_date').eq('tenant_id',session.tenantId),db.from('invoices').select('invoice_no,total,created_at').eq('tenant_id',session.tenantId).eq('type','sale'),db.from('invoices').select('invoice_no,type,party_name,total,created_at').eq('tenant_id',session.tenantId).order('created_at',{ascending:false}).limit(10)]);for(const result of [pr,ba,sales,latest])if(result.error)throw result.error;const products=pr.data||[],batches=ba.data||[],saleInvoices=sales.data||[],invoices=latest.data||[],stockValue=batches.reduce((sum,b)=>sum+(+b.quantity||0)*(+b.cost||0),0),todaySales=saleInvoices.filter(x=>new Date(x.created_at)>=start).reduce((sum,x)=>sum+(+x.total||0),0),monthSales=saleInvoices.filter(x=>new Date(x.created_at)>=month).reduce((sum,x)=>sum+(+x.total||0),0),stock={};batches.forEach(b=>stock[b.product_id]=(stock[b.product_id]||0)+(+b.quantity||0));const low=products.filter(p=>(stock[p.id]||0)<=+(p.min_stock||0)),soon=batches.filter(b=>{const expiry=new Date(b.expiry_date),limit=new Date();limit.setDate(limit.getDate()+90);return expiry>=start&&expiry<=limit&&+b.quantity>0});$('#metrics').innerHTML=[['الأصناف النشطة',products.length,'صنف متاح للبيع'],['قيمة المخزون',money(stockValue),'بحسب تكلفة الدفعات'],['مبيعات اليوم',money(todaySales),'فواتير البيع فقط'],['مبيعات الشهر',money(monthSales),'من بداية الشهر'],['نواقص المخزون',low.length,'عند أو دون الحد الأدنى']].map(x=>`<div class="card metric"><div class="label">${x[0]}</div><div class="num">${x[1]}</div><div class="hint">${x[2]}</div></div>`).join('');const alerts=[];if(low.length)alerts.push(`<div class="alert"><b>${low.length} صنف عند أو دون الحد الأدنى</b><small>${low.slice(0,3).map(x=>esc(x.name)).join('، ')}</small></div>`);if(soon.length)alerts.push(`<div class="alert" style="border-right-color:#c74646"><b>${soon.length} دفعة تنتهي خلال 90 يوماً</b><small>راجع تواريخ الصلاحية قبل البيع والشراء.</small></div>`);$('#alerts').innerHTML=alerts.join('')||'<div class="empty">لا توجد تنبيهات مخزون حالياً</div>';$('#invoiceRows').innerHTML=invoices.map(x=>`<tr><td>${esc(x.invoice_no)}</td><td>${esc(x.party_name||'—')}</td><td><span class="badge">${x.type==='sale'?'بيع':'شراء'}</span></td><td>${money(x.total)}</td><td>${day(x.created_at)}</td></tr>`).join('')||'<tr><td colspan="5"><div class="empty">لا توجد فواتير بعد</div></td></tr>';salesPoints=[];for(let i=0;i<7;i++){const d=new Date(week);d.setDate(week.getDate()+i);const key=dateKey(d);salesPoints.push({label:d.toLocaleDateString('ar-SA',{weekday:'short'}),total:saleInvoices.filter(x=>dateKey(x.created_at)===key).reduce((sum,x)=>sum+(+x.total||0),0)})}draw(salesPoints)}catch(e){console.error(e);toast('تعذر تحميل بيانات لوحة التحكم: '+(e.message||'خطأ'),true);$('#metrics').innerHTML='<div class="empty" style="grid-column:1/-1">تعذر الوصول إلى البيانات. تأكد من الاتصال والصلاحيات.</div>'}}
window.addEventListener('resize',()=>{if(salesPoints.length)draw(salesPoints)});load();
</script></body></html>
