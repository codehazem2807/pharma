<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0B2C4D">
  <title>الرئيسية - رفاد</title>

  <link rel="icon" type="image/png" href="logo.png">
  <link rel="manifest" href="manifest.json">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Libraries -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdn.jsdelivr.net/npm/dayjs@1.11.10/dayjs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    /* ============================================================
       Reset & CSS Variables
       ============================================================ */
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --primary: #0B2C4D;
      --primary-light: #1e4a73;
      --accent: #14B8A6;
      --accent-dark: #0d9488;
      --gold: #F59E0B;
      --bg: #F1F5F9;
      --card: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --danger: #ef4444;
      --success: #10b981;
      --warning: #f59e0b;
      --info: #3b82f6;
      --sidebar-bg: #0B2C4D;
      --sidebar-text: #cbd5e1;
      --sidebar-active: #14B8A6;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
      --shadow: 0 4px 20px rgba(11, 44, 77, 0.08);
      --shadow-lg: 0 10px 40px rgba(11, 44, 77, 0.12);
      --radius: 14px;
      --radius-sm: 10px;
      --sidebar-w: 260px;
      --topbar-h: 64px;
    }

    [data-theme="dark"] {
      --bg: #0a1628;
      --card: #0f2137;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --border: #1e3a5f;
      --sidebar-bg: #061a2e;
      --sidebar-text: #94a3b8;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.4);
      --shadow: 0 4px 20px rgba(0,0,0,0.4);
      --shadow-lg: 0 10px 40px rgba(0,0,0,0.5);
    }

    html, body {
      height: 100%;
      font-family: 'Cairo', sans-serif;
      background: var(--bg);
      color: var(--text);
      transition: background 0.3s, color 0.3s;
    }

    body {
      display: flex;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ============================================================
       Sidebar
       ============================================================ */
    .sidebar {
      width: var(--sidebar-w);
      height: 100vh;
      background: var(--sidebar-bg);
      color: var(--sidebar-text);
      position: fixed;
      top: 0;
      right: 0;
      z-index: 100;
      display: flex;
      flex-direction: column;
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: -4px 0 20px rgba(0,0,0,0.1);
    }

    .sidebar-header {
      padding: 20px 22px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      display: flex;
      align-items: center;
      gap: 14px;
      height: var(--topbar-h);
      box-sizing: border-box;
    }

    .sidebar-logo {
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, var(--accent), var(--accent-dark));
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 4px 12px rgba(20,184,166,0.4);
    }

    .sidebar-logo img {
      width: 70%;
      height: 70%;
      object-fit: contain;
    }

    .sidebar-logo .fallback {
      color: white;
      font-weight: 800;
      font-size: 18px;
    }

    .sidebar-brand h2 {
      color: white;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.5px;
      line-height: 1.2;
    }

    .sidebar-brand p {
      font-size: 10px;
      color: var(--sidebar-text);
      opacity: 0.7;
      font-weight: 500;
      margin-top: 2px;
    }

    .sidebar-nav {
      flex: 1;
      overflow-y: auto;
      padding: 12px 0;
      scrollbar-width: thin;
      scrollbar-color: rgba(255,255,255,0.15) transparent;
    }

    .sidebar-nav::-webkit-scrollbar { width: 5px; }
    .sidebar-nav::-webkit-scrollbar-track { background: transparent; }
    .sidebar-nav::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,0.15);
      border-radius: 10px;
    }

    .nav-section {
      padding: 8px 20px 4px;
      font-size: 10px;
      font-weight: 700;
      color: rgba(255,255,255,0.35);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-top: 8px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 11px 22px;
      color: var(--sidebar-text);
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      border-right: 3px solid transparent;
      transition: all 0.2s;
      position: relative;
      cursor: pointer;
    }

    .nav-item:hover {
      background: rgba(255,255,255,0.05);
      color: white;
      border-right-color: rgba(20,184,166,0.5);
    }

    .nav-item.active {
      background: rgba(20,184,166,0.12);
      color: white;
      border-right-color: var(--accent);
      font-weight: 600;
    }

    .nav-item.active::before {
      content: '';
      position: absolute;
      right: 0;
      top: 50%;
      transform: translateY(-50%);
      width: 3px;
      height: 60%;
      background: var(--accent);
      border-radius: 0 4px 4px 0;
    }

    .nav-item i,
    .nav-item svg {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
      opacity: 0.85;
    }

    .nav-item .badge {
      margin-right: auto;
      background: var(--danger);
      color: white;
      font-size: 10px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 10px;
      min-width: 20px;
      text-align: center;
    }

    .nav-item .badge.teal { background: var(--accent); }
    .nav-item .badge.gold { background: var(--gold); }

    /* ============================================================
       Main Area
       ============================================================ */
    .main {
      flex: 1;
      margin-right: var(--sidebar-w);
      min-width: 0;
      display: flex;
      flex-direction: column;
    }

    /* ============================================================
       Topbar
       ============================================================ */
    .topbar {
      height: var(--topbar-h);
      background: var(--card);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 0 24px;
      position: sticky;
      top: 0;
      z-index: 50;
      box-shadow: var(--shadow-sm);
    }

    .menu-toggle {
      display: none;
      background: transparent;
      border: none;
      color: var(--text);
      cursor: pointer;
      padding: 8px;
      border-radius: 8px;
      transition: background 0.2s;
    }

    .menu-toggle:hover { background: var(--bg); }

    .topbar-title {
      font-size: 18px;
      font-weight: 700;
      color: var(--text);
      flex-shrink: 0;
    }

    .topbar-title span {
      color: var(--text-muted);
      font-weight: 500;
      font-size: 14px;
      margin-right: 8px;
    }

    .search-box {
      flex: 1;
      max-width: 380px;
      margin-right: auto;
      position: relative;
    }

    .search-box input {
      width: 100%;
      padding: 10px 42px 10px 16px;
      font-family: inherit;
      font-size: 14px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      outline: none;
      transition: all 0.2s;
    }

    .search-box input:focus {
      border-color: var(--accent);
      background: var(--card);
      box-shadow: 0 0 0 3px rgba(20,184,166,0.1);
    }

    .search-box i {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      width: 18px;
      height: 18px;
      color: var(--text-muted);
      pointer-events: none;
    }

    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-right: auto;
    }

    .icon-btn {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      transition: all 0.2s;
    }

    .icon-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
      transform: translateY(-1px);
    }

    .icon-btn i,
    .icon-btn svg { width: 18px; height: 18px; }

    .icon-btn .dot {
      position: absolute;
      top: 8px;
      left: 8px;
      width: 8px;
      height: 8px;
      background: var(--danger);
      border-radius: 50%;
      border: 2px solid var(--card);
    }

    .user-menu {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 5px 12px 5px 5px;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.2s;
      border: 1px solid var(--border);
      background: var(--card);
    }

    .user-menu:hover { background: var(--bg); }

    .user-avatar {
      width: 34px;
      height: 34px;
      border-radius: 9px;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 700;
      font-size: 14px;
      flex-shrink: 0;
      overflow: hidden;
    }

    .user-avatar img { width: 100%; height: 100%; object-fit: cover; }

    .user-info {
      display: flex;
      flex-direction: column;
      line-height: 1.2;
    }

    .user-info .name {
      font-size: 13px;
      font-weight: 700;
      color: var(--text);
    }

    .user-info .role {
      font-size: 11px;
      color: var(--text-muted);
    }

    /* Dropdown */
    .dropdown {
      position: absolute;
      top: calc(100% + 8px);
      left: 0;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      box-shadow: var(--shadow-lg);
      min-width: 200px;
      padding: 6px;
      opacity: 0;
      visibility: hidden;
      transform: translateY(-8px);
      transition: all 0.2s;
      z-index: 100;
    }

    .dropdown.show {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }

    .dropdown-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 12px;
      border-radius: 8px;
      color: var(--text);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s;
      text-decoration: none;
    }

    .dropdown-item:hover { background: var(--bg); }

    .dropdown-item.danger { color: var(--danger); }
    .dropdown-item.danger:hover { background: rgba(239,68,68,0.08); }

    .dropdown-item i { width: 16px; height: 16px; }

    .dropdown-divider {
      height: 1px;
      background: var(--border);
      margin: 6px 0;
    }

    /* ============================================================
       Content Area
       ============================================================ */
    .content {
      padding: 24px;
      flex: 1;
    }

    .page-header {
      margin-bottom: 24px;
    }

    .page-header h1 {
      font-size: 24px;
      font-weight: 800;
      color: var(--text);
      margin-bottom: 4px;
    }

    .page-header p {
      font-size: 14px;
      color: var(--text-muted);
    }

    /* ============================================================
       Stats Cards
       ============================================================ */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }

    .stat-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      display: flex;
      align-items: center;
      gap: 16px;
      box-shadow: var(--shadow-sm);
      transition: all 0.3s;
      position: relative;
      overflow: hidden;
    }

    .stat-card::before {
      content: '';
      position: absolute;
      top: 0;
      right: 0;
      width: 4px;
      height: 100%;
      background: var(--accent);
      transform: scaleY(0);
      transition: transform 0.3s;
    }

    .stat-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow);
      border-color: var(--accent);
    }

    .stat-card:hover::before { transform: scaleY(1); }

    .stat-icon {
      width: 54px;
      height: 54px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .stat-icon i, .stat-icon svg { width: 24px; height: 24px; color: white; }

    .stat-icon.blue   { background: linear-gradient(135deg, #3b82f6, #1d4ed8); }
    .stat-icon.teal   { background: linear-gradient(135deg, #14B8A6, #0d9488); }
    .stat-icon.gold   { background: linear-gradient(135deg, #F59E0B, #d97706); }
    .stat-icon.purple { background: linear-gradient(135deg, #8b5cf6, #6d28d9); }
    .stat-icon.red    { background: linear-gradient(135deg, #ef4444, #b91c1c); }
    .stat-icon.green  { background: linear-gradient(135deg, #10b981, #047857); }

    .stat-body { flex: 1; min-width: 0; }

    .stat-body .label {
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 600;
      margin-bottom: 4px;
    }

    .stat-body .value {
      font-size: 22px;
      font-weight: 800;
      color: var(--text);
      line-height: 1.1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .stat-body .change {
      font-size: 11px;
      font-weight: 600;
      margin-top: 4px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .change.up   { color: var(--success); }
    .change.down { color: var(--danger); }
    .change.flat { color: var(--text-muted); }

    /* Skeleton loading */
    .skeleton {
      background: linear-gradient(90deg, var(--border) 25%, var(--bg) 50%, var(--border) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
      border-radius: 6px;
      color: transparent !important;
    }

    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* ============================================================
       Grid for Charts + Lists
       ============================================================ */
    .grid-2 {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 16px;
      margin-bottom: 16px;
    }

    @media (max-width: 1024px) {
      .grid-2 { grid-template-columns: 1fr; }
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
      overflow: hidden;
      transition: box-shadow 0.3s;
    }

    .card:hover { box-shadow: var(--shadow); }

    .card-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .card-header h3 {
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .card-header h3 i { width: 18px; height: 18px; color: var(--accent); }

    .card-header .link {
      font-size: 12px;
      color: var(--accent);
      font-weight: 600;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: gap 0.2s;
    }

    .card-header .link:hover { gap: 8px; }

    .card-body { padding: 20px; }

    /* Chart wrapper */
    .chart-wrap {
      position: relative;
      height: 280px;
    }

    /* ============================================================
       Alerts List (expiry / low stock)
       ============================================================ */
    .alert-list { display: flex; flex-direction: column; gap: 8px; }

    .alert-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      border-radius: var(--radius-sm);
      background: var(--bg);
      border: 1px solid var(--border);
      transition: all 0.2s;
    }

    .alert-item:hover {
      transform: translateX(-3px);
      border-color: var(--accent);
    }

    .alert-icon {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .alert-icon i { width: 18px; height: 18px; color: white; }

    .alert-icon.danger  { background: linear-gradient(135deg, #ef4444, #b91c1c); }
    .alert-icon.warning { background: linear-gradient(135deg, #F59E0B, #d97706); }
    .alert-icon.info    { background: linear-gradient(135deg, #3b82f6, #1d4ed8); }

    .alert-body { flex: 1; min-width: 0; }

    .alert-body .title {
      font-size: 13px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .alert-body .sub {
      font-size: 11px;
      color: var(--text-muted);
    }

    .empty-state {
      padding: 30px 20px;
      text-align: center;
      color: var(--text-muted);
    }

    .empty-state i {
      width: 42px;
      height: 42px;
      opacity: 0.4;
      margin-bottom: 8px;
    }

    .empty-state p {
      font-size: 13px;
      font-weight: 500;
    }

    /* ============================================================
       Recent Activity
       ============================================================ */
    .activity-list { display: flex; flex-direction: column; }

    .activity-item {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
    }

    .activity-item:last-child { border-bottom: none; }

    .activity-avatar {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 13px;
      flex-shrink: 0;
    }

    .activity-body { flex: 1; min-width: 0; }

    .activity-body .text {
      font-size: 13px;
      color: var(--text);
      font-weight: 500;
      line-height: 1.4;
    }

    .activity-body .text strong { font-weight: 700; }

    .activity-body .time {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 3px;
    }

    /* ============================================================
       Overlay (mobile)
       ============================================================ */
    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 99;
      opacity: 0;
      transition: opacity 0.3s;
    }

    .overlay.show { display: block; opacity: 1; }

    /* ============================================================
       Responsive
       ============================================================ */
    @media (max-width: 1024px) {
      .sidebar { transform: translateX(100%); }
      .sidebar.open { transform: translateX(0); }
      .main { margin-right: 0; }
      .menu-toggle { display: flex; }
      .user-info { display: none; }
    }

    @media (max-width: 640px) {
      .content { padding: 16px; }
      .topbar { padding: 0 14px; gap: 10px; }
      .search-box { display: none; }
      .topbar-title { font-size: 15px; }
      .stats-grid { grid-template-columns: 1fr; gap: 12px; }
      .stat-card { padding: 16px; }
      .stat-body .value { font-size: 19px; }
      .page-header h1 { font-size: 20px; }
    }
  </style>
</head>
<body>

  <!-- ============================================================
       Sidebar
       ============================================================ -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo">
        <img src="logo.png" alt="رفاد" onerror="this.style.display='none';this.parentElement.innerHTML='<span class=fallback>R</span>';">
      </div>
      <div class="sidebar-brand">
        <h2>رفاد</h2>
        <p>نظام إدارة الأدوية</p>
      </div>
    </div>

    <nav class="sidebar-nav" id="sidebarNav">
      <!-- سيتم توليدها بـ JS -->
    </nav>
  </aside>

  <!-- Overlay للموبايل -->
  <div class="overlay" id="overlay"></div>

  <!-- ============================================================
       Main
       ============================================================ -->
  <div class="main">

    <!-- Topbar -->
    <header class="topbar">
      <button class="menu-toggle" id="menuToggle">
        <i data-lucide="menu"></i>
      </button>

      <div class="topbar-title">
        الرئيسية <span id="greeting"></span>
      </div>

      <div class="search-box">
        <input type="text" placeholder="بحث سريع..." id="globalSearch">
        <i data-lucide="search"></i>
      </div>

      <div class="topbar-actions">
        <button class="icon-btn" id="themeToggle" title="الوضع الليلي/النهاري">
          <i data-lucide="moon" id="themeIcon"></i>
        </button>

        <button class="icon-btn" id="notifBtn" title="الإشعارات" style="position:relative;">
          <i data-lucide="bell"></i>
          <span class="dot" id="notifDot" style="display:none;"></span>
        </button>

        <div style="position:relative;">
          <div class="user-menu" id="userMenu">

  <!-- ============================================================
       Scripts
       ============================================================ -->
  <script src="refad-core.js"></script>
  <script src="refad-auth.js"></script>
  <script>
    (function () {
      'use strict';

      // ============================================================
      // 1) Guard: يجب تسجيل الدخول
      // ============================================================
      const session = Refad.Auth.guardPage();
      if (!session) return;

      // ============================================================
      // 2) تعريف قائمة السايدبار
      // ============================================================
      const MENU = [
        {
          section: 'الرئيسية',
          items: [
            { label: 'لوحة التحكم', icon: 'layout-dashboard', href: 'dashboard.html' },
            { label: 'الشات', icon: 'message-circle', href: 'chat.html', permission: 'chat.use' },
            { label: 'الإشعارات', icon: 'bell', href: 'notifications.html', id: 'notifNavItem', permission: 'notifications.view' }
          ]
        },
        {
          section: 'العمليات',
          items: [
            { label: 'الأصناف', icon: 'package', href: 'products.html', permission: 'products.view' },
            { label: 'المخزون', icon: 'warehouse', href: 'inventory.html', permission: 'inventory.view' },
            { label: 'طلبات الشراء', icon: 'clipboard-list', href: 'purchase-requests.html', permission: 'purchases.view' },
            { label: 'الاستلامات', icon: 'package-check', href: 'receipts.html', permission: 'purchases.receive' },
            { label: 'طلبات البيع', icon: 'shopping-cart', href: 'sales-orders.html', permission: 'sales.view' },
            { label: 'نقطة البيع', icon: 'scan-barcode', href: 'pos.html', permission: 'sales.pos', badge: 'POS', badgeClass: 'teal' },
            { label: 'الفواتير', icon: 'receipt', href: 'invoices.html', permission: 'sales.view' }
          ]
        },
        {
          section: 'الأطراف',
          items: [
            { label: 'الموردين', icon: 'truck', href: 'suppliers.html', permission: 'suppliers.view' },
            { label: 'العملاء', icon: 'users', href: 'customers.html', permission: 'customers.view' }
          ]
        },
        {
          section: 'المخزون',
          items: [
            { label: 'الجرد', icon: 'clipboard-check', href: 'stocktake.html', permission: 'inventory.stocktake' },
            { label: 'التسويات', icon: 'sliders-horizontal', href: 'adjustments.html', permission: 'inventory.adjust' }
          ]
        },
        {
          section: 'الموارد البشرية',
          items: [
            { label: 'الموظفين', icon: 'user-cog', href: 'employees.html', permission: 'employees.view' },
            { label: 'الصلاحيات', icon: 'shield-check', href: 'permissions.html', permission: 'permissions.manage' },
            { label: 'الحضور', icon: 'calendar-check', href: 'attendance.html', permission: 'attendance.view' },
            { label: 'الرواتب', icon: 'wallet', href: 'payroll.html', permission: 'payroll.view' }
          ]
        },
        {
          section: 'المالية',
          items: [
            { label: 'المصاريف', icon: 'banknote', href: 'expenses.html', permission: 'expenses.view' },
            { label: 'التقارير', icon: 'bar-chart-3', href: 'reports.html', permission: 'reports.view' }
          ]
        },
        {
          section: 'النظام',
          items: [
            { label: 'إعدادات الشركة', icon: 'settings', href: 'company-settings.html', permission: 'settings.view' },
            { label: 'شاشة الأدمن', icon: 'shield', href: 'admin.html', permission: 'admin.full', badge: 'Admin', badgeClass: 'gold' }
          ]
        }
      ];

      // ============================================================
      // 3) بناء السايدبار
      // ============================================================
      function buildSidebar() {
        const nav = document.getElementById('sidebarNav');
        const currentPage = location.pathname.split('/').pop() || 'dashboard.html';
        const frag = document.createDocumentFragment();

        MENU.forEach(group => {
          // فلترة العناصر حسب الصلاحية
          const allowed = group.items.filter(item => !item.permission || Refad.Session.has(item.permission));
          if (allowed.length === 0) return;

          frag.appendChild(Refad.el('div', { class: 'nav-section' }, group.section));

          allowed.forEach(item => {
            const isActive = item.href === currentPage;

            const link = Refad.el('a', {
              href: item.href,
              class: 'nav-item' + (isActive ? ' active' : ''),
              id: item.id || null
            });

            link.innerHTML = `
              <i data-lucide="${item.icon}"></i>
              <span>${Refad.escapeHtml(item.label)}</span>
              ${item.badge ? `<span class="badge ${item.badgeClass || ''}">${item.badge}</span>` : ''}
            `;

            frag.appendChild(link);
          });
        });

        nav.innerHTML = '';
        nav.appendChild(frag);
        if (window.lucide) lucide.createIcons();
      }

      // ============================================================
      // 4) تعبئة بيانات المستخدم
      // ============================================================
      function fillUserData() {
        const avatar = document.getElementById('userAvatar');
        const name   = document.getElementById('userName');
        const role   = document.getElementById('userRole');
        const greeting = document.getElementById('greeting');

        const initial = (session.full_name || '؟').trim().charAt(0);
        if (session.avatar_url) {
          avatar.innerHTML = `<img src="${Refad.escapeHtml(session.avatar_url)}" alt="">`;
        } else {
          avatar.textContent = initial;
        }
        name.textContent = session.full_name;
        role.textContent = session.is_owner ? 'صاحب الشركة' : 'موظف';

        // تحية حسب الوقت
        const h = new Date().getHours();
        let greet = 'مرحباً';
        if (h < 12) greet = 'صباح الخير';
        else if (h < 17) greet = 'مساء الخير';
        else greet = 'مساء الخير';
        greeting.textContent = `— ${greet}، ${session.full_name.split(' ')[0]}`;
      }

      // ============================================================
      // 5) جلب الإحصائيات
      // ============================================================
      async function loadStats() {
        if (!session.is_owner) return;
        const grid = document.getElementById('statsGrid');
        const companyId = session.company_id;
        const today = Refad.date.today();
        const monthStart = Refad.date.startOfMonth();

        // skeleton أولي
        grid.innerHTML = Array(4).fill(0).map(() => `
          <div class="stat-card">
            <div class="stat-icon skeleton" style="width:54px;height:54px;"></div>
            <div class="stat-body">
              <div class="label skeleton" style="width:60px;height:12px;margin-bottom:6px;">&nbsp;</div>
              <div class="value skeleton" style="width:100px;height:22px;">&nbsp;</div>
            </div>
          </div>
        `).join('');

        try {
          const [productsCount, suppliersCount, customersCount, todaySales, monthSales] = await Promise.all([
            Refad.db.count('products', { eq: { company_id: companyId, is_active: true } }).catch(() => 0),
            Refad.db.count('suppliers', { eq: { company_id: companyId, is_active: true } }).catch(() => 0),
            Refad.db.count('customers', { eq: { company_id: companyId, is_active: true } }).catch(() => 0),
            // مبيعات اليوم
            Refad.db.select('sales_invoices', {
              columns: 'grand_total',
              eq: { company_id: companyId, invoice_date: today, status: 'paid' }
            }).catch(() => []),
            // مبيعات الشهر
            Refad.db.select('sales_invoices', {
              columns: 'grand_total',
              eq: { company_id: companyId, status: 'paid' },
              gte: { invoice_date: monthStart }
            }).catch(() => [])
          ]);

          const todayTotal = todaySales.reduce((s, r) => s + (Number(r.grand_total) || 0), 0);
          const monthTotal = monthSales.reduce((s, r) => s + (Number(r.grand_total) || 0), 0);

          const cards = [
            {
              label: 'الأصناف',
              value: Refad.format.number(productsCount),
              icon: 'package',
              cls: 'blue',
              change: { text: 'نشط', dir: 'flat' }
            },
            {
              label: 'موردين',
              value: Refad.format.number(suppliersCount),
              icon: 'truck',
              cls: 'purple',
              change: { text: 'نشط', dir: 'flat' }
            },
            {
              label: 'مبيعات اليوم',
              value: Refad.format.money(todayTotal),
              icon: 'trending-up',
              cls: 'teal',
              change: { text: `${todaySales.length} فاتورة`, dir: 'up' }
            },
            {
              label: 'مبيعات الشهر',
              value: Refad.format.money(monthTotal),
              icon: 'bar-chart-3',
              cls: 'gold',
              change: { text: `${monthSales.length} فاتورة`, dir: 'up' }
            }
          ];

          grid.innerHTML = cards.map(c => `
            <div class="stat-card">
              <div class="stat-icon ${c.cls}"><i data-lucide="${c.icon}"></i></div>
              <div class="stat-body">
                <div class="label">${Refad.escapeHtml(c.label)}</div>
                <div class="value">${Refad.escapeHtml(c.value)}</div>
                <div class="change ${c.change.dir}">${Refad.escapeHtml(c.change.text)}</div>
              </div>
            </div>
          `).join('');

          if (window.lucide) lucide.createIcons();

        } catch (e) {
          console.error('[Dashboard] Stats error:', e);
          grid.innerHTML = `
            <div class="stat-card" style="grid-column:1/-1;justify-content:center;">
              <div class="stat-body" style="text-align:center;">
                <div class="label">تعذّر تحميل الإحصائيات</div>
                <div class="value" style="font-size:14px;color:var(--danger);">${Refad.escapeHtml(e.message)}</div>
              </div>
            </div>
          `;
        }
      }

      // ============================================================
      // 6) رسم بياني للمبيعات (7 أيام)
      // ============================================================
      let salesChartInstance = null;
      async function loadChart() {
        if (!session.is_owner) return;
        try {
          const companyId = session.company_id;
          const days = [];
          const labels = [];
          for (let i = 6; i >= 0; i--) {
            const d = Refad.date.addDays(Refad.date.today(), -i);
            days.push(d);
            labels.push(Refad.format.date(d, 'DD/MM'));
          }

          const fromDate = days[0];
          const rows = await Refad.db.select('sales_invoices', {
            columns: 'invoice_date, grand_total',
            eq: { company_id: companyId, status: 'paid' },
            gte: { invoice_date: fromDate }
          });

          const totalsByDay = {};
          rows.forEach(r => {
            const d = r.invoice_date;
            totalsByDay[d] = (totalsByDay[d] || 0) + (Number(r.grand_total) || 0);
          });
          const data = days.map(d => totalsByDay[d] || 0);

          const ctx = document.getElementById('salesChart').getContext('2d');
          const isDark = Refad.theme.get() === 'dark';
          const gridColor = isDark ? 'rgba(255,255,255,0.08)' : 'rgba(0,0,0,0.06)';
          const textColor = isDark ? '#94a3b8' : '#64748b';

          if (salesChartInstance) salesChartInstance.destroy();

          salesChartInstance = new Chart(ctx, {
            type: 'line',
            data: {
              labels,
              datasets: [{
                label: 'المبيعات',
                data,
                borderColor: '#14B8A6',
                backgroundColor: (context) => {
                  const chart = context.chart;
                  const { ctx, chartArea } = chart;
                  if (!chartArea) return 'rgba(20,184,166,0.1)';
                  const g = ctx.createLinearGradient(0, chartArea.top, 0, chartArea.bottom);
                  g.addColorStop(0, 'rgba(20,184,166,0.35)');
                  g.addColorStop(1, 'rgba(20,184,166,0)');
                  return g;
                },
                borderWidth: 3,
                fill: true,
                tension: 0.4,
                pointRadius: 4,
                pointHoverRadius: 6,
                pointBackgroundColor: '#14B8A6',
                pointBorderColor: '#fff',
                pointBorderWidth: 2
              }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: {
                legend: { display: false },
                tooltip: {
                  rtl: true,
                  textDirection: 'rtl',
                  backgroundColor: isDark ? '#0f2137' : '#0B2C4D',
                  padding: 12,
                  cornerRadius: 10,
                  titleFont: { family: 'Cairo', size: 13, weight: '700' },
                  bodyFont: { family: 'Cairo', size: 13 },
                  callbacks: {
                    label: (ctx) => ' ' + Refad.format.money(ctx.parsed.y)
                  }
                }
              },
              scales: {
                y: {
                  beginAtZero: true,
                  grid: { color: gridColor, drawBorder: false },
                  ticks: {
                    color: textColor,
                    font: { family: 'Cairo', size: 11 },
                    callback: (v) => Refad.format.number(v)
                  }
                },
                x: {
                  grid: { display: false },
                  ticks: { color: textColor, font: { family: 'Cairo', size: 11 } }
                }
              }
            }
          });

          // إعادة الرسم عند تغيير الثيم
          window.addEventListener('refad:theme-changed', () => loadChart(), { once: true });

        } catch (e) {
          console.error('[Dashboard] Chart error:', e);
        }
      }

      // ============================================================
      // 7) تنبيهات (صلاحية قريبة + مخزون منخفض)
      // ============================================================
      async function loadAlerts() {
        if (!Refad.Session.has('inventory.view')) {
          document.getElementById('alertsCard').style.display = 'none';
          return;
        }
        const list = document.getElementById('alertsList');
        list.innerHTML = `<div class="empty-state"><i data-lucide="loader-2"></i><p>جارٍ التحميل...</p></div>`;
        if (window.lucide) lucide.createIcons();

        try {
          const companyId = session.company_id;
          const in90Days = Refad.date.addDays(Refad.date.today(), 90);

          const [expiring, lowStock] = await Promise.all([
            Refad.db.select('batches', {
              columns: 'id, batch_number, expiry_date, quantity_left, products(name)',
              eq: { company_id: companyId },
              gt: { quantity_left: 0 },
              lte: { expiry_date: in90Days },
              order: { column: 'expiry_date', ascending: true },
              limit: 5
            }).catch(() => []),
            Refad.db.select('products', {
              columns: 'id, name, reorder_level',
              eq: { company_id: companyId, is_active: true },
              limit: 50
            }).catch(() => [])
          ]);

          const items = [];

          expiring.forEach(b => {
            const days = Refad.format.daysLeft(b.expiry_date);
            items.push({
              type: days <= 30 ? 'danger' : 'warning',
              icon: 'calendar-x',
              title: b.products?.name || 'صنف',
              sub: `تشغيلة ${b.batch_number || '—'} • متبقي ${b.quantity_left} • ${days} يوم`
            });
          });

          if (items.length === 0) {
            list.innerHTML = `
              <div class="empty-state">
                <i data-lucide="check-circle-2" style="color:var(--success);opacity:1;"></i>
                <p style="color:var(--text);font-weight:600;">لا توجد تنبيهات</p>
                <p style="font-size:11px;">كل شيء على ما يرام</p>
              </div>`;
          } else {
            list.innerHTML = items.map(it => `
              <div class="alert-item">
                <div class="alert-icon ${it.type}"><i data-lucide="${it.icon}"></i></div>
                <div class="alert-body">
                  <div class="title">${Refad.escapeHtml(it.title)}</div>
                  <div class="sub">${Refad.escapeHtml(it.sub)}</div>
                </div>
              </div>
            `).join('');
          }

          if (window.lucide) lucide.createIcons();
        } catch (e) {
          console.error('[Dashboard] Alerts error:', e);
          list.innerHTML = `<div class="empty-state"><p style="color:var(--danger);">تعذّر التحميل</p></div>`;
        }
      }

      // ============================================================
      // 8) آخر الحركات
      // ============================================================
      async function loadActivity() {
        if (!session.is_owner) return;
        const list = document.getElementById('activityList');
        try {
          const rows = await Refad.db.select('activity_log', {
            columns: 'id, action, module, details, created_at, users(full_name)',
            eq: { company_id: session.company_id },
            order: { column: 'created_at', ascending: false },
            limit: 8
          });

          if (rows.length === 0) {
            list.innerHTML = `
              <div class="empty-state">
                <i data-lucide="inbox"></i>
                <p>لا توجد حركات بعد</p>
              </div>`;
          } else {
            const ACTIONS_AR = {
              'login': 'تسجيل دخول',
              'logout': 'تسجيل خروج',
              'create_user': 'إنشاء موظف',
              'change_password': 'تغيير كلمة مرور',
              'reset_password': 'إعادة تعيين كلمة مرور',
              'unlock_user': 'فتح قفل مستخدم'
            };
            list.innerHTML = rows.map(r => {
              const name = r.users?.full_name || 'مستخدم';
              const initial = name.charAt(0);
              const act = ACTIONS_AR[r.action] || r.action;
              return `
                <div class="activity-item">
                  <div class="activity-avatar">${Refad.escapeHtml(initial)}</div>
                  <div class="activity-body">
                    <div class="text"><strong>${Refad.escapeHtml(name)}</strong> — ${Refad.escapeHtml(act)}</div>
                    <div class="time">${Refad.format.relative(r.created_at)}</div>
                  </div>
                </div>`;
            }).join('');
          }

          if (window.lucide) lucide.createIcons();
        } catch (e) {
          console.error('[Dashboard] Activity error:', e);
          list.innerHTML = `<div class="empty-state"><p style="color:var(--danger);">تعذّر التحميل</p></div>`;
        }
      }

      // ============================================================
      // 9) فحص الإشعارات غير المقروءة
      // ============================================================
      function canViewNotification(notification) {
        const requiredByType = {
          expiry: 'inventory.view',
          low_stock: 'inventory.view',
          invoice: 'sales.view',
          message: 'chat.use',
          payment: 'company.owner'
        };
        const permission = requiredByType[notification.type];
        return !permission || Refad.Session.has(permission);
      }

      async function checkNotifications() {
        if (!Refad.Session.has('notifications.view')) {
          document.getElementById('notifBtn').style.display = 'none';
          return;
        }
        try {
          const unreadRows = await Refad.db.select('notifications', {
            columns: 'type',
            eq: { user_id: session.user_id, is_read: false }
          });
          const unread = unreadRows.filter(canViewNotification).length;
          const dot = document.getElementById('notifDot');
          const navItem = document.getElementById('notifNavItem');
          if (unread > 0) {
            dot.style.display = 'block';
            if (navItem && !navItem.querySelector('.badge')) {
              const b = document.createElement('span');
              b.className = 'badge';
              b.textContent = unread > 99 ? '99+' : unread;
              navItem.appendChild(b);
            }
          }
        } catch (e) {
          console.warn('[Dashboard] Notif check failed:', e.message);
        }
      }

      // ============================================================
      // 10) Theme Toggle
      // ============================================================
      function setupTheme() {
        const btn = document.getElementById('themeToggle');
        const icon = document.getElementById('themeIcon');

        function refresh() {
          const isDark = Refad.theme.get() === 'dark';
          icon.setAttribute('data-lucide', isDark ? 'sun' : 'moon');
          if (window.lucide) lucide.createIcons();
        }
        refresh();

        btn.addEventListener('click', () => {
          Refad.theme.toggle();
          refresh();
        });
      }

      // ============================================================
      // 11) Sidebar (mobile)
      // ============================================================
      function setupSidebar() {
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('overlay');
        const btn = document.getElementById('menuToggle');

        function open() { sidebar.classList.add('open'); overlay.classList.add('show'); }
        function close() { sidebar.classList.remove('open'); overlay.classList.remove('show'); }

        btn.addEventListener('click', open);
        overlay.addEventListener('click', close);
      }

      // ============================================================
      // 12) User Dropdown
      // ============================================================
      function setupUserMenu() {
        const menu = document.getElementById('userMenu');
        const dropdown = document.getElementById('userDropdown');

        menu.addEventListener('click', (e) => {
          e.stopPropagation();
          dropdown.classList.toggle('show');
        });

        document.addEventListener('click', () => dropdown.classList.remove('show'));
        dropdown.addEventListener('click', (e) => e.stopPropagation());

        document.getElementById('logoutBtn').addEventListener('click', async () => {
          const ok = await Refad.alert.confirm('تسجيل الخروج', 'هل تريد الخروج من النظام؟', 'خروج');
          if (ok) await Refad.Auth.logout();
        });
      }

      // ============================================================
      // 13) Notifications Button
      // ============================================================
      function setupNotifBtn() {
        document.getElementById('notifBtn').addEventListener('click', () => {
          window.location.href = 'notifications.html';
        });
      }

      // ============================================================
      // 14) Global Search
      // ============================================================
      function setupSearch() {
        const input = document.getElementById('globalSearch');
        if (!input) return;
        const handler = Refad.debounce(async (q) => {
          if (q.length < 2) return;
          try {
            const products = await Refad.db.select('products', {
              columns: 'id, name',
              eq: { company_id: session.company_id },
              ilike: { name: q },
              limit: 5
            });
            if (products.length > 0) {
              // يمكن لاحقاً فتح modal
              console.log('Search results:', products);
            }
          } catch (e) {
            console.warn('Search failed:', e.message);
          }
        }, 400);
        input.addEventListener('input', (e) => handler(e.target.value.trim()));
      }

      // ============================================================
      // 15) Init
      // ============================================================
      function init() {
        buildSidebar();
        fillUserData();
        if (!session.is_owner) {
          document.getElementById('statsGrid').style.display = 'none';
          document.getElementById('salesChartCard').style.display = 'none';
          document.getElementById('activityCard').style.display = 'none';
        }
        setupTheme();
        setupSidebar();
        setupUserMenu();
        setupNotifBtn();
        setupSearch();

        // بيانات متوازية
        loadStats();
        loadChart();
        loadAlerts();
        loadActivity();
        checkNotifications();

        // تسجيل Service Worker
        Refad.registerServiceWorker();
      }

      // تشغيل بعد تحميل الـ DOM
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }

      console.log('%c[Refad] Dashboard ready', 'color:#14B8A6;font-weight:bold');

    })();
  </script>

</body>
</html>
