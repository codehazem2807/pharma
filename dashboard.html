          console.warn('[Search] Preload failed:', e.message);
        }
      }

      function performSearch(query) {
        const q = String(query || '').trim().toLowerCase();
        if (!q || q.length < 1) return [];
        const results = [];
        const data = state.searchData;

        data.products
          .filter(p =>
            (p.name || '').toLowerCase().includes(q) ||
            (p.name_en || '').toLowerCase().includes(q) ||
            (p.form || '').toLowerCase().includes(q)
          )
          .slice(0, 5)
          .forEach(p => {
            results.push({
              type: 'product',
              icon: 'package',
              iconClass: 'product',
              title: p.name,
              sub: [p.form, p.unit].filter(Boolean).join(' • ') || 'صنف',
              href: 'products.html?id=' + p.id
            });
          });

        data.customers
          .filter(c =>
            (c.name || '').toLowerCase().includes(q) ||
            (c.phone || '').toLowerCase().includes(q)
          )
          .slice(0, 4)
          .forEach(c => {
            const balance = Number(c.balance) || 0;
            const balanceText = balance !== 0
              ? (balance > 0 ? 'علينا: ' : 'لنا: ') + SafeSettings.locale.formatMoney(Math.abs(balance))
              : 'مصفّى';
            results.push({
              type: 'customer',
              icon: 'user',
              iconClass: 'customer',
              title: c.name,
              sub: (c.phone ? c.phone + ' • ' : '') + balanceText,
              href: 'customer-details.html?id=' + c.id
            });
          });

        data.suppliers
          .filter(s =>
            (s.name || '').toLowerCase().includes(q) ||
            (s.phone || '').toLowerCase().includes(q)
          )
          .slice(0, 4)
          .forEach(s => {
            const balance = Number(s.balance) || 0;
            const balanceText = balance !== 0
              ? 'رصيد: ' + SafeSettings.locale.formatMoney(balance)
              : 'مصفّى';
            results.push({
              type: 'supplier',
              icon: 'truck',
              iconClass: 'supplier',
              title: s.name,
              sub: (s.phone ? s.phone + ' • ' : '') + balanceText,
              href: 'supplier-details.html?id=' + s.id
            });
          });

        data.invoices
          .filter(inv => (inv.invoice_number || '').toLowerCase().includes(q))
          .slice(0, 4)
          .forEach(inv => {
            results.push({
              type: 'invoice',
              icon: 'receipt',
              iconClass: 'invoice',
              title: inv.invoice_number,
              sub: Refad.format.date(inv.invoice_date) + ' • ' + SafeSettings.locale.formatMoney(inv.grand_total),
              href: 'invoices.html?id=' + inv.id
            });
          });

        return results;
      }

      function renderSearchResults(results, query) {
        const container = document.getElementById('searchResults');
        if (!container) return;

        if (!query || query.trim().length < 1) {
          container.classList.remove('show');
          container.innerHTML = '';
          return;
        }

        container.classList.add('show');
        state.searchResults = results;
        state.searchHighlightIndex = -1;

        if (results.length === 0) {
          container.innerHTML = '<div class="search-empty">' +
            '<i data-lucide="search-x"></i>' +
            '<p>لا توجد نتائج لـ "' + Refad.escapeHtml(query) + '"</p>' +
            '<small>جرّب كلمات أخرى</small>' +
            '</div>' +
            '<div class="search-results-footer">' +
              '<span class="hint"><span class="kbd">Esc</span> إغلاق</span>' +
            '</div>';
          if (window.lucide) lucide.createIcons();
          return;
        }

        const groups = {
          product: { label: 'الأصناف', icon: 'package', items: [] },
          customer: { label: 'العملاء', icon: 'user', items: [] },
          supplier: { label: 'الموردين', icon: 'truck', items: [] },
          invoice: { label: 'الفواتير', icon: 'receipt', items: [] }
        };

        results.forEach(r => {
          if (groups[r.type]) groups[r.type].items.push(r);
        });

        let html = '<div class="search-results-header">' +
          '<span><i data-lucide="search" style="width:12px;height:12px;display:inline-block;vertical-align:middle;"></i> نتائج البحث</span>' +
          '<span class="count">' + results.length + ' نتيجة</span>' +
          '</div>';

        let globalIndex = 0;
        Object.keys(groups).forEach(type => {
          const group = groups[type];
          if (!group.items.length) return;

          html += '<div class="search-section">' +
            '<div class="search-section-title">' +
              '<i data-lucide="' + group.icon + '"></i>' +
              group.label + ' (' + group.items.length + ')' +
            '</div>';

          group.items.forEach(item => {
            html += '<a href="' + item.href + '" class="search-result-item" data-result-index="' + globalIndex + '">' +
              '<div class="result-icon ' + item.iconClass + '">' +
                '<i data-lucide="' + item.icon + '"></i>' +
              '</div>' +
              '<div class="result-body">' +
                '<div class="result-name">' + Refad.escapeHtml(item.title) + '</div>' +
                '<div class="result-sub">' + Refad.escapeHtml(item.sub) + '</div>' +
              '</div>' +
              '<i data-lucide="chevron-left" class="result-arrow" style="width:16px;height:16px;"></i>' +
              '</a>';
            globalIndex++;
          });

          html += '</div>';
        });

        html += '<div class="search-results-footer">' +
          '<span class="hint"><span class="kbd">↑</span><span class="kbd">↓</span> للتنقل</span>' +
          '<span class="hint"><span class="kbd">Enter</span> فتح</span>' +
          '<span class="hint"><span class="kbd">Esc</span> إغلاق</span>' +
          '</div>';

        container.innerHTML = html;
        if (window.lucide) lucide.createIcons();
      }

      function navigateSearchResults(direction) {
        const items = document.querySelectorAll('.search-result-item');
        if (!items.length) return;

        items.forEach(item => item.classList.remove('highlighted'));

        if (direction === 'down') {
          state.searchHighlightIndex = (state.searchHighlightIndex + 1) % items.length;
        } else if (direction === 'up') {
          state.searchHighlightIndex = state.searchHighlightIndex <= 0
            ? items.length - 1
            : state.searchHighlightIndex - 1;
        }

        const current = items[state.searchHighlightIndex];
        if (current) {
          current.classList.add('highlighted');
          current.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
        }
      }

      function handleSearchInput(value) {
        const q = value.trim();
        if (!q) {
          renderSearchResults([], '');
          return;
        }

        if (!state.searchData.loaded) {
          const container = document.getElementById('searchResults');
          container.classList.add('show');
          container.innerHTML = '<div class="search-loading"><i data-lucide="loader-2"></i></div>';
          if (window.lucide) lucide.createIcons();
          preloadSearchData().then(() => {
            const results = performSearch(q);
            renderSearchResults(results, q);
          });
          return;
        }

        const results = performSearch(q);
        renderSearchResults(results, q);
      }

      function closeSearch() {
        const container = document.getElementById('searchResults');
        const input = document.getElementById('globalSearch');
        if (container) container.classList.remove('show');
        if (input) input.value = '';
        state.searchHighlightIndex = -1;
      }

      function setupSearch() {
        const input = document.getElementById('globalSearch');
        const container = document.getElementById('searchResults');
        if (!input || !container) return;

        const debouncedSearch = Refad.debounce(handleSearchInput, 200);

        input.addEventListener('input', (e) => debouncedSearch(e.target.value));
        input.addEventListener('focus', async () => {
          if (!state.searchData.loaded) await preloadSearchData();
          if (input.value.trim()) handleSearchInput(input.value);
        });

        input.addEventListener('keydown', (e) => {
          if (e.key === 'ArrowDown') { e.preventDefault(); navigateSearchResults('down'); }
          else if (e.key === 'ArrowUp') { e.preventDefault(); navigateSearchResults('up'); }
          else if (e.key === 'Enter') {
            e.preventDefault();
            const items = document.querySelectorAll('.search-result-item');
            if (state.searchHighlightIndex >= 0 && items[state.searchHighlightIndex]) {
              items[state.searchHighlightIndex].click();
            } else if (items.length > 0) {
              items[0].click();
            }
            closeSearch();
          } else if (e.key === 'Escape') {
            closeSearch();
            input.blur();
          }
        });

        document.addEventListener('click', (e) => {
          if (!e.target.closest('.search-wrapper')) container.classList.remove('show');
        });

        container.addEventListener('click', (e) => {
          if (e.target.closest('.search-result-item')) closeSearch();
        });

        document.addEventListener('keydown', (e) => {
          if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
            e.preventDefault();
            input.focus();
            input.select();
          }
        });
      }

      // ============================================================
      // 12) Notifications
      // ============================================================
      async function checkNotifications() {
        if (!Refad.Session.has('notifications.view')) {
          const btn = document.getElementById('notifBtn');
          if (btn) btn.style.display = 'none';
          return;
        }
        try {
          const unread = await Refad.db.select('notifications', {
            columns: 'id',
            eq: { user_id: session.user_id, is_read: false },
            limit: 100
          });
          const countEl = document.getElementById('notifCount');
          const navItem = document.getElementById('notifNavItem');
          if (unread.length > 0 && countEl) {
            countEl.style.display = 'flex';
            countEl.textContent = unread.length > 99 ? '99+' : unread.length;
            if (navItem && !navItem.querySelector('.badge')) {
              const b = document.createElement('span');
              b.className = 'badge';
              b.textContent = unread.length > 99 ? '99+' : unread.length;
              navItem.appendChild(b);
            }
          }
        } catch (e) {
          console.warn('[Dashboard] Notif check failed:', e.message);
        }
      }

      // ============================================================
      // 13) Theme
      // ============================================================
      function setupTheme() {
        const btn = document.getElementById('themeToggle');
        const icon = document.getElementById('themeIcon');
        if (!btn || !icon) return;
        const refresh = () => {
          const isDark = Refad.theme.get() === 'dark';
          icon.setAttribute('data-lucide', isDark ? 'sun' : 'moon');
          if (window.lucide) lucide.createIcons();
        };
        refresh();
        btn.addEventListener('click', () => {
          Refad.theme.toggle();
          refresh();
          setTimeout(loadChart, 100);
        });
      }

      function setupSidebar() {
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('overlay');
        const btn = document.getElementById('menuToggle');
        if (!btn || !sidebar || !overlay) return;
        btn.addEventListener('click', () => { sidebar.classList.add('open'); overlay.classList.add('show'); });
        overlay.addEventListener('click', () => { sidebar.classList.remove('open'); overlay.classList.remove('show'); });
      }

      function setupUserMenu() {
        const menu = document.getElementById('userMenu');
        const dropdown = document.getElementById('userDropdown');
        if (!menu || !dropdown) return;
        menu.addEventListener('click', (e) => { e.stopPropagation(); dropdown.classList.toggle('show'); });
        document.addEventListener('click', () => dropdown.classList.remove('show'));
        dropdown.addEventListener('click', (e) => e.stopPropagation());
        const logoutBtn = document.getElementById('logoutBtn');
        if (logoutBtn) {
          logoutBtn.addEventListener('click', async () => {
            if (await Refad.alert.confirm('تسجيل الخروج', 'هل تريد الخروج من النظام؟', 'خروج')) {
              await Refad.Auth.logout();
            }
          });
        }
      }

      function setupNotifBtn() {
        const btn = document.getElementById('notifBtn');
        if (!btn) return;
        btn.addEventListener('click', () => {
          window.location.href = 'notifications.html';
        });
      }

      function setupChartRange() {
        document.querySelectorAll('.chart-range-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            document.querySelectorAll('.chart-range-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            state.chartRange = parseInt(btn.dataset.range, 10) || 14;
            loadChart();
          });
        });
      }

      // ============================================================
      // 14) Export
      // ============================================================
      function exportDashboard() {
        try {
          const data = [
            ['تقرير لوحة التحكم - ' + SafeSettings.identity.getSystemName()],
            ['التاريخ', new Date().toLocaleString('ar-EG')],
            ['المستخدم', session.full_name],
            ['']
          ];

          const stats = Array.from(document.querySelectorAll('.stat-card')).map(card => {
            const label = card.querySelector('.label') ? card.querySelector('.label').textContent : '';
            const value = card.querySelector('.value') ? card.querySelector('.value').textContent : '';
            return [label, value];
          });

          data.push(['الإحصائيات', '']);
          stats.forEach(s => data.push(s));

          const alerts = Array.from(document.querySelectorAll('.alert-item')).map(item => {
            const title = item.querySelector('.title') ? item.querySelector('.title').textContent : '';
            const sub = item.querySelector('.sub') ? item.querySelector('.sub').textContent : '';
            return [title, sub];
          });

          if (alerts.length) {
            data.push([''], ['التنبيهات', '']);
            alerts.forEach(a => data.push(a));
          }

          const ws = XLSX.utils.aoa_to_sheet(data);
          const wb = XLSX.utils.book_new();
          XLSX.utils.book_append_sheet(wb, ws, 'Dashboard');
          XLSX.writeFile(wb, 'dashboard-' + Refad.date.today() + '.xlsx');
          Refad.toast.success('تم التصدير');
        } catch (e) {
          console.error('Export failed:', e);
          Refad.toast.error('فشل التصدير: ' + e.message);
        }
      }

      // ============================================================
      // 15) Bind Events
      // ============================================================
      function bindEvents() {
        const refreshBtn = document.getElementById('refreshBtn');
        if (refreshBtn) {
          refreshBtn.addEventListener('click', async () => {
            Refad.toast.info('جارٍ التحديث...');
            state.searchData.loaded = false;
            await Promise.all([loadStats(), loadChart(), loadAlerts(), loadActivity(), checkNotifications(), preloadSearchData()]);
            Refad.toast.success('تم التحديث');
          });
        }

        const exportBtn = document.getElementById('exportBtn');
        if (exportBtn) exportBtn.addEventListener('click', exportDashboard);

        const newSaleBtn = document.getElementById('newSaleBtn');
        if (newSaleBtn) {
          newSaleBtn.addEventListener('click', () => {
            window.location.href = 'pos.html';
          });
        }
      }

      // ============================================================
      // 16) Realtime Theme
      // ============================================================
      function setupRealtimeTheme() {
        window.addEventListener('refad:theme-changed', () => {
          applyIdentity();
          setTimeout(loadChart, 100);
        });
      }

      // ============================================================
      // 17) Load Settings
      // ============================================================
      function loadSettings() {
        try {
          if (window.RefadSettings) {
            state.expiryAlertDays = SafeSettings.inventory.getExpiryAlertDays();
          }
        } catch (e) { console.warn('[loadSettings]', e); }
      }

      // ============================================================
      // 18) Init Dashboard
      // ============================================================
      async function initDashboard() {
        loadSettings();
        buildSidebar();
        buildQuickActions();
        fillUserData();
        setupTheme();
        setupSidebar();
        setupUserMenu();
        setupNotifBtn();
        setupSearch();
        setupChartRange();
        bindEvents();
        applyIdentity();
        setupRealtimeTheme();

        await Promise.all([
          loadStats(),
          loadChart(),
          loadAlerts(),
          loadActivity(),
          checkNotifications()
        ]);

        setTimeout(() => preloadSearchData(), 1500);

        if (Refad.registerServiceWorker) Refad.registerServiceWorker();

        console.log('%c[Refad] Dashboard v4 ready (Theme Sync + Settings)', 'color:#14B8A6;font-weight:bold');
      }

      // ============================================================
      // 19) Public API للجزء 4
      // ============================================================
      window.__DASHBOARD = {
        session: session,
        isOwner: isOwner,
        canUseAI: canUseAI,
        state: state,
        reload: async function () {
          state.searchData.loaded = false;
          await Promise.all([
            loadStats(),
            loadChart(),
            loadAlerts(),
            loadActivity(),
            checkNotifications(),
            preloadSearchData()
          ]);
        }
      };

      // ============================================================
      // 20) Start
      // ============================================================
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initDashboard);
      } else {
        initDashboard();
      }

    })();

  </script>
    <!-- ============================================================
       AI AGENT INTEGRATION
       ============================================================ -->
  <script>
    (function () {
      'use strict';

      // ============================================================
      // 0) انتظر Dashboard + AI جاهزين
      // ============================================================
      const Dashboard = window.__DASHBOARD;
      if (!Dashboard) {
        console.error('[AI-Integration] Dashboard not ready!');
        return;
      }

      const { session, isOwner, canUseAI } = Dashboard;

      // ============================================================
      // 1) فحص الصلاحيات — المالك والمدير فقط
      // ============================================================
      function checkAIAccess() {
        if (!canUseAI) {
          console.log('[AI-Integration] ⚠️ AI متاح للمالك والمدير فقط');
          return false;
        }
        return true;
      }

      // ============================================================
      // 2) إظهار أزرار AI
      // ============================================================
      function showAIButtons() {
        const topbarBtn = document.getElementById('aiTopbarBtn');
        const reportBtn = document.getElementById('aiReportBtn');

        if (topbarBtn) {
          topbarBtn.style.display = 'flex';
          topbarBtn.addEventListener('click', function () {
            if (window.AIAgent && window.AIAgent.toggle) {
              window.AIAgent.toggle();
            }
          });
        }

        if (reportBtn) {
          reportBtn.style.display = 'inline-flex';
          reportBtn.addEventListener('click', runSmartReport);
        }

        // زر "تحليل ذكي" في كارت التنبيهات
        injectAlertsAIAction();
      }

      // ============================================================
      // 3) زر تحليل ذكي في كارت التنبيهات
      // ============================================================
      function injectAlertsAIAction() {
        const alertsHeader = document.querySelector('#alertsCard .card-header');
        if (!alertsHeader) return;
        if (alertsHeader.querySelector('.ai-alerts-btn')) return;

        const btn = document.createElement('button');
        btn.className = 'ai-alerts-btn';
        btn.type = 'button';
        btn.title = 'تحليل ذكي للتنبيهات';
        btn.innerHTML = '✨';
        btn.style.cssText = [
          'width: 28px',
          'height: 28px',
          'border-radius: 8px',
          'border: 1px solid var(--border)',
          'background: linear-gradient(135deg, var(--purple), #6d28d9)',
          'color: white',
          'cursor: pointer',
          'display: flex',
          'align-items: center',
          'justify-content: center',
          'font-size: 14px',
          'margin-right: auto',
          'transition: all 0.2s'
        ].join(';');

        btn.addEventListener('mouseenter', function () {
          this.style.transform = 'scale(1.1)';
        });
        btn.addEventListener('mouseleave', function () {
          this.style.transform = 'scale(1)';
        });

        btn.addEventListener('click', function (e) {
          e.stopPropagation();
          analyzeAlerts();
        });

        alertsHeader.appendChild(btn);
      }

      // ============================================================
      // 4) تحليل ذكي شامل (Smart Report)
      // ============================================================
      function runSmartReport() {
        if (!window.AIAgent || !window.AIAgent.send) {
          if (window.Refad && Refad.toast) {
            Refad.toast.error('AI Agent مش جاهز');
          }
          return;
        }

        // فتح الشات
        if (window.AIAgent.open) window.AIAgent.open();

        // اختيار شخصية المحلل المالي
        if (window.AIAgent.setPersona) {
          window.AIAgent.setPersona('financial');
        }

        // إرسال طلب التقرير
        const reportPrompt = buildSmartReportPrompt();

        setTimeout(function () {
          window.AIAgent.send(reportPrompt);
        }, 400);
      }

      function buildSmartReportPrompt() {
        const today = new Date().toLocaleDateString('ar-EG', {
          weekday: 'long',
          year: 'numeric',
          month: 'long',
          day: 'numeric'
        });

        return [
          '🎯 مطلوب تقرير ذكي شامل عن الشركة',
          '',
          '📅 التاريخ: ' + today,
          '',
          'المطلوب:',
          '1️⃣ ملخص شامل لأداء الشركة (مبيعات، أرباح، اتجاهات)',
          '2️⃣ أهم 3 تنبيهات حرجة تحتاج تصرف فوري',
          '3️⃣ تحليل المخاطر الحالية (ائتمان، سيولة، مخزون)',
          '4️⃣ 5 توصيات عملية قابلة للتنفيذ',
          '5️⃣ توقعات للأسبوع الجاي',
          '',
          '🎯 كن دقيق، استخدم الأرقام، واذكر النسب المئوية'
        ].join('\n');
      }

      // ============================================================
      // 5) تحليل التنبيهات
      // ============================================================
      function analyzeAlerts() {
        if (!window.AIAgent || !window.AIAgent.send) {
          if (window.Refad && Refad.toast) {
            Refad.toast.error('AI Agent مش جاهز');
          }
          return;
        }

        // فتح الشات
        if (window.AIAgent.open) window.AIAgent.open();

        // اختيار شخصية مدقق المخاطر (إذا كان مالك)
        if (isOwner && window.AIAgent.setPersona) {
          window.AIAgent.setPersona('risk');
        } else if (window.AIAgent.setPersona) {
          window.AIAgent.setPersona('inventory');
        }

        // جمع التنبيهات الظاهرة حالياً
        const alerts = collectVisibleAlerts();

        let prompt = '';
        if (alerts.length === 0) {
          prompt = [
            '🤔 لاحظت إن مفيش تنبيهات حالياً.',
            '',
            'من فضلك:',
            '1️⃣ اعمل مسح شامل للشركة واكتشف أي مشاكل مخفية',
            '2️⃣ راجع المخزون، الائتمان، السيولة',
            '3️⃣ قولي فيه إيه ممكن يحصل خلال الأسبوع الجاي'
          ].join('\n');
        } else {
          prompt = [
            '🚨 عندي ' + alerts.length + ' تنبيه في الداشبورد:',
            '',
            alerts.map(function (a, i) {
              return (i + 1) + '. ' + a.title + ' — ' + a.sub;
            }).join('\n'),
            '',
            'المطلوب:',
            '1️⃣ رتّبهم حسب الأولوية (عاجل / مهم / عادي)',
            '2️⃣ قولي لكل واحد: إجراء محدد + المسؤول',
            '3️⃣ اكتشف لو فيه تنبيهات تانية مخفية مش ظاهرة',
            '4️⃣ توقّع المشاكل اللي ممكن تحصل لو مفيش تصرف'
          ].join('\n');
        }

        setTimeout(function () {
          window.AIAgent.send(prompt);
        }, 400);
      }

      function collectVisibleAlerts() {
        const alerts = [];
        const items = document.querySelectorAll('#alertsList .alert-item');
        items.forEach(function (item) {
          const title = item.querySelector('.title');
          const sub = item.querySelector('.sub');
          if (title) {
            alerts.push({
              title: title.textContent.trim(),
              sub: sub ? sub.textContent.trim() : ''
            });
          }
        });
        return alerts;
      }

      // ============================================================
      // 6) اختصارات كيبورد
      // ============================================================
      function setupKeyboardShortcuts() {
        document.addEventListener('keydown', function (e) {
          // Ctrl + I → فتح/قفل AI
          if ((e.ctrlKey || e.metaKey) && e.key === 'i') {
            e.preventDefault();
            if (window.AIAgent && window.AIAgent.toggle) {
              window.AIAgent.toggle();
            }
          }

          // Ctrl + Shift + R → تقرير ذكي
          if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key === 'R') {
            e.preventDefault();
            runSmartReport();
          }
        });
      }

      // ============================================================
      // 7) اقتراحات ذكية تلقائية (اختياري)
      // ============================================================
      function setupAutoSuggestions() {
        // نشوف لو المستخدم فاتح الداشبورد وفيه تنبيهات حرجة
        // نقترح عليه يفتح AI (بس مش تلقائياً — بس نضيف badge)
        setTimeout(function () {
          const criticalAlerts = document.querySelectorAll('#alertsList .alert-icon.danger');
          if (criticalAlerts.length > 0 && window.AIAgent) {
            const fab = document.querySelector('#aiFab');
            if (fab && !fab.querySelector('.ai-critical-badge')) {
              const badge = document.createElement('span');
              badge.className = 'ai-critical-badge';
              badge.textContent = '!';
              badge.style.cssText = [
                'position: absolute',
                'top: -6px',
                'left: -6px',
                'width: 22px',
                'height: 22px',
                'border-radius: 50%',
                'background: var(--danger)',
                'color: white',
                'font-size: 14px',
                'font-weight: 800',
                'display: flex',
                'align-items: center',
                'justify-content: center',
                'border: 2px solid white',
                'animation: ai-rec-pulse 1.5s ease-in-out infinite',
                'z-index: 4'
              ].join(';');
              fab.appendChild(badge);
            }
          }
        }, 3000);
      }

      // ============================================================
      // 8) Init
      // ============================================================
      function init() {
        if (!checkAIAccess()) {
          return;
        }

        // انتظر AI Agent يجهّز (بحد أقصى 5 ثواني)
        let attempts = 0;
        const waitForAI = setInterval(function () {
          attempts++;
          if (window.AIAgent && window.AIAgent.init) {
            clearInterval(waitForAI);
            bootAI();
          } else if (attempts > 50) {
            clearInterval(waitForAI);
            console.warn('[AI-Integration] ⚠️ AI Agent مش جاهز بعد 5 ثواني');
            // نعرض الأزرار على أي حال
            showAIButtons();
          }
        }, 100);
      }

      function bootAI() {
        try {
          // Init AI Agent بالـ session
          window.AIAgent.init(session);

          // إظهار الأزرار
          showAIButtons();

          // اختصارات كيبورد
          setupKeyboardShortcuts();

          // اقتراحات ذكية
          setTimeout(setupAutoSuggestions, 3000);

          console.log('%c[AI-Integration] ✅ Ready — AI for owner/manager', 'color:#8b5cf6;font-weight:bold');
        } catch (e) {
          console.error('[AI-Integration] ❌ bootAI failed:', e);
        }
      }

      // ============================================================
      // 9) Start
      // ============================================================
      // ننتظر Dashboard يخلص أولاً
      setTimeout(init, 500);

      // ============================================================
      // 10) Public API (اختياري)
      // ============================================================
      window.AIDashboard = {
        report: runSmartReport,
        analyzeAlerts: analyzeAlerts,
        open: function () {
          if (window.AIAgent && window.AIAgent.open) window.AIAgent.open();
        },
        close: function () {
          if (window.AIAgent && window.AIAgent.close) window.AIAgent.close();
        }
      };

    })();
  </script>
