<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0B2C4D">
  <title>الإشعارات - رفاد</title>

  <link rel="icon" type="image/png" href="logo.png">
  <link rel="manifest" href="manifest.json">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdn.jsdelivr.net/npm/dayjs@1.11.10/dayjs.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --primary: #0B2C4D;
      --primary-light: #1e4a73;
      --accent: #14B8A6;
      --accent-dark: #0d9488;
      --gold: #F59E0B;
      --bg: #F1F5F9;
      --card: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --danger: #ef4444;
      --success: #10b981;
      --warning: #f59e0b;
      --info: #3b82f6;
      --purple: #8b5cf6;
      --sidebar-bg: #0B2C4D;
      --sidebar-text: #cbd5e1;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
      --shadow: 0 4px 20px rgba(11, 44, 77, 0.08);
      --shadow-lg: 0 10px 40px rgba(11, 44, 77, 0.12);
      --radius: 14px;
      --radius-sm: 10px;
      --sidebar-w: 260px;
      --topbar-h: 64px;
    }

    [data-theme="dark"] {
      --bg: #0a1628;
      --card: #0f2137;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --border: #1e3a5f;
      --sidebar-bg: #061a2e;
      --sidebar-text: #94a3b8;
    }

    html, body {
      height: 100%;
      font-family: 'Cairo', sans-serif;
      background: var(--bg);
      color: var(--text);
      transition: background 0.3s, color 0.3s;
    }

    body { display: flex; min-height: 100vh; overflow-x: hidden; }

    /* ============ Sidebar ============ */
    .sidebar {
      width: var(--sidebar-w);
      height: 100vh;
      background: var(--sidebar-bg);
      color: var(--sidebar-text);
      position: fixed;
      top: 0; right: 0;
      z-index: 100;
      display: flex; flex-direction: column;
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: -4px 0 20px rgba(0,0,0,0.1);
    }
    .sidebar-header {
      padding: 20px 22px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      display: flex; align-items: center; gap: 14px;
      height: var(--topbar-h);
      box-sizing: border-box;
    }
    .sidebar-logo {
      width: 40px; height: 40px;
      background: linear-gradient(135deg, var(--accent), var(--accent-dark));
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 4px 12px rgba(20,184,166,0.4);
      overflow: hidden;
    }
    .sidebar-logo img { width: 70%; height: 70%; object-fit: contain; }
    .sidebar-logo .fallback { color: white; font-weight: 800; font-size: 18px; }
    .sidebar-brand h2 { color: white; font-size: 20px; font-weight: 800; line-height: 1.2; }
    .sidebar-brand p { font-size: 10px; color: var(--sidebar-text); opacity: 0.7; font-weight: 500; margin-top: 2px; }
    .sidebar-nav { flex: 1; overflow-y: auto; padding: 12px 0; scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.15) transparent; }
    .sidebar-nav::-webkit-scrollbar { width: 5px; }
    .sidebar-nav::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 10px; }
    .nav-section { padding: 8px 20px 4px; font-size: 10px; font-weight: 700; color: rgba(255,255,255,0.35); text-transform: uppercase; letter-spacing: 1px; margin-top: 8px; }
    .nav-item {
      display: flex; align-items: center; gap: 12px;
      padding: 11px 22px;
      color: var(--sidebar-text);
      text-decoration: none;
      font-size: 14px; font-weight: 500;
      border-right: 3px solid transparent;
      transition: all 0.2s;
      position: relative;
      cursor: pointer;
    }
    .nav-item:hover { background: rgba(255,255,255,0.05); color: white; border-right-color: rgba(20,184,166,0.5); }
    .nav-item.active { background: rgba(20,184,166,0.12); color: white; border-right-color: var(--accent); font-weight: 600; }
    .nav-item.active::before { content: ''; position: absolute; right: 0; top: 50%; transform: translateY(-50%); width: 3px; height: 60%; background: var(--accent); border-radius: 0 4px 4px 0; }
    .nav-item i, .nav-item svg { width: 18px; height: 18px; flex-shrink: 0; opacity: 0.85; }
    .nav-item .badge { margin-right: auto; background: var(--danger); color: white; font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 10px; }
    .nav-item .badge.teal { background: var(--accent); }
    .nav-item .badge.gold { background: var(--gold); }
    .nav-item .badge.new { background: var(--purple); }

    /* ============ Main ============ */
    .main { flex: 1; margin-right: var(--sidebar-w); min-width: 0; display: flex; flex-direction: column; }
    .topbar {
      height: var(--topbar-h);
      background: var(--card);
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 16px;
      padding: 0 24px;
      position: sticky; top: 0;
      z-index: 50;
      box-shadow: var(--shadow-sm);
    }
    .menu-toggle { display: none; background: transparent; border: none; color: var(--text); cursor: pointer; padding: 8px; border-radius: 8px; }
    .menu-toggle:hover { background: var(--bg); }
    .topbar-title { font-size: 18px; font-weight: 700; color: var(--text); flex-shrink: 0; }
    .topbar-actions { display: flex; align-items: center; gap: 8px; margin-right: auto; }
    .icon-btn {
      width: 40px; height: 40px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      position: relative;
      transition: all 0.2s;
    }
    .icon-btn:hover { border-color: var(--accent); color: var(--accent); }
    .icon-btn i, .icon-btn svg { width: 18px; height: 18px; }
    .icon-btn.active { background: rgba(20,184,166,0.1); border-color: var(--accent); color: var(--accent); }
    .icon-btn .dot { position: absolute; top: 8px; left: 8px; width: 8px; height: 8px; background: var(--danger); border-radius: 50%; border: 2px solid var(--card); }
    .user-menu {
      display: flex; align-items: center; gap: 10px;
      padding: 5px 12px 5px 5px;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.2s;
      border: 1px solid var(--border);
      background: var(--card);
    }
    .user-menu:hover { background: var(--bg); }
    .user-avatar {
      width: 34px; height: 34px;
      border-radius: 9px;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      display: flex; align-items: center; justify-content: center;
      color: white; font-weight: 700; font-size: 14px;
      flex-shrink: 0; overflow: hidden;
    }
    .user-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .user-info { display: flex; flex-direction: column; line-height: 1.2; }
    .user-info .name { font-size: 13px; font-weight: 700; color: var(--text); }
    .user-info .role { font-size: 11px; color: var(--text-muted); }
    .dropdown { position: absolute; top: calc(100% + 8px); left: 0; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-sm); box-shadow: var(--shadow-lg); min-width: 200px; padding: 6px; opacity: 0; visibility: hidden; transform: translateY(-8px); transition: all 0.2s; z-index: 100; }
    .dropdown.show { opacity: 1; visibility: visible; transform: translateY(0); }
    .dropdown-item { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 8px; color: var(--text); font-size: 13px; font-weight: 500; cursor: pointer; transition: background 0.15s; text-decoration: none; }
    .dropdown-item:hover { background: var(--bg); }
    .dropdown-item.danger { color: var(--danger); }
    .dropdown-item.danger:hover { background: rgba(239,68,68,0.08); }
    .dropdown-item i { width: 16px; height: 16px; }
    .dropdown-divider { height: 1px; background: var(--border); margin: 6px 0; }

    /* ============ Content ============ */
    .content { padding: 24px; flex: 1; max-width: 1100px; margin: 0 auto; width: 100%; }

    .page-head {
      display: flex; align-items: center; justify-content: space-between;
      gap: 16px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .page-head h1 { font-size: 24px; font-weight: 800; color: var(--text); margin-bottom: 4px; display: flex; align-items: center; gap: 10px; }
    .page-head h1 .live-dot {
      width: 10px; height: 10px;
      background: var(--success);
      border-radius: 50%;
      animation: pulse 2s infinite;
      box-shadow: 0 0 0 4px rgba(16,185,129,0.2);
    }
    .page-head p { font-size: 13px; color: var(--text-muted); }

    .btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 10px 18px;
      font-family: inherit;
      font-size: 14px; font-weight: 600;
      border-radius: var(--radius-sm);
      border: none;
      cursor: pointer;
      transition: all 0.2s;
      text-decoration: none;
      white-space: nowrap;
    }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .btn i { width: 16px; height: 16px; }
    .btn-primary { background: linear-gradient(135deg, var(--primary), var(--accent)); color: white; }
    .btn-primary:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(20,184,166,0.35); }
    .btn-outline { background: var(--card); color: var(--text); border: 1px solid var(--border); }
    .btn-outline:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
    .btn-danger { background: var(--danger); color: white; }
    .btn-danger:hover:not(:disabled) { background: #b91c1c; }
    .btn-success { background: var(--success); color: white; }
    .btn-success:hover:not(:disabled) { background: #047857; }
    .btn-sm { padding: 6px 12px; font-size: 12px; }

    /* ============ Stats Grid ============ */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 12px;
      margin-bottom: 20px;
    }
    .stat-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 16px;
      display: flex; align-items: center; gap: 12px;
      transition: all 0.2s;
      box-shadow: var(--shadow-sm);
      position: relative;
      overflow: hidden;
      cursor: pointer;
    }
    .stat-card:hover { border-color: var(--accent); transform: translateY(-2px); box-shadow: var(--shadow); }
    .stat-card.active { border-color: var(--accent); background: linear-gradient(135deg, rgba(20,184,166,0.08), rgba(20,184,166,0.03)); }
    .stat-icon {
      width: 44px; height: 44px;
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .stat-icon i { width: 20px; height: 20px; color: white; }
    .stat-icon.blue   { background: linear-gradient(135deg, #3b82f6, #1d4ed8); }
    .stat-icon.red    { background: linear-gradient(135deg, #ef4444, #b91c1c); }
    .stat-icon.green  { background: linear-gradient(135deg, #10b981, #047857); }
    .stat-icon.gold   { background: linear-gradient(135deg, #F59E0B, #d97706); }
    .stat-icon.purple { background: linear-gradient(135deg, #8b5cf6, #6d28d9); }
    .stat-icon.teal   { background: linear-gradient(135deg, #14B8A6, #0d9488); }
    .stat-body { flex: 1; min-width: 0; }
    .stat-body .label { font-size: 10px; color: var(--text-muted); font-weight: 700; margin-bottom: 3px; text-transform: uppercase; letter-spacing: 0.4px; }
    .stat-body .value { font-size: 20px; font-weight: 800; color: var(--text); line-height: 1; }
    .stat-body .sub { font-size: 10px; color: var(--text-muted); margin-top: 3px; }

    /* ============ Tabs ============ */
    .tabs-bar {
      display: flex;
      gap: 6px;
      margin-bottom: 12px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 0;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .tabs-bar::-webkit-scrollbar { display: none; }
    .tab-btn {
      padding: 10px 16px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 700;
      color: var(--text-muted);
      background: transparent;
      border: none;
      border-bottom: 3px solid transparent;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-bottom: -1px;
    }
    .tab-btn:hover { color: var(--text); }
    .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }
    .tab-btn .tab-count {
      background: var(--border);
      color: var(--text-muted);
      padding: 1px 8px;
      border-radius: 10px;
      font-size: 10px;
      font-weight: 800;
    }
    .tab-btn.active .tab-count { background: var(--accent); color: white; }

    /* ============ Toolbar ============ */
    .toolbar {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 16px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      box-shadow: var(--shadow-sm);
    }
    .search-box { position: relative; flex: 1; min-width: 220px; }
    .search-box input {
      width: 100%;
      padding: 10px 42px 10px 14px;
      font-family: inherit;
      font-size: 14px;
      background: var(--bg);
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text);
      outline: none;
      transition: all 0.2s;
    }
    .search-box input:focus { border-color: var(--accent); background: var(--card); box-shadow: 0 0 0 3px rgba(20,184,166,0.1); }
    .search-box i { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--text-muted); pointer-events: none; }
    .filter-select {
      padding: 10px 14px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      background: var(--bg);
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text);
      outline: none;
      cursor: pointer;
      min-width: 140px;
    }
    .filter-select:focus { border-color: var(--accent); background: var(--card); }

    /* ============ Notifications list ============ */
    .notif-list { display: flex; flex-direction: column; gap: 10px; }

    .date-separator {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 18px 0 10px;
      font-size: 12px;
      font-weight: 800;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .date-separator:first-child { margin-top: 0; }
    .date-separator::before,
    .date-separator::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    .notif-item {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 16px;
      display: flex;
      align-items: flex-start;
      gap: 14px;
      transition: all 0.2s;
      cursor: pointer;
      position: relative;
      box-shadow: var(--shadow-sm);
      overflow: hidden;
    }
    .notif-item:hover { border-color: var(--accent); transform: translateY(-2px); box-shadow: var(--shadow); }
    .notif-item.unread {
      background: linear-gradient(90deg, rgba(20,184,166,0.05) 0%, var(--card) 100%);
      border-right: 4px solid var(--accent);
    }
    .notif-item.starred {
      background: linear-gradient(90deg, rgba(245,158,11,0.05) 0%, var(--card) 100%);
      border-right: 4px solid var(--gold);
    }

    .notif-item.unread::before {
      content: '';
      position: absolute;
      top: 16px;
      right: 16px;
      width: 10px;
      height: 10px;
      background: var(--accent);
      border-radius: 50%;
      box-shadow: 0 0 0 4px rgba(20,184,166,0.15);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(1.15); }
    }

    .notif-icon {
      width: 48px; height: 48px;
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      position: relative;
    }
    .notif-icon i { width: 22px; height: 22px; color: white; }
    .notif-icon.expiry    { background: linear-gradient(135deg, #ef4444, #b91c1c); }
    .notif-icon.low_stock { background: linear-gradient(135deg, #F59E0B, #d97706); }
    .notif-icon.invoice   { background: linear-gradient(135deg, #10b981, #047857); }
    .notif-icon.message   { background: linear-gradient(135deg, #3b82f6, #1d4ed8); }
    .notif-icon.system    { background: linear-gradient(135deg, #8b5cf6, #6d28d9); }
    .notif-icon.payment   { background: linear-gradient(135deg, #14B8A6, #0d9488); }
    .notif-icon.purchase  { background: linear-gradient(135deg, #8b5cf6, #6d28d9); }
    .notif-icon.receipt   { background: linear-gradient(135deg, #14B8A6, #0d9488); }
    .notif-icon.stock     { background: linear-gradient(135deg, #F59E0B, #d97706); }
    .notif-icon.default   { background: linear-gradient(135deg, #64748b, #475569); }

    .notif-body { flex: 1; min-width: 0; padding-left: 30px; }

    .notif-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 4px;
      line-height: 1.4;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .notif-item.unread .notif-title { color: var(--accent); }

    .notif-text { font-size: 13px; color: var(--text-muted); line-height: 1.6; margin-bottom: 8px; }

    .notif-meta { display: flex; align-items: center; gap: 10px; font-size: 11px; color: var(--text-muted); flex-wrap: wrap; }
    .notif-meta .meta-item { display: flex; align-items: center; gap: 4px; }
    .notif-meta .meta-item i { width: 12px; height: 12px; }

    .badge-tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 10px;
      font-weight: 800;
      white-space: nowrap;
    }
    .badge-tag.green  { background: rgba(16,185,129,0.15); color: var(--success); }
    .badge-tag.gray   { background: rgba(148,163,184,0.15); color: var(--text-muted); }
    .badge-tag.gold   { background: rgba(245,158,11,0.15); color: var(--gold); }
    .badge-tag.red    { background: rgba(239,68,68,0.15); color: var(--danger); }
    .badge-tag.purple { background: rgba(139,92,246,0.15); color: var(--purple); }
    .badge-tag.blue   { background: rgba(59,130,246,0.15); color: var(--info); }

    .notif-actions { display: flex; gap: 4px; flex-shrink: 0; opacity: 0.7; transition: opacity 0.2s; }
    .notif-item:hover .notif-actions { opacity: 1; }

    .action-btn {
      width: 32px; height: 32px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text-muted);
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.2s;
      flex-shrink: 0;
    }
    .action-btn:hover { border-color: var(--accent); color: var(--accent); transform: translateY(-1px); }
    .action-btn.danger:hover { border-color: var(--danger); color: var(--danger); background: rgba(239,68,68,0.06); }
    .action-btn.success:hover { border-color: var(--success); color: var(--success); background: rgba(16,185,129,0.06); }
    .action-btn.star:hover { border-color: var(--gold); color: var(--gold); background: rgba(245,158,11,0.06); }
    .action-btn.starred { color: var(--gold); border-color: rgba(245,158,11,0.3); background: rgba(245,158,11,0.08); }
    .action-btn i { width: 15px; height: 15px; }

    /* ============ Empty state ============ */
    .empty-state {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 80px 20px;
      text-align: center;
      color: var(--text-muted);
      box-shadow: var(--shadow-sm);
    }
    .empty-state i { width: 64px; height: 64px; opacity: 0.3; margin-bottom: 16px; color: var(--accent); display: block; margin-left: auto; margin-right: auto; }
    .empty-state h2 { font-size: 20px; font-weight: 700; color: var(--text); margin-bottom: 8px; }
    .empty-state p { font-size: 14px; }

    /* ============ Loader ============ */
    .loader { text-align: center; padding: 60px 20px; color: var(--text-muted); }
    .loader i { width: 40px; height: 40px; animation: spin 1s linear infinite; color: var(--accent); margin-bottom: 12px; display: block; margin-left: auto; margin-right: auto; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ============ Overlay ============ */
    .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 99; opacity: 0; transition: opacity 0.3s; }
    .overlay.show { display: block; opacity: 1; }

    /* ============ Responsive ============ */
    @media (max-width: 1024px) {
      .sidebar { transform: translateX(100%); }
      .sidebar.open { transform: translateX(0); }
      .main { margin-right: 0; }
      .menu-toggle { display: flex; }
      .user-info { display: none; }
    }
    @media (max-width: 640px) {
      .content { padding: 16px; }
      .topbar { padding: 0 14px; gap: 10px; }
      .topbar-title { font-size: 15px; }
      .page-head { flex-direction: column; align-items: stretch; }
      .page-head h1 { font-size: 20px; }
      .stats-grid { grid-template-columns: repeat(2, 1fr); gap: 8px; }
      .stat-card { padding: 10px 12px; }
      .stat-icon { width: 38px; height: 38px; }
      .stat-icon i { width: 18px; height: 18px; }
      .stat-body .value { font-size: 16px; }
      .notif-item { padding: 12px; }
      .notif-icon { width: 40px; height: 40px; }
      .notif-icon i { width: 18px; height: 18px; }
      .notif-body { padding-left: 20px; }
      .notif-actions { opacity: 1; }
      .toolbar { padding: 10px 12px; }
      .search-box { min-width: 100%; }
    }
  </style>
</head>
<body>

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo" id="sidebarLogo">
        <img src="logo.png" alt="رفاد" id="sidebarLogoImg" onerror="this.style.display='none';this.parentElement.innerHTML='<span class=fallback>R</span>';">
      </div>
      <div class="sidebar-brand">
        <h2 id="sidebarBrandName">رفاد</h2>
        <p id="sidebarBrandDesc">نظام إدارة الأدوية</p>
      </div>
    </div>
    <nav class="sidebar-nav" id="sidebarNav"></nav>
  </aside>

  <div class="overlay" id="overlay"></div>

  <!-- Main -->
  <div class="main">
    <header class="topbar">
      <button class="menu-toggle" id="menuToggle"><i data-lucide="menu"></i></button>
      <div class="topbar-title">الإشعارات</div>
      <div class="topbar-actions">
        <button class="icon-btn" id="themeToggle" title="الوضع الليلي/النهاري">
          <i data-lucide="moon" id="themeIcon"></i>
        </button>
        <button class="icon-btn" id="refreshBtn" title="تحديث">
          <i data-lucide="refresh-cw"></i>
        </button>
        <button class="icon-btn" id="browserNotifBtn" title="تفعيل إشعارات المتصفح">
          <i data-lucide="bell-ring"></i>
        </button>
        <div style="position:relative;">
          <div class="user-menu" id="userMenu">
            <div class="user-avatar" id="userAvatar">م</div>
            <div class="user-info">
              <span class="name" id="userName">—</span>
              <span class="role" id="userRole">—</span>
            </div>
            <i data-lucide="chevron-down" style="width:14px;height:14px;opacity:0.5;"></i>
          </div>
          <div class="dropdown" id="userDropdown">
            <a href="company-settings.html" class="dropdown-item"><i data-lucide="settings"></i> الإعدادات</a>
            <a href="employees.html" class="dropdown-item"><i data-lucide="user-cog"></i> الملف الشخصي</a>
            <div class="dropdown-divider"></div>
            <div class="dropdown-item danger" id="logoutBtn"><i data-lucide="log-out"></i> تسجيل الخروج</div>
          </div>
        </div>
      </div>
    </header>

    <main class="content">

      <!-- Page head -->
      <div class="page-head">
        <div>
          <h1>
            <span class="live-dot" id="liveDot" style="display:none;"></span>
            الإشعارات
          </h1>
          <p>كل التنبيهات والرسائل الواردة</p>
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;">
          <button class="btn btn-outline btn-sm" id="markAllBtn">
            <i data-lucide="check-check"></i> تحديد الكل كمقروء
          </button>
          <button class="btn btn-outline btn-sm" id="deleteReadBtn">
            <i data-lucide="trash-2"></i> حذف المقروءة
          </button>
          <button class="btn btn-danger btn-sm" id="deleteAllBtn">
            <i data-lucide="trash"></i> حذف الكل
          </button>
        </div>
      </div>

      <!-- Stats Grid -->
      <div class="stats-grid">
        <div class="stat-card active" data-stat-filter="all">
          <div class="stat-icon blue"><i data-lucide="bell"></i></div>
          <div class="stat-body">
            <div class="label">إجمالي</div>
            <div class="value" id="statTotal">0</div>
            <div class="sub">إشعار</div>
          </div>
        </div>
        <div class="stat-card" data-stat-filter="unread">
          <div class="stat-icon red"><i data-lucide="bell-ring"></i></div>
          <div class="stat-body">
            <div class="label">غير مقروءة</div>
            <div class="value" id="statUnread">0</div>
            <div class="sub" id="statUnreadSub">تحتاج مراجعة</div>
          </div>
        </div>
        <div class="stat-card" data-stat-filter="read">
          <div class="stat-icon green"><i data-lucide="check-circle-2"></i></div>
          <div class="stat-body">
            <div class="label">مقروءة</div>
            <div class="value" id="statRead">0</div>
            <div class="sub" id="statReadSub">—</div>
          </div>
        </div>
        <div class="stat-card" data-stat-filter="today">
          <div class="stat-icon gold"><i data-lucide="calendar-days"></i></div>
          <div class="stat-body">
            <div class="label">اليوم</div>
            <div class="value" id="statToday">0</div>
            <div class="sub">آخر 24 ساعة</div>
          </div>
        </div>
        <div class="stat-card" data-stat-filter="week">
          <div class="stat-icon purple"><i data-lucide="trending-up"></i></div>
          <div class="stat-body">
            <div class="label">هذا الأسبوع</div>
            <div class="value" id="statWeek">0</div>
            <div class="sub">آخر 7 أيام</div>
          </div>
        </div>
        <div class="stat-card" data-stat-filter="starred">
          <div class="stat-icon teal"><i data-lucide="star"></i></div>
          <div class="stat-body">
            <div class="label">مهمة</div>
            <div class="value" id="statStarred">0</div>
            <div class="sub">مثبّتة</div>
          </div>
        </div>
      </div>

      <!-- Tabs -->
      <div class="tabs-bar" id="tabsBar">
        <button class="tab-btn active" data-tab="all">
          <i data-lucide="list" style="width:14px;height:14px;"></i>
          الكل
          <span class="tab-count" id="tabCountAll">0</span>
        </button>
        <button class="tab-btn" data-tab="unread">
          <i data-lucide="bell-ring" style="width:14px;height:14px;"></i>
          غير مقروءة
          <span class="tab-count" id="tabCountUnread">0</span>
        </button>
        <button class="tab-btn" data-tab="read">
          <i data-lucide="check-circle" style="width:14px;height:14px;"></i>
          مقروءة
          <span class="tab-count" id="tabCountRead">0</span>
        </button>
        <button class="tab-btn" data-tab="starred">
          <i data-lucide="star" style="width:14px;height:14px;"></i>
          مهمة
          <span class="tab-count" id="tabCountStarred">0</span>
        </button>
      </div>

      <!-- Toolbar -->
      <div class="toolbar">
        <div class="search-box">
          <input type="text" id="searchInput" placeholder="ابحث في الإشعارات...">
          <i data-lucide="search"></i>
        </div>
        <select class="filter-select" id="filterType">
          <option value="">كل الأنواع</option>
          <option value="expiry">انتهاء صلاحية</option>
          <option value="low_stock">مخزون منخفض</option>
          <option value="invoice">فواتير</option>
          <option value="purchase">طلبات شراء</option>
          <option value="receipt">استلامات</option>
          <option value="stock">مخزون</option>
          <option value="message">رسائل</option>
          <option value="payment">دفعات</option>
          <option value="system">النظام</option>
        </select>
        <select class="filter-select" id="filterPeriod">
          <option value="">كل الفترات</option>
          <option value="today">اليوم</option>
          <option value="week">هذا الأسبوع</option>
          <option value="month">هذا الشهر</option>
          <option value="older">أقدم</option>
        </select>
      </div>

      <!-- Notifications list -->
      <div id="notifContainer">
        <div class="loader">
          <i data-lucide="loader-2"></i>
          <p>جارٍ تحميل الإشعارات...</p>
        </div>
      </div>

    </main>
  </div>

  <!-- ============================================================
       SCRIPTS — الترتيب مهم جداً
       ============================================================ -->
  <script src="refad-core.js"></script>
  <script src="refad-auth.js"></script>
  <script src="refad-theme-sync.js"></script>
  <script src="refad-settings.js"></script>

  <script>
    (function () {
      'use strict';

      // ============================================================
      // 0) Safe Settings Wrapper
      // ============================================================
      const SafeSettings = {
        identity: {
          getSystemName: function () {
            try {
              if (window.RefadSettings?.identity?.getSystemName) {
                return RefadSettings.identity.getSystemName();
              }
            } catch (e) {}
            return 'رفاد';
          },
          getTagline: function () {
            try {
              if (window.RefadSettings?.identity?.getTagline) {
                return RefadSettings.identity.getTagline();
              }
            } catch (e) {}
            return 'نظام إدارة الأدوية';
          },
          getLogoUrl: function () {
            try {
              if (window.RefadSettings?.identity?.getLogoUrl) {
                return RefadSettings.identity.getLogoUrl();
              }
            } catch (e) {}
            return null;
          }
        }
      };

      // ============================================================
      // 1) Guard
      // ============================================================
      const session = Refad.Auth.guardPage('notifications.view');
      if (!session) return;

      // ============================================================
      // 2) State
      // ============================================================
      const state = {
        all: [],
        tab: 'all',
        typeFilter: '',
        periodFilter: '',
        search: '',
        realtimeChannel: null,
        starred: JSON.parse(localStorage.getItem('refad_starred_notifs') || '[]')
      };

      // Notification types config
      const TYPES = {
        expiry:    { label: 'انتهاء صلاحية', icon: 'calendar-x',      cls: 'expiry' },
        low_stock: { label: 'مخزون منخفض',   icon: 'alert-triangle',  cls: 'low_stock' },
        invoice:   { label: 'فاتورة',         icon: 'receipt',         cls: 'invoice' },
        message:   { label: 'رسالة',          icon: 'message-circle',  cls: 'message' },
        purchase:  { label: 'مشتريات',        icon: 'clipboard-list',  cls: 'purchase' },
        receipt:   { label: 'استلام',         icon: 'package-check',   cls: 'receipt' },
        stock:     { label: 'المخزون',        icon: 'package',         cls: 'stock' },
        payment:   { label: 'دفعة',           icon: 'dollar-sign',     cls: 'payment' },
        system:    { label: 'النظام',         icon: 'info',            cls: 'system' }
      };

      // Route map
      const ROUTES = {
        expiry:    'inventory.html',
        low_stock: 'product-details.html',
        invoice:   'invoices.html',
        purchase:  'purchase-request-form.html',
        receipt:   'receipt-form.html',
        stock:     'product-details.html',
        message:   'chat.html',
        payment:   'company-settings.html',
        system:    null
      };

      // ============================================================
      // 3) Helpers
      // ============================================================
      function esc(s) { return Refad.escapeHtml(s); }
      function fmtNumber(v) { return Refad.format.number(v); }

      // ============================================================
      // 4) UI helpers
      // ============================================================
      function fillUser() {
        const av = document.getElementById('userAvatar');
        const initial = (session.full_name || '؟').trim().charAt(0);
        if (session.avatar_url) av.innerHTML = '<img src="' + esc(session.avatar_url) + '" alt="">';
        else av.textContent = initial;
        document.getElementById('userName').textContent = session.full_name;
        document.getElementById('userRole').textContent = Refad.Session.has('company.owner') ? 'صاحب الشركة' : 'موظف';
      }

      function applyIdentity() {
        const name = SafeSettings.identity.getSystemName();
        const tagline = SafeSettings.identity.getTagline();
        const logoUrl = SafeSettings.identity.getLogoUrl();

        const brandName = document.getElementById('sidebarBrandName');
        const brandDesc = document.getElementById('sidebarBrandDesc');
        const logoImg = document.getElementById('sidebarLogoImg');

        if (brandName) brandName.textContent = name;
        if (brandDesc) brandDesc.textContent = tagline;
        if (logoImg && logoUrl) {
          logoImg.src = logoUrl;
          logoImg.onerror = function () {
            this.style.display = 'none';
            const parent = this.parentElement;
            if (parent) parent.innerHTML = '<span class="fallback">' + (name.charAt(0) || 'R') + '</span>';
          };
        }
      }

      function setupTheme() {
        const btn = document.getElementById('themeToggle');
        const icon = document.getElementById('themeIcon');
        const refresh = function () {
          const isDark = Refad.theme.get() === 'dark';
          icon.setAttribute('data-lucide', isDark ? 'sun' : 'moon');
          if (window.lucide) lucide.createIcons();
        };
        refresh();
        btn.addEventListener('click', function () { Refad.theme.toggle(); refresh(); });
      }

      function setupSidebarMobile() {
        const sb = document.getElementById('sidebar');
        const ov = document.getElementById('overlay');
        document.getElementById('menuToggle').addEventListener('click', function () {
          sb.classList.add('open'); ov.classList.add('show');
        });
        ov.addEventListener('click', function () {
          sb.classList.remove('open'); ov.classList.remove('show');
        });
      }

      function setupUserMenu() {
        const m = document.getElementById('userMenu');
        const d = document.getElementById('userDropdown');
        m.addEventListener('click', function (e) { e.stopPropagation(); d.classList.toggle('show'); });
        document.addEventListener('click', function () { d.classList.remove('show'); });
        d.addEventListener('click', function (e) { e.stopPropagation(); });
        document.getElementById('logoutBtn').addEventListener('click', async function () {
          if (await Refad.alert.confirm('تسجيل الخروج', 'هل تريد الخروج؟', 'خروج')) {
            await Refad.Auth.logout();
          }
        });
      }

      function setupRealtimeTheme() {
        window.addEventListener('refad:theme-changed', () => {
          applyIdentity();
        });
      }

      // ============================================================
      // 5) Notification Sound
      // ============================================================
      let audioCtx = null;
      function playNotifSound() {
        try {
          if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          if (audioCtx.state === 'suspended') audioCtx.resume();

          const now = audioCtx.currentTime;
          const notes = [
            { freq: 659.25, start: 0, duration: 0.12 },
            { freq: 880, start: 0.1, duration: 0.18 }
          ];
          notes.forEach(function (note) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.value = note.freq;
            const startTime = now + note.start;
            const endTime = startTime + note.duration;
            gain.gain.setValueAtTime(0, startTime);
            gain.gain.linearRampToValueAtTime(0.25, startTime + 0.02);
            gain.gain.exponentialRampToValueAtTime(0.001, endTime);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(startTime);
            osc.stop(endTime);
          });
        } catch (e) {}
      }

      function vibrateDevice() {
        if (navigator.vibrate) {
          try { navigator.vibrate([60, 30, 60]); } catch (e) {}
        }
      }

      // ============================================================
      // 6) Load notifications
      // ============================================================
      async function loadNotifications(silent) {
        if (!silent) {
          document.getElementById('notifContainer').innerHTML =
            '<div class="loader">' +
              '<i data-lucide="loader-2"></i>' +
              '<p>جارٍ تحميل الإشعارات...</p>' +
            '</div>';
          if (window.lucide) lucide.createIcons();
        }

        try {
          const rows = await Refad.db.select('notifications', {
            columns: 'id, title, body, type, reference_id, is_read, created_at',
            eq: { user_id: session.user_id },
            order: { column: 'created_at', ascending: false },
            limit: 300
          });

          state.all = (rows || []).filter(canViewNotification);
          renderStats();
          renderList();
        } catch (e) {
          console.error('[Notifications] load failed:', e);
          Refad.toast.error('تعذّر التحميل: ' + e.message);
          state.all = [];
          renderStats();
          renderList();
        }
      }

      function canViewNotification(notification) {
        const requiredByType = {
          expiry: 'inventory.view',
          low_stock: 'inventory.view',
          invoice: 'sales.view',
          message: 'chat.use',
          purchase: 'purchases.view',
          receipt: 'purchases.view',
          stock: 'inventory.view',
          payment: 'company.owner'
        };
        const permission = requiredByType[notification.type];
        return !permission || Refad.Session.has(permission);
      }

      // ============================================================
      // 7) Render Stats
      // ============================================================
      function renderStats() {
        const total = state.all.length;
        const unread = state.all.filter(function (n) { return !n.is_read; }).length;
        const read = total - unread;
        const today = Refad.date.today();
        const weekAgo = Refad.date.addDays(today, -7);

        const todayCount = state.all.filter(function (n) {
          return dayjs(n.created_at).format('YYYY-MM-DD') === today;
        }).length;

        const weekCount = state.all.filter(function (n) {
          const d = dayjs(n.created_at).format('YYYY-MM-DD');
          return d >= weekAgo;
        }).length;

        const starredCount = state.all.filter(function (n) {
          return state.starred.indexOf(n.id) !== -1;
        }).length;

        document.getElementById('statTotal').textContent = fmtNumber(total);
        document.getElementById('statUnread').textContent = fmtNumber(unread);
        document.getElementById('statRead').textContent = fmtNumber(read);
        document.getElementById('statToday').textContent = fmtNumber(todayCount);
        document.getElementById('statWeek').textContent = fmtNumber(weekCount);
        document.getElementById('statStarred').textContent = fmtNumber(starredCount);

        if (unread > 0) {
          document.getElementById('statUnreadSub').textContent = 'تحتاج مراجعة';
        } else {
          document.getElementById('statUnreadSub').textContent = 'كل شيء مقروء ✓';
        }

        if (total > 0) {
          document.getElementById('statReadSub').textContent = Math.round((read / total) * 100) + '%';
        } else {
          document.getElementById('statReadSub').textContent = '—';
        }

        // Sidebar badge
        const sidebarBadge = document.getElementById('sidebarNotifBadge');
        if (sidebarBadge) {
          if (unread > 0) {
            sidebarBadge.textContent = unread > 99 ? '99+' : unread;
            sidebarBadge.style.display = 'inline-block';
          } else {
            sidebarBadge.style.display = 'none';
          }
        }

        // Tab counts
        document.getElementById('tabCountAll').textContent = total;
        document.getElementById('tabCountUnread').textContent = unread;
        document.getElementById('tabCountRead').textContent = read;
        document.getElementById('tabCountStarred').textContent = starredCount;

        // Page title
        document.title = unread > 0 ? `(${unread}) الإشعارات - رفاد` : 'الإشعارات - رفاد';
      }

      // ============================================================
      // 8) Filter logic
      // ============================================================
      function applyFilters() {
        let list = state.all.slice();

        if (state.tab === 'unread') {
          list = list.filter(function (n) { return !n.is_read; });
        } else if (state.tab === 'read') {
          list = list.filter(function (n) { return n.is_read; });
        } else if (state.tab === 'starred') {
          list = list.filter(function (n) { return state.starred.indexOf(n.id) !== -1; });
        }

        if (state.typeFilter) {
          list = list.filter(function (n) { return n.type === state.typeFilter; });
        }

        if (state.periodFilter) {
          const today = Refad.date.today();
          const weekAgo = Refad.date.addDays(today, -7);
          const monthAgo = Refad.date.addDays(today, -30);

          list = list.filter(function (n) {
            const d = dayjs(n.created_at).format('YYYY-MM-DD');
            if (state.periodFilter === 'today') return d === today;
            if (state.periodFilter === 'week') return d >= weekAgo;
            if (state.periodFilter === 'month') return d >= monthAgo;
            if (state.periodFilter === 'older') return d < monthAgo;
            return true;
          });
        }

        if (state.search) {
          const q = state.search.toLowerCase();
          list = list.filter(function (n) {
            return (n.title || '').toLowerCase().includes(q) ||
                   (n.body || '').toLowerCase().includes(q);
          });
        }

        return list;
      }

      // ============================================================
      // 9) Render list
      // ============================================================
      function renderList() {
        const container = document.getElementById('notifContainer');
        const filtered = applyFilters();

        if (!filtered.length) {
          const msg = state.all.length === 0
            ? 'لا توجد إشعارات بعد'
            : 'لا توجد نتائج مطابقة';
          const sub = state.all.length === 0
            ? 'كل الإشعارات ستظهر هنا'
            : 'جرّب تغيير الفلاتر';
          container.innerHTML =
            '<div class="empty-state">' +
              '<i data-lucide="bell-off"></i>' +
              '<h2>' + msg + '</h2>' +
              '<p>' + sub + '</p>' +
            '</div>';
          if (window.lucide) lucide.createIcons();
          return;
        }

        const groups = {};
        filtered.forEach(function (n) {
          const d = dayjs(n.created_at).format('YYYY-MM-DD');
          if (!groups[d]) groups[d] = [];
          groups[d].push(n);
        });

        const sortedDates = Object.keys(groups).sort(function (a, b) { return b.localeCompare(a); });
        const today = Refad.date.today();
        const yesterday = Refad.date.addDays(today, -1);

        let html = '<div class="notif-list">';

        sortedDates.forEach(function (date) {
          let label = Refad.format.date(date);
          if (date === today) label = 'اليوم';
          else if (date === yesterday) label = 'أمس';

          html += '<div class="date-separator">' + label + '</div>';

          groups[date].forEach(function (n) {
            const t = TYPES[n.type] || { label: n.type, icon: 'bell', cls: 'default' };
            const isStarred = state.starred.indexOf(n.id) !== -1;

            let itemClass = '';
            if (!n.is_read) itemClass += ' unread';
            if (isStarred) itemClass += ' starred';

            html += '<div class="notif-item' + itemClass + '" data-id="' + n.id + '">' +
              '<div class="notif-icon ' + t.cls + '">' +
                '<i data-lucide="' + t.icon + '"></i>' +
              '</div>' +
              '<div class="notif-body">' +
                '<div class="notif-title">' +
                  esc(n.title) +
                  (isStarred ? '<span class="badge-tag gold"><i data-lucide="star" style="width:9px;height:9px;"></i> مهم</span>' : '') +
                  (!n.is_read ? '<span class="badge-tag green">جديد</span>' : '') +
                '</div>' +
                (n.body ? '<div class="notif-text">' + esc(n.body) + '</div>' : '') +
                '<div class="notif-meta">' +
                  '<span class="meta-item">' +
                    '<i data-lucide="clock"></i>' +
                    Refad.format.relative(n.created_at) +
                  '</span>' +
                  '<span class="meta-item">' +
                    '<i data-lucide="tag"></i>' +
                    t.label +
                  '</span>' +
                '</div>' +
              '</div>' +
              '<div class="notif-actions">' +
                '<button class="action-btn star ' + (isStarred ? 'starred' : '') + '" data-action="star" data-id="' + n.id + '" title="' + (isStarred ? 'إزالة التثبيت' : 'تثبيت كمهم') + '">' +
                  '<i data-lucide="star"></i>' +
                '</button>' +
                (!n.is_read ?
                  '<button class="action-btn success" data-action="mark-read" data-id="' + n.id + '" title="تحديد كمقروء">' +
                    '<i data-lucide="check"></i>' +
                  '</button>'
                : '') +
                '<button class="action-btn danger" data-action="delete" data-id="' + n.id + '" title="حذف">' +
                  '<i data-lucide="trash-2"></i>' +
                '</button>' +
              '</div>' +
            '</div>';
          });
        });

        html += '</div>';
        container.innerHTML = html;

        if (window.lucide) lucide.createIcons();
        bindItemEvents();
      }

      // ============================================================
      // 10) Bind item events
      // ============================================================
      function bindItemEvents() {
        const container = document.getElementById('notifContainer');

        container.querySelectorAll('.notif-item').forEach(function (item) {
          const id = parseInt(item.dataset.id, 10);

          item.addEventListener('click', function (e) {
            if (e.target.closest('[data-action]')) return;
            const n = state.all.find(function (x) { return x.id === id; });
            if (!n) return;
            handleClick(n);
          });
        });

        container.querySelectorAll('[data-action]').forEach(function (btn) {
          btn.addEventListener('click', async function (e) {
            e.stopPropagation();
            const id = parseInt(btn.dataset.id, 10);
            const action = btn.dataset.action;

            if (action === 'mark-read') {
              await markAsRead(id);
            } else if (action === 'delete') {
              await deleteNotification(id);
            } else if (action === 'star') {
              toggleStar(id);
            }
          });
        });
      }

      // ============================================================
      // 11) Star toggle
      // ============================================================
      function toggleStar(id) {
        const idx = state.starred.indexOf(id);
        if (idx === -1) {
          state.starred.push(id);
          Refad.toast.success('تم التثبيت كمهم');
        } else {
          state.starred.splice(idx, 1);
          Refad.toast.info('تم إزالة التثبيت');
        }
        localStorage.setItem('refad_starred_notifs', JSON.stringify(state.starred));
        renderStats();
        renderList();
      }

      // ============================================================
      // 12) Handle click → navigate
      // ============================================================
      async function handleClick(n) {
        if (!n.is_read) {
          await markAsRead(n.id, true);
        }

        const route = ROUTES[n.type];
        if (route) {
          let url = route;
          if (n.reference_id) {
            if (route === 'invoices.html') url += '?id=' + n.reference_id;
            else if (route === 'chat.html') url += '?id=' + n.reference_id;
            else if (route === 'purchase-request-form.html') url += '?id=' + n.reference_id;
            else if (route === 'receipt-form.html') url += '?id=' + n.reference_id;
            else if (route === 'product-details.html') url += '?id=' + n.reference_id;
          }
          setTimeout(function () { window.location.href = url; }, 300);
        }
      }

      // ============================================================
      // 13) Actions
      // ============================================================
      async function markAsRead(id, silent) {
        try {
          await Refad.db.update('notifications', id, { is_read: true });

          const n = state.all.find(function (x) { return x.id === id; });
          if (n) n.is_read = true;

          renderStats();
          renderList();

          if (!silent) Refad.toast.success('تم التحديد كمقروء');
        } catch (e) {
          console.error('Mark read failed:', e);
          Refad.toast.error('فشل: ' + e.message);
        }
      }

      async function markAllAsRead() {
        const unreadIds = state.all.filter(function (n) { return !n.is_read; }).map(function (n) { return n.id; });
        if (!unreadIds.length) {
          Refad.toast.info('لا توجد إشعارات غير مقروءة');
          return;
        }

        try {
          for (const id of unreadIds) {
            await Refad.db.update('notifications', id, { is_read: true });
          }

          state.all.forEach(function (n) { n.is_read = true; });
          renderStats();
          renderList();
          Refad.toast.success('تم تحديد ' + unreadIds.length + ' إشعار كمقروء');
        } catch (e) {
          console.error('Mark all failed:', e);
          Refad.toast.error('فشل: ' + e.message);
        }
      }

      async function deleteNotification(id) {
        try {
          await Refad.db.remove('notifications', id);
          state.all = state.all.filter(function (n) { return n.id !== id; });
          state.starred = state.starred.filter(function (x) { return x !== id; });
          localStorage.setItem('refad_starred_notifs', JSON.stringify(state.starred));
          renderStats();
          renderList();
          Refad.toast.success('تم الحذف');
        } catch (e) {
          console.error('Delete failed:', e);
          Refad.toast.error('فشل الحذف: ' + e.message);
        }
      }

      async function deleteAllRead() {
        const readIds = state.all.filter(function (n) { return n.is_read; }).map(function (n) { return n.id; });
        if (!readIds.length) {
          Refad.toast.info('لا توجد إشعارات مقروءة');
          return;
        }

        const ok = await Refad.alert.confirm(
          'حذف المقروءة',
          'سيتم حذف ' + readIds.length + ' إشعار مقروء. متابعة؟',
          'حذف'
        );
        if (!ok) return;

        try {
          for (const id of readIds) {
            await Refad.db.remove('notifications', id);
          }

          state.all = state.all.filter(function (n) { return !n.is_read; });
          renderStats();
          renderList();
          Refad.toast.success('تم حذف ' + readIds.length + ' إشعار');
        } catch (e) {
          console.error('Delete all read failed:', e);
          Refad.toast.error('فشل: ' + e.message);
        }
      }

      async function deleteAllNotifications() {
        if (!state.all.length) {
          Refad.toast.info('لا توجد إشعارات');
          return;
        }

        const ok = await Refad.alert.confirm(
          'حذف الكل',
          'سيتم حذف ' + state.all.length + ' إشعار. هذا الإجراء لا يمكن التراجع عنه!',
          'حذف الكل'
        );
        if (!ok) return;

        try {
          for (const n of state.all) {
            await Refad.db.remove('notifications', n.id);
          }

          state.all = [];
          state.starred = [];
          localStorage.removeItem('refad_starred_notifs');
          renderStats();
          renderList();
          Refad.toast.success('تم حذف كل الإشعارات');
        } catch (e) {
          console.error('Delete all failed:', e);
          Refad.toast.error('فشل: ' + e.message);
        }
      }

      // ============================================================
      // 14) Realtime
      // ============================================================
      function setupRealtime() {
        try {
          const liveDot = document.getElementById('liveDot');
          if (liveDot) liveDot.style.display = 'inline-block';

          state.realtimeChannel = Refad.sb
            .channel('notifications-changes')
            .on(
              'postgres_changes',
              {
                event: 'INSERT',
                schema: 'public',
                table: 'notifications',
                filter: 'user_id=eq.' + session.user_id
              },
              function (payload) {
                const n = payload.new;
                if (!canViewNotification(n)) return;
                state.all.unshift(n);
                renderStats();
                renderList();

                playNotifSound();
                vibrateDevice();

                Refad.toast.info('🔔 ' + n.title, 5000);

                if ('Notification' in window && Notification.permission === 'granted') {
                  try {
                    new Notification(n.title, {
                      body: n.body || '',
                      icon: 'logo.png',
                      tag: 'refad-notif-' + n.id
                    });
                  } catch (err) {
                    console.warn('Browser notification failed:', err);
                  }
                }
              }
            )
            .subscribe();
        } catch (e) {
          console.warn('Realtime not available:', e.message);
        }
      }

      function cleanupRealtime() {
        try {
          if (state.realtimeChannel) {
            Refad.sb.removeChannel(state.realtimeChannel);
            state.realtimeChannel = null;
          }
        } catch (e) {}
      }

      // ============================================================
      // 15) Events
      // ============================================================
      function bindEvents() {
        // Tabs
        document.querySelectorAll('.tab-btn').forEach(function (btn) {
          btn.addEventListener('click', function () {
            document.querySelectorAll('.tab-btn').forEach(function (b) { b.classList.remove('active'); });
            btn.classList.add('active');
            state.tab = btn.dataset.tab;
            renderList();
          });
        });

        // Stat cards click → filter
        document.querySelectorAll('.stat-card').forEach(function (card) {
          card.addEventListener('click', function () {
            const filter = card.dataset.statFilter;
            document.querySelectorAll('.stat-card').forEach(function (c) { c.classList.remove('active'); });
            card.classList.add('active');

            if (filter === 'all') {
              state.tab = 'all';
              state.periodFilter = '';
              document.getElementById('filterPeriod').value = '';
            } else if (filter === 'unread') {
              state.tab = 'unread';
            } else if (filter === 'read') {
              state.tab = 'read';
            } else if (filter === 'starred') {
              state.tab = 'starred';
            } else if (filter === 'today') {
              state.tab = 'all';
              state.periodFilter = 'today';
              document.getElementById('filterPeriod').value = 'today';
            } else if (filter === 'week') {
              state.tab = 'all';
              state.periodFilter = 'week';
              document.getElementById('filterPeriod').value = 'week';
            }
            document.querySelectorAll('.tab-btn').forEach(function (b) {
              b.classList.toggle('active', b.dataset.tab === state.tab);
            });
            renderList();
          });
        });

        // Search
        document.getElementById('searchInput').addEventListener('input', Refad.debounce(function (e) {
          state.search = e.target.value.trim();
          renderList();
        }, 250));

        // Type filter
        document.getElementById('filterType').addEventListener('change', function (e) {
          state.typeFilter = e.target.value;
          renderList();
        });

        // Period filter
        document.getElementById('filterPeriod').addEventListener('change', function (e) {
          state.periodFilter = e.target.value;
          renderList();
        });

        // Buttons
        document.getElementById('markAllBtn').addEventListener('click', markAllAsRead);
        document.getElementById('deleteReadBtn').addEventListener('click', deleteAllRead);
        document.getElementById('deleteAllBtn').addEventListener('click', deleteAllNotifications);

        // Refresh
        document.getElementById('refreshBtn').addEventListener('click', async function () {
          Refad.toast.info('جارٍ التحديث...');
          await loadNotifications(true);
          Refad.toast.success('تم التحديث');
        });

        // Browser notifications toggle
        document.getElementById('browserNotifBtn').addEventListener('click', async function () {
          if (!('Notification' in window)) {
            Refad.toast.warning('هذا المتصفح لا يدعم إشعارات النظام');
            return;
          }
          if (Notification.permission === 'denied') {
            Refad.toast.warning('إشعارات المتصفح محظورة؛ فعّلها من إعدادات الموقع');
            return;
          }
          try {
            const permission = Notification.permission === 'granted'
              ? 'granted'
              : await Notification.requestPermission();

            if (permission === 'granted') {
              this.classList.add('active');
              Refad.toast.success('تم تفعيل إشعارات المتصفح');
            } else {
              Refad.toast.info('لم يتم السماح بإشعارات المتصفح');
            }
          } catch (error) {
            console.error('Permission request failed:', error);
            Refad.toast.error('تعذّر طلب إذن الإشعارات');
          }
        });

        // Keyboard: Ctrl+R
        document.addEventListener('keydown', function (e) {
          if ((e.ctrlKey || e.metaKey) && e.key === 'r') {
            e.preventDefault();
            loadNotifications(true);
          }
        });

        // Cleanup on unload
        window.addEventListener('beforeunload', cleanupRealtime);
      }

      // ============================================================
      // 16) Init
      // ============================================================
      async function init() {
        // ✨ 1) Build menu + Identity
        Refad.buildMenu('notifications.html');
        fillUser();
        applyIdentity();
        setupTheme();
        setupSidebarMobile();
        setupUserMenu();
        setupRealtimeTheme();
        bindEvents();

        if ('Notification' in window && Notification.permission === 'granted') {
          document.getElementById('browserNotifBtn').classList.add('active');
        }

        await loadNotifications();
        setupRealtime();

        if (Refad.registerServiceWorker) Refad.registerServiceWorker();

        console.log('%c[Refad] Notifications v3 ready (Theme Sync + Settings + Sound)', 'color:#14B8A6;font-weight:bold;font-size:14px');
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }

    })();
  </script>
